services:
  alpaca-indexer:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: alpaca-indexer
    restart: "no"
    command: python /app/alpaca-puller.py reindex
    volumes:
      - /usr/share/ollama/.ollama/models:/models:ro
      - ./.alpaca-router:/router-models
    environment:
      MODELS_DIR: /models
      ROUTER_MODELS_DIR: /router-models

  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama-server
    container_name: llama-server
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
    ports:
      - "8080:8080"
    volumes:
      - /usr/share/ollama/.ollama/models:/models:ro
      - ./.alpaca-router:/router-models
      - ./.slots-cache:/slots-cache
      - ./llama-server-flags.py:/scripts/llama-server-flags.py:ro
      - ./llama-server-entrypoint.sh:/scripts/llama-server-entrypoint.sh:ro
    environment:
      # Reasoning-budget control for reasoning models (Qwen3 MoE etc.).
      # --reasoning-budget is a llama.cpp server-startup flag (NOT per-request):
      # it caps the thinking phase so the model cannot spend the whole
      # generation budget on thinking and return empty content. deepseek format
      # routes thoughts into message.thinking separate from scored content.
      # 8192: heavy reasoning tasks exceed 2048 think tokens and get cut
      # mid-thinking; 0 = unrestricted via .env if ever needed.
      LLAMA_REASONING_BUDGET: "${LLAMA_REASONING_BUDGET:-8192}"
      LLAMA_REASONING_FORMAT: "${LLAMA_REASONING_FORMAT:-deepseek}"
    entrypoint: ["/bin/sh", "/scripts/llama-server-entrypoint.sh"]
    depends_on:
      alpaca-indexer:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 31G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  alpaca-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: alpaca-proxy
    restart: always
    network_mode: "host"
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /usr/share/ollama/.ollama/models:/models
      - ./.alpaca-router:/router-models
      - ./.slots-cache:/slots-cache
      - /var/run/docker.sock:/var/run/docker.sock
      - ./alpaca-proxy.py:/app/alpaca-proxy.py:ro
      - ./alpaca-puller.py:/app/alpaca-puller.py:ro
      - ./alpaca_puller.py:/app/alpaca_puller.py:ro
      - ./benchmark-configs.py:/app/benchmark-configs.py:ro
      - ./analyzer.py:/app/analyzer.py:ro
      - ./online_providers.py:/app/online_providers.py:ro
      - ./data:/app/data
    environment:
      MODELS_DIR: /models
      ROUTER_MODELS_DIR: /router-models
      SLOTS_CACHE_DIR: /slots-cache
      TELEMETRY_DIR: /app/data/telemetry
      LLAMA_SERVER_URL: "http://localhost:8080"
      SD_SERVER_URL: "http://localhost:8081"
      SD_CONTAINER_NAME: "sd-server"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      alpaca-indexer:
        condition: service_completed_successfully
      llama-server:
        condition: service_started

  alpaca-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: alpaca-web
    restart: always
    group_add:
      - "${DOCKER_GID}"
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./web:/app/web:ro
      - ./llm_benchmark_suite.py:/app/llm_benchmark_suite.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./benchmark_tests.json:/app/benchmark_tests.json:ro
      - ./alpaca-puller.py:/app/alpaca-puller.py:ro
      - ./alpaca_puller.py:/app/alpaca_puller.py:ro
      - ./online_providers.py:/app/online_providers.py:ro
      - ./.alpaca-router:/router-models
      - ./analyzer.py:/app/analyzer.py:ro
      - ./sandbox_exec.py:/app/sandbox_exec.py:ro
      - /usr/share/ollama/.ollama/models:/models
    env_file:
      - ./.env
    environment:
      OLLAMA_SERVER_URLS: "http://llama-server:8080"
      PROXY_SERVER_URLS: "http://host.docker.internal:11434"
      AUDIO_SERVER_URL: "http://audio-server:8082"
      ROUTER_MODELS_DIR: "/router-models"
      MODELS_DIR: "/models"
      MODELS_INI_PATH: "/router-models/models.ini"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      alpaca-proxy:
        condition: service_started
      llama-server:
        condition: service_started

  alpaca-telemetry:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: alpaca-telemetry
    restart: always
    command: python /app/telemetry_monitor.py
    mem_limit: 256m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.alpaca-router:/router-models
      - ./data:/app/data
      - ./telemetry_monitor.py:/app/telemetry_monitor.py:ro
    environment:
      TELEMETRY_DIR: /app/data/telemetry
      LLAMA_SERVER_URL: http://llama-server:8080
      LLAMA_DOCKER_CONTAINER: llama-server
      PROXY_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      llama-server:
        condition: service_started

  sd-server:
    build:
      context: .
      dockerfile: Dockerfile.sd-server
    container_name: sd-server
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
    ports:
      - "8081:8081"
    environment:
      # Cap sd.cpp CPU threads so CPU-bound diffusion doesn't peg every core
      # and thermally shut down weak-cooled hosts. Tune to your thermals.
      - SD_CPU_THREADS=6
      # GPU layer configuration (highly recommended for RTX 4060 8GB).
      # Controls default layers offloaded to GPU for Qwen models.
      - SD_GPU_LAYERS=40
      # Enable verbose diagnostic and hardware detection reporting on startup.
      - SD_DEBUG=true
    volumes:
      - /usr/share/ollama/.ollama/models:/models
      - ./.alpaca-router:/router-models
      - ./sd-entrypoint.sh:/scripts/sd-entrypoint.sh
    entrypoint: ["/bin/bash", "/scripts/sd-entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: 31G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  audio-server:
    build:
      context: .
      dockerfile: Dockerfile.audio
    container_name: audio-server
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
    ports:
      - "8082:8082"
    environment:
      # Models load lazily on first request; the OTHER model is evicted first
      # and idle models are unloaded after this many seconds so llama-server
      # gets its VRAM back on an 8 GB card.
      - AUDIO_IDLE_UNLOAD_S=180
      - AUDIO_DEVICE=cuda
      - TTS_MODEL_ID=hexgrad/Kokoro-82M
      - MUSIC_MODEL_ID=facebook/musicgen-small
      - HUGGING_FACE_TOKEN=${HUGGING_FACE_TOKEN:-}
    volumes:
      - audio-models:/cache/huggingface
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  audio-models:


