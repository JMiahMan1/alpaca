<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpaca UI Launcher</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='bold' text-anchor='middle' fill='%2338bdf8' font-family='system-ui,sans-serif'%3EA%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        #launcher-toolbar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.9rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        #launcher-toolbar .brand {
            font-weight: 600;
            font-size: 0.95rem;
            margin-right: 0.5rem;
            white-space: nowrap;
        }
        #launcher-toolbar button {
            background: rgba(56, 189, 248, 0.12);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.35rem 0.8rem;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }
        #launcher-toolbar button:hover {
            background: rgba(56, 189, 248, 0.25);
        }
        #launcher-status {
            margin-left: auto;
            font-size: 0.78rem;
            color: var(--text-muted);
            max-width: 320px;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #launcher-main {
            display: flex;
            height: calc(100% - 46px);
        }
        #vnc-frame-wrap {
            flex: 1 1 auto;
            padding: 0.75rem;
            min-width: 0;
            /* JS (fitFrameToCanvas) shrinks this to the displayed canvas
            height so phones don't get a tall black letterbox around a
            short 4:3 stream. Default keeps a sane pre-connect size. */
            min-height: 240px;
        }
        #vnc-frame {
            width: 100%;
            height: 100%;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #000;
        }
        #launcher-panel {
            flex: 0 0 380px;
            max-width: 380px;
            border-left: 1px solid var(--border-color);
            background: var(--bg-secondary);
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            overflow-y: auto;
        }
        #launcher-panel h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        #launcher-panel pre {
            background: #0b1120;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem;
            font-family: ui-monospace, monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow: auto;
        }
        #launcher-panel input {
            width: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.45rem 0.6rem;
            font-family: ui-monospace, monospace;
            font-size: 0.78rem;
        }
        #shot-img {
            max-width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        /* On-screen key bar: basic keyboard buttons that work on mobile
        (no physical keyboard) and desktop alike. Sends X11 key taps via
        the sandbox exec endpoint (xdotool, DISPLAY=:99). */
        #key-bar {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            flex-wrap: wrap;
        }
        #key-bar button {
            min-width: 44px;
            min-height: 44px;
            touch-action: manipulation;
            font-size: 0.9rem;
        }
        /* Embed mode (?embed=1): clean player screen for the arcade. The
        game stream takes the whole area — no terminal sidebar, no Stop
        or App Log buttons. The Tests page keeps the full console.
        The toolbar is also trimmed to just the on-screen key bar (the
        only input a phone has) plus the status line. */
        body.embed #launcher-panel,
        body.embed #btn-stop,
        body.embed #btn-log,
        body.embed #launcher-toolbar .brand,
        body.embed #btn-restart,
        body.embed #btn-shot,
        body.embed #btn-close {
            display: none;
        }
        /* Arcade fullscreen: the arcade overlay provides its own bottom key
        bar + exit, so the launcher toolbar steps aside entirely and the
        VNC stream takes the whole frame. */
        body.arcade-full #launcher-toolbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="launcher-toolbar">
        <span class="brand">🖥 UI Launcher</span>
        <button id="btn-restart">🔄 Restart App</button>
        <button id="btn-log">📜 App Log</button>
        <button id="btn-shot">📷 Screenshot</button>
        <button id="btn-stop">⏹ Stop UI</button>
        <button id="btn-close">✕ Close</button>
        <span id="key-bar" role="group" aria-label="Send keys to app">
            <button type="button" data-xkey="Up" title="Arrow up">▲</button>
            <button type="button" data-xkey="Down" title="Arrow down">▼</button>
            <button type="button" data-xkey="Left" title="Arrow left">◀</button>
            <button type="button" data-xkey="Right" title="Arrow right">▶</button>
            <button type="button" data-xkey="space" title="Space">Space</button>
            <button type="button" data-xkey="Return" title="Enter">Enter</button>
            <button type="button" data-xkey="Escape" title="Escape">Esc</button>
        </span>
        <span id="launcher-status"></span>
    </div>
    <div id="launcher-main">
        <div id="vnc-frame-wrap">
            <iframe id="vnc-frame" allowfullscreen="true" allow="fullscreen" src=""></iframe>
        </div>
        <div id="launcher-panel">
            <h3>Terminal</h3>
            <input id="term-input" placeholder="e.g. ls /tmp; cat /tmp/ui_stdout.txt; DISPLAY=:99 xdpyinfo | head" />
            <button id="btn-term-run">▶ Run</button>
            <pre id="term-out"># sandbox terminal (sandbox user, DISPLAY=:99)</pre>
            <h3>App Log</h3>
            <button id="btn-log-refresh">🔄 Refresh Log</button>
            <pre id="log-out"># app runtime state</pre>
            <h3>Screenshot</h3>
            <button id="btn-shot-capture">📷 Capture</button>
            <img id="shot-img" style="display:none;" alt="Xvfb screenshot" />
        </div>
    </div>
    <script>
        const CONTAINER_ID = {{ container_id|tojson }};
        const HOST_PORT = {{ host_port|tojson }};
        if (new URLSearchParams(location.search).get('embed')) {
            document.body.classList.add('embed');
        }
        const statusEl = document.getElementById('launcher-status');
        const setStatus = (m) => { statusEl.textContent = m; };
        const uiFetch = (path, body) =>
            fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            }).then((r) => r.json().then((j) => ({ ok: r.ok, j })));

        const frame = document.getElementById('vnc-frame');
        // Report real stream state up to an embedding arcade page (same-origin
        // parent). The 'Connected' text below only means the iframe src was
        // set — the inner noVNC client reports its own status separately, and
        // on phones that is the only way to see a silent stream failure.
        const report = (state, detail) => {
            try {
                parent.postMessage(
                    { source: 'arcade-vnc', container: CONTAINER_ID, state, detail: detail || '' },
                    '*'
                );
            } catch (e) { /* no parent listener — harmless */ }
            // Mirror to the server log so a phone-side stall is visible
            // without reading the phone screen (fire-and-forget).
            try {
                const url = '/api/sandbox/ui_inner_status';
                const body = JSON.stringify({ container_id: CONTAINER_ID, state, detail: detail || '' });
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }));
                } else {
                    fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
                }
            } catch (e) { /* telemetry must never break the stream */ }
        };
        report('launcher-ready');
        window.addEventListener('error', (ev) => {
            report('page-error', String((ev && ev.message) || ev));
        });
        // Shrink the frame wrap to the displayed canvas height. noVNC
        // letterboxes a 4:3 desktop inside a tall container, which reads
        // on phones as a mostly-black screen. Same-origin (/serve/ tunnel)
        // so the inner DOM is readable; failures stay silent (default CSS).
        const fitFrameToCanvas = () => {
            try {
                const doc = frame.contentDocument;
                const canvas = doc && (doc.querySelector('#noVNC_container canvas')
                    || doc.querySelector('#noVNC_canvas'));
                const h = canvas && canvas.clientHeight;
                if (h && h >= 120) {
                    document.getElementById('vnc-frame-wrap').style.height = h + 24 + 'px';
                    // Tell the embedding arcade page the true video height so
                    // it can shrink the tall default live-frame (62dvh) down
                    // to the video — otherwise phones show the game as a
                    // small strip over a big black gap. Change-guarded.
                    if (Math.abs(h - (fitFrameToCanvas._last || 0)) > 2) {
                        fitFrameToCanvas._last = h;
                        report('video-height', String(h + 24));
                    }
                }
            } catch (e) { /* cross-origin or pre-load — keep default */ }
        };
        const watchInnerStream = () => {
            let last = '';
            let ticks = 0;
            let innerHooked = false;
            const poll = () => {
                try {
                // Same-origin inner window: capture its JS errors (module
                // import failures etc. never reach the outer window).
                if (!innerHooked) {
                    try {
                        const iw = frame.contentWindow;
                        if (iw && iw.document && iw.document.querySelector('#noVNC_status')) {
                            iw.onerror = (msg, src, line) => {
                                report('inner-error', `${msg} @${String(src || '').split('/').pop()}:${line || '?'}`.slice(0, 160));
                            };
                            innerHooked = true;
                        }
                    } catch (e) { /* inner not ready — retry next poll */ }
                }
                let state = 'inner-unreadable';
                let detail = '';
                try {
                    const doc = frame.contentDocument;
                    const el = doc && doc.querySelector('#noVNC_status');
                    if (el) {
                        state = 'inner-status';
                        detail = (el.textContent || '').trim().slice(0, 120);
                    } else if (doc && doc.querySelector('#noVNC_container, #noVNC_screen')) {
                        state = 'inner-rendered';
                    } else if (doc) {
                        state = 'inner-loading';
                    }
                } catch (e) {
                    state = 'inner-blocked';
                    detail = String(e && e.message || e).slice(0, 120);
                }
                const key = state + '|' + detail;
                if (key !== last) {
                    last = key;
                    report(state, detail);
                }
                // Heartbeat every ~10s even when nothing changes (beacon-only,
                // not shown in the parent status line): tells the server log
                // whether the phone page is still alive and what it sees.
                // Stops arriving = user left/closed; stuck state repeating =
                // genuinely stalled client.
                ticks += 1;
                if (ticks % 4 === 0) {
                    try {
                        // Blob (not a bare string) so the body arrives as
                        // application/json and parses server-side.
                        const hb = new Blob([JSON.stringify({
                            container_id: CONTAINER_ID,
                            state: 'heartbeat',
                            detail: `${key} online=${navigator.onLine}`,
                        })], { type: 'application/json' });
                        if (!navigator.sendBeacon('/api/sandbox/ui_inner_status', hb)) {
                            fetch('/api/sandbox/ui_inner_status', {
                                method: 'POST',
                                body: hb,
                                keepalive: true,
                            }).catch(() => {});
                        }
                    } catch (e) { /* telemetry only */ }
                }
                fitFrameToCanvas();
                } finally {
                    // Never let a telemetry exception kill the watch loop.
                    setTimeout(poll, 2500);
                }
            };
            poll();
        };
        let watchingStream = false;
        frame.addEventListener('load', () => {
            // Skip the initial about:blank load; watch only the real stream.
            if (!String(frame.src || '').includes('/serve/')) return;
            if (watchingStream) return;
            watchingStream = true;
            watchInnerStream();
        });
        if (HOST_PORT) {
            // Tunnel the noVNC client page AND its WebSocket through the dashboard
            // origin (port 5000) so it works from a LAN, VPN, or external network.
            // The published sandbox port is random and not reachable off-box.
            frame.src = `/serve/${CONTAINER_ID}/vnc.html?autoconnect=true&resize=scale&path=/serve/ws/${CONTAINER_ID}/websockify`;
            setStatus('Connected to noVNC stream.');
        } else {
            setStatus('No VNC port found for container.');
        }

        const termInput = document.getElementById('term-input');
        const termOut = document.getElementById('term-out');
        const runTerm = () => {
            const cmd = termInput.value.trim();
            if (!cmd) return;
            termOut.textContent += `\n$ ${cmd}\n`;
            termOut.scrollTop = termOut.scrollHeight;
            uiFetch('/api/sandbox/ui/exec', { container_id: CONTAINER_ID, command: cmd })
                .then(({ ok, j }) => {
                    if (!ok || j.error) throw new Error(j.error || 'exec failed');
                    termOut.textContent += (j.output || '(no output)') + '\n';
                    termOut.scrollTop = termOut.scrollHeight;
                })
                .catch((e) => { termOut.textContent += `[error] ${e.message}\n`; });
        };
        document.getElementById('btn-term-run').addEventListener('click', runTerm);
        termInput.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') runTerm(); });

        const logOut = document.getElementById('log-out');
        document.getElementById('btn-log').addEventListener('click', () => {
            uiFetch('/api/sandbox/ui/status', { container_id: CONTAINER_ID })
                .then(({ ok, j }) => {
                    if (!ok || j.error) throw new Error(j.error || 'status failed');
                    logOut.textContent =
                        `running: ${j.running}\n` +
                        `app_pid: ${j.app_pid || 'n/a'}\n` +
                        `app_exitcode: ${j.app_exitcode === null ? 'still running' : j.app_exitcode}\n` +
                        `\n--- stdout (tail) ---\n${j.stdout_tail || '(no output)'}`;
                })
                .catch((e) => { logOut.textContent += `\n[error] ${e.message}\n`; });
        });
        document.getElementById('btn-log-refresh').addEventListener('click', () => {
            document.getElementById('btn-log').click();
        });

        const shotImg = document.getElementById('shot-img');
        document.getElementById('btn-shot').addEventListener('click', capture);
        document.getElementById('btn-shot-capture').addEventListener('click', capture);
        function capture() {
            shotImg.style.display = 'none';
            uiFetch('/api/sandbox/ui/screenshot', { container_id: CONTAINER_ID })
                .then(({ ok, j }) => {
                    if (!ok || j.error) throw new Error(j.error || 'screenshot failed');
                    if (!j.image) throw new Error('no image returned');
                    shotImg.src = 'data:image/png;base64,' + j.image;
                    shotImg.style.display = 'block';
                })
                .catch((e) => { setStatus('Screenshot failed: ' + e.message); });
        }

        document.getElementById('btn-restart').addEventListener('click', () => {
            setStatus('Restarting app…');
            uiFetch('/api/sandbox/ui/restart', { container_id: CONTAINER_ID })
                .then(({ ok, j }) => {
                    if (!ok || j.error) throw new Error(j.error || 'restart failed');
                    setStatus('App relaunched.');
                })
                .catch((e) => { setStatus('Restart failed: ' + e.message); });
        });

        document.getElementById('btn-stop').addEventListener('click', () => {
            setStatus('Stopping UI…');
            uiFetch('/api/sandbox/stop_serve', { container_id: CONTAINER_ID })
                .then(() => {
                    setStatus('UI stopped.');
                    frame.src = 'about:blank';
                })
                .catch((e) => { setStatus('Stop failed: ' + e.message); });
        });

        document.getElementById('btn-close').addEventListener('click', () => {
            window.close();
        });

        // Arcade fullscreen channel: the arcade play page wraps this launcher
        // in a fullscreen overlay with its own bottom key bar, so it tells
        // us (a) which keys to inject and (b) when to hide our own toolbar
        // for maximum game area. Ignored on the Tests page (no messages).
        window.addEventListener('message', (ev) => {
            const m = ev && ev.data;
            if (!m || m.source !== 'arcade-key') return;
            if (m.fullscreen === true) document.body.classList.add('arcade-full');
            if (m.fullscreen === false) document.body.classList.remove('arcade-full');
            if (m.xkey) {
                uiFetch('/api/sandbox/ui/exec', {
                    container_id: CONTAINER_ID,
                    command: `DISPLAY=:99 xdotool key ${m.xkey}`,
                }).catch((e) => { setStatus('Key failed: ' + e.message); });
            }
        });

        // On-screen key bar: tap a button to send that X11 key to the app
        // (xdotool on DISPLAY=:99). Works with touch screens and keyboards.
        document.querySelectorAll('#key-bar button').forEach((b) => {
            b.addEventListener('click', () => {
                uiFetch('/api/sandbox/ui/exec', {
                    container_id: CONTAINER_ID,
                    command: `DISPLAY=:99 xdotool key ${b.dataset.xkey}`,
                })
                    .then(({ ok, j }) => {
                        if (!ok || j.error) throw new Error(j.error || 'key press failed');
                    })
                    .catch((e) => { setStatus('Key failed: ' + e.message); });
            });
        });
    </script>
</body>
</html>
