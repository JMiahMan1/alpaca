<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpaca UI Launcher</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='bold' text-anchor='middle' fill='%2338bdf8' font-family='system-ui,sans-serif'%3EA%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        #launcher-toolbar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.9rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        #launcher-toolbar .brand {
            font-weight: 600;
            font-size: 0.95rem;
            margin-right: 0.5rem;
            white-space: nowrap;
        }
        #launcher-toolbar button {
            background: rgba(56, 189, 248, 0.12);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.35rem 0.8rem;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }
        #launcher-toolbar button:hover {
            background: rgba(56, 189, 248, 0.25);
        }
        #launcher-status {
            margin-left: auto;
            font-size: 0.78rem;
            color: var(--text-muted);
            max-width: 320px;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #launcher-main {
            display: flex;
            height: calc(100% - 46px);
        }
        #vnc-frame-wrap {
            flex: 1 1 auto;
            padding: 0.75rem;
            min-width: 0;
            min-height: 0;
        }
        #vnc-frame {
            width: 100%;
            height: 100%;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #000;
        }
        #launcher-panel {
            flex: 0 0 380px;
            max-width: 380px;
            border-left: 1px solid var(--border-color);
            background: var(--bg-secondary);
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            overflow-y: auto;
        }
        #launcher-panel h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        #launcher-panel pre {
            background: #0b1120;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem;
            font-family: ui-monospace, monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow: auto;
        }
        #launcher-panel input {
            width: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.45rem 0.6rem;
            font-family: ui-monospace, monospace;
            font-size: 0.78rem;
        }
        #shot-img {
            max-width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        /* On-screen key bar: basic keyboard buttons that work on mobile
        (no physical keyboard) and desktop alike. Sends X11 key taps via
        the sandbox exec endpoint (xdotool, DISPLAY=:99). */
        #key-bar {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            flex-wrap: wrap;
        }
        #key-bar button {
            min-width: 44px;
            min-height: 44px;
            touch-action: manipulation;
            font-size: 0.9rem;
        }
        /* Embed mode (?embed=1): clean player screen for the arcade. The
        game stream takes the whole area — no terminal sidebar, no Stop
        or App Log buttons. The Tests page keeps the full console.
        The launcher toolbar is hidden entirely: the arcade overlay
        provides its own bottom key bar + exit, and the stream state is
        reported to the parent status line + server beacon. */
        body.embed #launcher-panel,
        body.embed #launcher-toolbar,
        body.embed #btn-stop,
        body.embed #btn-log,
        body.embed #launcher-toolbar .brand,
        body.embed #btn-restart,
        body.embed #btn-shot,
        body.embed #btn-close {
            display: none;
        }
        /* With the toolbar gone the stream fills the whole frame. */
        body.embed #launcher-main {
            height: 100%;
        }
        /* Arcade fullscreen: the arcade overlay provides its own bottom key
        bar + exit, so the launcher toolbar steps aside entirely and the
        VNC stream takes the whole frame. */
        body.arcade-full #launcher-toolbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="launcher-toolbar">
        <span class="brand">🖥 UI Launcher</span>
        <button id="btn-restart">🔄 Restart App</button>
        <button id="btn-log">📜 App Log</button>
        <button id="btn-shot">📷 Screenshot</button>
        <button id="btn-stop">⏹ Stop UI</button>
        <button id="btn-close">✕ Close</button>
        <button id="btn-sound">🔊 Sound</button>
        <!-- Game audio side-channel (noVNC is video-only): the sandbox streams
        game sound as MP3 via /serve/audio/<id>. No controls attribute — the
        Sound button toggles playback. Hidden ancestors never block audio. -->
        <audio id="game-audio" preload="none"></audio>
        <span id="key-bar" role="group" aria-label="Send keys to app">
            <button type="button" data-xkey="Up" title="Arrow up">▲</button>
            <button type="button" data-xkey="Down" title="Arrow down">▼</button>
            <button type="button" data-xkey="Left" title="Arrow left">◀</button>
            <button type="button" data-xkey="Right" title="Arrow right">▶</button>
            <button type="button" data-xkey="space" title="Space">Space</button>
            <button type="button" data-xkey="Return" title="Enter">Enter</button>
            <button type="button" data-xkey="Escape" title="Escape">Esc</button>
        </span>
        <span id="launcher-status"></span>
    </div>
    <div id="launcher-main">
        <div id="vnc-frame-wrap">
            <iframe id="vnc-frame" allowfullscreen="true" allow="fullscreen" src=""></iframe>
        </div>
        <div id="launcher-panel">
            <h3>Terminal</h3>
            <input id="term-input" placeholder="e.g. ls /tmp; cat /tmp/ui_stdout.txt; DISPLAY=:99 xdpyinfo | head" />
            <button id="btn-term-run">▶ Run</button>
            <pre id="term-out"># sandbox terminal (sandbox user, DISPLAY=:99)</pre>
            <h3>App Log</h3>
            <button id="btn-log-refresh">🔄 Refresh Log</button>
            <pre id="log-out"># app runtime state</pre>
            <h3>Screenshot</h3>
            <button id="btn-shot-capture">📷 Capture</button>
            <img id="shot-img" style="display:none;" alt="Xvfb screenshot" />
        </div>
    </div>
    <script>
        const CONTAINER_ID = {{ container_id|tojson }};
        const HOST_PORT = {{ host_port|tojson }};
        if (new URLSearchParams(location.search).get('embed')) {
            document.body.classList.add('embed');
        }
        const statusEl = document.getElementById('launcher-status');
        const setStatus = (m) => { statusEl.textContent = m; };
        const uiFetch = (path, body) =>
            fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            }).then((r) => r.json().then((j) => ({ ok: r.ok, j })));

        const frame = document.getElementById('vnc-frame');
        // Report real stream state up to an embedding arcade page (same-origin
        // parent). The 'Connected' text below only means the iframe src was
        // set — the inner noVNC client reports its own status separately, and
        // on phones that is the only way to see a silent stream failure.
        const report = (state, detail) => {
            try {
                parent.postMessage(
                    { source: 'arcade-vnc', container: CONTAINER_ID, state, detail: detail || '' },
                    '*'
                );
            } catch (e) { /* no parent listener — harmless */ }
            // Mirror to the server log so a phone-side stall is visible
            // without reading the phone screen (fire-and-forget).
            try {
                const url = '/api/sandbox/ui_inner_status';
                const body = JSON.stringify({ container_id: CONTAINER_ID, state, detail: detail || '' });
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }));
                } else {
                    fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
                }
            } catch (e) { /* telemetry must never break the stream */ }
        };
        report('launcher-ready');
        window.addEventListener('error', (ev) => {
            report('page-error', String((ev && ev.message) || ev));
        });
        // Promise rejections (module import failures, fetch faults) never
        // fire 'error' — without this they die completely silently.
        window.addEventListener('unhandledrejection', (ev) => {
            let r = ev && ev.reason;
            report('page-rejection', String((r && (r.message || r)) || ev).slice(0, 160));
        });
        // Strip noVNC's own chrome (top control bar, sidebar) inside the
        // inner frame: on a phone it eats ~150px and squeezes the game
        // into a strip. Same-origin (/serve/ tunnel) so the inner DOM is
        // writable. Injects a <style> with !important rules (noVNC's own
        // stylesheet and UI.js state changes override plain inline styles).
        // One-shot: noVNC never removes our style element.
        const hideNoVncChrome = () => {
            if (hideNoVncChrome._done) return;
            try {
                const doc = frame.contentDocument;
                if (!doc || !doc.head) return;
                if (doc.getElementById('arcade-strip')) {
                    hideNoVncChrome._done = true;
                    return;
                }
                const st = doc.createElement('style');
                st.id = 'arcade-strip';
                st.textContent = [
                    '#noVNC_control_bar, #noVNC_control_bar_anchor,',
                    '#noVNC_sidebar, #noVNC_sidebar_button,',
                    '#noVNC_mobile_buttons, #noVNC_bell { display: none !important; }',
                    '#noVNC_container { padding: 0 !important; margin: 0 !important; }',
                ].join('\n');
                doc.head.appendChild(st);
                hideNoVncChrome._done = true;
            } catch (e) { /* cross-origin or pre-load — retry next poll */ }
        };
        const watchInnerStream = () => {
            let last = '';
            let ticks = 0;
            let innerHooked = false;
            const poll = () => {
                try {
                // Same-origin inner window: capture its JS errors (module
                // import failures etc. never reach the outer window).
                if (!innerHooked) {
                    try {
                        const iw = frame.contentWindow;
                        if (iw && iw.document && iw.document.querySelector('#noVNC_status')) {
                            iw.onerror = (msg, src, line) => {
                                report('inner-error', `${msg} @${String(src || '').split('/').pop()}:${line || '?'}`.slice(0, 160));
                            };
                            // Same gap as the outer page: rejected promises
                            // (failed dynamic import, stalled fetch) skip
                            // window.onerror entirely.
                            try {
                                iw.addEventListener('unhandledrejection', (ev) => {
                                    let r = ev && ev.reason;
                                    report('inner-rejection', String((r && (r.message || r)) || ev).slice(0, 160));
                                });
                            } catch (e) { /* hook best-effort */ }
                            innerHooked = true;
                        }
                    } catch (e) { /* inner not ready — retry next poll */ }
                }
                let state = 'inner-unreadable';
                let detail = '';
                try {
                    const doc = frame.contentDocument;
                    const el = doc && doc.querySelector('#noVNC_status');
                    if (el) {
                        state = 'inner-status';
                        detail = (el.textContent || '').trim().slice(0, 120);
                    } else if (doc && doc.querySelector('#noVNC_container, #noVNC_screen')) {
                        state = 'inner-rendered';
                    } else if (doc) {
                        state = 'inner-loading';
                    }
                } catch (e) {
                    state = 'inner-blocked';
                    detail = String(e && e.message || e).slice(0, 120);
                }
                const key = state + '|' + detail;
                if (key !== last) {
                    last = key;
                    report(state, detail);
                }
                // Heartbeat every ~10s even when nothing changes (beacon-only,
                // not shown in the parent status line): tells the server log
                // whether the phone page is still alive and what it sees.
                // Stops arriving = user left/closed; stuck state repeating =
                // genuinely stalled client.
                ticks += 1;
                if (ticks % 4 === 0) {
                    try {
                        // Blob (not a bare string) so the body arrives as
                        // application/json and parses server-side.
                        const hb = new Blob([JSON.stringify({
                            container_id: CONTAINER_ID,
                            state: 'heartbeat',
                            detail: `${key} online=${navigator.onLine}`,
                        })], { type: 'application/json' });
                        if (!navigator.sendBeacon('/api/sandbox/ui_inner_status', hb)) {
                            fetch('/api/sandbox/ui_inner_status', {
                                method: 'POST',
                                body: hb,
                                keepalive: true,
                            }).catch(() => {});
                        }
                    } catch (e) { /* telemetry only */ }
                }
                // One-shot deep diagnostics: when the inner client never leaves
                // the connecting state, the status text alone cannot say why.
                // Snapshot the inner runtime once the document is complete,
                // then verify every script/stylesheet asset is fetchable from
                // THIS client (a carrier-stalled noVNC module fails silently:
                // no error event, no status text, spinner forever).
                if (!watchInnerStream._diagSent) {
                    try {
                        const iw0 = frame.contentWindow;
                        if (iw0 && iw0.document && iw0.document.readyState === 'complete') {
                            watchInnerStream._diagSent = true;
                            const d = {};
                            try {
                                const doc = iw0.document;
                                d.ready = doc.readyState;
                                const st = doc.querySelector('#noVNC_status');
                                d.status = st ? `'${(st.textContent || '').trim().slice(0, 40)}'` : '<none>';
                                const tr = doc.querySelector('#noVNC_transition');
                                d.spinner = tr ? iw0.getComputedStyle(tr).display : '<none>';
                                d.canvas = !!doc.querySelector('#noVNC_container canvas, #noVNC_canvas');
                                d.rfb = typeof iw0.RFB;
                                d.ui = typeof iw0.UI;
                                d.scripts = doc.querySelectorAll('script[src]').length;
                                d.ws = (function () {
                                    try { return typeof iw0.WebSocket; } catch (e) { return 'blocked'; }
                                })();
                            } catch (e) {
                                d.err = String((e && e.message) || e).slice(0, 80);
                            }
                            const diag = Object.entries(d).map(([k, v]) => `${k}=${v}`).join(' ');
                            report('inner-diag', diag.slice(0, 200));
                        }
                    } catch (e) { /* inner not ready — retry next poll */ }
                }
                if (watchInnerStream._diagSent && !watchInnerStream._assetsTested) {
                    watchInnerStream._assetsTested = true;
                    try {
                        const doc = frame.contentDocument;
                        const urls = [...doc.querySelectorAll('script[src]')].map((s) => s.src)
                            .concat([...doc.querySelectorAll('link[rel="stylesheet"]')].map((l) => l.href));
                        if (!urls.length) {
                            report('inner-asset', 'no script/link assets found in inner frame');
                        } else {
                            let pending = urls.length;
                            const bad = [];
                            urls.forEach((u) => {
                                // HEAD is cheap and accepted by the /serve/ tunnel.
                                fetch(u, { method: 'HEAD' }).then((r) => {
                                    if (!r.ok) bad.push(`${r.status} ${u.split('/').pop()}`);
                                }).catch(() => {
                                    bad.push(`net-fail ${u.split('/').pop()}`);
                                }).finally(() => {
                                    pending -= 1;
                                    if (pending === 0) {
                                        const summary = bad.length ? bad.join(', ') : `all ${urls.length} ok`;
                                        report('inner-asset', summary.slice(0, 200));
                                    }
                                });
                            });
                        }
                    } catch (e) {
                        report('inner-asset', `probe failed: ${String((e && e.message) || e).slice(0, 100)}`);
                    }
                }
                // One-shot GET test of the exact files vnc.html's inline
                // module needs (HEAD can succeed where GET stalls: the module
                // uses GET for its static import + top-level-await fetches,
                // and a hung GET suspends it silently — spinner forever).
                if (watchInnerStream._diagSent && !watchInnerStream._moduleTested) {
                    watchInnerStream._moduleTested = true;
                    try {
                        const base = String(frame.src || '').split('?')[0].replace(/vnc\.html$/, '');
                        const files = ['app/ui.js', 'defaults.json', 'mandatory.json'];
                        let pending = files.length;
                        const out = [];
                        files.forEach((f) => {
                            const ctl = new AbortController();
                            const timer = setTimeout(() => ctl.abort(), 20000);
                            fetch(base + f, { signal: ctl.signal }).then((r) => {
                                if (!r.ok) {
                                    out.push(`${f}=http${r.status}`);
                                } else {
                                    return r.text().then((t) => {
                                        out.push(`${f}=${t.length}b`);
                                    });
                                }
                            }).catch((e) => {
                                out.push(`${f}=${(e && e.name === 'AbortError') ? 'timeout' : 'net-fail'}`);
                            }).finally(() => {
                                clearTimeout(timer);
                                pending -= 1;
                                if (pending === 0) {
                                    report('inner-get', out.join(' ').slice(0, 200));
                                    // DOM integrity: the inline module (no src) is
                                    // what boots the viewer. A middlebox that
                                    // strips scripts, or a truncated parse, leaves
                                    // the spinner forever with no error. Expect
                                    // exactly 1 inline script and ~17-18KB.
                                    try {
                                        const doc2 = frame.contentDocument;
                                        const inl = doc2 ? doc2.querySelectorAll('script:not([src])').length : -1;
                                        const len = doc2 ? doc2.documentElement.outerHTML.length : -1;
                                        report('inner-dom', `inline=${inl} htmllen=${len}`.slice(0, 200));
                                    } catch (e2) { report('inner-dom', 'unreadable'); }
                                    // Loader truth: the iframe's resource-timing log
                                    // shows what ITS loader actually fetched (module
                                    // tree included). A stalled/failed module fetch
                                    // is silent to window.onerror but visible here.
                                    try {
                                        const iw2 = frame.contentWindow;
                                        const entries = iw2 && iw2.performance
                                            ? iw2.performance.getEntriesByType('resource') : [];
                                        const isJs = (r) => r.initiatorType === 'script'
                                            || String(r.name || '').endsWith('.js');
                                        const mods = entries.filter(isJs)
                                            .map((r) => `${String(r.name || '').split('/').pop()}:`
                                                + `${Math.round(r.duration)}ms`);
                                        report('inner-res', `n=${entries.length} js=[${mods.join(',')}]`.slice(0, 200));
                                    } catch (e3) { report('inner-res', 'unreadable'); }
                                }
                            });
                        });
                    } catch (e) {
                        report('inner-get', `probe failed: ${String((e && e.message) || e).slice(0, 100)}`);
                    }
                }
                hideNoVncChrome();
                } finally {
                    // Never let a telemetry exception kill the watch loop.
                    setTimeout(poll, 2500);
                }
            };
            poll();
        };
        let watchingStream = false;
        frame.addEventListener('load', () => {
            // Skip the initial about:blank load; watch only the real stream.
            if (!String(frame.src || '').includes('/serve/')) return;
            if (watchingStream) return;
            watchingStream = true;
            watchInnerStream();
        });
        if (HOST_PORT) {
            // Tunnel the noVNC client page AND its WebSocket through the dashboard
            // origin (port 5000) so it works from a LAN, VPN, or external network.
            // The published sandbox port is random and not reachable off-box.
            frame.src = `/serve/${CONTAINER_ID}/vnc.html?autoconnect=true&resize=scale&path=/serve/ws/${CONTAINER_ID}/websockify`;
            setStatus('Connected to noVNC stream.');
            // Independent socket probe: open a second WebSocket to the exact
            // URL noVNC uses, from THIS client's own radio, and report what
            // happens. The phone's noVNC sits in "connecting" with zero
            // errors — this distinguishes "client never sends" (probe opens
            // fine) from "path broken for this client" (probe fails/hangs).
            setTimeout(() => {
                try {
                    const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const url = `${scheme}//${location.host}/serve/ws/${CONTAINER_ID}/websockify`;
                    let done = false;
                    const finish = (msg) => {
                        if (done) return;
                        done = true;
                        try { sock.close(); } catch (e) { /* already closed */ }
                        report('ws-probe', `${msg} host=${location.host}`.slice(0, 200));
                    };
                    const sock = new WebSocket(url, ['binary']);
                    const timer = setTimeout(() => {
                        clearTimeout(timer);
                        try {
                            finish(`timeout readyState=${sock.readyState}`);
                        } catch (e) {
                            finish('timeout (unreadable)');
                        }
                    }, 15000);
                    sock.onopen = () => { clearTimeout(timer); finish('open'); };
                    sock.onerror = () => { clearTimeout(timer); finish('error'); };
                    sock.onclose = (ev) => {
                        clearTimeout(timer);
                        finish(`close code=${ev && ev.code} wasClean=${ev && ev.wasClean}`);
                    };
                } catch (e) {
                    report('ws-probe', `ctor-threw: ${String((e && e.message) || e).slice(0, 120)}`);
                }
            }, 5000);
            // Client identity for the silent-module theory: identical bytes
            // work on desktop, so a phone-only module parse failure means an
            // old engine. UA carries the Chrome version (vnc.html's inline
            // module needs top-level await, Chrome 89+).
            setTimeout(() => {
                report('ua', `${navigator.userAgent}`.slice(0, 250));
            }, 8000);
            // Decisive module probe: import the SAME module noVNC boots,
            // from this realm, behind a timeout race. Resolves => the graph
            // fetches and evaluates fine and the hang is inside start()'s
            // awaits; hung => stall at fetch/evaluate level for this client.
            // Also captures locale list (non-English triggers a locale-JSON
            // fetch in l10n.setup) and storage health (initSettings path).
            setTimeout(() => {
                try {
                    const base = `/serve/${CONTAINER_ID}/`;
                    let langs = '?';
                    try { langs = (navigator.languages || []).join(','); } catch (e) { /* keep ? */ }
                    let storage = '?';
                    try {
                        localStorage.setItem('__alpaca_t', '1');
                        localStorage.removeItem('__alpaca_t');
                        storage = 'ok';
                    } catch (e) { storage = `fail:${String((e && e.name) || e).slice(0, 30)}`; }
                    const raced = Promise.race([
                        import(base + 'app/ui.js').then(
                            () => 'ui-import=ok',
                            (e) => `ui-import=rejected:${String((e && e.message) || e).slice(0, 60)}`),
                        new Promise((res) => setTimeout(() => res('ui-import=hung'), 20000)),
                    ]);
                    raced.then((r) => {
                        report('inner-import', `${r} langs=${langs} storage=${storage}`.slice(0, 250));
                    });
                } catch (e) {
                    report('inner-import', `probe failed: ${String((e && e.message) || e).slice(0, 100)}`);
                }
            }, 12000);
            // Follow-up: cache-busted import + timed plain fetches of the
            // inline module's own awaits. import(hung) + import(?bust=ok) =>
            // poisoned cache entry for the exact URL (fix = bust the module
            // URL); both hung => request-shape stall (module loader vs
            // fetch); slow plain fetch of one JSON => that await is the
            // silent hang. Runs after the warm reload settles.
            setTimeout(() => {
                try {
                    const base = `/serve/${CONTAINER_ID}/`;
                    const timed = (url, ms) => {
                        const t0 = Date.now();
                        const ctl = new AbortController();
                        const timer = setTimeout(() => ctl.abort(), ms);
                        return fetch(url, { signal: ctl.signal }).then(
                            (r) => r.text().then((t) => `${url.split('/').pop()}=${Date.now() - t0}ms/${t.length}b`),
                            (e) => `${url.split('/').pop()}=FAIL:${String((e && e.name) || e).slice(0, 20)}`,
                        ).finally(() => clearTimeout(timer));
                    };
                    const bust = Promise.race([
                        import(base + 'app/ui.js?alpaca_probe=' + Date.now()).then(
                            () => 'bust-import=ok',
                            (e) => `bust-import=rejected:${String((e && e.message) || e).slice(0, 50)}`),
                        new Promise((res) => setTimeout(() => res('bust-import=hung'), 15000)),
                    ]);
                    Promise.all([
                        bust,
                        timed(base + 'defaults.json', 15000),
                        timed(base + 'mandatory.json', 15000),
                        timed(base + 'package.json', 15000),
                    ]).then((parts) => {
                        report('inner-import2', parts.join(' ').slice(0, 250));
                    });
                } catch (e) {
                    report('inner-import2', `probe failed: ${String((e && e.message) || e).slice(0, 100)}`);
                }
            }, 40000);
            // One-shot warm reload: if the viewer still shows nothing after
            // every probe, reload the frame once. First load warms all
            // caches, so the second run executes with instant fetches — a
            // cold-link fetch stall cannot survive it. Beaconed, so the log
            // shows whether the reload is what fixed it.
            setTimeout(() => {
                try {
                    if (window.__alpacaReloaded) return;
                    if (!String(frame.src || '').includes('/serve/')) return;
                    const doc = frame.contentDocument;
                    const el = doc && doc.querySelector('#noVNC_status');
                    const empty = !el || !el.textContent.trim();
                    const noCanvas = !(doc && doc.querySelector('canvas'));
                    if (empty && noCanvas) {
                        window.__alpacaReloaded = true;
                        report('frame-reload', 'empty-after-25s reloading once');
                        frame.contentWindow.location.reload();
                    }
                } catch (e) {
                    report('frame-reload', `unreadable: ${String((e && e.message) || e).slice(0, 80)}`);
                }
            }, 25000);
            // WebCodecs probe: replicates noVNC core/util/browser.js top-level
            // await (VideoDecoder.isConfigSupported + configure/decode/flush,
            // the ONLY top-level await in its 55-file graph). If either never
            // settles here, the phone's media stack wedges noVNC's whole
            // module graph silently (spinner forever, zero errors).
            setTimeout(() => {
                const delay = (ms, v) =>
                    new Promise((res) => setTimeout(() => res(v), ms));
                (async () => {
                    if (!('VideoDecoder' in window)) {
                        report('webcodecs', 'no-decoder');
                        return;
                    }
                    const cfg = { codec: 'avc1.42401f', codedWidth: 1920,
                                  codedHeight: 1080, optimizeForLatency: true };
                    let r;
                    try {
                        r = await Promise.race([
                            VideoDecoder.isConfigSupported(cfg),
                            delay(10000, 'time'),
                        ]);
                        report('webcodecs', `isConfig=${
                            r === 'time' ? 'time' : JSON.stringify(r.supported)}`);
                    } catch (e) {
                        report('webcodecs', `isConfig=err:${String(e).slice(0, 60)}`);
                        return;
                    }
                    if (r === 'time') return;
                    try {
                        const out = await Promise.race([
                            (async () => {
                                const d = new VideoDecoder({
                                    output: () => {}, error: () => {} });
                                d.configure(cfg);
                                d.decode(new EncodedVideoChunk({
                                    timestamp: 0, type: 'key',
                                    data: new Uint8Array([0, 0, 0, 1]) }));
                                await d.flush();
                                return 'ok';
                            })(),
                            delay(10000, 'time'),
                        ]);
                        report('webcodecs', `flush=${out}`);
                    } catch (e) {
                        report('webcodecs', `flush=err:${String(e).slice(0, 60)}`);
                    }
                })();
            }, 12000);
            // In-iframe fetch: the inline module and UI run in the FRAME's
            // loader context, while every probe so far used the launcher's.
            // Same-origin (verified by inner-diag DOM reads), so time the
            // frame's own fetch of the exact inline-module URLs. A stall here
            // (while launcher-side fetch flies) is the silent suspension.
            setTimeout(() => {
                try {
                    const iw = frame.contentWindow;
                    if (!iw || typeof iw.fetch !== 'function') {
                        report('inner-ifetch', 'no-frame-fetch');
                        return;
                    }
                    const base = window.location.origin + '/serve/' + CONTAINER_ID;
                    const outs = [];
                    const one = (nm, url) => {
                        const t0 = performance.now();
                        return Promise.race([
                            iw.fetch(url, {cache: 'no-store'})
                                .then((r) => r.text().then((t) => `${nm}=${Math.round(performance.now() - t0)}ms/`
                                    + `${r.status}/${t.length}b`))
                                .catch((e) => `${nm}=net-fail:${String((e && e.name) || e).slice(0, 20)}`),
                            new Promise((res) => setTimeout(() => res(`${nm}=hung`), 15000)),
                        ]).then((s) => outs.push(s));
                    };
                    one('if-defaults', `${base}/defaults.json`)
                        .then(() => one('if-mandatory', `${base}/mandatory.json`))
                        .then(() => {
                            report('inner-ifetch', outs.join(' '));
                            // Execution trace: the proxy injects a fetch
                            // call-tracer + body-end marker into vnc.html.
                            // fetch> with no ok/fail = the module suspended
                            // on that exact call; body-end missing = parser
                            // never finished the page.
                            try {
                                const tr = iw.__vncTrace;
                                report('inner-trace', Array.isArray(tr)
                                    ? tr.join('|').slice(0, 2000)
                                    : `typeof=${typeof tr}`);
                            } catch (e2) {
                                report('inner-trace', 'unreadable');
                            }
                        });
                } catch (e) {
                    report('inner-ifetch', `err:${String((e && e.message) || e).slice(0, 60)}`);
                }
            }, 45000);
        } else {
            setStatus('No VNC port found for container.');
        }

        // Game audio side-channel: noVNC/RFB carries video only, so the
        // sandbox streams game sound as MP3 at /serve/audio/<id> (virtual
        // PulseAudio null sink + ffmpeg — see sandbox_exec.py _AUDIO_SETUP).
        // Only play() is gated by autoplay policy — mute is just a volume
        // control — so the arcade embed (toolbar hidden, ?embed=1) starts
        // MUTED (always allowed, no gesture needed) and unmutes itself:
        // sound is on from the first second. The Sound button (Tests page)
        // toggles manually; the arcade overlay drives the same channel via
        // the 'arcade-audio' message. States ride the existing report()
        // channel so the server log shows audio health per session.
        const audioEl = document.getElementById('game-audio');
        const btnSound = document.getElementById('btn-sound');
        const isEmbed = new URLSearchParams(location.search).get('embed');
        let audioOn = false;
        // Generation guard: every off() or fresh start bumps audioGen, so a
        // stale in-flight play() can never unmute or report after the user
        // muted or a newer start replaced it. Redundant on() calls are
        // no-ops (no src reset): each reset reboots the lazy encoder and
        // forces seconds of browser rebuffer, which stacked autostart +
        // parent unmute + button clicks into minute-long start delays.
        let audioGen = 0;
        const audioURL = `/serve/audio/${CONTAINER_ID}`;
        const setAudio = (on) => {
            audioOn = on;
            btnSound.textContent = on ? '🔇 Mute' : '🔊 Sound';
            if (!on) {
                audioGen++;
                audioEl.pause();
                report('audio-stopped');
                return;
            }
            // Already live: keep the running stream, just make sure it is
            // playing unmuted. No src reset here.
            if (audioEl.src && !audioEl.paused && !audioEl.ended) {
                audioEl.muted = false;
                return;
            }
            // Fresh start: muted first (autoplay-safe), unmute once the
            // stream is actually playing. load() re-opens the connection so
            // an unmute after mute rejoins the live edge instead of
            // resuming a paused-backpressured (stale) connection.
            const gen = ++audioGen;
            audioEl.muted = true;
            if (!audioEl.src) audioEl.src = audioURL;
            audioEl.load();
            audioEl.play().then(
                () => {
                    if (gen !== audioGen) return;
                    audioEl.muted = false;
                    report('audio-playing');
                },
                (e) => {
                    if (gen !== audioGen) return;
                    audioOn = false;
                    btnSound.textContent = '🔊 Sound';
                    const msg = String((e && e.message) || e).slice(0, 120);
                    report('audio-blocked', msg);
                    setStatus('Sound unavailable: ' + msg);
                }
            );
        };
        btnSound.addEventListener('click', () => setAudio(!audioOn));
        audioEl.addEventListener('error', () => {
            report('audio-error', 'stream error (container audio down?)');
        });
        if (isEmbed) {
            // Muted autoplay connects the stream immediately (also boots
            // the lazy encoder), then unmute for sound-by-default. Taps
            // inside the nested VNC iframe never reach this document, so a
            // gesture-gated start here would never fire. setAudio starts
            // muted (always allowed) and unmutes itself once playing.
            setAudio(true);
            document.addEventListener('pointerdown', () => {
                if (!audioOn) setAudio(true);
            }, { once: true });
        }

        const termInput = document.getElementById('term-input');
        const termOut = document.getElementById('term-out');
        const runTerm = () => {
            const cmd = termInput.value.trim();
            if (!cmd) return;
            termOut.textContent += `\n$ ${cmd}\n`;
            termOut.scrollTop = termOut.scrollHeight;
            uiFetch('/api/sandbox/ui/exec', { container_id: CONTAINER_ID, command: cmd })
                .then(({ ok, j }) => {
                    if (!ok || j.error) throw new Error(j.error || 'exec failed');
                    termOut.textContent += (j.output || '(no output)') + '\n';
                    termOut.scrollTop = termOut.scrollHeight;
                })
                .catch((e) => { termOut.textContent += `[error] ${e.message}\n`; });
        };
        document.getElementById('btn-term-run').addEventListener('click', runTerm);
        termInput.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') runTerm(); });

        const logOut = document.getElementById('log-out');
        document.getElementById('btn-log').addEventListener('click', () => {
            uiFetch('/api/sandbox/ui/status', { container_id: CONTAINER_ID })
                .then(({ ok, j }) => {
                    if (!ok || j.error) throw new Error(j.error || 'status failed');
                    logOut.textContent =
                        `running: ${j.running}\n` +
                        `app_pid: ${j.app_pid || 'n/a'}\n` +
                        `app_exitcode: ${j.app_exitcode === null ? 'still running' : j.app_exitcode}\n` +
                        `\n--- stdout (tail) ---\n${j.stdout_tail || '(no output)'}`;
                })
                .catch((e) => { logOut.textContent += `\n[error] ${e.message}\n`; });
        });
        document.getElementById('btn-log-refresh').addEventListener('click', () => {
            document.getElementById('btn-log').click();
        });

        const shotImg = document.getElementById('shot-img');
        document.getElementById('btn-shot').addEventListener('click', capture);
        document.getElementById('btn-shot-capture').addEventListener('click', capture);
        function capture() {
            shotImg.style.display = 'none';
            uiFetch('/api/sandbox/ui/screenshot', { container_id: CONTAINER_ID })
                .then(({ ok, j }) => {
                    if (!ok || j.error) throw new Error(j.error || 'screenshot failed');
                    if (!j.image) throw new Error('no image returned');
                    shotImg.src = 'data:image/png;base64,' + j.image;
                    shotImg.style.display = 'block';
                })
                .catch((e) => { setStatus('Screenshot failed: ' + e.message); });
        }

        document.getElementById('btn-restart').addEventListener('click', () => {
            setStatus('Restarting app…');
            uiFetch('/api/sandbox/ui/restart', { container_id: CONTAINER_ID })
                .then(({ ok, j }) => {
                    if (!ok || j.error) throw new Error(j.error || 'restart failed');
                    setStatus('App relaunched.');
                })
                .catch((e) => { setStatus('Restart failed: ' + e.message); });
        });

        document.getElementById('btn-stop').addEventListener('click', () => {
            setStatus('Stopping UI…');
            uiFetch('/api/sandbox/stop_serve', { container_id: CONTAINER_ID })
                .then(() => {
                    setStatus('UI stopped.');
                    frame.src = 'about:blank';
                })
                .catch((e) => { setStatus('Stop failed: ' + e.message); });
        });

        document.getElementById('btn-close').addEventListener('click', () => {
            window.close();
        });

        // Arcade fullscreen channel: the arcade play page wraps this launcher
        // in a fullscreen overlay with its own bottom key bar, so it tells
        // us (a) which keys to inject and (b) when to hide our own toolbar
        // for maximum game area. Ignored on the Tests page (no messages).
        // The arcade overlay's Sound button drives game sound through this
        // channel ({on: bool}); the embed also autostarts muted above, so
        // this mostly re-syncs after a frame reload or manual mute.
        window.addEventListener('message', (ev) => {
            const m = ev && ev.data;
            if (!m) return;
            if (m.source === 'arcade-audio') {
                if (typeof m.on === 'boolean') setAudio(m.on);
                return;
            }
            if (m.source !== 'arcade-key') return;
            if (m.fullscreen === true) document.body.classList.add('arcade-full');
            if (m.fullscreen === false) document.body.classList.remove('arcade-full');
            if (m.xkey) {
                // down=true (pressed) / down=false (released) gives
                // press-and-hold; absent flag keeps the old tap behavior.
                const verb = m.down === true ? 'keydown' : m.down === false ? 'keyup' : 'key';
                uiFetch('/api/sandbox/ui/exec', {
                    container_id: CONTAINER_ID,
                    command: `DISPLAY=:99 xdotool ${verb} ${m.xkey}`,
                }).catch((e) => { setStatus('Key failed: ' + e.message); });
            }
        });

        // On-screen key bar: press-and-hold sends xdotool keydown/keyup to
        // the app (xdotool on DISPLAY=:99). Works with touch and mouse.
        document.querySelectorAll('#key-bar button').forEach((b) => {
            const keyCmd = (verb) => uiFetch('/api/sandbox/ui/exec', {
                container_id: CONTAINER_ID,
                command: `DISPLAY=:99 xdotool ${verb} ${b.dataset.xkey}`,
            })
                .then(({ ok, j }) => {
                    if (!ok || j.error) throw new Error(j.error || 'key press failed');
                })
                .catch((e) => { setStatus('Key failed: ' + e.message); });
            b.addEventListener('pointerdown', (ev) => {
                ev.preventDefault();
                keyCmd('keydown');
            });
            for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) {
                b.addEventListener(ev, () => keyCmd('keyup'));
            }
        });
    </script>
</body>
</html>
