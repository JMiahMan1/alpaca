name: Test

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install mypy
      - name: Run lint
        run: ruff check .
      # -m "not live" is belt-and-braces: pyproject addopts already deselects
      # them, but an explicit marker keeps this line honest if addopts changes.
      # The live suite (test_live_services / test_dashboard_e2e /
      # test_smoke_playwright) needs a running stack and lives in live.yml.
      - name: Run tests
        run: pytest -m "not live"
      - name: Type check (strict files)
        run: mypy web/app.py llm_benchmark_suite.py
      - name: Type check (lenient files)
        run: mypy web/shared_llm_benchmark.py
