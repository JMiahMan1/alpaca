[mypy]
# 3.12, not 3.10: modern numpy ships `type X = ...` statements in its stubs,
# which older targets cannot parse at all ("Type statement is only supported in
# Python 3.12 and greater"), so the whole run aborted before checking anything.
# The runtime stays 3.11 (compose / Dockerfiles / CI); this only sets the
# version mypy assumes for type-checking.
python_version = 3.12
ignore_missing_imports = True
no_implicit_optional = True
show_error_codes = True
warn_redundant_casts = True
warn_unused_ignores = True
disable_error_code = import-untyped

[mypy-web.*]
disallow_untyped_defs = False

[mypy-yaml]
disable_error_code = import-untyped
