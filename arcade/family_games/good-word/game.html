<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Parable Party</title>
<!-- @family-kit -->
<!--
  The phone controller for Parable Party.

  The TV is the show and every phone is a controller, the way Jackbox-style
  party games work: join with a room code, wait in the lobby, then one focused
  screen per moment (write, vote, look at the TV). When a TV stage is showing
  the room it plays all the sound; phones stay silent apart from a haptic tap.
  With no TV, only the host's phone speaks the announcer, so a table of phones
  never echoes. What you type is always visible to you: the TV never shows a
  draft, so there is nothing to hide it from.
-->
<style>
  :root {
    --ink: #1b0f3b;
    --paper: #fff8e7;
    --gold: #ffc83d;
    --coral: #ff6b6b;
    --teal: #2ed3b7;
    --violet: #7c5cff;
    --dim: #fff0b8;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Rounded", "Segoe UI", system-ui, sans-serif;
  }
  #fk-overlay { display: none !important; }
  #fk-hud [data-fk="pause"], #fk-hud [data-fk="best"] { display: none !important; }
  #fk-hud .fk-pill small { font-size: 12px; }
  #gw-app {
    position: absolute; inset: 0; z-index: 6; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y;
    padding: calc(var(--fk-safe-top) + 64px) calc(14px + var(--fk-safe-right))
      calc(24px + var(--fk-safe-bottom)) calc(14px + var(--fk-safe-left));
    font-family: var(--font); color: #fff; -webkit-tap-highlight-color: transparent;
  }
  #gw-screen { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  #gw-screen *, #gw-sheet * { box-sizing: border-box; }
  .gw-enter { animation: gw-pop .32s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes gw-pop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }

  /* --- logo --- */
  .gw-logo { text-align: center; margin: 4px 0 2px; line-height: .95; }
  .gw-logo span { display: inline-block; font-weight: 900; text-transform: uppercase; color: var(--ink);
    padding: 6px 14px 4px; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 4px 5px 0 var(--ink); }
  .gw-logo .a { background: var(--gold); font-size: 22px; transform: rotate(-3deg); }
  .gw-logo .b { background: var(--coral); color: #fff; font-size: 34px; transform: rotate(2deg); margin-top: -4px; }
  .gw-logo .c { background: var(--teal); font-size: 18px; transform: rotate(-1.5deg); margin-top: -2px; }
  .gw-tag { text-align: center; color: var(--dim); font-weight: 700; font-size: 15px; margin: 2px 8px 0; }

  /* --- sticker card + inputs + buttons --- */
  .gw-card { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 20px;
    box-shadow: 0 6px 0 var(--ink); padding: 16px; }
  .gw-card h2 { margin: 0 0 10px; font-size: 20px; font-weight: 900; }
  .gw-label { display: block; font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em;
    color: #5b4a8a; margin: 2px 0 6px; }
  /* 16px+ keeps iOS from zooming on focus; dark ink on white so the writer always sees their words. */
  .gw-field { width: 100%; font: 800 20px var(--font); color: var(--ink); -webkit-text-fill-color: var(--ink); background: #fff;
    border: 3px solid var(--ink); border-radius: 14px; padding: 12px 14px; outline: none; -webkit-appearance: none; caret-color: var(--violet); }
  .gw-field::placeholder { color: #a99cc9; -webkit-text-fill-color: #a99cc9; }
  .gw-field:focus { box-shadow: 0 0 0 4px rgba(124, 92, 255, .35); }
  .gw-code-field { text-transform: uppercase; letter-spacing: .4em; text-align: center; font-size: 30px; padding: 10px; }
  textarea.gw-field { min-height: 112px; resize: none; line-height: 1.3; font-size: 19px; }
  .gw-count { text-align: right; font-size: 14px; font-weight: 800; color: #7b6aa8; margin-top: 4px; }
  .gw-btn { display: block; width: 100%; font: 900 20px var(--font); color: var(--ink); background: var(--gold);
    border: 3px solid var(--ink); border-radius: 16px; padding: 14px 16px; box-shadow: 0 6px 0 var(--ink);
    text-transform: uppercase; letter-spacing: .03em; cursor: pointer; transition: transform .06s, box-shadow .06s; }
  .gw-btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .gw-btn:disabled { opacity: .45; }
  .gw-btn.coral { background: var(--coral); color: #fff; }
  .gw-btn.teal { background: var(--teal); }
  .gw-btn.violet { background: var(--violet); color: #fff; }
  .gw-btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.55); box-shadow: none;
    font-size: 15px; padding: 10px; text-transform: none; }
  .gw-btn.small { font-size: 15px; padding: 10px 12px; box-shadow: 0 4px 0 var(--ink); }
  .gw-row { display: flex; gap: 10px; align-items: center; }
  .gw-row > * { flex: 1; min-width: 0; }
  .gw-or { text-align: center; color: var(--dim); font-weight: 900; font-size: 15px; letter-spacing: .2em; }

  /* --- avatars + players --- */
  .gw-avatars { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .gw-av { aspect-ratio: 1; font-size: 21px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff;
    display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; min-width: 0; }
  .gw-av.on { background: var(--gold); transform: scale(1.08); box-shadow: 0 3px 0 var(--ink); }
  .gw-players { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .gw-p { text-align: center; position: relative; min-width: 0; }
  .gw-p .face { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper);
    display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 0 var(--ink); }
  /* Names get two lines before they are cut: "Grandpa Joe" fits on the narrowest phone. */
  .gw-p .nm { font-size: 15px; font-weight: 900; margin-top: 6px; line-height: 1.15; overflow: hidden; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .gw-p.me .face { background: var(--gold); }
  .gw-p.away { opacity: .4; }
  .gw-p.empty .face { background: transparent; border-style: dashed; border-color: rgba(255,255,255,.35); box-shadow: none; color: rgba(255,255,255,.35); font-size: 22px; }
  .gw-p .crown { position: absolute; top: -10px; right: 2px; font-size: 18px; transform: rotate(18deg); }
  .gw-p .tick { position: absolute; bottom: 18px; right: 0; background: var(--teal); color: var(--ink); border: 2px solid var(--ink);
    width: 22px; height: 22px; border-radius: 50%; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; }

  /* --- lobby --- */
  .gw-roomcode { text-align: center; }
  .gw-roomcode .k { font-size: 15px; font-weight: 900; letter-spacing: .2em; color: var(--dim); }
  .gw-roomcode .v { display: inline-block; font-size: 52px; font-weight: 900; letter-spacing: .14em; color: var(--ink);
    background: var(--gold); border: 3px solid var(--ink); border-radius: 18px; padding: 2px 18px 2px 26px;
    box-shadow: 0 6px 0 var(--ink); transform: rotate(-2deg); margin-top: 6px; max-width: 100%; }
  .gw-wait { text-align: center; font-weight: 900; font-size: 18px; }
  .gw-dots span { display: inline-block; animation: gw-bob 1s infinite; }
  .gw-dots span:nth-child(2) { animation-delay: .15s; } .gw-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes gw-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .gw-chip { display: inline-block; font-size: 15px; font-weight: 900; padding: 5px 10px; border-radius: 999px;
    border: 2px solid var(--ink); background: var(--teal); color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gw-chip.off { background: #ece4ff; }
  .gw-note { font-size: 15px; font-weight: 700; color: #5b4a8a; margin-top: 8px; overflow-wrap: anywhere; }
  .gw-switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; font-size: 15px; margin-top: 12px; }
  .gw-switch input { width: 24px; height: 24px; accent-color: var(--violet); flex: 0 0 auto; }
  select.gw-field { font-size: 16px; padding: 10px; }

  /* --- round header + prompt --- */
  .gw-head { display: flex; align-items: center; gap: 10px; }
  .gw-badge { flex: 1; min-width: 0; font-size: 14px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
    background: var(--violet); border: 2.5px solid var(--ink); border-radius: 12px; padding: 8px 10px; box-shadow: 0 4px 0 var(--ink);
    line-height: 1.25; overflow-wrap: anywhere; }
  .gw-badge b { color: var(--gold); }
  .gw-clock { width: 54px; height: 54px; flex: 0 0 54px; position: relative; }
  .gw-clock svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gw-clock .n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; }
  .gw-clock.low .n { color: var(--coral); }
  .gw-prompt { font-size: 22px; font-weight: 900; line-height: 1.22; overflow-wrap: anywhere; }
  .gw-scene { font-size: 15px; font-weight: 700; color: #5b4a8a; background: #f1e7ff; border-radius: 12px; padding: 9px 11px; margin-bottom: 10px; }
  .gw-instr { font-size: 15px; font-weight: 800; color: #6b5a99; margin-top: 10px; }

  /* --- answers --- */
  .gw-opts { display: flex; flex-direction: column; gap: 12px; }
  .gw-opt { text-align: left; width: 100%; font: 800 18px/1.25 var(--font); color: var(--ink); background: var(--paper);
    border: 3px solid var(--ink); border-radius: 16px; padding: 14px 16px; box-shadow: 0 5px 0 var(--ink); cursor: pointer;
    transition: transform .06s, box-shadow .06s; overflow-wrap: anywhere; }
  .gw-opt:nth-child(4n+1) { transform: rotate(-.6deg); } .gw-opt:nth-child(4n+3) { transform: rotate(.6deg); }
  .gw-opt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .gw-opt.mine { background: #e9e2fb; color: #6b5a99; box-shadow: none; border-style: dashed; }
  .gw-opt.picked { background: var(--gold); }
  .gw-opt .meta { display: block; font-size: 15px; font-weight: 900; color: #6b5a99; margin-top: 6px; }
  /* race rounds: big game-show buttons */
  .gw-picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gw-pick { min-height: 84px; font: 900 19px/1.2 var(--font); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px;
    box-shadow: 0 6px 0 var(--ink); padding: 10px 8px; cursor: pointer; text-align: center; overflow-wrap: anywhere; }
  .gw-pick:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .gw-pick .l { display: block; font-size: 15px; opacity: .7; }
  .gw-pick.c0 { background: var(--gold); } .gw-pick.c1 { background: var(--teal); }
  .gw-pick.c2 { background: #ff9b9b; } .gw-pick.c3 { background: #b9a6ff; }
  .gw-picks.tf .gw-pick { min-height: 120px; font-size: 30px; }
  .gw-picks.tf .c0 { background: var(--teal); } .gw-picks.tf .c1 { background: var(--coral); color: #fff; }
  .gw-pick.right { outline: 5px solid #fff; background: #4ade80 !important; color: var(--ink); }
  .gw-pick.dim { opacity: .4; }
  /* Closed while the TV reads the clue out. */
  .gw-picks.closed .gw-pick, .gw-board2.closed .gw-cell { filter: grayscale(1); opacity: .45; box-shadow: none; }
  .gw-listen { text-align: center; font: 900 18px var(--font); color: #fff3c4; animation: gw-pulse 1.2s ease-in-out infinite; }
  @keyframes gw-pulse { 50% { opacity: .5; } }
  .gw-board2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gw-cell { font: 800 16px/1.2 var(--font); color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
    padding: 10px 8px; min-height: 52px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; text-align: center; overflow-wrap: anywhere; }
  .gw-cell.sel { background: var(--gold); }
  .gw-cell.m0 { background: #ffd66b; } .gw-cell.m1 { background: #7ee8d5; } .gw-cell.m2 { background: #ffb3b3; }
  .gw-cell.m3 { background: #cdbdff; } .gw-cell.m4 { background: #a7e3ff; }
  .gw-cell .k { display: inline-block; min-width: 22px; font-weight: 900; }
  .gw-cell.used { opacity: .45; }
  .gw-colhead { font: 900 15px var(--font); color: #fff; text-transform: uppercase; letter-spacing: .08em; text-align: center; }
  .gw-opt.win { background: #fff1b8; } .gw-opt.trap { background: #ffd9d9; } .gw-opt.truth { background: #c9f7ec; }
  .gw-opt .pts { float: right; color: #138a6f; font-weight: 900; margin-left: 8px; }

  /* --- big status screens --- */
  .gw-hero { text-align: center; padding: 20px 8px; }
  .gw-hero .big { font-size: 64px; line-height: 1; filter: drop-shadow(0 6px 0 rgba(0,0,0,.25)); }
  .gw-hero h1 { font-size: 30px; font-weight: 900; margin: 12px 0 6px; text-shadow: 0 3px 0 var(--ink); }
  .gw-hero p { margin: 0; color: var(--dim); font-weight: 800; font-size: 16px; overflow-wrap: anywhere; }
  .gw-delta { display: inline-block; margin-top: 14px; font-size: 26px; font-weight: 900; color: var(--ink); background: var(--teal);
    border: 3px solid var(--ink); border-radius: 14px; padding: 4px 14px; box-shadow: 0 5px 0 var(--ink); transform: rotate(-2deg); }
  .gw-delta.zero { background: rgba(255,255,255,.15); color: #fff; border-color: rgba(255,255,255,.4); box-shadow: none; }
  .gw-delta.neg { background: var(--coral); color: #fff; }
  .gw-board { display: flex; flex-direction: column; gap: 8px; }
  .gw-line { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.15);
    border-radius: 14px; padding: 9px 12px; font-weight: 900; }
  .gw-line.me { background: var(--gold); color: var(--ink); border-color: var(--ink); }
  .gw-line .r { width: 26px; text-align: center; } .gw-line .a { font-size: 22px; }
  .gw-line .n { flex: 1; min-width: 0; overflow: hidden; line-height: 1.15; overflow-wrap: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  /* The score with this round's change under it: the name keeps the room. */
  .gw-line .s { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
  .gw-line .d { font-size: 14px; color: var(--teal); } .gw-line.me .d { color: #0d6e58; }
  .gw-line .d.neg { color: #ff9b9b; } .gw-line.me .d.neg { color: #be123c; }

  /* --- sheet + toast --- */
  #gw-sheet { position: absolute; inset: 0; z-index: 30; background: rgba(10, 5, 30, .6); display: none; align-items: flex-end; }
  #gw-sheet.on { display: flex; animation: gw-fade .2s; }
  @keyframes gw-fade { from { opacity: 0; } }
  .gw-sheet-body { width: 100%; max-height: 84%; overflow-y: auto; overflow-x: hidden; background: var(--paper); color: var(--ink); font-family: var(--font);
    border-top: 3px solid var(--ink); border-radius: 24px 24px 0 0; padding: 18px 16px calc(20px + var(--fk-safe-bottom));
    animation: gw-up .25s cubic-bezier(.2, 1.2, .4, 1); }
  @keyframes gw-up { from { transform: translateY(40%); } }
  .gw-sheet-body h2 { margin: 0 0 4px; font-size: 22px; font-weight: 900; }
  .gw-tv { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 16px; padding: 12px; margin-top: 10px; font: 800 16px var(--font); box-shadow: 0 4px 0 var(--ink); }
  .gw-tv .ic { font-size: 28px; flex: 0 0 auto; } .gw-tv .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .gw-tv small { display: block; color: #6b5a99; font-size: 14px; font-weight: 800; }
  .gw-tv.live { background: #c9f7ec; }
  .gw-status { margin-top: 12px; font-weight: 800; font-size: 15px; border-radius: 12px; padding: 10px 12px; background: #f1e7ff; overflow-wrap: anywhere; }
  .gw-status.ok { background: #c9f7ec; } .gw-status.err { background: #ffd9d9; }
  #gw-toast { position: absolute; left: 16px; right: 16px; bottom: calc(18px + var(--fk-safe-bottom)); z-index: 40;
    background: var(--ink); color: #fff; border: 2px solid var(--gold); border-radius: 14px; padding: 12px 14px; font: 800 15px var(--font);
    text-align: center; transform: translateY(20px); opacity: 0; visibility: hidden; transition: transform .25s, opacity .25s, visibility .25s; pointer-events: none; }
  #gw-toast.on { transform: none; opacity: 1; visibility: visible; }
  .gw-ways { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .gw-join-row { display: flex; gap: 8px; align-items: stretch; }
  .gw-join-row .gw-field { flex: 1 1 auto; min-width: 0; margin: 0; text-align: center; letter-spacing: .25em; font-size: 22px; }
  .gw-join-row .gw-btn { flex: 0 0 auto; width: auto; padding-left: 22px; padding-right: 22px; }
  /* Short phones: a smaller header so both ways in stay above the fold. */
  @media (max-height: 760px) {
    .gw-tall-only { display: none; }
    .gw-logo .a { font-size: 16px; } .gw-logo .b { font-size: 26px; } .gw-logo .c { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) { .gw-enter, .gw-dots span, .gw-sheet-body { animation: none; } }
</style>
</head>
<body>
<div id="fk-stage"></div>
<div id="gw-app"><div id="gw-screen"></div></div>
<div id="gw-sheet"><div class="gw-sheet-body" id="gw-sheet-body"></div></div>
<div id="gw-toast" role="status" aria-live="polite"></div>
<script>
(function () {
  "use strict";

  /* ================= identity & parameters ================= */
  const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
  const query = new URLSearchParams(location.search);
  hash.forEach((v, k) => query.set(k, v));
  const store = {
    get(k) { try { return localStorage.getItem("gw:" + k) || ""; } catch (_) { return ""; } },
    set(k, v) { try { localStorage.setItem("gw:" + k, v); } catch (_) {} }
  };
  const cleanName = (s) => String(s || "").replace(/[^\p{L}\p{N} .'-]/gu, "").trim().slice(0, 20);
  const cleanCode = (s) => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  const appName = cleanName(query.get("name") || "");
  let myName = appName || cleanName(store.get("name"));
  let myAvatar = store.get("avatar");
  let myId = store.get("player_id");
  if (!myId) {
    myId = "gw_" + Math.random().toString(36).slice(2, 10);
    store.set("player_id", myId);
  }
  const AVATARS = ["👑", "🦁", "🕊️", "🐑", "🐪", "🐟", "🎺", "🏺", "⭐", "🛡️", "🌿", "🍇", "⛵", "🔥", "🌈", "🦉"];
  if (!AVATARS.includes(myAvatar)) myAvatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
  const isAutomatedCheck = navigator.webdriver === true;

  /* ================= state ================= */
  let code = cleanCode(query.get("room") || "");
  let room = null;
  let view = "join";
  let busy = false;
  let draft = "";
  let pollTimer = null;
  let lastSig = "";
  let deadline = 0;
  let holdUntil = 0;
  let autoSentFor = ""; // the round whose unsent draft was sent when time ran out // streamed TV: the picture is behind, so each phase waits for it
  let stageEverSeen = false; // a TV played for this room: phones stay silent from then on
  const spoken = {};
  let voices = [];
  let useAiPrompts = false;
  let openRooms = [];
  let scorePostedFor = "";
  let failures = 0;
  // TV stage
  let screens = [];
  let screensLoading = false;
  let screensError = "";
  let castStatus = null;
  let castingId = "";
  let activeScreen = null;
  let jarvisRelay = false;
  let castTimer = null;
  let pendingStop = false;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ================= kit: controller shell ================= */
  const kit = FamilyKit.create({
    slug: "good-word",
    title: "Parable Party",
    tagline: "Join on your phone. Watch it on the TV.",
    emoji: "📜",
    accent: "#ffc83d",
    accent2: "#7c5cff",
    bg: "#120a2e",
    scoreLabel: "Points",
    howTo: ["Join with the room code on the TV.", "Write answers, vote for favourites, dodge the Scribe's Trap."],
    onStart() {}
  });
  const stage = kit.canvas();
  const motes = [];
  for (let i = 0; i < 46; i++) {
    motes.push({ x: Math.random(), y: Math.random(), r: 1.5 + Math.random() * 2.5, s: 0.004 + Math.random() * 0.012, p: Math.random() * 6.28 });
  }
  kit.run(
    () => {},
    () => {

          <div class="gw-join-row">
            <input id="gw-code" class="gw-field gw-code-field" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Room code" value="${esc(code)}">
            <button type="button" class="gw-btn coral" id="gw-join" ${busy ? "disabled" : ""}>Join</button>
          </div>
        </div>
      </div>
      ${rooms ? `<div class="gw-or">ROOMS OPEN NOW</div>${rooms}` : ""}`;
  }

  function howToCard() {
    return `<div class="gw-card"><div class="gw-label">How to play</div>
      <ol style="margin:6px 0 0;padding-left:20px;font-weight:700;line-height:1.45">
        <li>A Bible-story prompt shows on the TV (and here).</li>
        <li>Write a funny or wise answer. Stuck? Play the Scribe's Decoy.</li>
        <li>Vote for your favourite, not your own. Every vote you get is points!</li>
        <li>Careful: the Scribe's Trap is hiding in the answers (sometimes two!). Voting for one costs points.</li></ol></div>`;
  }
  function viewLobby(r) {
    const humans = humansOf(r).length;
    const host = (r.players || []).find((p) => p.is_host);
    let h = `<div class="gw-roomcode gw-enter"><div class="k">ROOM CODE</div><div class="v">${esc(r.code)}</div></div>
      <div class="gw-tag">Friends join by scanning the TV, or with this code.</div>
      ${playersGrid(r)}`;
    if (r.you_are_host) {
      const tv = activeScreen || (r.stage_connected ? { name: "a TV" } : null);
      h += `<div class="gw-card">
          <h2>📺 The big screen</h2>
          <span class="gw-chip ${tv ? "" : "off"}">${tv ? "Live on " + esc(tv.name) : "Not on a TV yet"}</span>
          <div class="gw-note">Put the game on a TV so everyone watches together. It plays the sound; answers stay private on phones.</div>
          <div style="margin-top:12px"><button type="button" class="gw-btn teal small" id="gw-tv-open">${tv ? "Change TV" : "Show on a TV"}</button></div>
        </div>
        <button type="button" class="gw-btn coral" id="gw-start" ${busy ? "disabled" : ""}>${humans >= 3 ? "Everybody's in, start!" : "Start (AI scribes fill seats)"}</button>
        <div class="gw-card">
          <h2>⚙️ Settings</h2>
          <label class="gw-label" for="gw-voice">Announcer voice</label>
          <select id="gw-voice" class="gw-field">${(voices.length ? voices : [{ id: r.voice, label: r.voice }]).map((v) =>
            `<option value="${esc(v.id)}" ${v.id === r.voice ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select>
          <label class="gw-switch"><span>✨ Fresh AI-written prompts</span><input type="checkbox" id="gw-ai" ${useAiPrompts ? "checked" : ""}></label>
          <label class="gw-switch"><span>🎵 Game show music</span><input type="checkbox" id="gw-music" ${r.music !== false ? "checked" : ""}></label>
        </div>` + howToCard();
    } else {
      h += `<div class="gw-card gw-wait">Waiting for ${esc(host ? host.name : "the host")} to start<span class="gw-dots"><span>.</span><span>.</span><span>.</span></span>
        <div class="gw-note" style="font-weight:800">${r.stage_connected ? "📺 The game is on the TV." : "Get comfy. You'll write your answers here."}</div></div>`;
      h += howToCard();
      if (r.joke) h += `<div class="gw-card"><div class="gw-label">😄 Dad joke while you wait</div><p style="font-weight:800;margin:6px 0 4px">${esc(r.joke.setup)}</p><p style="font-weight:900;color:var(--teal);margin:0">${esc(r.joke.punch)}</p></div>`;
    }
    return h;
  }

  // Seconds left; a race clue still being read shows its full time, held, like the TV.
  function clockLeft() {
    if (room && room.race && room.race.listening) return room.race.seconds || 0;
    return Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  }
  function header(r) {
    const pr = r.prompt || {};
    const x2 = pr.multiplier > 1 ? ` <b>· ${pr.multiplier}X</b>` : "";
    const total = Math.max(1, (r.phase_seconds || (r.phase === "writing" ? 55 : r.phase === "voting" ? 35 : 14)) - (r.stage_delay_s || 0));
    const left = clockLeft();
    const frac = Math.max(0, Math.min(1, left / total));
    return `<div class="gw-head"><div class="gw-badge">Round ${r.round}/${r.total_rounds} · ${esc(pr.icon || "📜")} ${esc(pr.badge || pr.title || "")}${x2}</div>
      <div class="gw-clock ${left <= 10 ? "low" : ""}" id="gw-clock" data-total="${total}"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#1b0f3b" stroke="rgba(255,255,255,.15)" stroke-width="5"/>
      <circle id="gw-arc" cx="20" cy="20" r="17" fill="none" stroke="#ffc83d" stroke-width="5" stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="${(106.8 * (1 - frac)).toFixed(1)}"/></svg>
      <div class="n" id="gw-left">${left}</div></div></div>`;
  }
  function promptCard(r, compact) {
    const pr = r.prompt || {};
    return `<div class="gw-card ${compact ? "" : "gw-enter"}">
      ${pr.subprompt ? `<div class="gw-scene">🎬 ${esc(String(pr.subprompt).replace(/^SCENE:\s*/i, ""))}</div>` : ""}
      ${pr.speaker ? `<div class="gw-label">🗣️ ${esc(pr.speaker)} says…</div>` : ""}
      <div class="gw-prompt">${esc(pr.prompt)}</div>
      ${compact ? "" : `<div class="gw-instr">${esc(pr.instructions || "")}</div>`}</div>`;
  }

  // Between screens, while every device (and the TV, if there is one) gets ready for the next one.
  function viewGetReady(r) {
    const what = r.phase === "writing" ? "Round " + r.round + " is coming up" : r.phase === "voting" ? "Time to vote"
      : r.phase === "racing" ? "Next question coming up" : "Here come the results";
    return `<div class="gw-panel gw-enter" style="text-align:center;padding:34px 18px">
      <div style="font-size:54px;line-height:1">${r.stage_connected ? "📺" : "⏳"}</div>
      <h1 style="margin:12px 0 6px">Get ready!</h1>
      <p class="gw-note" style="font-weight:800;color:#fff3c4">${what}. ${r.stage_connected ? "Watch the TV…" : "Waiting for everyone…"}</p></div>`;
  }
  function viewHold(r) {
    // The TV is a video a few seconds behind; nothing here may get ahead of it.
    const what = r.phase === "writing" ? "Round " + r.round + " is coming up" : r.phase === "voting" ? "Time to vote"
      : r.phase === "racing" ? "Next question coming up" : "Here come the results";
    return `<div class="gw-panel gw-enter" style="text-align:center;padding:34px 18px">
      <div style="font-size:54px;line-height:1">📺</div>
      <h1 style="margin:12px 0 6px">Get ready!</h1>
      <p class="gw-note" style="font-weight:800;color:#fff3c4">${what}. Watch the TV…</p></div>`;
  }
  function viewWriting(r) {
    let h = header(r);
    const me = meOf(r);
    if (!me || me.spectator) {
      return h + promptCard(r, true) + `<div class="gw-hero"><div class="big">👀</div><h1>You're watching this round</h1><p>You'll play from the next match.</p></div>`;
    }
    if (r.my_submission) {
      const waiting = seatsOf(r).filter((p) => !p.submitted && !p.is_bot);
      return h + promptCard(r, true) + `<div class="gw-hero gw-enter"><div class="big">📜</div><h1>Sealed!</h1>
        <p>${r.my_submission.is_decoy ? "You played the Scribe's Decoy. Sneaky." : "“" + esc(r.my_submission.text) + "”"}</p>
        <p style="margin-top:10px">${waiting.length ? "Waiting on " + waiting.map((p) => esc(p.name)).join(", ") : "Everyone's in!"}</p></div>` + playersGrid(r, "submitted");
    }
    const isBluff = r.prompt && r.prompt.kind === "truth_or_bluff";
    return h + promptCard(r) + `<div class="gw-card">
        <label class="gw-label" for="gw-answer">${isBluff ? "Your believable FAKE answer" : "Your answer"}</label>
        <textarea id="gw-answer" class="gw-field" maxlength="120" rows="3" enterkeyhint="done" autocapitalize="sentences" placeholder="${isBluff ? "Make it sound true…" : "Be funny. Be wise. Be quick."}">${esc(draft)}</textarea>
        <div class="gw-count" id="gw-count">${draft.length}/120</div>
        <div style="margin-top:8px"><button type="button" class="gw-btn coral" id="gw-send" ${busy ? "disabled" : ""}>Send it!</button></div>
      </div>
      <button type="button" class="gw-btn ghost" id="gw-decoy" ${busy ? "disabled" : ""}>🪤 Stuck? Play the Scribe's Decoy (+500 per vote)</button>`;
  }

  /* ---------- race rounds ---------- */
  let raceUi = { key: "", sel: -1, map: {}, order: [] };
  let raceOpenAt = 0;  // local time when the current clue takes answers
  function raceClosed() { return raceOpenAt > Date.now(); }
  function raceSend(choice) {
    if (busy || !room || !room.race) return;
    busy = true;
    api(`/api/party/rooms/${encodeURIComponent(code)}/race`, { player_id: myId, item: room.race.index, choice })
      .then((d) => { busy = false; tap(); lastSig = ""; setRoom(d.room); })
      .catch((e) => { busy = false; lastSig = ""; render(); toast(e.message); });
  }
  function viewRacing(r) {
    const race = r.race || {};
    const item = race.item || {};
    let h = header(r);
    const qn = race.count > 1 ? `<div class="gw-label" style="color:#fff3c4;text-align:center">Question ${race.index + 1} of ${race.count}</div>` : "";
    const me = meOf(r);
    const clue = `<div class="gw-card gw-enter"><div class="gw-prompt">${esc(item.clue || "")}</div>
      ${item.type === "pairs" ? `<div class="gw-instr">Tap one on the left, then its match on the right.</div>`
        : item.type === "order" ? `<div class="gw-instr">Tap them in order: ${esc(item.order_label || "first to last")}.</div>` : ""}</div>`;
    if (!me || me.spectator) return h + qn + clue + `<div class="gw-hero"><div class="big">👀</div><h1>You're watching this round</h1></div>`;
    if (race.flash) {
      const mine = race.mine;
      const right = race.right || [];
      const head = !mine ? `<div class="big">⏰</div><h1>Too slow!</h1>`
        : mine.correct ? `<div class="big">${mine.place === 0 ? "⚡" : "✅"}</div><h1>${mine.place === 0 ? "FASTEST!" : "Correct! " + ordinal(mine.place + 1) + " in"}</h1>`
          : `<div class="big">❌</div><h1>Not quite!</h1>`;
      return h + qn + `<div class="gw-hero gw-enter">${head}<p>The answer: <b>${esc(item.answer_text || "")}</b></p>
        <p style="margin-top:8px">${right.length ? "⚡ " + esc(right[0]) + " got there first" : "Nobody got that one!"}</p></div>` +
        (item.note ? `<div class="gw-tag">📖 ${esc(item.note)}</div>` : "");
    }
    if (race.mine) {
      const waiting = humansOf(r).filter((p) => !p.submitted).length;
      return h + qn + clue + `<div class="gw-hero gw-enter"><div class="big">🔒</div><h1>Locked in!</h1>
        <p>${waiting ? "Waiting on " + waiting + " more…" : "Everyone's in!"}</p></div>`;
    }
    const closed = raceClosed();
    const listen = closed ? `<div class="gw-listen">🎧 Listen to the question…</div>` : "";
    if (item.type === "pick") {
      const tf = (item.options || []).length === 2;
      return h + qn + clue + listen + `<div class="gw-picks${tf ? " tf" : ""}${closed ? " closed" : ""}">` + (item.options || []).map((o, i) =>
        `<button type="button" class="gw-pick c${i}" data-pick="${i}" ${busy || closed ? "disabled" : ""}>${tf ? "" : `<span class="l">${"ABCD"[i]}</span>`}${esc(o)}</button>`).join("") + "</div>";
    }
    if (item.type === "pairs") {
      const leftOf = {}; Object.keys(raceUi.map).forEach((l) => { leftOf[raceUi.map[l]] = Number(l); });
      const done = Object.keys(raceUi.map).length === (item.left || []).length;
      let g = listen + `<div class="gw-board2${closed ? " closed" : ""}"><div class="gw-colhead">${esc(item.left_label || "")}</div><div class="gw-colhead">${esc(item.right_label || "")}</div>`;
      for (let i = 0; i < (item.left || []).length; i++) {
        const lm = raceUi.map[i] !== undefined ? " m" + i : raceUi.sel === i ? " sel" : "";
        const rl = leftOf[i];
        g += `<button type="button" class="gw-cell${lm}" data-left="${i}" ${closed ? "disabled" : ""}>${esc(item.left[i])}</button>`;
        g += `<button type="button" class="gw-cell${rl !== undefined ? " m" + rl : ""}" data-right="${i}" ${closed ? "disabled" : ""}>${esc(item.right[i])}</button>`;
      }
      return h + qn + clue + g + `</div><div class="gw-row" style="gap:8px"><button type="button" class="gw-btn ghost" id="gw-race-reset">Start over</button>
        <button type="button" class="gw-btn coral" id="gw-race-lock" ${done && !busy ? "" : "disabled"}>Lock it in!</button></div>`;
    }
    const items = item.items || [];
    const done = raceUi.order.length === items.length;
    let g = `<div class="gw-card" style="padding:12px"><div class="gw-label">Your order (${esc(item.order_label || "first → last")})</div>` +
      (raceUi.order.length ? raceUi.order.map((idx, n) => `<div style="font-weight:900;margin:4px 0">${n + 1}. ${esc(items[idx])}</div>`).join("") : `<div class="gw-note" style="color:#5b4a8a">Tap below to start</div>`) + "</div>";
    g += listen + `<div class="gw-board2${closed ? " closed" : ""}" style="grid-template-columns:1fr">` + items.map((t, i) => {
      const pos = raceUi.order.indexOf(i);
      return `<button type="button" class="gw-cell${pos >= 0 ? " used" : ""}" data-ord="${i}" ${pos >= 0 || closed ? "disabled" : ""}>${esc(t)}</button>`;
    }).join("") + "</div>";
    return h + qn + clue + g + `<div class="gw-row" style="gap:8px"><button type="button" class="gw-btn ghost" id="gw-race-reset">Start over</button>
      <button type="button" class="gw-btn coral" id="gw-race-lock" ${done && !busy ? "" : "disabled"}>Lock it in!</button></div>`;
  }
  function raceSummaryHtml(r) {
    const list = (r.reveal && r.reveal.race) || [];
    return list.map((it, i) => `<div class="gw-opt" style="cursor:default">${list.length > 1 ? `<b>${i + 1}.</b> ` : ""}${esc(it.clue)}
      <span class="meta">✅ ${esc(it.answer_text || "")}${(it.right || []).length ? " · ⚡ " + esc(it.right[0]) : ""}</span></div>`).join("");
  }

  function viewVoting(r) {
    const isBluff = r.prompt && r.prompt.kind === "truth_or_bluff";
    let h = header(r);
    if ((meOf(r) || {}).spectator) {
      return h + promptCard(r, true) + `<div class="gw-hero"><div class="big">👀</div><h1>You're watching this round</h1><p>The room is full. You'll get a seat when one opens.</p></div>`;
    }
    if (r.my_vote) {
      const mine = (r.options || []).find((o) => o.option_id === r.my_vote);
      return h + `<div class="gw-hero gw-enter"><div class="big">🗳️</div><h1>Vote locked!</h1>
        <p>${mine ? "“" + esc(mine.text) + "”" : ""}</p><p style="margin-top:10px">${r.stage_connected ? "Watch the TV for the reveal." : "Hang tight for the reveal."}</p></div>` + playersGrid(r, "voted");
    }
    h += promptCard(r, true) + `<div class="gw-tag" style="color:#fff;font-size:20px;font-weight:900">${isBluff ? "Which one is the TRUTH?" : "Tap your favourite!"}</div><div class="gw-opts">`;
    (r.options || []).forEach((o) => {
      h += o.is_mine
        ? `<button type="button" class="gw-opt mine" disabled>${esc(o.text)}<span class="meta">✍️ Yours</span></button>`
        : `<button type="button" class="gw-opt" data-vote="${esc(o.option_id)}">${esc(o.text)}</button>`;
    });
    return h + "</div>";
  }

  function resultsHtml(r) {
    const opts = (r.options || []).slice().sort((a, b) => (b.voters || []).length - (a.voters || []).length);
    let h = '<div class="gw-opts">';
    opts.forEach((o) => {
      const cls = o.kind === "decoy" ? "trap" : o.kind === "truth" ? "truth" : o.is_round_winner ? "win" : "";
      const who = o.kind === "truth" ? "📖 The real answer"
        : o.kind === "decoy" ? "🪤 The Scribe's Trap"
        : (o.author_names || []).length ? "✍️ " + esc(o.author_names.join(", "))  // only winners are signed
        : o.is_mine ? "✍️ Yours" : "";
      const votes = (o.voters || []).map((v) => esc(typeof v === "string" ? "•" : v.avatar || "•")).join(" ");
      h += `<div class="gw-opt ${cls}" style="cursor:default">${o.points_awarded ? `<span class="pts">+${o.points_awarded}</span>` : ""}${o.is_round_winner ? "🏆 " : ""}${esc(o.text)}${who || votes ? `<span class="meta">${who}${who && votes ? " · " : ""}${votes}</span>` : ""}</div>`;
    });
    return h + "</div>";
  }
  function boardHtml(r) {
    return '<div class="gw-board">' + seatsOf(r).map((p, i) =>
      `<div class="gw-line ${p.id === r.you ? "me" : ""}"><span class="r">${i + 1}</span><span class="a">${esc(p.avatar)}</span><span class="n">${esc(p.id === r.you ? "You" : p.name)}</span>` +
      `<span class="s">${p.score}${p.round_delta ? `<span class="d${p.round_delta < 0 ? " neg" : ""}">${p.round_delta > 0 ? "+" : ""}${p.round_delta}</span>` : ""}</span></div>`).join("") + "</div>";
  }
  function resultCalled(r) {
    return !!(r && r.phase === "reveal" && (Date.now() - phaseStartLocal) / 1000 >= (r.result_at_s || 0));
  }
  function scoresShown(r) {
    return !!(r && r.phase === "reveal" && r.scores_at_s && (Date.now() - phaseStartLocal) / 1000 >= r.scores_at_s);
  }
  // The reveal ends on its own page: the standings and what's coming next, at the top where they can be seen.
  function viewScores(r) {
    const mine = meOf(r);
    const rank = mine ? 1 + seatsOf(r).filter((p) => p.score > mine.score).length : 0;  // ties share a place
    const last = r.round >= r.total_rounds;
    const nx = r.up_next;
    let h = `<div class="gw-hero gw-enter"><div class="big">${rank === 1 && mine.score > 0 ? "👑" : "📊"}</div>
      <h1>${last ? "Final standings!" : "Scoreboard"}</h1><p>${rank ? "You're in " + ordinal(rank) + " place" : ""}</p></div>` + boardHtml(r);
    if (nx) h += `<div class="gw-card" style="text-align:center;padding:12px"><div class="gw-label">Up next</div>
      <div style="font-size:22px;font-weight:900">${esc(nx.icon || "")} ${esc(nx.title || "")}${nx.multiplier > 1 ? " · " + nx.multiplier + "X" : ""}</div>
      <div class="gw-note" style="color:#5b4a8a">Starts in <b id="gw-next-in">${Math.max(0, Math.ceil((deadline - Date.now()) / 1000))}</b>s</div></div>`;
    else h += `<div class="gw-tag" style="margin-top:8px">Final scores in <b id="gw-next-in">${Math.max(0, Math.ceil((deadline - Date.now()) / 1000))}</b>s</div>`;
    if (r.you_are_host) h += `<button type="button" class="gw-btn teal" id="gw-next" ${busy ? "disabled" : ""}>${last ? "Final scores now ▶" : "Start next round now ▶"}</button>`;
    return h;
  }
  function viewReveal(r) {
    if (scoresShown(r)) return viewScores(r);
    if (r.stage_connected && !resultCalled(r)) {
      // The TV is unveiling the answers and the host has not called it yet: no spoilers here.
      let w = `<div class="gw-hero gw-enter"><div class="big">📺</div><h1>Look at the TV!</h1><p>Here come the answers…</p></div>`;
      if (r.you_are_host) w += `<button type="button" class="gw-btn teal" id="gw-next" ${busy ? "disabled" : ""}>Show the scores ▶</button>`;
      return w;
    }
    const me = meOf(r) || { round_delta: 0, score: 0 };
    const rank = seatsOf(r).findIndex((p) => p.id === r.you) + 1;
    const d = me.round_delta || 0;
    let h = `<div class="gw-hero gw-enter"><div class="big">${d > 0 ? "🎉" : d < 0 ? "🪤" : "👀"}</div>
      <h1>${r.stage_connected ? "Look at the TV!" : "Round " + r.round + " results"}</h1>
      <p>${rank ? "You're in " + ordinal(rank) + " place" : ""}</p>
      <div class="gw-delta ${d > 0 ? "" : d < 0 ? "neg" : "zero"}">${d > 0 ? "+" : ""}${d} pts</div></div>`;
    if (!r.stage_connected && r.reveal && r.reveal.race) h += `<div class="gw-opts">${raceSummaryHtml(r)}</div>`;
    else if (!r.stage_connected) h += resultsHtml(r) + (r.prompt && r.prompt.scripture_note ? `<div class="gw-tag">${esc(r.prompt.scripture_note)}</div>` : "");
    // The standings get their own page next (viewScores); here it is only the answers.
    if (r.you_are_host) h += `<button type="button" class="gw-btn teal" id="gw-next" ${busy ? "disabled" : ""}>Show the scores ▶</button>`;
    return h;
  }
  function viewFinished(r) {
    const seats = seatsOf(r);
    const rank = seats.findIndex((p) => p.id === r.you) + 1;
    const winner = seats[0];
    let h = `<div class="gw-hero gw-enter"><div class="big">${rank === 1 ? "🏆" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : "📜"}</div>
      <h1>${rank === 1 ? "You won the Golden Scroll!" : winner ? esc(winner.name) + " wins!" : "Match complete!"}</h1>
      <p>${rank ? "You finished " + ordinal(rank) + " with " + ((meOf(r) || {}).score || 0) + " points" : ""}</p></div>` + boardHtml(r);
    h += r.you_are_host
      ? `<button type="button" class="gw-btn coral" id="gw-again" ${busy ? "disabled" : ""}>Play again</button>`
      : `<div class="gw-card gw-wait">Waiting for the host to start another match<span class="gw-dots"><span>.</span><span>.</span><span>.</span></span></div>`;
    return h;
  }

  let confirming = "";
  function roomFooter(r) {
    const leaveLabel = confirming === "leave" ? "Tap again to leave" : "Leave game";
    const endLabel = confirming === "end" ? "Tap again to end for all" : "End game for everyone";
    // Only a room whose TV is a video stream has a lag to tune.
    const sync = r.you_are_host && r.stage_delay_s > 0 ? `<div class="gw-card" style="padding:12px 14px">
      <div class="gw-row" style="align-items:center;justify-content:space-between;gap:10px">
        <div><b>📺 TV picture lag: ${Number(r.stage_delay_s).toFixed(0)}s</b>
          <div class="gw-note">Phones wait this long for the TV. Nudge it if they get ahead or fall behind.</div></div>
        <div class="gw-row" style="gap:6px;flex:0 0 auto">
          <button type="button" class="gw-btn ghost small" data-lag="-1" aria-label="Less lag">−</button>
          <button type="button" class="gw-btn ghost small" data-lag="1" aria-label="More lag">+</button></div></div></div>` : "";
    return sync + `<div class="gw-row" style="margin-top:6px">
      <button type="button" class="gw-btn ghost" id="gw-leave">${leaveLabel}</button>
      ${r.you_are_host ? `<button type="button" class="gw-btn ghost" id="gw-end" style="border-color:rgba(255,107,107,.7)">${endLabel}</button>` : ""}</div>`;
  }
  function confirmThen(kind, fn) {
    if (confirming === kind) { confirming = ""; fn(); return; }
    confirming = kind; render();
    clearTimeout(confirmThen.timer);
    confirmThen.timer = setTimeout(() => { confirming = ""; render(); }, 4000);
  }

  /* ================= render + bind ================= */
  /* A tap belongs to the screen it started on. When the screen changes under a finger
     (writing turns into voting, the next race clue arrives), the lifted finger would
     otherwise press whatever new button is now under it: an answer chosen for you. */
  let screenId = "", screenAt = 0, touchedAt = 0;
  ["pointerdown", "touchstart", "mousedown"].forEach((t) =>
    document.addEventListener(t, () => { touchedAt = Date.now(); }, { capture: true, passive: true }));
  function freshTap() { return touchedAt >= screenAt; }
  function screenOf() {
    if (view !== "room" || !room) return view;
    return [stepKey(room), !!room.waiting, holding(), raceClosed(), !!room.my_submission, room.my_vote || "", !!(room.race && room.race.mine)].join("|");
  }
  function render(animate) {
    const screen = $("gw-screen");
    const focusedId = document.activeElement && document.activeElement.id;
    const id = screenOf();
    // Never rebuild the answer box while someone is typing in it: a rebuilt box loses the
    // keyboard's half-typed word and autocorrect. The same screen has nothing new to show.
    if (focusedId === "gw-answer" && id === screenId && $("gw-answer")) return;
    if (id !== screenId) { screenId = id; screenAt = Date.now(); }
    const caret = focusedId === "gw-answer" ? $("gw-answer").selectionStart : null;
    let html;
    if (view === "join" || !room) html = viewJoin();
    else if (room.phase === "lobby") html = viewLobby(room);
    else if (room.waiting) html = viewGetReady(room);
    else if (["writing", "voting", "reveal", "racing"].includes(room.phase) && holding()) html = viewHold(room);
    else if (room.phase === "racing") html = viewRacing(room);
    else if (room.phase === "writing") html = viewWriting(room);
    else if (room.phase === "voting") html = viewVoting(room);
    else if (room.phase === "reveal") html = viewReveal(room);
    else html = viewFinished(room);
    if (view === "room" && room) html += roomFooter(room);
    if (!animate) html = html.replace(/ gw-enter/g, "");
    screen.innerHTML = html;
    bind();
    if (focusedId && ["gw-answer", "gw-name", "gw-code"].includes(focusedId) && $(focusedId)) {
      const el = $(focusedId);
      el.focus({ preventScroll: true });
      if (caret !== null && el.setSelectionRange) el.setSelectionRange(caret, caret);
    }
    if (animate) $("gw-app").scrollTop = 0;
  }
  function on(id, fn) { const el = $(id); if (el) el.addEventListener("click", (e) => { e.preventDefault(); fn(e); }); }
  function bind() {
    on("gw-join", () => join(($("gw-code") || {}).value, false));
    on("gw-host", () => join("", true));
    on("gw-leave", () => confirmThen("leave", leave));
    on("gw-end", () => confirmThen("end", endForEveryone));
    on("gw-start", () => hostAction("start", { use_ai_prompt: useAiPrompts }));
    on("gw-again", () => hostAction("start", { use_ai_prompt: useAiPrompts }));
    on("gw-next", () => hostAction("next", { use_ai_prompt: useAiPrompts }));
    on("gw-send", () => { if (freshTap()) submitAnswer(false); });
    on("gw-decoy", () => { if (freshTap()) submitAnswer(true); });
    on("gw-tv-open", openTvSheet);
    document.querySelectorAll("[data-lag]").forEach((b) => b.addEventListener("click", () => {
      if (!room) return;
      tap();
      const seconds = Math.max(0, Math.min(30, (room.stage_delay_s || 0) + Number(b.getAttribute("data-lag"))));
      api(`/api/party/rooms/${encodeURIComponent(room.code)}/stream_delay`, { player_id: myId, seconds })
        .then(() => { room.stage_delay_s = seconds; lastSig = ""; render(); }).catch(() => {});
    }));
    const codeEl = $("gw-code");
    if (codeEl) codeEl.addEventListener("input", () => { codeEl.value = cleanCode(codeEl.value); });
    const nameEl = $("gw-name");
    if (nameEl) nameEl.addEventListener("input", () => { myName = cleanName(nameEl.value); });
    document.querySelectorAll("[data-av]").forEach((b) => b.addEventListener("click", () => {
      myAvatar = b.getAttribute("data-av"); store.set("avatar", myAvatar); tap();
      document.querySelectorAll("[data-av]").forEach((x) => x.classList.toggle("on", x === b));
    }));
    document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => join(b.getAttribute("data-open"), false)));
    document.querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => {
      if (!freshTap()) return;
      document.querySelectorAll("[data-pick]").forEach((x) => { x.disabled = true; x.classList.toggle("dim", x !== b); });
      raceSend(Number(b.getAttribute("data-pick")));
    }));
    document.querySelectorAll("[data-left]").forEach((b) => b.addEventListener("click", () => {
      if (!freshTap()) return;
      const i = Number(b.getAttribute("data-left"));
      if (raceUi.map[i] !== undefined) delete raceUi.map[i]; else raceUi.sel = raceUi.sel === i ? -1 : i;
      tap(); lastSig = ""; render();
    }));
    document.querySelectorAll("[data-right]").forEach((b) => b.addEventListener("click", () => {
      if (!freshTap()) return;
      const j = Number(b.getAttribute("data-right"));
      Object.keys(raceUi.map).forEach((l) => { if (raceUi.map[l] === j) delete raceUi.map[l]; });
      if (raceUi.sel >= 0) { raceUi.map[raceUi.sel] = j; raceUi.sel = -1; }
      else { const free = (room.race.item.left || []).findIndex((_, i) => raceUi.map[i] === undefined); if (free >= 0) raceUi.map[free] = j; }
      tap(); lastSig = ""; render();
    }));
    document.querySelectorAll("[data-ord]").forEach((b) => b.addEventListener("click", () => {
      if (!freshTap()) return;
      raceUi.order.push(Number(b.getAttribute("data-ord"))); tap(); lastSig = ""; render();
    }));
    on("gw-race-reset", () => { raceUi.map = {}; raceUi.sel = -1; raceUi.order = []; lastSig = ""; render(); });
    on("gw-race-lock", () => {
      if (!freshTap()) return;
      const item = room && room.race && room.race.item;
      if (!item) return;
      if (item.type === "pairs") raceSend((item.left || []).map((_, i) => raceUi.map[i]));
      else raceSend(raceUi.order.slice());
    });
    document.querySelectorAll("[data-vote]").forEach((b) => b.addEventListener("click", () => {
      if (!freshTap()) return;
      document.querySelectorAll("[data-vote]").forEach((x) => { x.disabled = true; });
      b.classList.add("picked");
      vote(b.getAttribute("data-vote"));
    }));
    const ans = $("gw-answer");
    if (ans) {
      ans.addEventListener("input", () => {
        draft = ans.value.slice(0, 120);
        const c = $("gw-count"); if (c) c.textContent = draft.length + "/120";
      });
      // keep the box above the on-screen keyboard
      ans.addEventListener("focus", () => setTimeout(() => ans.scrollIntoView({ block: "center", behavior: "smooth" }), 250));
      // Return closes the keyboard; only the Send button sends. Return was sending half-written
      // answers (it is where a thumb lands to accept autocorrect or start a new line).
      ans.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ans.blur(); } });
    }
    const voiceEl = $("gw-voice");
    if (voiceEl) voiceEl.addEventListener("change", () => {
      api(`/api/party/rooms/${encodeURIComponent(code)}/voice`, { voice: voiceEl.value, player_id: myId }).catch(() => {});
    });
    const mu = $("gw-music");
    if (mu) mu.addEventListener("change", () => {
      api(`/api/party/rooms/${encodeURIComponent(code)}/music`, { on: mu.checked, player_id: myId })
        .then((d) => { if (d && d.room) setRoom(d.room); }).catch(() => {});
    });
    const ai = $("gw-ai");
    if (ai) ai.addEventListener("change", () => { useAiPrompts = ai.checked; });
  }

  // the countdown ring ticks between polls without re-rendering the screen
  let scoresWasShown = false, resultWasCalled = false;
  setInterval(() => {
    const rc = resultCalled(room);
    if (rc !== resultWasCalled) { resultWasCalled = rc; if (rc && view === "room") { lastSig = ""; render(true); } }
    const sc = scoresShown(room);
    if (sc !== scoresWasShown) { scoresWasShown = sc; if (sc && view === "room") { lastSig = ""; render(true); } }
  }, 250);
  setInterval(() => {
    const ni = $("gw-next-in");
    if (ni && deadline) ni.textContent = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  }, 250);
  setInterval(() => {
    const n = $("gw-left"), arc = $("gw-arc"), clock = $("gw-clock");
    if (!n || !arc || !clock || !deadline) return;
    const left = clockLeft();
    const total = Number(clock.getAttribute("data-total")) || 55;
    n.textContent = left;
    arc.setAttribute("stroke-dashoffset", (106.8 * (1 - Math.min(1, left / total))).toFixed(1));
    // Time's up with words in the box: send them rather than lose them to a house answer.
    if (room && room.phase === "writing" && !room.my_submission && (draft || "").trim() && left <= 1) {
      const k = room.match_id + ":" + room.round;
      if (autoSentFor !== k) { autoSentFor = k; submitAnswer(false); }
    }
    clock.classList.toggle("low", left <= 10);
  }, 250);

  /* ================= TV stage picker (host) =================
     Screens are discovered by Jarvis from Home Assistant and Google Cast;
     nothing here names a device. Inside Jarvis the request goes through the
     app (it knows who is asking); otherwise through the arcade. */
  function postToParent(message) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ source: "arcade-game", ...message }, "*"); } catch (_) {}
  }
  function mergeScreens(list) {
    const byId = new Map(screens.map((t) => [t.id, t]));
    (list || []).forEach((t) => { if (t && t.id) byId.set(t.id, t); });
    screens = Array.from(byId.values()).filter((t) => t.display !== "none");
  }
  function loadScreens(refresh) {
    screensLoading = true; screensError = ""; renderSheet();
    fetch("/api/party/tvs" + (refresh ? "?refresh=1" : ""))
      .then((r) => r.json())
      .then((d) => {
        if (d && Array.isArray(d.tvs)) mergeScreens(d.tvs);
        if (d && d.success === false && !screens.length && !jarvisRelay) screensError = d.error || "";
      })
      .catch(() => {})
      .then(() => { screensLoading = false; renderSheet(); });
    postToParent({ type: "list-tvs", payload: { refresh: !!refresh } });
  }
  function openTvSheet() {
    $("gw-sheet").classList.add("on");
    if (!screens.length) loadScreens(false);
    renderSheet();
  }
  function closeSheet() { $("gw-sheet").classList.remove("on"); }
  $("gw-sheet").addEventListener("click", (e) => { if (e.target.id === "gw-sheet") closeSheet(); });
  function renderSheet() {
    if (!$("gw-sheet").classList.contains("on")) return;
    const body = $("gw-sheet-body");
    let list;
    if (screens.length) {
      list = screens.map((t) => {
        const live = activeScreen && activeScreen.id === t.id;
        const sub = (t.display === "video" ? "Live video (this TV has no web browser)" : "Live game")
          + (t.state === "off" ? " · off, will wake it" : t.state === "unavailable" ? " · may be offline" : "");
        return `<button type="button" class="gw-tv ${live ? "live" : ""}" data-screen="${esc(t.id)}" ${castingId ? "disabled" : ""}>
          <span class="ic">${castingId === t.id ? "⏳" : live ? "📡" : t.display === "video" ? "🎞️" : "📺"}</span><span class="tx">${esc(t.name)}<small>${esc(sub)}</small></span></button>`;
      }).join("");
    } else if (screensLoading) {
      list = '<div class="gw-status">🔎 Looking for TVs in your home…</div>';
    } else {
      list = `<div class="gw-status err">No TVs found.${screensError ? `<div class="gw-note" style="margin-top:6px">${esc(screensError)}</div>` : ""}</div>`;
    }
    const stageUrl = `${location.origin}/tv/${encodeURIComponent(code)}`;
    body.innerHTML = `<h2>📺 Show on a TV</h2>
      <div class="gw-note">The TV shows the questions and plays the sound. Everyone answers on their phone.</div>
      ${castStatus ? `<div class="gw-status ${castStatus.kind === "ok" ? "ok" : castStatus.kind === "error" ? "err" : ""}">${esc(castStatus.text)}</div>` : ""}
      ${list}
      ${activeScreen ? `<div style="margin-top:12px"><button type="button" class="gw-btn small" id="gw-tv-stop">Take it off ${esc(activeScreen.name)}</button></div>` : ""}
      <div class="gw-note">Another screen? Open <b>${esc(stageUrl)}</b> in its web browser.</div>
      <div class="gw-row" style="margin-top:12px">
        <button type="button" class="gw-btn small" id="gw-tv-rescan" ${screensLoading ? "disabled" : ""}>${screensLoading ? "Searching…" : "↻ Search"}</button>
        <button type="button" class="gw-btn small violet" id="gw-tv-close">Done</button></div>`;
    body.querySelectorAll("[data-screen]").forEach((b) => b.addEventListener("click", () => {
      const t = screens.find((s) => s.id === b.getAttribute("data-screen"));
      if (t) sendCast(t, false);
    }));
    const stop = $("gw-tv-stop"); if (stop) stop.addEventListener("click", () => sendCast(activeScreen, true));
    $("gw-tv-rescan").addEventListener("click", () => loadScreens(true));
    $("gw-tv-close").addEventListener("click", closeSheet);
  }
  function sendCast(t, stop) {
    if (!t || castingId || !code) return;
    castingId = t.id; pendingStop = !!stop;
    castStatus = { kind: "pending", text: stop ? "Taking the game off " + t.name + "…" : "Opening the game on " + t.name + "… (a sleeping TV can take a few seconds)" };
    renderSheet();
    const payload = { screen_id: t.id, room_code: code, stop: !!stop };
    if (jarvisRelay) {
      postToParent({ type: "cast", payload });
      clearTimeout(castTimer);
      castTimer = setTimeout(() => castResult({ success: false, error: "Jarvis did not answer. Try again." }), 100000);
      return;
    }
    api("/api/party/cast", payload).then(castResult).catch((e) => castResult({ success: false, error: e.message }));
  }
  function castResult(res) {
    clearTimeout(castTimer);
    const t = screens.find((s) => s.id === castingId);
    castingId = "";
    if (res && res.success) {
      if (pendingStop) { activeScreen = null; castStatus = { kind: "ok", text: "The TV is free again." }; }
      else {
        activeScreen = (res.screen && res.screen.id ? res.screen : t) || activeScreen;
        const name = (activeScreen && activeScreen.name) || "the TV";
        castStatus = { kind: "ok", text: res.display === "video"
          ? `✅ ${name} is showing a live video of the game (a few seconds behind).`
          : res.verified ? `✅ ${name} is showing the game!` : `📺 Sent to ${name}. If it doesn't appear, wake the TV and try again.` };
        tap();
      }
    } else {
      const tries = (res && res.attempts) || [];
      castStatus = { kind: "error", text: "⚠️ " + ((res && res.error) || (tries.length && tries[tries.length - 1].detail) || "The TV did not respond.") };
    }
    renderSheet(); lastSig = ""; if (room) render();
  }
  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.source !== "arcade-host") return;
    if (msg.type === "tvs" && Array.isArray(msg.tvs)) {
      if (msg.available !== false) jarvisRelay = true;
      mergeScreens(msg.tvs); renderSheet();
    } else if (msg.type === "cast-status" && msg.result) {
      castResult(msg.result);
    }
  });

  /* ================= boot ================= */
  function loadOpenRooms() {
    fetch("/api/party/rooms").then((r) => r.json()).then((d) => { openRooms = (d && d.rooms) || []; if (view === "join") render(); }).catch(() => {});
  }
  fetch("/api/party/voices").then((r) => r.json()).then((d) => {
    voices = (d && d.voices) || [];
    if (room && room.you_are_host) { lastSig = ""; render(); }
  }).catch(() => {});
  render(true);
  const remembered = store.get("room");
  if (code && myName) join(code, false);
  else if (!code && remembered && myName) {
    // Back after a reload or a locked screen: rejoin if the room still has us.
    fetch(`/api/party/rooms/${encodeURIComponent(remembered)}?player_id=${encodeURIComponent(myId)}`).then((r) => r.json()).then((d) => {
      if (d && d.success && d.room && d.room.you) join(remembered, false);  // "you" is set only if we're still in it
      else loadOpenRooms();
    }).catch(loadOpenRooms);
  } else loadOpenRooms();
})();
</script>
</body>
</html>
