        roundRect(g, x - (startL ? 0.05 : 0), y, 1.001 + (startL ? 0.05 : 0) + (endR ? 0.05 : 0), 0.3, startL || endR ? 0.08 : 0);
        g.fill();
        g.fillStyle = "rgba(0,0,0,0.18)";
        g.fillRect(x, y + 0.24, 1.001, 0.06);
        if (startL || endR) {
          const bx = startL ? x + 0.12 : x + 0.75;
          g.fillStyle = theme.line;
          g.beginPath();
          g.moveTo(bx, y + 0.3);
          g.lineTo(bx + 0.13, y + 0.3);
          g.lineTo(bx + 0.13, y + 0.75);
          g.closePath();
          g.fill();
        }
      }
    }
    return c;
  }

  // Little touches on top of the blocks, chosen per tile so they never move.
  function decorate(g, theme, x, y) {
    const h1 = hash(x, y);
    const h2 = hash(x + 17, y * 3);
    const deco = theme.deco;
    if (deco === "grass") {
      g.fillStyle = theme.top;
      g.beginPath();
      for (let k = 0; k < 5; k++) {
        const gx = x + 0.08 + k * 0.2 + h1 * 0.05;
        const hgt = 0.12 + ((k * 7 + Math.floor(h2 * 10)) % 4) * 0.05;
        g.moveTo(gx - 0.05, y + 0.05);
        g.quadraticCurveTo(gx, y - hgt * 0.5, gx + 0.03 + (h1 - 0.5) * 0.1, y - hgt);
        g.quadraticCurveTo(gx + 0.02, y - hgt * 0.4, gx + 0.06, y + 0.05);
      }
      g.fill();
      if (h1 > 0.72) {
        const fx = x + 0.2 + h2 * 0.6;
        g.strokeStyle = theme.top;
        g.lineWidth = 0.03;
        g.beginPath(); g.moveTo(fx, y); g.lineTo(fx, y - 0.28); g.stroke();
        g.fillStyle = ["#ff8fb1", "#ffd23f", "#ffffff", "#9fb8ff"][Math.floor(h2 * 4)];
        for (let k = 0; k < 5; k++) {
          g.beginPath();
          g.arc(fx + Math.cos((k / 5) * TAU) * 0.07, y - 0.3 + Math.sin((k / 5) * TAU) * 0.07, 0.05, 0, TAU);
          g.fill();
        }
        g.fillStyle = "#ffe066";
        g.beginPath(); g.arc(fx, y - 0.3, 0.035, 0, TAU); g.fill();
      } else if (h1 < 0.12) {
        g.fillStyle = "#b9b0a6";
        g.beginPath(); g.ellipse(x + 0.3 + h2 * 0.4, y + 0.02, 0.12, 0.07, 0, Math.PI, TAU); g.fill();
      }
    } else if (deco === "roof") {
      g.fillStyle = "rgba(0,0,0,0.12)";
      for (let k = 0; k < 3; k++) {
        g.beginPath();
        g.arc(x + 0.17 + k * 0.33, y + 0.26, 0.16, 0, Math.PI);
        g.fill();
      }
    } else if (deco === "rug") {
      if (h1 > 0.55) {
        g.strokeStyle = "rgba(255,255,255,0.55)";
        g.lineWidth = 0.025;
        g.beginPath();
        for (let k = 0; k < 6; k++) { g.moveTo(x + 0.08 + k * 0.17, y + 0.3); g.lineTo(x + 0.08 + k * 0.17, y + 0.4); }
        g.stroke();
      }
      if (h2 > 0.9) {
        // A dropped book.
        g.fillStyle = ["#6c8cff", "#ff6b8a", "#7dd87d"][Math.floor(h1 * 3)];
        g.fillRect(x + 0.25, y - 0.12, 0.45, 0.12);
        g.fillStyle = "#fff";
        g.fillRect(x + 0.27, y - 0.1, 0.41, 0.03);
      }
    } else if (deco === "stripes") {
      if (h1 > 0.82) {
        g.fillStyle = "rgba(255,207,63,0.85)";
        for (let k = 0; k < 4; k++) {
          g.beginPath();
          g.moveTo(x + k * 0.25, y + 0.32);
          g.lineTo(x + k * 0.25 + 0.12, y + 0.32);
          g.lineTo(x + k * 0.25 + 0.22, y + 0.04);
          g.lineTo(x + k * 0.25 + 0.1, y + 0.04);
          g.fill();
        }
      } else if (h2 > 0.88) {
        g.fillStyle = "rgba(20,15,40,0.25)";
        g.beginPath(); g.ellipse(x + 0.5, y + 0.02, 0.32, 0.06, 0, 0, TAU); g.fill();
      }
    } else if (deco === "shine") {
      if (h1 > 0.7) {
        g.fillStyle = "rgba(255,255,255,0.7)";
        g.beginPath(); g.ellipse(x + 0.3 + h2 * 0.4, y + 0.12, 0.12, 0.03, 0, 0, TAU); g.fill();
      }
    }
  }

  function drawChunks(theme) {
    const L = world.L;
    const o = camOrigin();
    const vx0 = Math.floor(-o.x / Z) - 1;
    const vx1 = Math.ceil((W - o.x) / Z) + 1;
    const vy0 = Math.floor(-o.y / Z) - 1;
    const vy1 = Math.ceil((H - o.y) / Z) + 1;
    const cx0 = Math.floor(vx0 / CH);
    const cx1 = Math.floor(vx1 / CH);
    const cy0 = Math.floor(Math.max(L.top - 1, vy0) / CH);
    const cy1 = Math.floor(vy1 / CH);
    let built = 0;
    const scale = Z / chunkScale();
    // Bottom row first, left to right: each chunk's depth faces spill up
    // and right, under the chunks drawn after it.
    for (let cy = cy1; cy >= cy0; cy--) {
      for (let cx = cx0; cx <= cx1; cx++) {
        if (cx < -1 || cx * CH > L.w + 2) continue;
        const key = `${cx},${cy}`;
        let c = chunks.get(key);
        if (!c && built < 3) {
          c = buildChunk(theme, cx, cy);
          chunks.set(key, c);
          if (c !== EMPTY) built += 1;
          if (chunks.size > CHUNK_MAX) chunks.delete(chunks.keys().next().value);
        } else if (c) {
          // Keep recently used chunks at the end of the map.
          chunks.delete(key);
          chunks.set(key, c);
        }
        if (c === EMPTY) continue;
        if (c) {
          const sx = o.x + (cx * CH - 1) * Z;
          const sy = o.y + (cy * CH - 1) * Z;
          ctx.drawImage(c, sx, sy, c.width * scale, c.height * scale);
        } else {
          // Not painted yet (a few a frame): plain blocks for now.
          ctx.fillStyle = theme.body;
          for (let y = cy * CH; y < cy * CH + CH; y++) for (let x = cx * CH; x < cx * CH + CH; x++) {
            if (L.tile(x, y) === 1) ctx.fillRect(o.x + x * Z, o.y + y * Z, Z + 0.5, Z + 0.5);
          }
        }
      }
    }
  }

  /* ---------- things in the world (tile units: ctx is translated and scaled) ---------- */
  function drawWater(wtr, theme) {
    const t = world.t;
    const top = wtr.y + 0.3;
    const g = ctx.createLinearGradient(0, top, 0, wtr.y + 1);
    g.addColorStop(0, theme.dark ? "#3a7bd5" : "#6fd0ff");
    g.addColorStop(1, theme.dark ? "#1d3f86" : "#2b7ad1");
    const wave = (x) => top + Math.sin(t * 3 + x * 2.6) * 0.05 + Math.sin(t * 1.7 - x * 4.1) * 0.025;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(wtr.x0, wtr.y + 1);
    for (let x = wtr.x0; x <= wtr.x1 + 0.001; x += 0.2) ctx.lineTo(x, wave(x));
    ctx.lineTo(wtr.x1, wtr.y + 1);
    ctx.closePath();
    ctx.fill();
    // Caustic ripples.
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 0.03;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      for (let x = wtr.x0; x <= wtr.x1; x += 0.2) {
        const y = top + 0.15 + k * 0.17 + Math.sin(t * 2 + x * 5 + k) * 0.04;
        if (x === wtr.x0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.lineWidth = 0.05;
    ctx.beginPath();
    for (let x = wtr.x0; x <= wtr.x1 + 0.001; x += 0.2) {
      if (x === wtr.x0) ctx.moveTo(x, wave(x));
      else ctx.lineTo(x, wave(x));
    }
    ctx.stroke();
    const mx = (wtr.x0 + wtr.x1) / 2;
    // A little warning sign: water and Telly do not mix.
    ctx.fillStyle = "#6b5a40";
    ctx.fillRect(mx - 0.035, wtr.y - 0.66, 0.07, 0.96);
    ctx.fillStyle = "#3b2a10";
    ctx.beginPath();
    ctx.moveTo(mx, wtr.y - 1.26);
    ctx.lineTo(mx + 0.37, wtr.y - 0.62);
    ctx.lineTo(mx - 0.37, wtr.y - 0.62);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffd23f";
    ctx.beginPath();
    ctx.moveTo(mx, wtr.y - 1.18);
    ctx.lineTo(mx + 0.3, wtr.y - 0.67);
    ctx.lineTo(mx - 0.3, wtr.y - 0.67);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#3b2a10";
    ctx.fillRect(mx - 0.03, wtr.y - 1.03, 0.06, 0.2);
    ctx.fillRect(mx - 0.03, wtr.y - 0.78, 0.06, 0.06);
    if (Math.random() < 0.05) emit("drop", wtr.x0 + Math.random() * (wtr.x1 - wtr.x0), top, 1, { speed: 0.6, vy: -1.5 });
  }

  function machineAnchor(m) {
    if (m.x0 !== undefined && m.yDown !== undefined) return { x: (m.x0 + m.x1) / 2, y: m.yDown + 0.3 };
    if (m.x0 !== undefined) return { x: m.x0, y: m.y + 0.2 };
    if (m.y0 !== undefined) return { x: m.x + 0.5, y: m.y1 - 0.2 };
    return { x: m.x, y: m.y };
  }

  // Cables on the back wall from each socket or plate to what it powers.
  function drawWires() {
    const L = world.L;
    const all = [...L.doors, ...L.lifts, ...L.fans, ...L.bridges];
    for (const m of all) {
      if (!m.by) continue;
      const from = m.by.kind === "plate" ? { x: (m.by.x0 + m.by.x1) / 2, y: m.by.y } : { x: m.by.x, y: m.by.y - 0.5 };
      const to = machineAnchor(m);
      const on = powered(m.by);
      const surge = m.by.surge || 0;
      const midX = (from.x + to.x) / 2;
      const sag = Math.min(2.5, Math.abs(to.x - from.x) * 0.15) + 0.3;
      const cy = Math.max(from.y, to.y) + sag - 1.2;
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(30,25,50,0.65)";
      ctx.lineWidth = 0.14;
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.quadraticCurveTo(midX, cy, to.x, to.y);
      ctx.stroke();
      ctx.strokeStyle = on ? "rgba(125,255,176,0.35)" : "rgba(255,255,255,0.12)";
      ctx.lineWidth = 0.045;
      ctx.stroke();
      if (on) {
        ctx.strokeStyle = surge > 0 ? "#7fe0ff" : "#ffe066";
        ctx.lineWidth = surge > 0 ? 0.11 : 0.08;
        ctx.setLineDash([0.22, 0.44]);
        ctx.lineDashOffset = -world.t * (surge > 0 ? 7 : 3.2);
        ctx.stroke();
        ctx.setLineDash([]);
        // Two sparks of current running along the powered cable.
        for (const off of [0, 0.5]) {
          const k = (world.t * 0.85 + off) % 1;
          const x = (1 - k) * (1 - k) * from.x + 2 * (1 - k) * k * midX + k * k * to.x;
          const y = (1 - k) * (1 - k) * from.y + 2 * (1 - k) * k * cy + k * k * to.y;
          worldGlow(x, y, 0.48, "#ffe066", 0.78);
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(x, y, 0.055, 0, TAU);
          ctx.fill();
          if (off === 0) light(x, y, 1.5, 0.6);
        }
      }
      if (surge > 0) {
        // High-voltage surge wave racing from socket to machine right on plug-in.
        const sk = clamp(1 - surge, 0, 1);
        const sx = (1 - sk) * (1 - sk) * from.x + 2 * (1 - sk) * sk * midX + sk * sk * to.x;
        const sy = (1 - sk) * (1 - sk) * from.y + 2 * (1 - sk) * sk * cy + sk * sk * to.y;
        worldGlow(sx, sy, 1.1, "#7fe0ff", 0.95);
        light(sx, sy, 2.4, 0.9);
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(sx, sy, 0.11, 0, TAU);
        ctx.fill();
      }
    }
  }

  // A glow in world units (ctx is in tile units).
  function worldGlow(x, y, r, color, a) {
    glow(x, y, r, color, a);
  }

  function drawSocket(s) {
    const on = powered(s);
    const plugging = !!(world.plug && !world.plug.exit && world.plug.s === s && world.plug.seated);
    const jx = (s.jolt || 0) * Math.sin(world.t * 55) * 0.06;
    const x = s.x + jx;
    const y = s.y;
    const near = !on && nearSocket() === s && !world.plug;
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath();
    ctx.ellipse(s.x, y, 0.58, 0.11, 0, 0, TAU);
    ctx.fill();
    // Base pedestal & 3D side housing.
    ctx.fillStyle = "#2b2e44";
    roundRect(ctx, x - 0.48, y - 0.14, 0.92, 0.14, 0.06);
    ctx.fill();
    ctx.fillStyle = "#353954";
    roundRect(ctx, x - 0.32, y - 1.26, 0.84, 1.24, 0.14);
    ctx.fill();
    const bg = ctx.createLinearGradient(x - 0.42, 0, x + 0.42, 0);
    bg.addColorStop(0, on || plugging ? "#8292bf" : "#727aa3");
    bg.addColorStop(1, "#4b5175");
    ctx.fillStyle = bg;
    roundRect(ctx, x - 0.42, y - 1.16, 0.78, 1.14, 0.14);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    roundRect(ctx, x - 0.36, y - 1.11, 0.66, 0.08, 0.04);
    ctx.fill();
    // Side/front receptacle rim & bright faceplate.
    ctx.fillStyle = on || plugging ? "#7fe0ff" : near ? "#ffe066" : "#2b2e44";
    roundRect(ctx, x - 0.33, y - 1.03, 0.56, 0.61, 0.12);
    ctx.fill();
    ctx.fillStyle = on || plugging ? "#f4fffb" : "#f4f2ff";
    roundRect(ctx, x - 0.3, y - 1.0, 0.5, 0.55, 0.1);
    ctx.fill();
    // Prong slots and ground hole (glowing when energized).
    ctx.fillStyle = on || plugging ? "#1d8a56" : "#3d3756";
    ctx.fillRect(x - 0.17, y - 0.86, 0.065, 0.18);
    ctx.fillRect(x + 0.02, y - 0.86, 0.065, 0.18);
    ctx.beginPath();
    ctx.arc(x - 0.045, y - 0.58, 0.042, 0, TAU);
    ctx.fill();
    if (on || plugging) {
      worldGlow(x - 0.05, y - 0.77, 0.65, "#7fe0ff", 0.55);
    }
    // Status lamp & charge bar.
    ctx.fillStyle = on || plugging ? "#5dff9a" : "#ff6b6b";
    ctx.beginPath();
    ctx.arc(x - 0.05, y - 0.27, 0.095, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(x - 0.075, y - 0.295, 0.03, 0, TAU);
    ctx.fill();
    worldGlow(x - 0.05, y - 0.27, on ? 0.78 : 0.35, on ? "#5dff9a" : "#ff6b6b", on ? 0.68 : 0.3);
    light(x - 0.05, y - 0.5, on ? 2.5 : 1.2, on ? 0.95 : 0.4);
    if (s.left > 0 && s.time > 0) {
      ctx.strokeStyle = "rgba(0,0,0,0.28)";
      ctx.lineWidth = 0.1;
      ctx.beginPath();
      ctx.arc(x - 0.05, y - 1.6, 0.26, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = s.left < 1.6 && Math.floor(world.t * 6) % 2 ? "#ff6b6b" : "#ffe066";
      ctx.lineWidth = 0.09;
      ctx.beginPath();
      ctx.arc(x - 0.05, y - 1.6, 0.26, -Math.PI / 2, -Math.PI / 2 + TAU * (s.left / s.time));
      ctx.stroke();
    }
    if (s.time > 0 && !on) {
      // Text in screen pixels: tiny fonts scaled up render poorly.
      ctx.save();
      ctx.scale(1 / Z, 1 / Z);
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.strokeStyle = "rgba(30,20,60,0.5)";
      ctx.lineWidth = 3;
      ctx.font = `bold ${Math.round(Z * 0.34)}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.strokeText(`${Math.round(s.time)}s`, (x - 0.05) * Z, (y - 1.4) * Z);
      ctx.fillText(`${Math.round(s.time)}s`, (x - 0.05) * Z, (y - 1.4) * Z);
      ctx.restore();
    }
    if (near) {
      const bob = Math.sin(world.t * 7) * 0.07;
      worldGlow(x - 0.05, y - 0.75, 1.3, "#fff3a0", 0.38 + 0.15 * Math.sin(world.t * 6));
      // Floating Cordy-style plug prompt pill above the socket.
      const py = (s.time > 0 ? y - 1.95 : y - 1.58) + bob;
      ctx.fillStyle = "rgba(28,24,54,0.88)";
      roundRect(ctx, x - 0.31, py - 0.22, 0.52, 0.36, 0.12);
      ctx.fill();
      ctx.strokeStyle = "#ffe066";
      ctx.lineWidth = 0.035;
      ctx.stroke();
      ctx.fillStyle = "#ffe066";
      bolt(x - 0.05, py - 0.04, 0.24);
      ctx.fill();
    }
  }

  function drawExit(e) {
    const jx = (e.jolt || 0) * Math.sin(world.t * 55) * 0.07;
    const x = e.x + jx;
    const y = e.y;
    const active = world.finishing > 0 || !!(world.plug && world.plug.exit && world.plug.seated);
    const near = nearExit() && !world.plug && world.finishing <= 0;
    const pulse = 0.5 + 0.5 * Math.sin(world.t * (active ? 10 : 3));
    worldGlow(x - 0.1, y - 1.3, (active ? 3.2 : 2.4) + pulse * 0.35, active ? "#7fe0ff" : "#ffe58a", active ? 0.72 : 0.45);
    light(x, y - 1.3, active ? 6.2 : 5, 1);
    ctx.fillStyle = "rgba(0,0,0,0.24)";
    ctx.beginPath();
    ctx.ellipse(e.x, y, 0.9, 0.15, 0, 0, TAU);
    ctx.fill();
    // Base pedestal step.
    ctx.fillStyle = "#7a5306";
    roundRect(ctx, x - 0.68, y - 0.18, 1.48, 0.18, 0.08);
    ctx.fill();
    ctx.fillStyle = "#a8780a";
    roundRect(ctx, x - 0.5, y - 2.42, 1.24, 2.4, 0.22);
    ctx.fill();
    const g = ctx.createLinearGradient(x - 0.6, 0, x + 0.5, 0);
    g.addColorStop(0, "#fff0a0");
    g.addColorStop(0.5, "#ffd24a");
    g.addColorStop(1, "#e9a21c");
    ctx.fillStyle = g;
    roundRect(ctx, x - 0.62, y - 2.32, 1.06, 2.3, 0.2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.52)";
    roundRect(ctx, x - 0.55, y - 2.24, 0.12, 2.1, 0.06);
    ctx.fill();
    //Three crown bulbs along the top of the gold exit post.
    for (let i = -1; i <= 1; i++) {
      const bx = x - 0.09 + i * 0.28;
      const by = y - 2.38 + Math.abs(i) * 0.04;
      ctx.fillStyle = active ? "#7dffb0" : "#fff4b8";
      ctx.beginPath();
      ctx.arc(bx, by, 0.085, 0, TAU);
      ctx.fill();
      if (active) worldGlow(bx, by, 0.45, "#7dffb0", 0.7);
    }
    // Receptacle collar & cream outlet faceplate.
    ctx.fillStyle = active ? "#5dff9a" : near ? "#ffffff" : "#b88214";
    roundRect(ctx, x - 0.46, y - 1.79, 0.74, 0.93, 0.14);
    ctx.fill();
    ctx.fillStyle = active ? "#f2fff8" : "#fffaf0";
    roundRect(ctx, x - 0.42, y - 1.75, 0.66, 0.85, 0.12);
    ctx.fill();
    ctx.fillStyle = active ? "#1d8a56" : "#5b4a1a";
    ctx.fillRect(x - 0.25, y - 1.55, 0.075, 0.22);
    ctx.fillRect(x + 0.0, y - 1.55, 0.075, 0.22);
    ctx.beginPath();
    ctx.arc(x - 0.09, y - 1.17, 0.055, 0, TAU);
    ctx.fill();
    ctx.save();
    ctx.translate(x - 0.09, y - 2.02);
    ctx.rotate(world.t * (active ? 4.5 : 0.8));
    ctx.fillStyle = active ? "#7dffb0" : "#ffffff";
    FK.starPath(ctx, 0, 0, 0.18 + pulse * 0.04, 0.085, 5);
    ctx.fill();
    ctx.restore();
  }

  function drawDoor(d) {
    const h = (d.y1 - d.y0) * (1 - d.open);
    const x = d.x + 0.08;
    ctx.fillStyle = "rgba(20,15,40,0.35)";
    ctx.fillRect(d.x, d.y0, 1, d.y1 - d.y0);
    // Rails either side.
    ctx.fillStyle = "#3b3f55";
    ctx.fillRect(d.x - 0.05, d.y0, 0.12, d.y1 - d.y0);
    ctx.fillRect(d.x + 0.93, d.y0, 0.12, d.y1 - d.y0);
    if (h > 0.02) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, d.y0, 0.84, h);
      ctx.clip();
      const g = ctx.createLinearGradient(x, 0, x + 0.84, 0);
      g.addColorStop(0, "#737b99");
      g.addColorStop(1, "#4f5570");
      ctx.fillStyle = g;
      ctx.fillRect(x, d.y0, 0.84, h);
      ctx.fillStyle = "#ffcf3f";
      for (let yy = d.y0 + h - 1.1; yy > d.y0 - 1; yy -= 0.7) {
        ctx.beginPath();
        ctx.moveTo(x, yy);
        ctx.lineTo(x + 0.84, yy - 0.35);
        ctx.lineTo(x + 0.84, yy - 0.05);
        ctx.lineTo(x, yy + 0.3);
        ctx.fill();
      }
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(x + 0.05, d.y0, 0.08, h);
      ctx.fillStyle = "#2f3346";
      ctx.fillRect(x, d.y0 + h - 0.6, 0.84, 0.6);
      const on = powered(d.by);
      ctx.fillStyle = on ? "#5dff9a" : "#ff6b6b";
      ctx.beginPath();
      ctx.arc(x + 0.42, d.y0 + h - 0.3, 0.11, 0, TAU);
      ctx.fill();
      ctx.restore();
      worldGlow(x + 0.42, d.y0 + h - 0.3, 0.5, on ? "#5dff9a" : "#ff6b6b", 0.5);
      light(x + 0.42, d.y0 + h - 0.3, 1.2, 0.5);
    }
  }

  function drawLift(lf) {
    const w = lf.x1 - lf.x0;
    if (lf.mover) {
      const cx = (lf.bx0 + lf.bx1) * 0.5;
      const hw = w * 0.5;
      ctx.save();
      ctx.strokeStyle = "rgba(120, 220, 255, 0.35)";
      ctx.setLineDash([0.14, 0.14]);
      ctx.lineWidth = 0.05;
      ctx.beginPath();
      ctx.moveTo(cx - lf.ax - hw * 0.4, lf.yDown - lf.ay + 0.22);
      ctx.lineTo(cx + lf.ax + hw * 0.4, lf.yDown + lf.ay + 0.22);
      ctx.stroke();
      ctx.setLineDash([]);
      // Hover-thruster flames beneath the gondola
      for (const tx of [lf.x0 + 0.65, lf.x1 - 0.65]) {
        const fl = 0.22 + 0.08 * Math.sin(world.t * 36 + tx);
        const fg = ctx.createLinearGradient(tx, lf.y + 0.42, tx, lf.y + 0.42 + fl);
        fg.addColorStop(0, "rgba(120, 240, 255, 0.85)");
        fg.addColorStop(1, "rgba(72, 140, 255, 0)");
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.moveTo(tx - 0.16, lf.y + 0.42);
        ctx.lineTo(tx + 0.16, lf.y + 0.42);
        ctx.lineTo(tx, lf.y + 0.42 + fl);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = "#252b48";
      roundRect(ctx, lf.x0, lf.y, w, 0.44, 0.12);
      ctx.fill();
      ctx.fillStyle = "#48d8ff";
      roundRect(ctx, lf.x0 + 0.06, lf.y + 0.03, w - 0.12, 0.1, 0.04);
      ctx.fill();
      for (const lx of [lf.x0 + 0.22, lf.x1 - 0.22]) {
        ctx.fillStyle = "#ffe066";
        ctx.beginPath();
        ctx.arc(lx, lf.y + 0.26, 0.06, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
      return;
    }
    ctx.strokeStyle = "#596073";
    ctx.lineWidth = 0.1;
    const base = lf.yDown + 0.45;
    const span = base - (lf.y + 0.45);
    if (span > 0.05) {
      const n = Math.max(1, Math.ceil(span / 1.2));
      const segH = span / n;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const yTop = lf.y + 0.45 + i * segH;
        ctx.moveTo(lf.x0 + 0.3, yTop);
        ctx.lineTo(lf.x1 - 0.3, yTop + segH);
        ctx.moveTo(lf.x1 - 0.3, yTop);
        ctx.lineTo(lf.x0 + 0.3, yTop + segH);
      }
      ctx.stroke();
      ctx.fillStyle = "#3b3f55";
      for (let i = 0; i <= n; i++) {
        const yy = lf.y + 0.45 + i * segH;
        ctx.beginPath(); ctx.arc(lf.x0 + 0.3, yy, 0.07, 0, TAU); ctx.arc(lf.x1 - 0.3, yy, 0.07, 0, TAU); ctx.fill();
      }
    }
    ctx.fillStyle = "#3b3f55";
    ctx.fillRect(lf.x0 + 0.12, lf.y - 0.1, w, 0.45);
    ctx.fillStyle = "#ffcf3f";
    ctx.fillRect(lf.x0, lf.y, w, 0.45);
    ctx.fillStyle = "#2f3346";
    for (let x = lf.x0 + 0.1; x < lf.x1 - 0.1; x += 0.5) {
      ctx.beginPath();
      ctx.moveTo(x, lf.y + 0.45);
      ctx.lineTo(x + 0.25, lf.y + 0.1);
      ctx.lineTo(x + 0.45, lf.y + 0.1);
      ctx.lineTo(x + 0.2, lf.y + 0.45);
      ctx.fill();
    }
    ctx.fillStyle = "#e9ecf5";
    ctx.fillRect(lf.x0, lf.y, w, 0.1);
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillRect(lf.x0, lf.y, w, 0.03);
    if (powered(lf.by)) {
      ctx.fillStyle = "#5dff9a";
      for (const lx of [lf.x0 + 0.15, lf.x1 - 0.15]) {
        ctx.beginPath(); ctx.arc(lx, lf.y + 0.27, 0.06, 0, TAU); ctx.fill();
        worldGlow(lx, lf.y + 0.27, 0.4, "#5dff9a", 0.6);
      }
    }
  }

  function drawFan(f) {
    const x = f.x;
    const y = f.y;
    if (f.spin > 0.05) {
      const g = ctx.createLinearGradient(0, y, 0, y - f.h);
      g.addColorStop(0, `rgba(200,240,255,${0.3 * f.spin})`);
      g.addColorStop(1, "rgba(200,240,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x - 0.85, y);
      ctx.lineTo(x + 0.85, y);
      ctx.lineTo(x + 1.05, y - f.h);
      ctx.lineTo(x - 1.05, y - f.h);
      ctx.fill();
    }
    ctx.strokeStyle = "rgba(255,255,255,0.75)";
    ctx.lineWidth = 0.05;
    ctx.lineCap = "round";
    for (const s of world.wind) {
      if (Math.abs(s.x - x) > 1.2) continue;
      const wob = Math.sin(s.y * 2 + s.x * 5) * 0.08;
      ctx.beginPath();
      ctx.moveTo(s.x + wob, s.y);
      ctx.lineTo(s.x - wob, s.y + s.len);
      ctx.stroke();
    }
    ctx.fillStyle = "#2f3346";
    ctx.beginPath();
    ctx.ellipse(x, y + 0.02, 0.9, 0.22, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#3b3f55";
    ctx.beginPath();
    ctx.ellipse(x, y, 0.78, 0.17, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#a9b2d6";
    for (let k = 0; k < 5; k++) {
      const a = f.a + (k * TAU) / 5;
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(a) * 0.36, y + Math.sin(a) * 0.075, 0.3, 0.055, 0, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = "#e9ecf5";
    ctx.beginPath();
    ctx.ellipse(x, y, 0.1, 0.04, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = "#596073";
    ctx.lineWidth = 0.05;
    ctx.beginPath();
    for (let k = -3; k <= 3; k++) {
      ctx.moveTo(x + k * 0.22, y - 0.16 * Math.sqrt(Math.max(0, 1 - (k * 0.22 / 0.78) ** 2)));
      ctx.lineTo(x + k * 0.22, y + 0.16 * Math.sqrt(Math.max(0, 1 - (k * 0.22 / 0.78) ** 2)));
    }
    ctx.stroke();
    if (f.spin > 0.3) light(x, y - 1, 2, 0.5 * f.spin);
  }

  function drawBridge(br) {
    const rc = bridgeRect(br);
    ctx.fillStyle = "#4b5175";
    roundRect(ctx, br.x0 - 0.45, br.y - 0.2, 0.55, 0.8, 0.1);
    ctx.fill();
    ctx.fillStyle = powered(br.by) ? "#5dff9a" : "#ff6b6b";
    ctx.beginPath(); ctx.arc(br.x0 - 0.18, br.y + 0.2, 0.07, 0, TAU); ctx.fill();
    if (!rc) return;
    for (let x = rc.x; x < rc.x + rc.w - 0.01; x += 0.5) {
      const ww = Math.min(0.46, rc.x + rc.w - x);
      ctx.fillStyle = "#7a5a3a";
      ctx.fillRect(x + 0.1, br.y - 0.1, ww, 0.4);
      const g = ctx.createLinearGradient(0, br.y, 0, br.y + 0.4);
      g.addColorStop(0, "#e2b27c");
      g.addColorStop(1, "#b07c4c");
      ctx.fillStyle = g;
      ctx.fillRect(x, br.y, ww, 0.4);
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.fillRect(x, br.y, ww, 0.05);
      ctx.fillStyle = "#6b4a2a";
      ctx.beginPath(); ctx.arc(x + 0.08, br.y + 0.2, 0.03, 0, TAU); ctx.arc(x + ww - 0.08, br.y + 0.2, 0.03, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = "rgba(20,10,40,0.2)";
    ctx.fillRect(rc.x, br.y + 0.4, rc.w, 0.25);
  }

  function drawPlate(pl) {
    const dpt = pl.depth * 0.12;
    ctx.fillStyle = "#2f3346";
    roundRect(ctx, pl.x0 - 0.08, pl.y - 0.1, pl.x1 - pl.x0 + 0.16, 0.14, 0.05);
    ctx.fill();
    const g = ctx.createLinearGradient(0, pl.y - 0.22, 0, pl.y - 0.06);
    g.addColorStop(0, pl.pressed ? "#9dffc4" : "#ffb08a");
    g.addColorStop(1, pl.pressed ? "#3fd27a" : "#e9643a");
    ctx.fillStyle = g;
    roundRect(ctx, pl.x0 + 0.06, pl.y - 0.22 + dpt, pl.x1 - pl.x0 - 0.12, 0.16, 0.05);
    ctx.fill();
    if (pl.pressed) {
      worldGlow((pl.x0 + pl.x1) / 2, pl.y - 0.1, 1, "#5dff9a", 0.45);
      light((pl.x0 + pl.x1) / 2, pl.y - 0.3, 1.6, 0.6);
    }
  }

  function drawCrate(c) {
    const x = c.x - c.w / 2;
    const y = c.y - c.h;
    drawShadowAt(c.x, c.y, 0.55);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.tilt);
    ctx.translate(-c.x, -c.y);
    ctx.fillStyle = "#7a4a22";
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 0.14, y - 0.14);
    ctx.lineTo(x + c.w + 0.14, y - 0.14);
    ctx.lineTo(x + c.w + 0.14, y + c.h - 0.14);
    ctx.lineTo(x + c.w, y + c.h);
    ctx.closePath();
    ctx.fill();
    const g = ctx.createLinearGradient(x, y, x + c.w, y + c.h);
    g.addColorStop(0, "#e0a568");
    g.addColorStop(1, "#b77a40");
    ctx.fillStyle = g;
    ctx.fillRect(x, y, c.w, c.h);
    ctx.strokeStyle = "#7a4a22";
    ctx.lineWidth = 0.09;
    ctx.strokeRect(x + 0.05, y + 0.05, c.w - 0.1, c.h - 0.1);
    ctx.lineWidth = 0.08;
    ctx.beginPath();
    ctx.moveTo(x + 0.12, y + 0.12);
    ctx.lineTo(x + c.w - 0.12, y + c.h - 0.12);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 0.03;
    ctx.beginPath();
    for (let k = 1; k < 4; k++) { ctx.moveTo(x + 0.1, y + k * 0.24); ctx.lineTo(x + c.w - 0.1, y + k * 0.24); }
    ctx.stroke();
    ctx.fillStyle = "#5a3a1a";
    for (const [px, py] of [[0.12, 0.12], [c.w - 0.12, 0.12], [0.12, c.h - 0.12], [c.w - 0.12, c.h - 0.12]]) {
      ctx.beginPath(); ctx.arc(x + px, y + py, 0.035, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(x, y, c.w, 0.06);
    ctx.restore();
  }

  function drawBaddie(bd) {
    if (bd.dead && bd.deadT >= 0.55) return;
    if (!bd.dead) drawShadowAt(bd.x, bd.y, 0.46);
    const sy = 1 - bd.squash * 0.32;
    const sx = 1 + bd.squash * 0.28;
    const target = nearBaddie() === bd && !world.rope && !world.plug;
    const glowCol = bd.kind === "roller" ? "#7fe0ff" : bd.kind === "hopper" ? "#5dff9a" : "#ff6b8a";
    if (!bd.dead) {
      worldGlow(bd.x, bd.y - bd.h * 0.55, target ? 0.95 : 0.6, glowCol, target ? 0.55 : 0.32);
      light(bd.x, bd.y - bd.h * 0.5, 1.5, 0.55);
    }
    ctx.save();
    if (bd.dead) ctx.globalAlpha = clamp(1 - bd.deadT / 0.55, 0, 1);
    ctx.translate(bd.x, bd.y);
    if (bd.dead) {
      ctx.translate(0, -bd.h * 0.5);
      ctx.rotate(bd.spin);
      ctx.translate(0, bd.h * 0.5);
    } else if (bd.kind === "roller" || bd.kind === "hopper") {
      ctx.rotate(clamp(bd.vx * 0.04, -0.14, 0.14));
    }
    ctx.scale(sx * bd.dir, sy);
    if (bd.kind === "hopper") {
      // Boogaloo's Pogo-Zapper: spring-loaded plasma hopper with accordion coil & twin horns.
      ctx.fillStyle = "#1c1f30";
      roundRect(ctx, -0.22, -0.07, 0.44, 0.07, 0.03);
      ctx.fill();
      ctx.strokeStyle = "#98a4cc";
      ctx.lineWidth = 0.055;
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(0, -0.07);
      ctx.lineTo(-0.14, -0.15);
      ctx.lineTo(0.14, -0.23);
      ctx.lineTo(-0.14, -0.31);
      ctx.lineTo(0, -0.39);
      ctx.stroke();
      const hg = ctx.createRadialGradient(-0.08, -0.74, 0.05, 0, -0.66, 0.42);
      hg.addColorStop(0, "#7dffb0");
      hg.addColorStop(0.5, "#1f9d62");
      hg.addColorStop(1, "#144532");
      ctx.fillStyle = hg;
      roundRect(ctx, -0.34, -0.94, 0.68, 0.56, 0.24);
      ctx.fill();
      ctx.strokeStyle = "#0e291e";
      ctx.lineWidth = 0.035;
      ctx.stroke();
      for (const hx of [-0.18, 0.18]) {
        ctx.strokeStyle = "#23263a";
        ctx.lineWidth = 0.045;
        ctx.beginPath();
        ctx.moveTo(hx, -0.92);
        ctx.lineTo(hx * 1.4, -1.1);
        ctx.stroke();
        ctx.fillStyle = "#ffe066";
        ctx.beginPath();
        ctx.arc(hx * 1.4, -1.1, 0.06, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = "#121828";
      roundRect(ctx, -0.14, -0.8, 0.42, 0.24, 0.09);
      ctx.fill();
      if (bd.dead) {
        ctx.strokeStyle = "#5dff9a";
        ctx.lineWidth = 0.035;
        ctx.beginPath();
        ctx.moveTo(0.02, -0.73); ctx.lineTo(0.14, -0.63);
        ctx.moveTo(0.14, -0.73); ctx.lineTo(0.02, -0.63);
        ctx.stroke();
      } else {
        ctx.fillStyle = "#ffe066";
        ctx.beginPath();
        ctx.arc(0.02, -0.68, 0.05, 0, TAU);
        ctx.arc(0.18, -0.68, 0.05, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "#5dff9a";
        ctx.lineWidth = 0.032;
        ctx.beginPath();
        ctx.moveTo(-0.06, -0.76);
        ctx.lineTo(0.1, -0.71);
        ctx.lineTo(0.24, -0.76);
        ctx.stroke();
      }
    } else if (bd.kind === "roller") {
      // Boogaloo's Volt-Bot: a grumpy unicycle zapper with a glowing cyan wheel & top coil.
      const ph = bd.walk * 2.2;
      // Unicycle wheel.
      ctx.fillStyle = "#1c1f30";
      ctx.beginPath();
      ctx.arc(0, -0.2, 0.2, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "#7fe0ff";
      ctx.lineWidth = 0.04;
      ctx.beginPath();
      ctx.arc(0, -0.2, 0.11, 0, TAU);
      ctx.moveTo(Math.cos(ph) * 0.11, -0.2 + Math.sin(ph) * 0.11);
      ctx.lineTo(-Math.cos(ph) * 0.11, -0.2 - Math.sin(ph) * 0.11);
      ctx.stroke();
      // Wheel fork.
      ctx.strokeStyle = "#485078";
      ctx.lineWidth = 0.06;
      ctx.beginPath();
      ctx.moveTo(0, -0.2);
      ctx.lineTo(0, -0.4);
      ctx.stroke();
      // Side shock-studs.
      ctx.fillStyle = "#ffd24a";
      roundRect(ctx, -0.44, -0.68, 0.88, 0.12, 0.05);
      ctx.fill();
      // Cylindrical dark-indigo torso.
      const bg = ctx.createLinearGradient(-0.34, -0.92, 0.34, -0.34);
      bg.addColorStop(0, "#63599e");
      bg.addColorStop(0.5, "#3e376e");
      bg.addColorStop(1, "#252047");
      ctx.fillStyle = bg;
      roundRect(ctx, -0.34, -0.92, 0.68, 0.58, 0.22);
      ctx.fill();
      ctx.strokeStyle = "#191533";
      ctx.lineWidth = 0.035;
      ctx.stroke();
      // Top tesla coil dish & glowing orb.
      ctx.strokeStyle = "#252047";
      ctx.lineWidth = 0.05;
      ctx.beginPath();
      ctx.moveTo(0, -0.92);
      ctx.lineTo(0, -1.1);
      ctx.stroke();
      ctx.fillStyle = "#7fe0ff";
      ctx.beginPath();
      ctx.arc(0, -1.12, 0.075, 0, TAU);
      ctx.fill();
      // Cyclops visor.
      ctx.fillStyle = "#141126";
      roundRect(ctx, -0.18, -0.78, 0.44, 0.24, 0.1);
      ctx.fill();
      if (bd.dead) {
        ctx.strokeStyle = "#ff6b8a";
        ctx.lineWidth = 0.035;
        ctx.beginPath();
        ctx.moveTo(0.02, -0.71); ctx.lineTo(0.14, -0.61);
        ctx.moveTo(0.14, -0.71); ctx.lineTo(0.02, -0.61);
        ctx.stroke();
      } else {
        ctx.fillStyle = "#ff5c8a";
        ctx.beginPath();
        ctx.arc(0.09, -0.66, 0.075, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0.11, -0.68, 0.026, 0, TAU);
        ctx.fill();
        // Angry brow plate.
        ctx.strokeStyle = "#ffd24a";
        ctx.lineWidth = 0.035;
        ctx.beginPath();
        ctx.moveTo(-0.12, -0.77);
        ctx.lineTo(0.22, -0.71);
        ctx.stroke();
      }
    } else {
      // Static Bug: a grumpy wind-up crimson robot beetle with scuttling legs.
      const ph = bd.walk * 2.5;
      // Wind-up key on its back.
      const kw = 0.35 + 0.65 * Math.abs(Math.cos(ph * 0.7));
      ctx.strokeStyle = "#ffd24a";
      ctx.lineWidth = 0.045;
      ctx.beginPath();
      ctx.moveTo(-0.18, -0.62);
      ctx.lineTo(-0.26, -0.82);
      ctx.stroke();
      ctx.save();
      ctx.translate(-0.27, -0.86);
      ctx.scale(kw, 1);
      ctx.beginPath();
      ctx.arc(-0.05, 0, 0.06, 0, TAU);
      ctx.arc(0.05, 0, 0.06, 0, TAU);
      ctx.stroke();
      ctx.restore();
      // Scuttling mechanical legs.
      ctx.strokeStyle = "#23263a";
      ctx.lineWidth = 0.075;
      ctx.lineCap = "round";
      for (const [lx, off] of [[-0.22, 0], [-0.06, Math.PI], [0.1, 0.6], [0.24, Math.PI + 0.6]]) {
        const lift = bd.dead ? 0 : Math.max(0, Math.sin(ph + off)) * 0.08;
        const stepX = bd.dead ? 0 : Math.cos(ph + off) * 0.07;
        ctx.beginPath();
        ctx.moveTo(lx, -0.18);
        ctx.lineTo(lx + stepX, -0.02 - lift);
        ctx.stroke();
      }
      // Dark slate underbelly.
      ctx.fillStyle = "#23263a";
      roundRect(ctx, -0.38, -0.28, 0.76, 0.2, 0.09);
      ctx.fill();
      // Domed metallic crimson carapace.
      const cg = ctx.createRadialGradient(-0.08, -0.52, 0.04, 0, -0.36, 0.46);
      cg.addColorStop(0, "#ff8fa8");
      cg.addColorStop(0.45, "#f03e65");
      cg.addColorStop(1, "#9e193a");
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(0, -0.24, 0.4, Math.PI, TAU);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#6e0f27";
      ctx.lineWidth = 0.035;
      ctx.stroke();
      // Specular shell highlight.
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath();
      ctx.ellipse(-0.1, -0.5, 0.15, 0.055, -0.25, 0, TAU);
      ctx.fill();
      // Front static antenna.
      ctx.strokeStyle = "#23263a";
      ctx.lineWidth = 0.04;
      ctx.beginPath();
      ctx.moveTo(0.18, -0.56);
      ctx.lineTo(0.3, -0.78);
      ctx.stroke();
      ctx.fillStyle = "#ffe066";
      ctx.beginPath();
      ctx.arc(0.3, -0.78, 0.065, 0, TAU);
      ctx.fill();
      // Angry visor & eyes.
      ctx.fillStyle = "#1b1d2e";
      roundRect(ctx, 0.02, -0.46, 0.34, 0.2, 0.08);
      ctx.fill();
      if (bd.dead) {
        ctx.strokeStyle = "#ffe066";
        ctx.lineWidth = 0.03;
        ctx.beginPath();
        ctx.moveTo(0.14, -0.4); ctx.lineTo(0.24, -0.32);
        ctx.moveTo(0.24, -0.4); ctx.lineTo(0.14, -0.32);
        ctx.stroke();
      } else {
        ctx.fillStyle = "#ffe066";
        ctx.beginPath();
        ctx.arc(0.14, -0.35, 0.048, 0, TAU);
        ctx.arc(0.28, -0.35, 0.048, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "#ff4d6d";
        ctx.lineWidth = 0.032;
        ctx.beginPath();
        ctx.moveTo(0.08, -0.43);
        ctx.lineTo(0.21, -0.38);
        ctx.lineTo(0.33, -0.43);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawSparker(sp) {
    const x = sp.x + 0.5;
    const y = sp.y;
    ctx.fillStyle = "#2f3346";
    roundRect(ctx, x - 0.28, y - 0.5, 0.56, 0.5, 0.1);
    ctx.fill();
    ctx.fillStyle = "#596073";
    roundRect(ctx, x - 0.12, y - 0.85, 0.24, 0.4, 0.05);
    ctx.fill();
    for (let k = 0; k < 3; k++) {
      ctx.fillStyle = "#c78a3a";
      roundRect(ctx, x - 0.18, y - 0.82 + k * 0.12, 0.36, 0.06, 0.03);
      ctx.fill();
    }
    const g = ctx.createRadialGradient(x - 0.05, y - 1.0, 0, x, y - 0.95, 0.2);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(1, sp.active ? "#7fd6ff" : "#9aa3c7");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y - 0.95, 0.18, 0, TAU);
    ctx.fill();
    if (sp.warn) {
      worldGlow(x, y - 0.95, 0.7, "#7fd6ff", 0.3 + 0.3 * Math.sin(world.t * 30));
      light(x, y - 1, 1.2, 0.4);
    }
    if (!sp.active) return;
    worldGlow(x, y - 0.95 - sp.h / 3, 2, "#7fd6ff", 0.5);
    light(x, y - 1.5, 3.5, 1);
    ctx.strokeStyle = "#e9fbff";
    ctx.lineCap = "round";
    for (let k = 0; k < 3; k++) {
      ctx.lineWidth = k ? 0.04 : 0.08;
      ctx.beginPath();
      ctx.moveTo(x, y - 1.05);
      const r = rngFn(Math.floor(world.t * 24) + k * 99);
      for (let yy = y - 1.05; yy > y - sp.h - 0.3; yy -= 0.25) ctx.lineTo(x + (r() - 0.5) * (0.4 + k * 0.2), yy);
      ctx.stroke();
    }
  }

  function drawSpring(s) {
    const sq = 1 - Math.max(0, s.squash) * 0.3;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.scale(1, sq);
    ctx.fillStyle = "#23263a";
    roundRect(ctx, -0.32, -0.78, 0.84, 0.78, 0.14);
    ctx.fill();
    const g = ctx.createLinearGradient(-0.42, 0, 0.42, 0);
    g.addColorStop(0, "#4b5175");
    g.addColorStop(1, "#33374e");
    ctx.fillStyle = g;
    roundRect(ctx, -0.42, -0.72, 0.84, 0.72, 0.14);
    ctx.fill();
    const cone = ctx.createRadialGradient(-0.06, -0.42, 0.02, 0, -0.36, 0.28);
    cone.addColorStop(0, "#e8ecff");
    cone.addColorStop(1, "#8a93bb");
    ctx.fillStyle = cone;
    ctx.beginPath();
    ctx.arc(0, -0.36, 0.27 + Math.max(0, s.squash) * 0.04, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#33374e";
    ctx.beginPath();
    ctx.arc(0, -0.36, 0.1, 0, TAU);
    ctx.fill();
    ctx.restore();
    if (s.squash > 0) worldGlow(s.x, s.y - 0.6, 1, "#ffe066", s.squash * 0.5);
  }

  function drawBooster(bst) {
    const dir = bst.vx >= 0 ? 1 : -1;
    worldGlow(bst.x, bst.y - 0.15, 0.9 + bst.pulse * 0.4, "#48f0ff", 0.38 + bst.pulse * 0.35);
    light(bst.x, bst.y - 0.25, 1.6, 0.6);
    ctx.save();
    ctx.translate(bst.x, bst.y);
    ctx.scale(dir, 1);
    ctx.fillStyle = "#1f253d";
    roundRect(ctx, -0.68, -0.22, 1.36, 0.22, 0.08);
    ctx.fill();
    ctx.strokeStyle = "#48f0ff";
    ctx.lineWidth = 0.035;
    ctx.stroke();
    for (let k = -1; k <= 1; k++) {
      const cyc = (world.t * 5.5 - k * 0.33) % 1;
      ctx.strokeStyle = cyc < 0.45 ? "#ffe066" : "#48f0ff";
      ctx.lineWidth = 0.06;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      const cx = k * 0.34;
      ctx.beginPath();
      ctx.moveTo(cx - 0.1, -0.17);
      ctx.lineTo(cx + 0.08, -0.11);
      ctx.lineTo(cx - 0.1, -0.05);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPad(pad) {
    ctx.fillStyle = "#2f3346";
    roundRect(ctx, pad.x - 0.5, pad.y - 0.16, 1, 0.16, 0.07);
    ctx.fill();
    ctx.fillStyle = pad.on ? "#5dff9a" : "#8b90ad";
    roundRect(ctx, pad.x - 0.4, pad.y - 0.2, 0.8, 0.06, 0.03);
    ctx.fill();
    ctx.fillStyle = "#4b5175";
    ctx.fillRect(pad.x - 0.04, pad.y - 0.6, 0.08, 0.45);
    ctx.fillStyle = pad.on ? "#5dff9a" : "#c8cbe0";
    ctx.beginPath();
    ctx.arc(pad.x, pad.y - 0.66, 0.13, 0, TAU);
    ctx.fill();
    if (pad.on) {
      worldGlow(pad.x, pad.y - 0.66, 0.7, "#5dff9a", 0.4 + 0.2 * Math.sin(world.t * 5));
      light(pad.x, pad.y - 0.6, 1.6, 0.7);
    }
  }

  function drawHook(h, target) {
    const raw = hookPos(h, world.t);
    const jy = (h.jolt || 0) * Math.sin(world.t * 45) * 0.08;
    const hp = { x: raw.x, y: raw.y + jy };
    const latched = !!(world.rope && world.rope.hook === h);
    if (h.ax || h.ay) {
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.setLineDash([0.12, 0.12]);
      ctx.lineWidth = 0.04;
      ctx.beginPath();
      ctx.moveTo(h.bx - h.ax, h.by - h.ay);
      ctx.lineTo(h.bx + h.ax, h.by + h.ay);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // A short chain up to a ceiling we cannot see.
    ctx.strokeStyle = "rgba(60,64,90,0.75)";
    ctx.lineWidth = 0.055;
    for (let k = 0; k < 5; k++) {
      ctx.beginPath();
      ctx.ellipse(hp.x, hp.y - 0.34 - k * 0.2, 0.045, 0.09, 0, 0, TAU);
      ctx.stroke();
    }
    if (target && world.cord && world.cord.length) {
      // Faint Cordy-style aiming guide from Telly's plug to the targeted hook.
      const plugPt = world.cord[world.cord.length - 1];
      ctx.save();
      ctx.strokeStyle = "rgba(255,230,102,0.32)";
      ctx.lineWidth = 0.035;
      ctx.setLineDash([0.14, 0.16]);
      ctx.lineDashOffset = -world.t * 3.5;
      ctx.beginPath();
      ctx.moveTo(plugPt.x, plugPt.y);
      ctx.lineTo(hp.x, hp.y);
      ctx.stroke();
      ctx.restore();
    }
    if (target || latched) {
      worldGlow(hp.x, hp.y, latched ? 1.15 : 1.0, latched ? "#7fe0ff" : "#ffe066", latched ? 0.7 : 0.6);
      ctx.strokeStyle = latched ? "rgba(127,224,255,0.9)" : "rgba(255,230,90,0.9)";
      ctx.lineWidth = 0.065;
      ctx.setLineDash([0.18, 0.12]);
      ctx.lineDashOffset = -world.t * (latched ? 4 : 2);
      ctx.beginPath();
      ctx.arc(hp.x, hp.y, (latched ? 0.44 : 0.5) + 0.05 * Math.sin(world.t * 8), 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    light(hp.x, hp.y, target || latched ? 1.8 : 0.9, target || latched ? 0.85 : 0.35);
    // Outer metal grapple ring + copper contact jaws.
    const g = ctx.createRadialGradient(hp.x - 0.08, hp.y - 0.08, 0.02, hp.x, hp.y, 0.28);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(1, latched ? "#9ee8ff" : "#b8c0d8");
    ctx.fillStyle = g;
    ctx.strokeStyle = "#3f4863";
    ctx.lineWidth = 0.08;
    ctx.beginPath();
    ctx.arc(hp.x, hp.y, 0.25, 0, TAU);
    ctx.fill();
    ctx.stroke();
    // Copper/gold conductive inner socket ring.
    ctx.strokeStyle = latched ? "#5dff9a" : target ? "#ffd24a" : "#d99b38";
    ctx.lineWidth = 0.05;
    ctx.beginPath();
    ctx.arc(hp.x, hp.y, 0.14, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = latched ? "#e9fdff" : "#3b425c";
    ctx.beginPath();
    ctx.arc(hp.x, hp.y, 0.085, 0, TAU);
    ctx.fill();
  }

  function bolt(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x + s * 0.12, y - s * 0.5);
    ctx.lineTo(x - s * 0.28, y + s * 0.06);
    ctx.lineTo(x - s * 0.02, y + s * 0.06);
    ctx.lineTo(x - s * 0.14, y + s * 0.5);
    ctx.lineTo(x + s * 0.3, y - s * 0.1);
    ctx.lineTo(x + s * 0.04, y - s * 0.1);
    ctx.closePath();
  }

  function drawSpark(s) {
    if (s.got) return;
    const y = s.y + Math.sin(world.t * 3 + s.x) * 0.08;
    const spin = Math.cos(world.t * 2.4 + s.x);
    worldGlow(s.x, y, 0.65, "#ffd23f", 0.5);
    light(s.x, y, 1.1, 0.5);
    ctx.save();
    ctx.translate(s.x, y);
    ctx.scale(0.4 + Math.abs(spin) * 0.6, 1);
    ctx.fillStyle = spin > 0 ? "#ffe066" : "#ffcf3f";
    ctx.strokeStyle = "#e08a10";
    ctx.lineWidth = 0.05;
    bolt(0, 0, 0.62);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    bolt(-0.03, -0.05, 0.3);
    ctx.fill();
    ctx.restore();
  }

  function drawCell(cell) {
    if (cell.got) return;
    const y = cell.y + Math.sin(world.t * 2.5 + cell.x) * 0.1;
    worldGlow(cell.x, y, 1, "#7dffb0", 0.55);
    light(cell.x, y, 1.8, 0.8);
    ctx.save();
    ctx.translate(cell.x, y);
    ctx.rotate(Math.sin(world.t * 1.8 + cell.x) * 0.12);
    ctx.fillStyle = "#1f8048";
    roundRect(ctx, -0.18, -0.36, 0.48, 0.66, 0.09);
    ctx.fill();
    const g = ctx.createLinearGradient(-0.24, 0, 0.2, 0);
    g.addColorStop(0, "#8dffbe");
    g.addColorStop(0.4, "#3ccf7a");
    g.addColorStop(1, "#24a35c");
    ctx.fillStyle = g;
    roundRect(ctx, -0.24, -0.32, 0.44, 0.64, 0.09);
    ctx.fill();
    ctx.fillStyle = "#c9d2d8";
    roundRect(ctx, -0.12, -0.43, 0.2, 0.13, 0.03);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    bolt(-0.02, 0, 0.36);
    ctx.fill();
    ctx.restore();
  }

  function drawPlug(x, y, angle, insertDepth = 0, energized = false) {
    const depth = clamp(insertDepth, 0, 0.95);
    const prongLen = 0.165 * (1 - depth);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    if (energized) {
      worldGlow(0.04, 0, 0.48, "#7fe0ff", 0.5);
    }
    // Two beveled brass prongs (retract into the outlet slots as insertDepth -> 1).
    if (prongLen > 0.015) {
      const pg = ctx.createLinearGradient(0.11, -0.1, 0.11 + prongLen, 0.1);
      pg.addColorStop(0, "#fff4bd");
      pg.addColorStop(0.5, "#e8c45c");
      pg.addColorStop(1, "#c49228");
      ctx.fillStyle = pg;
      for (const py of [-0.095, 0.04]) {
        roundRect(ctx, 0.11, py, prongLen, 0.055, 0.02);
        ctx.fill();
        if (prongLen > 0.09) {
          ctx.fillStyle = "#4a3810";
          ctx.beginPath();
          ctx.arc(0.11 + prongLen * 0.68, py + 0.0275, 0.013, 0, TAU);
          ctx.fill();
          ctx.fillStyle = pg;
        }
      }
    }
    // Ribbed rubber strain-relief neck joining the cord to the plug body.
    ctx.fillStyle = "#171a28";
    for (let i = 0; i < 3; i++) {
      const rx = -0.31 + i * 0.042;
      const rh = 0.15 + i * 0.022;
      roundRect(ctx, rx, -rh / 2, 0.034, rh, 0.015);
      ctx.fill();
    }
    // Contoured dark rubber grip housing.
    const bg = ctx.createLinearGradient(0, -0.15, 0, 0.15);
    bg.addColorStop(0, "#383e5e");
    bg.addColorStop(0.5, "#252940");
    bg.addColorStop(1, "#181a2b");
    ctx.fillStyle = bg;
    roundRect(ctx, -0.21, -0.14, 0.31, 0.28, 0.08);
    ctx.fill();
    ctx.strokeStyle = "#10121f";
    ctx.lineWidth = 0.022;
    ctx.stroke();
    // Front safety flange that seats flush against socket faceplates.
    ctx.fillStyle = "#323856";
    roundRect(ctx, 0.06, -0.165, 0.065, 0.33, 0.03);
    ctx.fill();
    // Top specular highlight & side grip ribs.
    ctx.fillStyle = "rgba(255,255,255,0.24)";
    roundRect(ctx, -0.18, -0.115, 0.23, 0.05, 0.025);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.16)";
    ctx.lineWidth = 0.018;
    for (const gx of [-0.12, -0.06, 0.0]) {
      ctx.beginPath();
      ctx.moveTo(gx, -0.05);
      ctx.lineTo(gx, 0.05);
      ctx.stroke();
    }
    // Power status LED on the side of the plug.
    ctx.fillStyle = energized ? "#5dff9a" : "#ffcf3f";
    ctx.beginPath();
    ctx.arc(-0.06, 0, 0.038, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(-0.07, -0.01, 0.014, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function strokePath(pts, ox, oy) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x + ox, pts[0].y + oy);
    if (pts.length === 2) {
      ctx.lineTo(pts[1].x + ox, pts[1].y + oy);
      return;
    }
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2;
      const my = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x + ox, pts[i].y + oy, mx + ox, my + oy);
    }
    ctx.lineTo(pts[pts.length - 1].x + ox, pts[pts.length - 1].y + oy);
  }

  function drawCord(px, py) {
    const w = world;
    const p = w.p;
    const a = cordAnchor(px, py, p.faceDir, p.tilt, p.sy, p.ropeBlend);
    const pts = w.cord.slice();
    pts[0] = a;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const r = w.rope;
    const surging = !!(w.plug && w.plug.seated) || w.finishing > 0 || w.flick > 0;
    const taut = !!r || surging;
    const draw = (ox, oy) => strokePath(pts, ox, oy);
    // Drop shadow.
    ctx.strokeStyle = "rgba(10,5,25,0.28)";
    ctx.lineWidth = 0.17;
    draw(0.05, 0.07);
    ctx.stroke();
    // Outer dark rubber jacket.
    ctx.strokeStyle = "#171a29";
    ctx.lineWidth = 0.15;
    draw(0, 0);
    ctx.stroke();
    // Inner insulated core sheath.
    ctx.strokeStyle = surging ? "#3b789c" : taut ? "#5e6794" : "#444b70";
    ctx.lineWidth = 0.085;
    draw(0, 0);
    ctx.stroke();
    // Specular highlight along the top edge of the cord.
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 0.026;
    draw(-0.025, -0.025);
    ctx.stroke();
    // Animated electricity pulses racing through the cord when surging or swinging!
    if (surging || r) {
      ctx.save();
      ctx.strokeStyle = surging ? "#7fe0ff" : "#ffe066";
      ctx.lineWidth = surging ? 0.065 : 0.045;
      ctx.setLineDash(surging ? [0.16, 0.26] : [0.12, 0.38]);
      ctx.lineDashOffset = -w.t * (surging ? 6.5 : 3.6);
      draw(0, 0);
      ctx.stroke();
      ctx.restore();
      const pulses = surging ? 2 : 1;
      for (let k = 0; k < pulses; k++) {
        const u = ((w.t * (surging ? 2.4 : 1.5)) + k * 0.5) % 1;
        const idx = u * (pts.length - 1);
        const i0 = Math.floor(idx);
        const i1 = Math.min(pts.length - 1, i0 + 1);
        const f = idx - i0;
        const sx = lerp(pts[i0].x, pts[i1].x, f);
        const sy = lerp(pts[i0].y, pts[i1].y, f);
        worldGlow(sx, sy, surging ? 0.48 : 0.34, surging ? "#7fe0ff" : "#ffe066", surging ? 0.75 : 0.5);
        if (surging) {
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(sx, sy, 0.048, 0, TAU);
          ctx.fill();
        }
      }
    }
    if (r) {
      const hp = hookPos(r.hook, w.t);
      ctx.strokeStyle = "#171a29";
      ctx.lineWidth = 0.085;
      for (let i = 0; i < Math.min(r.wraps, 5); i++) {
        ctx.beginPath();
        ctx.arc(hp.x, hp.y, 0.27 + i * 0.07, 0, TAU);
        ctx.stroke();
      }
      for (const k of r.pivots) worldGlow(k.x, k.y, 0.38, "#ffe066", 0.42);
      const last = pts[pts.length - 1];
      const prev = pts[pts.length - 2];
      const ang = w.plugAngle !== undefined ? w.plugAngle : Math.atan2(last.y - prev.y, last.x - prev.x);
      drawPlug(last.x, last.y, ang, r.shoot > 0 ? 0 : 0.58, true);
      return;
    }
    const end = pts[pts.length - 1];
    const prev = pts[pts.length - 3];
    const ang = w.plugAngle !== undefined ? w.plugAngle : Math.atan2(end.y - prev.y, end.x - prev.x);
    let depth = 0;
    if (w.plug) {
      depth = w.plug.seated ? 0.92 : clamp((w.plug.t - 0.14) / 0.12, 0, 0.85);
    }
    const ready = !!(surging || nearSocket() || nearExit() || bestHook() || nearBaddie());
    drawPlug(end.x, end.y, ang, depth, ready);
  }

  function drawShadowAt(x, y, size) {
    const fy = floorBelow(x, y - 0.05, 8);
    if (fy === null) return;
    const dist = fy - y;
    const a = clamp(0.32 - dist * 0.04, 0.05, 0.32);
    const s = size * clamp(1 - dist * 0.06, 0.5, 1);
    ctx.fillStyle = `rgba(20,10,40,${a})`;
    ctx.beginPath();
    ctx.ellipse(x, fy, s, s * 0.22, 0, 0, TAU);
    ctx.fill();
  }

  function drawRobotArm(sx, sy, hx, hy, color) {
    const mx = (sx + hx) * 0.5 - (hy - sy) * 0.18;
    const my = (sy + hy) * 0.5 + Math.abs(hx - sx) * 0.16;
    ctx.strokeStyle = "#2b2e44";
    ctx.lineWidth = 0.095;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(mx, my, hx, hy);
    ctx.stroke();
    ctx.strokeStyle = "#52587a";
    ctx.lineWidth = 0.045;
    ctx.stroke();
    // Cute Cordy-style round clamp/mitten hand.
    const ang = Math.atan2(hy - my, hx - mx);
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(ang);
    ctx.fillStyle = color || "#ff9a3c";
    ctx.strokeStyle = "#2b2e44";
    ctx.lineWidth = 0.03;
    ctx.beginPath();
    ctx.arc(0, 0, 0.075, 0.22 * Math.PI, 1.78 * Math.PI);
    ctx.lineTo(0.03, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawTellyAt(x, y, tilt, dir, sy, ghost) {
    const w = world;
    const p = w.p;
    const s = 1.05;
    const rawDir = dir !== undefined ? dir : p.faceDir !== undefined ? p.faceDir : p.dir;
    const fDir = (rawDir >= 0 ? 1 : -1) * (0.78 + 0.22 * Math.min(1, Math.abs(rawDir)));
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    const sx = 1 + (1 - sy) * 0.9;
    ctx.translate(0, -s * 0.46 * sy);
    ctx.scale(sx * fDir, sy);
    if (ghost) {
      ctx.fillStyle = "#ffd7a8";
      roundRect(ctx, -0.55, -0.42, 1.1, 0.84, 0.2);
      ctx.fill();
      ctx.restore();
      return;
    }
    const glowing = w.finishing > 0 || !!(w.plug && (w.plug.seated || w.plug.done));
    const moving = p.ground && Math.abs(p.vx) > 0.3;
    const ph = p.walk * 2.2;
    // Arm pose targets (back arm drawn behind chassis, front arm in front).
    let backHand = { x: -0.18, y: 0.22 };
    let frontHand = { x: 0.18, y: 0.24 };
    if (w.rope) {
      backHand = { x: -0.08, y: -0.52 };
      frontHand = { x: 0.1, y: -0.52 };
    } else if (p.pushing || p.pulling) {
      backHand = { x: 0.56, y: -0.02 };
      frontHand = { x: 0.6, y: 0.14 };
    } else if (glowing) {
      const wave = Math.sin(w.t * 16) * 0.06;
      backHand = { x: -0.42, y: -0.42 + wave };
      frontHand = { x: 0.48, y: -0.42 - wave };
    } else if (!p.ground) {
      backHand = { x: -0.36, y: -0.18 };
      frontHand = { x: 0.36, y: -0.14 };
    } else if (moving) {
      backHand = { x: -0.12 - Math.cos(ph) * 0.22, y: 0.22 - Math.abs(Math.sin(ph)) * 0.06 };
      frontHand = { x: 0.08 + Math.cos(ph) * 0.24, y: 0.24 - Math.abs(Math.sin(ph)) * 0.06 };
    }
    drawRobotArm(-0.22, 0.08, backHand.x, backHand.y, "#e8701a");
    // Rear & top rubber cord strain-relief grommet where the cord exits Telly's body.
    const rb = p.ropeBlend || 0;
    const gx = lerp(-0.54, 0, rb);
    const gy = lerp(0.14, -0.46, rb);
    ctx.fillStyle = "#1c1f30";
    ctx.beginPath();
    ctx.arc(gx, gy, 0.11, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = "#485078";
    ctx.lineWidth = 0.03;
    ctx.stroke();
    // Little legs and boots, with electric hover-jet flames when cushioning a fall!
    for (const [lx, o] of [[-0.2, 0], [0.2, Math.PI]]) {
      const lift = moving ? Math.max(0, Math.sin(ph + o)) * 0.11 : 0;
      const swing = moving ? Math.cos(ph + o) * 0.14 : !p.ground ? 0.08 * Math.sin(w.t * 12 + o) : 0;
      const fx = lx + swing;
      const fy = 0.45 - lift;
      if (p.hovering) {
        const flick = 0.18 + 0.08 * Math.sin(w.t * 42 + o);
        const jg = ctx.createLinearGradient(fx, fy + 0.04, fx, fy + 0.06 + flick);
        jg.addColorStop(0, "#ffffff");
        jg.addColorStop(0.45, "#7fe0ff");
        jg.addColorStop(1, "rgba(127,224,255,0)");
        ctx.fillStyle = jg;
        ctx.beginPath();
        ctx.moveTo(fx - 0.07, fy + 0.04);
        ctx.lineTo(fx + 0.15, fy + 0.04);
        ctx.lineTo(fx + 0.04, fy + 0.08 + flick);
        ctx.closePath();
        ctx.fill();
      }
      ctx.strokeStyle = "#2b2e44";
      ctx.lineWidth = 0.1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(lx, 0.34);
      ctx.lineTo(fx, fy);
      ctx.stroke();
      ctx.fillStyle = "#2b2e44";
      ctx.beginPath();
      ctx.ellipse(fx + 0.05, fy + 0.02, 0.135, 0.068, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = p.hovering ? "#7fe0ff" : "#ff6b8a";
      ctx.fillRect(fx - 0.07, fy + 0.04, 0.24, 0.032);
    }
    // Antennae on springs, with shiny balls and electric arcs when charging!
    ctx.strokeStyle = "#2b2e44";
    ctx.lineWidth = 0.045;
    const tips = [[-0.1, -0.4, -0.3, -0.8, p.ant[0], "#ff6b8a"], [0.1, -0.4, 0.33, -0.78, p.ant[1], "#ffd93d"]];
    const tipCoords = [];
    for (const [bx, by, tx, ty, a, col] of tips) {
      const ex = bx + (tx - bx) * Math.cos(a) - (ty - by) * Math.sin(a);
      const ey = by + (tx - bx) * Math.sin(a) + (ty - by) * Math.cos(a);
      tipCoords.push({ x: ex, y: ey });
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo((bx + ex) / 2 - a * 0.12, (by + ey) / 2, ex, ey);
      ctx.stroke();
      const bg = ctx.createRadialGradient(ex - 0.02, ey - 0.02, 0.005, ex, ey, 0.08);
      bg.addColorStop(0, "#ffffff");
      bg.addColorStop(0.4, glowing ? "#7fe0ff" : col);
      bg.addColorStop(1, glowing ? "#5dff9a" : col);
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(ex, ey, 0.08, 0, TAU);
      ctx.fill();
    }
    if (glowing && tipCoords.length === 2) {
      ctx.strokeStyle = "#e9fdff";
      ctx.lineWidth = 0.032;
      ctx.beginPath();
      ctx.moveTo(tipCoords[0].x, tipCoords[0].y);
      const mx = (tipCoords[0].x + tipCoords[1].x) * 0.5;
      const my = (tipCoords[0].y + tipCoords[1].y) * 0.5 - 0.08 + Math.sin(w.t * 48) * 0.05;
      ctx.quadraticCurveTo(mx, my, tipCoords[1].x, tipCoords[1].y);
      ctx.stroke();
    }
    // Body: the side panel for depth, then the front.
    ctx.fillStyle = "#b5520c";
    roundRect(ctx, -0.64, -0.49, 1.1, 0.84, 0.2);
    ctx.fill();
    const bg = ctx.createLinearGradient(-0.55, -0.42, 0.4, 0.42);
    bg.addColorStop(0, "#ffc47a");
    bg.addColorStop(0.5, "#ff9a3c");
    bg.addColorStop(1, "#e8701a");
    ctx.fillStyle = bg;
    roundRect(ctx, -0.55, -0.42, 1.1, 0.84, 0.2);
    ctx.fill();
    ctx.strokeStyle = "#b85a0e";
    ctx.lineWidth = 0.04;
    ctx.stroke();
    // A shine along the top and a rim along the bottom.
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    roundRect(ctx, -0.46, -0.38, 0.86, 0.07, 0.035);
    ctx.fill();
    ctx.fillStyle = "rgba(120,40,0,0.25)";
    roundRect(ctx, -0.46, 0.32, 0.92, 0.06, 0.03);
    ctx.fill();
    // Knobs and speaker grille.
    for (const ky of [-0.18, -0.01]) {
      const kg = ctx.createRadialGradient(0.38, ky - 0.02, 0.005, 0.4, ky, 0.06);
      kg.addColorStop(0, "#ffffff");
      kg.addColorStop(1, "#e9c39a");
      ctx.fillStyle = kg;
      ctx.beginPath();
      ctx.arc(0.4, ky, 0.058, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "#b85a0e";
      ctx.lineWidth = 0.015;
      ctx.beginPath();
      ctx.moveTo(0.4, ky);
      ctx.lineTo(0.4 + Math.cos(w.t + ky * 9) * 0.045, ky + Math.sin(w.t + ky * 9) * 0.045);
      ctx.stroke();
    }
    ctx.fillStyle = "#b85a0e";
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        ctx.beginPath();
        ctx.arc(0.33 + j * 0.07, 0.12 + i * 0.07, 0.017, 0, TAU);
        ctx.fill();
      }
    }
    // The screen: an inset bezel, then glass with scanlines and a glare.
    ctx.fillStyle = "#3a2410";
    roundRect(ctx, -0.47, -0.34, 0.76, 0.68, 0.16);
    ctx.fill();
    const sg = ctx.createRadialGradient(-0.12, -0.05, 0.05, -0.09, 0, 0.45);
    sg.addColorStop(0, glowing ? "#e9fdff" : "#4c6aa3");
    sg.addColorStop(1, glowing ? "#7fe0ff" : "#1a2340");
    ctx.fillStyle = sg;
    roundRect(ctx, -0.44, -0.31, 0.7, 0.62, 0.14);
    ctx.fill();
    ctx.save();
    roundRect(ctx, -0.44, -0.31, 0.7, 0.62, 0.14);
    ctx.clip();
    ctx.fillStyle = glowing ? "rgba(255,255,255,0.14)" : "rgba(140,190,255,0.09)";
    const scroll = (w.t * 0.4) % 0.07;
    for (let yy = -0.31 + scroll; yy < 0.31; yy += 0.07) ctx.fillRect(-0.44, yy, 0.7, 0.025);
    drawFace(glowing);
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    ctx.beginPath();
    ctx.moveTo(-0.44, -0.31);
    ctx.lineTo(-0.12, -0.31);
    ctx.lineTo(-0.34, 0.31);
    ctx.lineTo(-0.44, 0.31);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.ellipse(0.12, -0.22, 0.09, 0.035, -0.3, 0, TAU);
    ctx.fill();
    ctx.restore();
    // Front articulated arm (drawn over the side of the body).
    drawRobotArm(0.28, 0.12, frontHand.x, frontHand.y, "#ffb25c");
    ctx.restore();
  }

  function drawTelly(px, py) {
    const w = world;
    const p = w.p;
    if (w.invuln > 0 && Math.floor(w.invuln * 12) % 2 === 0) return;
    drawShadowAt(px, py, 0.5);
    for (const g of w.ghosts) {
      ctx.globalAlpha = (g.life / 0.25) * 0.25;
      drawTellyAt(g.x, g.y, g.tilt, g.dir, 1, true);
    }
    ctx.globalAlpha = 1;
    drawTellyAt(px, py, p.tilt, p.faceDir, p.sy, false);
    const glowing = w.finishing > 0 || !!(w.plug && (w.plug.seated || w.plug.done));
    const c = { x: px - p.dir * 0.09, y: py - 0.46 };
    worldGlow(c.x, c.y, glowing ? 1.7 : 0.95, glowing ? "#7fe0ff" : "#6f9bff", glowing ? 0.65 : 0.24);
    light(c.x, c.y, glowing ? 5.2 : 3.6, 1);
  }

  function drawFace(glowing) {
    const w = world;
    const p = w.p;
    const s = 1.05;
    const fx = -s * 0.09;
    const fy = 0;
    const ink = glowing ? "#1c2640" : "#ffffff";
    const speed = Math.hypot(p.vx, p.vy);
    let face = p.face;
    if (face !== "zap" && face !== "love" && face !== "surge") {
      if (w.plug && w.plug.seated) face = "surge";
      else if (p.worried) face = "worried";
      else if (w.rope && speed > 9) face = "whee";
      else if (p.pushing || p.pulling) face = "push";
      else if (p.hovering) face = "whee";
      else if (!p.ground && p.vy > 8) face = "oh";
      else face = "happy";
    }
    ctx.fillStyle = ink;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 0.04;
    ctx.lineCap = "round";
    if (face === "zap") {
      for (const ex of [-0.12, 0.12]) {
        ctx.beginPath();
        ctx.moveTo(fx + s * (ex - 0.05), fy - s * 0.12);
        ctx.lineTo(fx + s * (ex + 0.05), fy - s * 0.02);
        ctx.moveTo(fx + s * (ex + 0.05), fy - s * 0.12);
        ctx.lineTo(fx + s * (ex - 0.05), fy - s * 0.02);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(fx - s * 0.08, fy + s * 0.12);
      for (let i = 1; i <= 4; i++) ctx.lineTo(fx - s * 0.08 + i * s * 0.04, fy + s * (i % 2 ? 0.08 : 0.12));
      ctx.stroke();
      return;
    }
    if (face === "surge") {
      // Excited electric star-eyes while Telly pumps power into a socket!
      for (const ex of [-0.12, 0.12]) {
        const sx = fx + s * ex + 0.02;
        const sy = fy - s * 0.07;
        ctx.fillStyle = glowing ? "#1c2640" : "#ffe066";
        FK.starPath(ctx, sx, sy, s * 0.072, s * 0.032, 4);
        ctx.fill();
      }
      ctx.fillStyle = ink;
      ctx.beginPath();
      ctx.arc(fx, fy + s * 0.05, s * 0.095, 0, Math.PI);
      ctx.fill();
      return;
    }
    if (face === "love") {
      for (const ex of [-0.12, 0.12]) {
        const hx = fx + s * ex;
        const hy = fy - s * 0.07;
        const beat = 1 + Math.sin(w.t * 12) * 0.12;
        ctx.fillStyle = "#ff5c8a";
        ctx.beginPath();
        ctx.moveTo(hx, hy + s * 0.05 * beat);
        ctx.bezierCurveTo(hx - s * 0.08 * beat, hy - s * 0.02, hx - s * 0.03, hy - s * 0.08 * beat, hx, hy - s * 0.03);
        ctx.bezierCurveTo(hx + s * 0.03, hy - s * 0.08 * beat, hx + s * 0.08 * beat, hy - s * 0.02, hx, hy + s * 0.05 * beat);
        ctx.fill();
      }
      ctx.strokeStyle = ink;
      ctx.beginPath();
      ctx.arc(fx, fy + s * 0.06, s * 0.08, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      return;
    }
    // Eyes look where Telly is going.
    const lookX = clamp(p.vx * 0.004, -0.02, 0.03);
    const lookY = clamp(p.vy * 0.003, -0.02, 0.02);
    const blink = face === "happy" && p.blink < 0;
    if (blink) {
      for (const ex of [-0.12, 0.12]) {
        ctx.beginPath();
        ctx.moveTo(fx + s * (ex - 0.05), fy - s * 0.07);
        ctx.lineTo(fx + s * (ex + 0.05), fy - s * 0.07);
        ctx.stroke();
      }
    } else {
      for (const ex of [-0.12, 0.12]) {
        ctx.fillStyle = ink;
        ctx.beginPath();
        const tall = face === "push" ? 0.038 : face === "oh" || face === "whee" ? 0.078 : 0.066;
        ctx.ellipse(fx + s * ex + 0.02, fy - s * 0.07, s * 0.056, s * tall, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = glowing ? "#ffffff" : "#1b2440";
        ctx.beginPath();
        ctx.arc(fx + s * ex + 0.03 + lookX, fy - s * 0.075 + lookY, s * 0.026, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(fx + s * ex + 0.045 + lookX, fy - s * 0.09 + lookY, s * 0.01, 0, TAU);
        ctx.fill();
      }
      if (face === "worried" || face === "push") {
        ctx.strokeStyle = ink;
        ctx.lineWidth = 0.03;
        for (const ex of [-0.12, 0.12]) {
          ctx.beginPath();
          if (face === "push") {
            ctx.moveTo(fx + s * (ex - 0.05), fy - s * (ex < 0 ? 0.17 : 0.13));
            ctx.lineTo(fx + s * (ex + 0.05), fy - s * (ex < 0 ? 0.13 : 0.17));
          } else {
            ctx.moveTo(fx + s * (ex - 0.05), fy - s * (ex < 0 ? 0.15 : 0.18));
            ctx.lineTo(fx + s * (ex + 0.05), fy - s * (ex < 0 ? 0.18 : 0.15));
          }
          ctx.stroke();
        }
      }
    }
    ctx.fillStyle = "rgba(255,120,150,0.55)";
    ctx.beginPath();
    ctx.arc(fx - s * 0.22, fy + s * 0.05, s * 0.045, 0, TAU);
    ctx.arc(fx + s * 0.22, fy + s * 0.05, s * 0.045, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.fillStyle = ink;
    ctx.lineWidth = 0.04;
    ctx.beginPath();
    if (face === "oh") {
      ctx.ellipse(fx, fy + s * 0.1, s * 0.045, s * 0.06, 0, 0, TAU);
      ctx.fill();
    } else if (face === "whee") {
      ctx.arc(fx, fy + s * 0.05, s * 0.09, 0, Math.PI);
      ctx.fill();
      ctx.fillStyle = "#ff8fa8";
      ctx.beginPath();
      ctx.ellipse(fx, fy + s * 0.11, s * 0.045, s * 0.025, 0, 0, TAU);
      ctx.fill();
    } else if (face === "worried" || face === "push") {
      ctx.moveTo(fx - s * 0.07, fy + s * 0.12);
      ctx.quadraticCurveTo(fx, fy + s * (face === "push" ? 0.09 : 0.06), fx + s * 0.07, fy + s * 0.12);
      ctx.stroke();
    } else {
      ctx.arc(fx, fy + s * 0.04, s * 0.08, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (const q of world.parts) {
      const k = q.life / q.max;
      const a = 1 - k;
      if (q.kind === "dust" || q.kind === "smoke") {
        ctx.globalAlpha = a * (q.kind === "smoke" ? 0.4 : 0.6);
        ctx.fillStyle = q.kind === "smoke" ? "#3b3550" : "#ffffff";
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.size * (1 + k * 1.5), 0, TAU);
        ctx.fill();
      } else if (q.kind === "spark") {
        ctx.globalAlpha = a;
        ctx.strokeStyle = q.color;
        ctx.lineWidth = 0.05;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(q.x, q.y);
        ctx.lineTo(q.x - q.vx * 0.03, q.y - q.vy * 0.03);
        ctx.stroke();
      } else if (q.kind === "drop") {
        ctx.globalAlpha = a;
        ctx.fillStyle = "#9fdcff";
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.size, 0, TAU);
        ctx.fill();
      } else if (q.kind === "star") {
        ctx.globalAlpha = a;
        ctx.fillStyle = q.color;
        FK.starPath(ctx, q.x, q.y, q.size * 1.4, q.size * 0.55, 4);
        ctx.fill();
      } else if (q.kind === "ring") {
        ctx.globalAlpha = a * 0.9;
        ctx.strokeStyle = q.color;
        ctx.lineWidth = 0.07 * a + 0.01;
        ctx.beginPath();
        ctx.arc(q.x, q.y, 0.2 + k * 1.3, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    for (const q of world.parts) if (q.kind === "spark" || q.kind === "star") glow(q.x, q.y, 0.25, "#ffe066", (1 - q.life / q.max) * 0.5);
  }

  // The dark rooms: everything dims except what is lit.
  function drawLighting(theme) {
    if (!theme.dark) return;
    const q = 0.25;
    const lw = Math.ceil(W * q);
    const lh = Math.ceil(H * q);
    if (!lightCanvas || lightCanvas.width !== lw || lightCanvas.height !== lh) lightCanvas = canvasOf(lw, lh);
    const g = lightCanvas.getContext("2d");
    g.globalCompositeOperation = "source-over";
    g.clearRect(0, 0, lw, lh);
    g.fillStyle = `rgba(12,8,38,${theme.dark})`;
    g.fillRect(0, 0, lw, lh);
    g.globalCompositeOperation = "destination-out";
    const o = camOrigin();
    for (let i = 0; i < lights.length; i += 4) {
      const x = (o.x + lights[i] * Z) * q;
      const y = (o.y + lights[i + 1] * Z) * q;
      const r = lights[i + 2] * Z * q;
      if (x < -r || y < -r || x > lw + r || y > lh + r) continue;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(0,0,0,${lights[i + 3]})`);
      gr.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = gr;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.drawImage(lightCanvas, 0, 0, W, H);
  }

  /* ---------------- on-screen mobile controls ---------------- */
  let showPad = true;
  const touches = new Map();     // pointerId -> button
  function buttons() {
    const R = clamp(Math.min(W, H) * 0.088, 30, 50);
    const padX = Math.max(16, Math.round(W * 0.024));
    const by = H - safeBottom - R - 18;
    return [
      { id: "left", x: padX + R, y: by, r: R, icon: "◀", label: "LEFT" },
      { id: "right", x: padX + R * 3.25, y: by, r: R, icon: "▶", label: "RIGHT" },
      { id: "cord", x: W - padX - R * 3.45, y: by + R * 0.06, r: R * 1.02, icon: "🔌", label: "CORD" },
      { id: "jump", x: W - padX - R * 1.15, y: by - R * 0.2, r: R * 1.14, icon: "⤒", label: "JUMP" },
    ];
  }
  function buttonAt(x, y) {
    let best = null;
    let bestD = Infinity;
    for (const b of buttons()) {
      const d = Math.hypot(x - b.x, y - b.y) / b.r;
      if (d < bestD) {
        bestD = d;
        best = b;
      }
    }
    return bestD < 2.25 ? best.id : null;
  }
  function applyTouches() {
    const held = new Set(touches.values());
    input.left = held.has("left");
    input.right = held.has("right");
    if (held.has("jump") && !input.jump) input.jumpPressed = true;
    input.jump = held.has("jump");
    if (held.has("cord") && !input.cord) input.cordPressed = true;
    if (!held.has("cord") && input.cord) input.cordReleased = true;
    input.cord = held.has("cord");
  }

  function drawButtons() {
    if (!showPad || kit.state !== "playing" || bench.active) return;
    const held = new Set(touches.values());
    const w = world;
    const p = w ? w.p : null;
    const btns = buttons();
    const bLeft = btns[0];
    const bRight = btns[1];
    // Left thumb rocker housing connecting ◀ and ▶
    ctx.save();
    const pillPad = bLeft.r * 0.22;
    const pillX = bLeft.x - bLeft.r - pillPad;
    const pillY = bLeft.y - bLeft.r - pillPad;
    const pillW = (bRight.x + bRight.r) - (bLeft.x - bLeft.r) + pillPad * 2;
    const pillH = bLeft.r * 2 + pillPad * 2;
    ctx.fillStyle = "rgba(18, 22, 44, 0.46)";
    ctx.strokeStyle = "rgba(255, 255, 255, 0.34)";
    ctx.lineWidth = 2;
    roundRect(ctx, pillX, pillY, pillW, pillH, pillH * 0.5);
    ctx.fill();
    ctx.stroke();

    // Context-aware Cord & Jump button states
    const hasSocket = w && !w.rope && (nearSocket() || nearExit());
    const hasHook = w && !w.rope && !hasSocket && bestHook();
    const hasBaddie = w && !w.rope && !hasSocket && !hasHook && nearBaddie();
    const ready = !!(hasSocket || hasHook || hasBaddie || (w && w.rope));
    let cordIcon = "🔌";
    let cordLabel = "CORD";
    let cordAccent = "#5ac8ff";
    if (w && w.rope) {
      cordIcon = "🪝";
      cordLabel = "SWING";
      cordAccent = "#48f0ff";
    } else if (hasSocket) {
      cordIcon = "🔌";
      cordLabel = "PLUG";
      cordAccent = "#5cff9d";
    } else if (hasHook) {
      cordIcon = "🪝";
      cordLabel = "HOOK";
      cordAccent = "#ffe066";
    } else if (hasBaddie) {
      cordIcon = "⚡";
      cordLabel = "ZAP";
      cordAccent = "#ffbe3b";
    }
    const jumpLabel = w && w.rope ? "LEAP" : p && !p.ground && p.hover > 0 ? "HOVER" : "JUMP";

    for (const b of btns) {
      const on = held.has(b.id);
      const pressY = on ? 2.5 : 0;
      const isCord = b.id === "cord";
      const isJump = b.id === "jump";

      // Pulsing outer action halo when Cord is in range of a hook/socket/baddie
      if (isCord && ready) {
        const pulse = 0.55 + 0.35 * Math.sin(w.t * 9);
        ctx.strokeStyle = cordAccent;
        ctx.globalAlpha = pulse;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 5 + Math.sin(w.t * 9) * 1.5, 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Drop shadow / 3D base rim
      ctx.fillStyle = "rgba(12, 15, 32, 0.55)";
      ctx.beginPath();
      ctx.arc(b.x, b.y + 3.5, b.r + 1, 0, TAU);
      ctx.fill();

      // Tactile button cap gradient
      const g = ctx.createRadialGradient(b.x - b.r * 0.28, b.y + pressY - b.r * 0.32, b.r * 0.08, b.x, b.y + pressY, b.r);
      if (isJump) {
        g.addColorStop(0, on ? "rgba(255, 196, 110, 0.92)" : "rgba(255, 156, 68, 0.78)");
        g.addColorStop(1, on ? "rgba(230, 108, 28, 0.88)" : "rgba(44, 32, 68, 0.72)");
      } else if (isCord) {
        g.addColorStop(0, on ? "rgba(140, 238, 255, 0.92)" : ready ? "rgba(95, 210, 255, 0.82)" : "rgba(110, 155, 245, 0.72)");
        g.addColorStop(1, on ? "rgba(48, 132, 225, 0.88)" : "rgba(28, 38, 76, 0.74)");
      } else {
        g.addColorStop(0, on ? "rgba(255, 224, 130, 0.9)" : "rgba(72, 86, 132, 0.72)");
        g.addColorStop(1, on ? "rgba(235, 138, 42, 0.84)" : "rgba(24, 30, 58, 0.74)");
      }
      ctx.fillStyle = g;
      ctx.strokeStyle = on
        ? "#ffe066"
        : isCord && ready
          ? cordAccent
          : isJump
            ? "rgba(255, 198, 128, 0.85)"
            : "rgba(255, 255, 255, 0.72)";
      ctx.lineWidth = on || (isCord && ready) ? 2.8 : 2.2;
      ctx.beginPath();
      ctx.arc(b.x, b.y + pressY, b.r, 0, TAU);
      ctx.fill();
      ctx.stroke();

      // Top glossy arc highlight
      ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(b.x, b.y + pressY, b.r * 0.84, -Math.PI * 0.8, -Math.PI * 0.2);
      ctx.stroke();

      // Icon & sub-label
      const hasSub = isCord || isJump;
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.round(b.r * (hasSub ? 0.74 : 0.82))}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(isCord ? cordIcon : b.icon, b.x, b.y + pressY - (hasSub ? b.r * 0.14 : 0));
      if (hasSub) {
        ctx.fillStyle = isCord && ready ? "#fff4b8" : "rgba(255, 255, 255, 0.92)";
        ctx.font = `800 ${Math.max(9, Math.round(b.r * 0.26))}px system-ui, sans-serif`;
        ctx.fillText(isCord ? cordLabel : jumpLabel, b.x, b.y + pressY + b.r * 0.48);
      }
    }
    ctx.restore();
  }

  let lastRender = 0;
  function render() {
    if (!ctx) return;
    const now = performance.now();
    const realDt = lastRender ? clamp((now - lastRender) / 1000, 0, 1 / 30) : 1 / 60;
    lastRender = now;
    if (bench.active) bench.frame(now);
    if (!world) newWorld(0);
    // The attract screen plays itself behind the title and result cards.
    if (kit.state !== "playing" && kit.state !== "paused" && mode === "play") {
      mode = "demo";
      newWorld(0);
    }
    if (kit.state !== "playing" && kit.state !== "paused") simulate(realDt);
    const w = world;
    const p = w.p;
    const L = w.L;
    // Draw Telly between the last two physics steps, so motion is smooth at
    // any screen refresh rate.
    const alpha = clamp(w.acc / STEP, 0, 1);
    const ix = lerp(p.px, p.x, alpha);
    const iy = lerp(p.py, p.y, alpha);
    const speed = Math.hypot(p.vx, p.vy);
    // The camera leads where Telly is heading and pulls back on fast swings.
    const zoomTo = w.rope || (!p.ground && speed > 9) ? clamp(1 - (speed - 6) * 0.018, 0.84, 1) : 1;
    w.cam.z = lerp(w.cam.z, zoomTo, Math.min(1, realDt * 2));
    Z = T * w.cam.z;
    const lead = p.dir * 1.6 + clamp(p.vx * 0.15, -1.2, 1.2);
    w.cam.x = lerp(w.cam.x, ix + lead, Math.min(1, realDt * 4.2));
    w.cam.y = lerp(w.cam.y, Math.min(iy, BOTTOM + 1) - 1.8 + clamp(p.vy * 0.06, -0.6, 1), Math.min(1, realDt * 4.2));
    w.cam.x = Math.max(w.cam.x, (W * 0.42) / Z - 1);
    const theme = L.theme;
    lights.length = 0;
    ctx.save();
    kit.applyShake(ctx);
    ctx.drawImage(sky(theme), 0, 0, W, H);
    if (quality < 2) drawStrip(theme, 0);
    drawBackground(theme);
    drawChunks(theme);
    const o = camOrigin();
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.scale(Z, Z);
    drawWires();
    for (const wtr of L.water) drawWater(wtr, theme);
    for (const pl of L.plates) drawPlate(pl);
    for (const br of L.bridges) drawBridge(br);
    for (const d of L.doors) drawDoor(d);
    for (const lf of L.lifts) drawLift(lf);
    for (const f of L.fans) drawFan(f);
    for (const sp of L.sparkers) drawSparker(sp);
    for (const s of L.springs) drawSpring(s);
    for (const bst of L.boosters) drawBooster(bst);
    for (const pad of L.pads) drawPad(pad);
    for (const s of L.sockets) drawSocket(s);
    drawExit(L.exit);
    const target = !w.rope && w.zap <= 0 && !w.plug ? bestHook() : null;
    for (const h of L.hooks) drawHook(h, h === target);
    for (const s of L.sparks) drawSpark(s);
    for (const c of L.cells) drawCell(c);
    for (const c of L.crates) drawCrate(c);
    for (const bd of L.baddies) drawBaddie(bd);
    if (bench.active && w.trail.length > 1) {
      ctx.strokeStyle = "rgba(255,230,120,0.35)";
      ctx.lineWidth = 0.08;
      ctx.beginPath();
      const from = Math.max(0, w.trail.length - 240);
      for (let i = from; i < w.trail.length; i++) {
        if (i === from) ctx.moveTo(w.trail[i].x, w.trail[i].y);
        else ctx.lineTo(w.trail[i].x, w.trail[i].y);
      }
      ctx.stroke();
    }
    if (w.plug || w.flick > 0) {
      drawTelly(ix, iy);
      drawCord(ix, iy);
    } else {
      drawCord(ix, iy);
      drawTelly(ix, iy);
    }
    drawParticles();
    ctx.restore();
    drawLighting(theme);
    if (theme.dark && quality < 2) ctx.drawImage(getVignette(), 0, 0, W, H);
    kit.fx.draw(ctx);
    drawButtons();
    ctx.restore();
    govern(realDt);
  }

  function simulate(dt) {
    const w = world;
    w.acc += dt;
    let n = 0;
    while (w.acc >= STEP && n < 8) {
      step(STEP);
      w.acc -= STEP;
      n += 1;
      if (world !== w) return;
    }
    if (n === 8) w.acc = 0;
  }

  function update(dt) {
    if (mode !== "play") return;
    if (world.finishing <= 0) roomTime += dt;
    simulate(dt);
  }

  function updateHud() {
    if (mode !== "play" || !world) return;
    const cells = world.L.cells.filter((c) => c.got).length;
    kit.setExtra(`<span>🔋${Math.max(0, batteries)} · Room ${world.L.n + 1}${cells ? ` · ${cells}/3` : ""}</span>`);
  }

  let startRoomIdx = 0;
  function startGame() {
    bench.stop(false);
    mode = "play";
    batteries = BATTERIES;
    for (const k of Object.keys(stats)) stats[k] = 0;
    clearInput();
    newWorld(startRoomIdx);
    updateHud();
    kit.toast(`Room ${startRoomIdx + 1}: ${world.L.def.name}`, "#ffe9c4");
  }

  /* ---------------- benchmark: "Test this device" ---------------- */
  const BENCH_SECONDS = 20;
  const BENCH_KEY = "fk:family-telly-swing:bench";
  const bench = {
    active: false,
    started: 0,
    last: 0,
    frames: [],
    begin() {
      if (kit.state === "playing" || kit.state === "paused") return;
      const overlay = document.getElementById("fk-overlay");
      overlay.classList.remove("fk-show");
      overlay.innerHTML = "";
      mode = "bench";
      newWorld(1);
      this.active = true;
      if (view) view.resize();
      this.frames = [];
      this.started = performance.now();
      this.last = 0;
      kit.sound.unlock();
    },
    frame(now) {
      if (this.last) this.frames.push(now - this.last);
      this.last = now;
      if (now - this.started >= BENCH_SECONDS * 1000) this.stop(true);
    },
    stop(show) {
      if (!this.active) return;
      this.active = false;
      mode = "demo";
      newWorld(0);
      if (show) showBenchResult(summarize(this.frames));
    },
  };

  function summarize(frames) {
    const sorted = frames.slice().sort((a, b) => a - b);
    const total = frames.reduce((s, f) => s + f, 0) || 1;
    const pct = (q) => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * q))] || 0;
    const slowest = sorted.slice(Math.floor(sorted.length * 0.99));
    const low = slowest.length ? 1000 / (slowest.reduce((s, f) => s + f, 0) / slowest.length) : 0;
    const result = {
      fps: Math.round((frames.length / total) * 1000),
      low1: Math.round(low),
      p95: Math.round(pct(0.95) * 10) / 10,
      hitches: frames.filter((f) => f > 50).length,
      frames: frames.length,
      w: Math.round(W),
      h: Math.round(H),
      dpr: view ? view.dpr : 1,
      quality,
      ua: navigator.userAgent.slice(0, 160),
      at: new Date().toISOString(),
    };
    result.grade = result.fps >= 55 && result.hitches <= 2 ? "Silky smooth" : result.fps >= 40 ? "Smooth" : result.fps >= 25 ? "Playable" : "Struggling";
    try {
      localStorage.setItem(BENCH_KEY, JSON.stringify(result));
    } catch (_) {
      /* storage blocked */
    }
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: "arcade-game", slug: "family-telly-swing", type: "benchmark", result }, "*");
      }
    } catch (_) {
      /* parent gone */
    }
    return result;
  }

  function lastBench() {
    try {
      return JSON.parse(localStorage.getItem(BENCH_KEY) || "null");
    } catch (_) {
      return null;
    }
  }

  function showBenchResult(r) {
