    ctx.drawImage(c, x - r, y - r, r * 2, r * 2);
    ctx.globalCompositeOperation = prevOp;
    ctx.globalAlpha = prevA;
  }

  // A light for the dark rooms, in world units (radius in tiles).
  function light(x, y, r, a) {
    lights.push(x, y, r, a === undefined ? 1 : a);
  }

  /* ---------- the blocks: pre-drawn in chunks with all the detail ---------- */
  const CH = 12;
  const CHUNK_MAX = 18;

  function texture(g, theme, px) {
    const c = canvasOf(px * 2, px * 2);
    const t = c.getContext("2d");
    const grad = t.createLinearGradient(0, 0, px * 2, px * 2);
    grad.addColorStop(0, theme.body);
    grad.addColorStop(1, theme.side);
    t.fillStyle = theme.body;
    t.fillRect(0, 0, px * 2, px * 2);
    t.strokeStyle = theme.line;
    t.fillStyle = theme.line;
    t.lineWidth = Math.max(1, px * 0.045);
    const r = rngFn(theme.name.length * 31);
    t.globalAlpha = 0.4;
    if (theme.tex === "planks") {
      for (let i = 0; i < 4; i++) {
        t.globalAlpha = 0.1 + r() * 0.12;
        t.fillStyle = r() > 0.5 ? "#ffffff" : "#000000";
        t.fillRect(0, i * px * 0.5, px * 2, px * 0.5);
        t.globalAlpha = 0.45;
        t.beginPath(); t.moveTo(0, i * px * 0.5); t.lineTo(px * 2, i * px * 0.5); t.stroke();
        const sx = ((i * 0.7) % 2) * px;
        t.beginPath(); t.moveTo(sx, i * px * 0.5); t.lineTo(sx, (i + 1) * px * 0.5); t.stroke();
        t.globalAlpha = 0.25;
        t.beginPath(); t.ellipse(sx + px * 0.6, i * px * 0.5 + px * 0.25, px * 0.12, px * 0.05, 0, 0, TAU); t.stroke();
      }
    } else if (theme.tex === "tiles") {
      for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
        t.globalAlpha = 0.06 + r() * 0.08;
        t.fillStyle = "#ffffff";
        t.fillRect(i * px + px * 0.06, j * px + px * 0.06, px * 0.88, px * 0.88);
      }
      t.globalAlpha = 0.45;
      for (let i = 0; i <= 2; i++) {
        t.beginPath(); t.moveTo(i * px, 0); t.lineTo(i * px, px * 2); t.moveTo(0, i * px); t.lineTo(px * 2, i * px); t.stroke();
      }
      t.globalAlpha = 0.18;
      t.fillStyle = "#ffffff";
      t.fillRect(px * 0.1, px * 0.1, px * 0.4, px * 0.1);
      t.fillRect(px * 1.1, px * 1.1, px * 0.4, px * 0.1);
    } else if (theme.tex === "metal") {
      t.globalAlpha = 0.1;
      t.fillStyle = "#ffffff";
      t.fillRect(0, 0, px * 2, px * 0.5);
      t.fillRect(0, px, px * 2, px * 0.5);
      t.globalAlpha = 0.5;
      t.fillStyle = theme.line;
      for (let i = 0; i <= 2; i++) { t.beginPath(); t.moveTo(0, i * px); t.lineTo(px * 2, i * px); t.stroke(); }
      for (const [x, y] of [[0.15, 0.15], [0.85, 0.15], [1.15, 1.15], [1.85, 1.15], [0.15, 1.15], [0.85, 1.15], [1.15, 0.15], [1.85, 0.15]]) {
        t.beginPath(); t.arc(x * px, y * px, px * 0.05, 0, TAU); t.fill();
        t.globalAlpha = 0.3; t.fillStyle = "#ffffff";
        t.beginPath(); t.arc(x * px - px * 0.015, y * px - px * 0.015, px * 0.02, 0, TAU); t.fill();
        t.globalAlpha = 0.5; t.fillStyle = theme.line;
      }
    } else if (theme.tex === "bricks") {
      for (let row = 0; row < 4; row++) {
        const y = row * px * 0.5;
        const off = row % 2 ? px * 0.5 : 0;
        for (let x = off - px; x < px * 2; x += px) {
          t.globalAlpha = 0.05 + r() * 0.12;
          t.fillStyle = r() > 0.5 ? "#ffffff" : "#000000";
          t.fillRect(x, y, px, px * 0.5);
        }
        t.globalAlpha = 0.5;
        t.beginPath(); t.moveTo(0, y); t.lineTo(px * 2, y); t.stroke();
        for (let x = off; x < px * 2; x += px) { t.beginPath(); t.moveTo(x, y); t.lineTo(x, y + px * 0.5); t.stroke(); }
      }
    } else {
      for (let i = 0; i < 30; i++) {
        t.globalAlpha = 0.15 + r() * 0.35;
        t.fillStyle = r() > 0.7 ? "#c9a27e" : theme.line;
        t.beginPath();
        t.ellipse(r() * px * 2, r() * px * 2, px * (0.04 + r() * 0.09), px * (0.03 + r() * 0.06), r() * 3, 0, TAU);
        t.fill();
      }
    }
    t.globalAlpha = 1;
    let pat = null;
    try {
      pat = g.createPattern(c, "repeat");
      if (pat && pat.setTransform && window.DOMMatrix) pat.setTransform(new DOMMatrix().scale(1 / px));
      else pat = null;
    } catch (_) {
      pat = null;
    }
    return pat;
  }

  function chunkScale() {
    return T * Math.min(DPR, 1.5);
  }

  const EMPTY = { empty: true };
  function buildChunk(theme, cx, cy) {
    const L = world.L;
    // Open sky needs no canvas at all.
    let any = false;
    for (let y = cy * CH - 1; y <= cy * CH + CH && !any; y++) for (let x = cx * CH - 1; x <= cx * CH + CH; x++) if (L.tile(x, y)) { any = true; break; }
    if (!any) return EMPTY;
    const px = chunkScale();
    const pad = 1;
    const size = (CH + pad * 2) * px;
    const c = canvasOf(size, size);
    const g = c.getContext("2d");
    g.scale(px, px);
    g.translate(pad - cx * CH, pad - cy * CH);
    const x0 = cx * CH;
    const y0 = cy * CH;
    const x1 = x0 + CH - 1;
    const y1 = y0 + CH - 1;
    const solid = (x, y) => L.tile(x, y) === 1;
    const air = (x, y) => L.tile(x, y) !== 1;
    const pat = texture(g, theme, px) || theme.body;
    const d = 0.16;
    // How deep a tile is below the surface above it (for shading).
    const depth = (x, y) => {
      let k = 0;
      while (k < 4 && solid(x, y - k - 1)) k++;
      return k;
    };
    // Shadows under overhangs and ledges.
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const t = L.tile(x, y);
        if (!t || L.tile(x, y + 1)) continue;
        const top = y + (t === 2 ? 0.3 : 1);
        const gr = g.createLinearGradient(0, top, 0, top + 0.9);
        gr.addColorStop(0, "rgba(20,10,40,0.3)");
        gr.addColorStop(1, "rgba(20,10,40,0)");
        g.fillStyle = gr;
        g.fillRect(x - 0.1, top, 1.2, 0.9);
      }
    }
    // Back faces: depth up and to the right.
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (!solid(x, y)) continue;
        if (solid(x + 1, y - 1) && solid(x, y - 1) && solid(x + 1, y)) continue;
        const gr = g.createLinearGradient(x, y - d, x + d, y);
        gr.addColorStop(0, theme.side);
        gr.addColorStop(1, theme.line);
        g.fillStyle = gr;
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + d, y - d);
        g.lineTo(x + 1 + d, y - d);
        g.lineTo(x + 1 + d, y + 1 - d);
        g.lineTo(x + 1, y + 1);
        g.closePath();
        g.fill();
      }
    }
    // Fronts, with rounded outer corners.
    const R = 0.26;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (!solid(x, y)) continue;
        const up = air(x, y - 1);
        const dn = air(x, y + 1);
        const lf = air(x - 1, y);
        const rt = air(x + 1, y);
        const tl = up && lf ? R : 0;
        const tr = up && rt ? R : 0;
        const br = dn && rt ? R : 0;
        const bl = dn && lf ? R : 0;
        g.fillStyle = pat;
        g.beginPath();
        g.moveTo(x + tl, y);
        g.lineTo(x + 1 - tr, y);
        if (tr) g.quadraticCurveTo(x + 1, y, x + 1, y + tr);
        g.lineTo(x + 1, y + 1 - br);
        if (br) g.quadraticCurveTo(x + 1, y + 1, x + 1 - br, y + 1);
        g.lineTo(x + bl, y + 1);
        if (bl) g.quadraticCurveTo(x, y + 1, x, y + 1 - bl);
        g.lineTo(x, y + tl);
        if (tl) g.quadraticCurveTo(x, y, x + tl, y);
        g.closePath();
        g.fill();
        // Deeper is darker; edges catch the light or fall into shade.
        const k = depth(x, y);
        if (k > 0) {
          g.fillStyle = `rgba(15,8,35,${Math.min(0.32, k * 0.08)})`;
          g.fill();
        }
        if (lf) {
          const gr = g.createLinearGradient(x, 0, x + 0.25, 0);
          gr.addColorStop(0, "rgba(255,255,255,0.22)");
          gr.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = gr;
          g.fillRect(x, y + (up ? 0.25 : 0), 0.25, 1 - (up ? 0.25 : 0) - (dn ? R : 0));
        }
        if (rt) {
          const gr = g.createLinearGradient(x + 0.75, 0, x + 1, 0);
          gr.addColorStop(0, "rgba(0,0,0,0)");
          gr.addColorStop(1, "rgba(0,0,0,0.22)");
          g.fillStyle = gr;
          g.fillRect(x + 0.75, y + (up ? 0.25 : 0), 0.25, 1 - (up ? 0.25 : 0) - (dn ? R : 0));
        }
        if (dn) {
          g.fillStyle = "rgba(0,0,0,0.18)";
          g.fillRect(x + bl, y + 0.88, 1 - bl - br, 0.12);
        }
      }
    }
    // The top surface: a thick lip with a lit edge, and its decorations.
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (!solid(x, y) || solid(x, y - 1)) continue;
        const lf = air(x - 1, y) || solid(x - 1, y - 1);
        const rt = air(x + 1, y) || solid(x + 1, y - 1);
        const ex0 = lf ? x - 0.06 : x;
        const ex1 = rt ? x + 1.06 : x + 1.001;
        const gr = g.createLinearGradient(0, y - 0.02, 0, y + 0.32);
        gr.addColorStop(0, theme.topHi);
        gr.addColorStop(0.35, theme.top);
        gr.addColorStop(1, theme.top);
        g.fillStyle = gr;
        roundRect(g, ex0, y - 0.04, ex1 - ex0, 0.34, lf || rt ? 0.12 : 0);
        g.fill();
        g.fillStyle = "rgba(0,0,0,0.15)";
        g.fillRect(ex0 + 0.04, y + 0.26, ex1 - ex0 - 0.08, 0.06);
        g.fillStyle = "rgba(255,255,255,0.55)";
        g.fillRect(ex0 + 0.08, y - 0.02, ex1 - ex0 - 0.16, 0.04);
        decorate(g, theme, x, y);
      }
    }
    // One-way shelves: planks on brackets.
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (L.tile(x, y) !== 2) continue;
        const startL = L.tile(x - 1, y) !== 2;
        const endR = L.tile(x + 1, y) !== 2;
        g.fillStyle = theme.side;
        g.fillRect(x + d, y - d, 1, 0.3);
        const gr = g.createLinearGradient(0, y, 0, y + 0.3);
        gr.addColorStop(0, theme.topHi);
        gr.addColorStop(1, theme.top);
        g.fillStyle = gr;
        roundRect(g, x - (startL ? 0.05 : 0), y, 1.001 + (startL ? 0.05 : 0) + (endR ? 0.05 : 0), 0.3, startL || endR ? 0.08 : 0);
        g.fill();
        g.fillStyle = "rgba(0,0,0,0.18)";
        g.fillRect(x, y + 0.24, 1.001, 0.06);
        if (startL || endR) {
          const bx = startL ? x + 0.12 : x + 0.75;
          g.fillStyle = theme.line;
          g.beginPath();
          g.moveTo(bx, y + 0.3);
          g.lineTo(bx + 0.13, y + 0.3);
          g.lineTo(bx + 0.13, y + 0.75);
          g.closePath();
          g.fill();
        }
      }
    }
    return c;
  }

  // Little touches on top of the blocks, chosen per tile so they never move.
  function decorate(g, theme, x, y) {
    const h1 = hash(x, y);
    const h2 = hash(x + 17, y * 3);
    const deco = theme.deco;
    if (deco === "grass") {
      g.fillStyle = theme.top;
      g.beginPath();
      for (let k = 0; k < 5; k++) {
        const gx = x + 0.08 + k * 0.2 + h1 * 0.05;
        const hgt = 0.12 + ((k * 7 + Math.floor(h2 * 10)) % 4) * 0.05;
        g.moveTo(gx - 0.05, y + 0.05);
        g.quadraticCurveTo(gx, y - hgt * 0.5, gx + 0.03 + (h1 - 0.5) * 0.1, y - hgt);
        g.quadraticCurveTo(gx + 0.02, y - hgt * 0.4, gx + 0.06, y + 0.05);
      }
      g.fill();
      if (h1 > 0.72) {
        const fx = x + 0.2 + h2 * 0.6;
        g.strokeStyle = theme.top;
        g.lineWidth = 0.03;
        g.beginPath(); g.moveTo(fx, y); g.lineTo(fx, y - 0.28); g.stroke();
        g.fillStyle = ["#ff8fb1", "#ffd23f", "#ffffff", "#9fb8ff"][Math.floor(h2 * 4)];
        for (let k = 0; k < 5; k++) {
          g.beginPath();
          g.arc(fx + Math.cos((k / 5) * TAU) * 0.07, y - 0.3 + Math.sin((k / 5) * TAU) * 0.07, 0.05, 0, TAU);
          g.fill();
        }
        g.fillStyle = "#ffe066";
        g.beginPath(); g.arc(fx, y - 0.3, 0.035, 0, TAU); g.fill();
      } else if (h1 < 0.12) {
        g.fillStyle = "#b9b0a6";
        g.beginPath(); g.ellipse(x + 0.3 + h2 * 0.4, y + 0.02, 0.12, 0.07, 0, Math.PI, TAU); g.fill();
      }
    } else if (deco === "roof") {
      g.fillStyle = "rgba(0,0,0,0.12)";
      for (let k = 0; k < 3; k++) {
        g.beginPath();
        g.arc(x + 0.17 + k * 0.33, y + 0.26, 0.16, 0, Math.PI);
        g.fill();
      }
    } else if (deco === "rug") {
      if (h1 > 0.55) {
        g.strokeStyle = "rgba(255,255,255,0.55)";
        g.lineWidth = 0.025;
        g.beginPath();
        for (let k = 0; k < 6; k++) { g.moveTo(x + 0.08 + k * 0.17, y + 0.3); g.lineTo(x + 0.08 + k * 0.17, y + 0.4); }
        g.stroke();
      }
      if (h2 > 0.9) {
        // A dropped book.
        g.fillStyle = ["#6c8cff", "#ff6b8a", "#7dd87d"][Math.floor(h1 * 3)];
        g.fillRect(x + 0.25, y - 0.12, 0.45, 0.12);
        g.fillStyle = "#fff";
        g.fillRect(x + 0.27, y - 0.1, 0.41, 0.03);
      }
    } else if (deco === "stripes") {
      if (h1 > 0.82) {
        g.fillStyle = "rgba(255,207,63,0.85)";
        for (let k = 0; k < 4; k++) {
          g.beginPath();
          g.moveTo(x + k * 0.25, y + 0.32);
          g.lineTo(x + k * 0.25 + 0.12, y + 0.32);
          g.lineTo(x + k * 0.25 + 0.22, y + 0.04);
          g.lineTo(x + k * 0.25 + 0.1, y + 0.04);
          g.fill();
        }
      } else if (h2 > 0.88) {
        g.fillStyle = "rgba(20,15,40,0.25)";
        g.beginPath(); g.ellipse(x + 0.5, y + 0.02, 0.32, 0.06, 0, 0, TAU); g.fill();
      }
    } else if (deco === "shine") {
      if (h1 > 0.7) {
        g.fillStyle = "rgba(255,255,255,0.7)";
        g.beginPath(); g.ellipse(x + 0.3 + h2 * 0.4, y + 0.12, 0.12, 0.03, 0, 0, TAU); g.fill();
      }
    }
  }

  function drawChunks(theme) {
    const L = world.L;
    const o = camOrigin();
    const vx0 = Math.floor(-o.x / Z) - 1;
    const vx1 = Math.ceil((W - o.x) / Z) + 1;
    const vy0 = Math.floor(-o.y / Z) - 1;
    const vy1 = Math.ceil((H - o.y) / Z) + 1;
    const cx0 = Math.floor(vx0 / CH);
    const cx1 = Math.floor(vx1 / CH);
    const cy0 = Math.floor(Math.max(L.top - 1, vy0) / CH);
    const cy1 = Math.floor(vy1 / CH);
    let built = 0;
    const scale = Z / chunkScale();
    // Bottom row first, left to right: each chunk's depth faces spill up
    // and right, under the chunks drawn after it.
    for (let cy = cy1; cy >= cy0; cy--) {
      for (let cx = cx0; cx <= cx1; cx++) {
        if (cx < -1 || cx * CH > L.w + 2) continue;
        const key = `${cx},${cy}`;
        let c = chunks.get(key);
        if (!c && built < 3) {
          c = buildChunk(theme, cx, cy);
          chunks.set(key, c);
          if (c !== EMPTY) built += 1;
          if (chunks.size > CHUNK_MAX) chunks.delete(chunks.keys().next().value);
        } else if (c) {
          // Keep recently used chunks at the end of the map.
          chunks.delete(key);
          chunks.set(key, c);
        }
        if (c === EMPTY) continue;
        if (c) {
          const sx = o.x + (cx * CH - 1) * Z;
          const sy = o.y + (cy * CH - 1) * Z;
          ctx.drawImage(c, sx, sy, c.width * scale, c.height * scale);
        } else {
          // Not painted yet (a few a frame): plain blocks for now.
          ctx.fillStyle = theme.body;
          for (let y = cy * CH; y < cy * CH + CH; y++) for (let x = cx * CH; x < cx * CH + CH; x++) {
            if (L.tile(x, y) === 1) ctx.fillRect(o.x + x * Z, o.y + y * Z, Z + 0.5, Z + 0.5);
          }
        }
      }
    }
  }

  /* ---------- things in the world (tile units: ctx is translated and scaled) ---------- */
  function drawWater(wtr, theme) {
    const t = world.t;
    const top = wtr.y + 0.3;
    const g = ctx.createLinearGradient(0, top, 0, wtr.y + 1);
    g.addColorStop(0, theme.dark ? "#3a7bd5" : "#6fd0ff");
    g.addColorStop(1, theme.dark ? "#1d3f86" : "#2b7ad1");
    const wave = (x) => top + Math.sin(t * 3 + x * 2.6) * 0.05 + Math.sin(t * 1.7 - x * 4.1) * 0.025;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(wtr.x0, wtr.y + 1);
    for (let x = wtr.x0; x <= wtr.x1 + 0.001; x += 0.2) ctx.lineTo(x, wave(x));
    ctx.lineTo(wtr.x1, wtr.y + 1);
    ctx.closePath();
    ctx.fill();
    // Caustic ripples.
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 0.03;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      for (let x = wtr.x0; x <= wtr.x1; x += 0.2) {
        const y = top + 0.15 + k * 0.17 + Math.sin(t * 2 + x * 5 + k) * 0.04;
        if (x === wtr.x0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.lineWidth = 0.05;
    ctx.beginPath();
    for (let x = wtr.x0; x <= wtr.x1 + 0.001; x += 0.2) {
      if (x === wtr.x0) ctx.moveTo(x, wave(x));
      else ctx.lineTo(x, wave(x));
    }
    ctx.stroke();
    const mx = (wtr.x0 + wtr.x1) / 2;
    // A little warning sign: water and Telly do not mix.
    ctx.fillStyle = "#6b5a40";
    ctx.fillRect(mx - 0.035, wtr.y - 0.66, 0.07, 0.96);
    ctx.fillStyle = "#3b2a10";
    ctx.beginPath();
    ctx.moveTo(mx, wtr.y - 1.26);
    ctx.lineTo(mx + 0.37, wtr.y - 0.62);
    ctx.lineTo(mx - 0.37, wtr.y - 0.62);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffd23f";
    ctx.beginPath();
    ctx.moveTo(mx, wtr.y - 1.18);
    ctx.lineTo(mx + 0.3, wtr.y - 0.67);
    ctx.lineTo(mx - 0.3, wtr.y - 0.67);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#3b2a10";
    ctx.fillRect(mx - 0.03, wtr.y - 1.03, 0.06, 0.2);
    ctx.fillRect(mx - 0.03, wtr.y - 0.78, 0.06, 0.06);
    if (Math.random() < 0.05) emit("drop", wtr.x0 + Math.random() * (wtr.x1 - wtr.x0), top, 1, { speed: 0.6, vy: -1.5 });
  }

  function machineAnchor(m) {
    if (m.x0 !== undefined && m.yDown !== undefined) return { x: (m.x0 + m.x1) / 2, y: m.yDown + 0.3 };
    if (m.x0 !== undefined) return { x: m.x0, y: m.y + 0.2 };
    if (m.y0 !== undefined) return { x: m.x + 0.5, y: m.y1 - 0.2 };
    return { x: m.x, y: m.y };
  }

  // Cables on the back wall from each socket or plate to what it powers.
  function drawWires() {
    const L = world.L;
    const all = [...L.doors, ...L.lifts, ...L.fans, ...L.bridges];
    for (const m of all) {
      if (!m.by) continue;
      const from = m.by.kind === "plate" ? { x: (m.by.x0 + m.by.x1) / 2, y: m.by.y } : { x: m.by.x, y: m.by.y - 0.5 };
      const to = machineAnchor(m);
      const on = powered(m.by);
      const midX = (from.x + to.x) / 2;
      const sag = Math.min(2.5, Math.abs(to.x - from.x) * 0.15) + 0.3;
      const cy = Math.max(from.y, to.y) + sag - 1.2;
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(30,25,50,0.6)";
      ctx.lineWidth = 0.13;
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.quadraticCurveTo(midX, cy, to.x, to.y);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 0.04;
      ctx.stroke();
      if (on) {
        ctx.strokeStyle = "#ffe066";
        ctx.lineWidth = 0.08;
        ctx.setLineDash([0.2, 0.5]);
        ctx.lineDashOffset = -world.t * 3;
        ctx.stroke();
        ctx.setLineDash([]);
        // A spark of current running along it.
        const k = (world.t * 0.8) % 1;
        const x = (1 - k) * (1 - k) * from.x + 2 * (1 - k) * k * midX + k * k * to.x;
        const y = (1 - k) * (1 - k) * from.y + 2 * (1 - k) * k * cy + k * k * to.y;
        worldGlow(x, y, 0.5, "#ffe066", 0.8);
        light(x, y, 1.5, 0.6);
      }
    }
  }

  // A glow in world units (ctx is in tile units).
  function worldGlow(x, y, r, color, a) {
    glow(x, y, r, color, a);
  }

  function drawSocket(s) {
    const on = powered(s);
    const x = s.x;
    const y = s.y;
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.beginPath();
    ctx.ellipse(x, y, 0.55, 0.1, 0, 0, TAU);
    ctx.fill();
    // A little charging post, a box with depth.
    ctx.fillStyle = "#353954";
    roundRect(ctx, x - 0.32, y - 1.25, 0.84, 1.25, 0.14);
    ctx.fill();
    const bg = ctx.createLinearGradient(x - 0.42, 0, x + 0.42, 0);
    bg.addColorStop(0, "#727aa3");
    bg.addColorStop(1, "#4b5175");
    ctx.fillStyle = bg;
    roundRect(ctx, x - 0.42, y - 1.15, 0.78, 1.15, 0.14);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    roundRect(ctx, x - 0.36, y - 1.1, 0.66, 0.08, 0.04);
    ctx.fill();
    ctx.fillStyle = "#f4f2ff";
    roundRect(ctx, x - 0.3, y - 1.0, 0.5, 0.55, 0.1);
    ctx.fill();
    ctx.fillStyle = "#3d3756";
    ctx.fillRect(x - 0.17, y - 0.86, 0.06, 0.18);
    ctx.fillRect(x + 0.02, y - 0.86, 0.06, 0.18);
    ctx.beginPath();
    ctx.arc(x - 0.05, y - 0.58, 0.04, 0, TAU);
    ctx.fill();
    ctx.fillStyle = on ? "#5dff9a" : "#ff6b6b";
    ctx.beginPath();
    ctx.arc(x - 0.05, y - 0.27, 0.09, 0, TAU);
    ctx.fill();
    worldGlow(x - 0.05, y - 0.27, on ? 0.7 : 0.35, on ? "#5dff9a" : "#ff6b6b", on ? 0.6 : 0.3);
    light(x - 0.05, y - 0.5, on ? 2.4 : 1.2, on ? 0.9 : 0.4);
    if (s.left > 0 && s.time > 0) {
      ctx.strokeStyle = "rgba(0,0,0,0.25)";
      ctx.lineWidth = 0.1;
      ctx.beginPath();
      ctx.arc(x - 0.05, y - 1.6, 0.26, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = s.left < 1.6 && Math.floor(world.t * 6) % 2 ? "#ff6b6b" : "#ffe066";
      ctx.lineWidth = 0.09;
      ctx.beginPath();
      ctx.arc(x - 0.05, y - 1.6, 0.26, -Math.PI / 2, -Math.PI / 2 + TAU * (s.left / s.time));
      ctx.stroke();
    }
    if (s.time > 0 && !on) {
      // Text in screen pixels: tiny fonts scaled up render poorly.
      ctx.save();
      ctx.scale(1 / Z, 1 / Z);
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.strokeStyle = "rgba(30,20,60,0.5)";
      ctx.lineWidth = 3;
      ctx.font = `bold ${Math.round(Z * 0.34)}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.strokeText(`${Math.round(s.time)}s`, (x - 0.05) * Z, (y - 1.4) * Z);
      ctx.fillText(`${Math.round(s.time)}s`, (x - 0.05) * Z, (y - 1.4) * Z);
      ctx.restore();
    }
    if (!on && nearSocket() === s && !world.plug) worldGlow(x - 0.05, y - 0.7, 1.2, "#fff3a0", 0.35 + 0.15 * Math.sin(world.t * 6));
  }

  function drawExit(e) {
    const x = e.x;
    const y = e.y;
    const pulse = 0.5 + 0.5 * Math.sin(world.t * 3);
    worldGlow(x - 0.1, y - 1.3, 2.4 + pulse * 0.3, "#ffe58a", 0.45);
    light(x, y - 1.3, 5, 1);
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath();
    ctx.ellipse(x, y, 0.85, 0.14, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#a8780a";
    roundRect(ctx, x - 0.5, y - 2.4, 1.24, 2.4, 0.22);
    ctx.fill();
    const g = ctx.createLinearGradient(x - 0.6, 0, x + 0.5, 0);
    g.addColorStop(0, "#fff0a0");
    g.addColorStop(0.5, "#ffd24a");
    g.addColorStop(1, "#e9a21c");
    ctx.fillStyle = g;
    roundRect(ctx, x - 0.62, y - 2.3, 1.06, 2.3, 0.2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    roundRect(ctx, x - 0.55, y - 2.24, 0.12, 2.1, 0.06);
    ctx.fill();
    ctx.fillStyle = "#fffaf0";
    roundRect(ctx, x - 0.42, y - 1.75, 0.66, 0.85, 0.12);
    ctx.fill();
    ctx.fillStyle = "#5b4a1a";
    ctx.fillRect(x - 0.25, y - 1.55, 0.07, 0.22);
    ctx.fillRect(x + 0.0, y - 1.55, 0.07, 0.22);
    ctx.beginPath();
    ctx.arc(x - 0.09, y - 1.17, 0.05, 0, TAU);
    ctx.fill();
    ctx.save();
    ctx.translate(x - 0.09, y - 2.02);
    ctx.rotate(world.t * 0.8);
    ctx.fillStyle = "#fff";
    FK.starPath(ctx, 0, 0, 0.17 + pulse * 0.03, 0.08, 5);
    ctx.fill();
    ctx.restore();
  }

  function drawDoor(d) {
    const h = (d.y1 - d.y0) * (1 - d.open);
    const x = d.x + 0.08;
    ctx.fillStyle = "rgba(20,15,40,0.35)";
    ctx.fillRect(d.x, d.y0, 1, d.y1 - d.y0);
    // Rails either side.
    ctx.fillStyle = "#3b3f55";
    ctx.fillRect(d.x - 0.05, d.y0, 0.12, d.y1 - d.y0);
    ctx.fillRect(d.x + 0.93, d.y0, 0.12, d.y1 - d.y0);
    if (h > 0.02) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, d.y0, 0.84, h);
      ctx.clip();
      const g = ctx.createLinearGradient(x, 0, x + 0.84, 0);
      g.addColorStop(0, "#737b99");
      g.addColorStop(1, "#4f5570");
      ctx.fillStyle = g;
      ctx.fillRect(x, d.y0, 0.84, h);
      ctx.fillStyle = "#ffcf3f";
      for (let yy = d.y0 + h - 1.1; yy > d.y0 - 1; yy -= 0.7) {
        ctx.beginPath();
        ctx.moveTo(x, yy);
        ctx.lineTo(x + 0.84, yy - 0.35);
        ctx.lineTo(x + 0.84, yy - 0.05);
        ctx.lineTo(x, yy + 0.3);
        ctx.fill();
      }
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(x + 0.05, d.y0, 0.08, h);
      ctx.fillStyle = "#2f3346";
      ctx.fillRect(x, d.y0 + h - 0.6, 0.84, 0.6);
      const on = powered(d.by);
      ctx.fillStyle = on ? "#5dff9a" : "#ff6b6b";
      ctx.beginPath();
      ctx.arc(x + 0.42, d.y0 + h - 0.3, 0.11, 0, TAU);
      ctx.fill();
      ctx.restore();
      worldGlow(x + 0.42, d.y0 + h - 0.3, 0.5, on ? "#5dff9a" : "#ff6b6b", 0.5);
      light(x + 0.42, d.y0 + h - 0.3, 1.2, 0.5);
    }
  }

  function drawLift(lf) {
    const w = lf.x1 - lf.x0;
    ctx.strokeStyle = "#596073";
    ctx.lineWidth = 0.1;
    const base = lf.yDown + 0.45;
    const span = base - (lf.y + 0.45);
    if (span > 0.05) {
      const n = Math.max(1, Math.ceil(span / 1.2));
      const segH = span / n;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const yTop = lf.y + 0.45 + i * segH;
        ctx.moveTo(lf.x0 + 0.3, yTop);
        ctx.lineTo(lf.x1 - 0.3, yTop + segH);
        ctx.moveTo(lf.x1 - 0.3, yTop);
        ctx.lineTo(lf.x0 + 0.3, yTop + segH);
      }
      ctx.stroke();
      ctx.fillStyle = "#3b3f55";
      for (let i = 0; i <= n; i++) {
        const yy = lf.y + 0.45 + i * segH;
        ctx.beginPath(); ctx.arc(lf.x0 + 0.3, yy, 0.07, 0, TAU); ctx.arc(lf.x1 - 0.3, yy, 0.07, 0, TAU); ctx.fill();
      }
    }
    ctx.fillStyle = "#3b3f55";
    ctx.fillRect(lf.x0 + 0.12, lf.y - 0.1, w, 0.45);
    ctx.fillStyle = "#ffcf3f";
    ctx.fillRect(lf.x0, lf.y, w, 0.45);
    ctx.fillStyle = "#2f3346";
    for (let x = lf.x0 + 0.1; x < lf.x1 - 0.1; x += 0.5) {
      ctx.beginPath();
      ctx.moveTo(x, lf.y + 0.45);
      ctx.lineTo(x + 0.25, lf.y + 0.1);
      ctx.lineTo(x + 0.45, lf.y + 0.1);
      ctx.lineTo(x + 0.2, lf.y + 0.45);
      ctx.fill();
    }
    ctx.fillStyle = "#e9ecf5";
    ctx.fillRect(lf.x0, lf.y, w, 0.1);
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillRect(lf.x0, lf.y, w, 0.03);
    if (powered(lf.by)) {
      ctx.fillStyle = "#5dff9a";
      for (const lx of [lf.x0 + 0.15, lf.x1 - 0.15]) {
        ctx.beginPath(); ctx.arc(lx, lf.y + 0.27, 0.06, 0, TAU); ctx.fill();
        worldGlow(lx, lf.y + 0.27, 0.4, "#5dff9a", 0.6);
      }
    }
  }

  function drawFan(f) {
    const x = f.x;
    const y = f.y;
    if (f.spin > 0.05) {
      const g = ctx.createLinearGradient(0, y, 0, y - f.h);
      g.addColorStop(0, `rgba(200,240,255,${0.3 * f.spin})`);
      g.addColorStop(1, "rgba(200,240,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x - 0.85, y);
      ctx.lineTo(x + 0.85, y);
      ctx.lineTo(x + 1.05, y - f.h);
      ctx.lineTo(x - 1.05, y - f.h);
      ctx.fill();
    }
    ctx.strokeStyle = "rgba(255,255,255,0.75)";
    ctx.lineWidth = 0.05;
    ctx.lineCap = "round";
    for (const s of world.wind) {
      if (Math.abs(s.x - x) > 1.2) continue;
      const wob = Math.sin(s.y * 2 + s.x * 5) * 0.08;
      ctx.beginPath();
      ctx.moveTo(s.x + wob, s.y);
      ctx.lineTo(s.x - wob, s.y + s.len);
      ctx.stroke();
    }
    ctx.fillStyle = "#2f3346";
    ctx.beginPath();
    ctx.ellipse(x, y + 0.02, 0.9, 0.22, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#3b3f55";
    ctx.beginPath();
    ctx.ellipse(x, y, 0.78, 0.17, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#a9b2d6";
    for (let k = 0; k < 5; k++) {
      const a = f.a + (k * TAU) / 5;
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(a) * 0.36, y + Math.sin(a) * 0.075, 0.3, 0.055, 0, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = "#e9ecf5";
    ctx.beginPath();
    ctx.ellipse(x, y, 0.1, 0.04, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = "#596073";
    ctx.lineWidth = 0.05;
    ctx.beginPath();
    for (let k = -3; k <= 3; k++) {
      ctx.moveTo(x + k * 0.22, y - 0.16 * Math.sqrt(Math.max(0, 1 - (k * 0.22 / 0.78) ** 2)));
      ctx.lineTo(x + k * 0.22, y + 0.16 * Math.sqrt(Math.max(0, 1 - (k * 0.22 / 0.78) ** 2)));
    }
    ctx.stroke();
    if (f.spin > 0.3) light(x, y - 1, 2, 0.5 * f.spin);
  }

  function drawBridge(br) {
    const rc = bridgeRect(br);
    ctx.fillStyle = "#4b5175";
    roundRect(ctx, br.x0 - 0.45, br.y - 0.2, 0.55, 0.8, 0.1);
    ctx.fill();
    ctx.fillStyle = powered(br.by) ? "#5dff9a" : "#ff6b6b";
    ctx.beginPath(); ctx.arc(br.x0 - 0.18, br.y + 0.2, 0.07, 0, TAU); ctx.fill();
    if (!rc) return;
    for (let x = rc.x; x < rc.x + rc.w - 0.01; x += 0.5) {
      const ww = Math.min(0.46, rc.x + rc.w - x);
      ctx.fillStyle = "#7a5a3a";
      ctx.fillRect(x + 0.1, br.y - 0.1, ww, 0.4);
      const g = ctx.createLinearGradient(0, br.y, 0, br.y + 0.4);
      g.addColorStop(0, "#e2b27c");
      g.addColorStop(1, "#b07c4c");
      ctx.fillStyle = g;
      ctx.fillRect(x, br.y, ww, 0.4);
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.fillRect(x, br.y, ww, 0.05);
      ctx.fillStyle = "#6b4a2a";
      ctx.beginPath(); ctx.arc(x + 0.08, br.y + 0.2, 0.03, 0, TAU); ctx.arc(x + ww - 0.08, br.y + 0.2, 0.03, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = "rgba(20,10,40,0.2)";
    ctx.fillRect(rc.x, br.y + 0.4, rc.w, 0.25);
  }

  function drawPlate(pl) {
    const dpt = pl.depth * 0.12;
    ctx.fillStyle = "#2f3346";
    roundRect(ctx, pl.x0 - 0.08, pl.y - 0.1, pl.x1 - pl.x0 + 0.16, 0.14, 0.05);
    ctx.fill();
    const g = ctx.createLinearGradient(0, pl.y - 0.22, 0, pl.y - 0.06);
    g.addColorStop(0, pl.pressed ? "#9dffc4" : "#ffb08a");
    g.addColorStop(1, pl.pressed ? "#3fd27a" : "#e9643a");
    ctx.fillStyle = g;
    roundRect(ctx, pl.x0 + 0.06, pl.y - 0.22 + dpt, pl.x1 - pl.x0 - 0.12, 0.16, 0.05);
    ctx.fill();
    if (pl.pressed) {
      worldGlow((pl.x0 + pl.x1) / 2, pl.y - 0.1, 1, "#5dff9a", 0.45);
      light((pl.x0 + pl.x1) / 2, pl.y - 0.3, 1.6, 0.6);
    }
  }

  function drawCrate(c) {
    const x = c.x - c.w / 2;
    const y = c.y - c.h;
    drawShadowAt(c.x, c.y, 0.55);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.tilt);
    ctx.translate(-c.x, -c.y);
    ctx.fillStyle = "#7a4a22";
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 0.14, y - 0.14);
    ctx.lineTo(x + c.w + 0.14, y - 0.14);
    ctx.lineTo(x + c.w + 0.14, y + c.h - 0.14);
    ctx.lineTo(x + c.w, y + c.h);
    ctx.closePath();
    ctx.fill();
    const g = ctx.createLinearGradient(x, y, x + c.w, y + c.h);
    g.addColorStop(0, "#e0a568");
    g.addColorStop(1, "#b77a40");
    ctx.fillStyle = g;
    ctx.fillRect(x, y, c.w, c.h);
    ctx.strokeStyle = "#7a4a22";
    ctx.lineWidth = 0.09;
    ctx.strokeRect(x + 0.05, y + 0.05, c.w - 0.1, c.h - 0.1);
    ctx.lineWidth = 0.08;
    ctx.beginPath();
    ctx.moveTo(x + 0.12, y + 0.12);
    ctx.lineTo(x + c.w - 0.12, y + c.h - 0.12);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 0.03;
    ctx.beginPath();
    for (let k = 1; k < 4; k++) { ctx.moveTo(x + 0.1, y + k * 0.24); ctx.lineTo(x + c.w - 0.1, y + k * 0.24); }
    ctx.stroke();
    ctx.fillStyle = "#5a3a1a";
    for (const [px, py] of [[0.12, 0.12], [c.w - 0.12, 0.12], [0.12, c.h - 0.12], [c.w - 0.12, c.h - 0.12]]) {
      ctx.beginPath(); ctx.arc(x + px, y + py, 0.035, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(x, y, c.w, 0.06);
    ctx.restore();
  }

  function drawSparker(sp) {
    const x = sp.x + 0.5;
    const y = sp.y;
    ctx.fillStyle = "#2f3346";
    roundRect(ctx, x - 0.28, y - 0.5, 0.56, 0.5, 0.1);
    ctx.fill();
    ctx.fillStyle = "#596073";
    roundRect(ctx, x - 0.12, y - 0.85, 0.24, 0.4, 0.05);
    ctx.fill();
    for (let k = 0; k < 3; k++) {
      ctx.fillStyle = "#c78a3a";
      roundRect(ctx, x - 0.18, y - 0.82 + k * 0.12, 0.36, 0.06, 0.03);
      ctx.fill();
    }
    const g = ctx.createRadialGradient(x - 0.05, y - 1.0, 0, x, y - 0.95, 0.2);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(1, sp.active ? "#7fd6ff" : "#9aa3c7");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y - 0.95, 0.18, 0, TAU);
    ctx.fill();
    if (sp.warn) {
      worldGlow(x, y - 0.95, 0.7, "#7fd6ff", 0.3 + 0.3 * Math.sin(world.t * 30));
      light(x, y - 1, 1.2, 0.4);
    }
    if (!sp.active) return;
    worldGlow(x, y - 0.95 - sp.h / 3, 2, "#7fd6ff", 0.5);
    light(x, y - 1.5, 3.5, 1);
    ctx.strokeStyle = "#e9fbff";
    ctx.lineCap = "round";
    for (let k = 0; k < 3; k++) {
      ctx.lineWidth = k ? 0.04 : 0.08;
      ctx.beginPath();
      ctx.moveTo(x, y - 1.05);
      const r = rngFn(Math.floor(world.t * 24) + k * 99);
      for (let yy = y - 1.05; yy > y - sp.h - 0.3; yy -= 0.25) ctx.lineTo(x + (r() - 0.5) * (0.4 + k * 0.2), yy);
      ctx.stroke();
    }
  }

  function drawSpring(s) {
    const sq = 1 - Math.max(0, s.squash) * 0.3;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.scale(1, sq);
    ctx.fillStyle = "#23263a";
    roundRect(ctx, -0.32, -0.78, 0.84, 0.78, 0.14);
    ctx.fill();
    const g = ctx.createLinearGradient(-0.42, 0, 0.42, 0);
    g.addColorStop(0, "#4b5175");
    g.addColorStop(1, "#33374e");
    ctx.fillStyle = g;
    roundRect(ctx, -0.42, -0.72, 0.84, 0.72, 0.14);
    ctx.fill();
    const cone = ctx.createRadialGradient(-0.06, -0.42, 0.02, 0, -0.36, 0.28);
    cone.addColorStop(0, "#e8ecff");
    cone.addColorStop(1, "#8a93bb");
    ctx.fillStyle = cone;
    ctx.beginPath();
    ctx.arc(0, -0.36, 0.27 + Math.max(0, s.squash) * 0.04, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#33374e";
    ctx.beginPath();
    ctx.arc(0, -0.36, 0.1, 0, TAU);
    ctx.fill();
    ctx.restore();
    if (s.squash > 0) worldGlow(s.x, s.y - 0.6, 1, "#ffe066", s.squash * 0.5);
  }

  function drawPad(pad) {
    ctx.fillStyle = "#2f3346";
    roundRect(ctx, pad.x - 0.5, pad.y - 0.16, 1, 0.16, 0.07);
    ctx.fill();
    ctx.fillStyle = pad.on ? "#5dff9a" : "#8b90ad";
    roundRect(ctx, pad.x - 0.4, pad.y - 0.2, 0.8, 0.06, 0.03);
    ctx.fill();
    ctx.fillStyle = "#4b5175";
    ctx.fillRect(pad.x - 0.04, pad.y - 0.6, 0.08, 0.45);
    ctx.fillStyle = pad.on ? "#5dff9a" : "#c8cbe0";
    ctx.beginPath();
    ctx.arc(pad.x, pad.y - 0.66, 0.13, 0, TAU);
    ctx.fill();
    if (pad.on) {
      worldGlow(pad.x, pad.y - 0.66, 0.7, "#5dff9a", 0.4 + 0.2 * Math.sin(world.t * 5));
      light(pad.x, pad.y - 0.6, 1.6, 0.7);
    }
  }

  function drawHook(h, target) {
    const hp = hookPos(h, world.t);
    if (h.ax || h.ay) {
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.setLineDash([0.12, 0.12]);
      ctx.lineWidth = 0.04;
      ctx.beginPath();
      ctx.moveTo(h.bx - h.ax, h.by - h.ay);
      ctx.lineTo(h.bx + h.ax, h.by + h.ay);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // A short chain up to a ceiling we cannot see.
    ctx.strokeStyle = "rgba(60,64,90,0.7)";
    ctx.lineWidth = 0.05;
    for (let k = 0; k < 5; k++) {
      ctx.beginPath();
      ctx.ellipse(hp.x, hp.y - 0.32 - k * 0.2, 0.04, 0.09, 0, 0, TAU);
      ctx.stroke();
    }
    if (target) {
      worldGlow(hp.x, hp.y, 1, "#ffe066", 0.6);
      ctx.strokeStyle = "rgba(255,230,90,0.9)";
      ctx.lineWidth = 0.07;
      ctx.setLineDash([0.18, 0.12]);
      ctx.lineDashOffset = -world.t * 2;
      ctx.beginPath();
      ctx.arc(hp.x, hp.y, 0.5 + 0.06 * Math.sin(world.t * 8), 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    light(hp.x, hp.y, target ? 1.6 : 0.8, target ? 0.8 : 0.3);
    const g = ctx.createRadialGradient(hp.x - 0.08, hp.y - 0.08, 0.02, hp.x, hp.y, 0.26);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(1, "#b8c0d8");
    ctx.fillStyle = g;
    ctx.strokeStyle = "#4c5670";
    ctx.lineWidth = 0.08;
    ctx.beginPath();
    ctx.arc(hp.x, hp.y, 0.23, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#4c5670";
    ctx.beginPath();
    ctx.arc(hp.x, hp.y, 0.08, 0, TAU);
    ctx.fill();
  }

  function bolt(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x + s * 0.12, y - s * 0.5);
    ctx.lineTo(x - s * 0.28, y + s * 0.06);
    ctx.lineTo(x - s * 0.02, y + s * 0.06);
    ctx.lineTo(x - s * 0.14, y + s * 0.5);
    ctx.lineTo(x + s * 0.3, y - s * 0.1);
    ctx.lineTo(x + s * 0.04, y - s * 0.1);
    ctx.closePath();
  }

  function drawSpark(s) {
    if (s.got) return;
    const y = s.y + Math.sin(world.t * 3 + s.x) * 0.08;
    const spin = Math.cos(world.t * 2.4 + s.x);
    worldGlow(s.x, y, 0.65, "#ffd23f", 0.5);
    light(s.x, y, 1.1, 0.5);
    ctx.save();
    ctx.translate(s.x, y);
    ctx.scale(0.4 + Math.abs(spin) * 0.6, 1);
    ctx.fillStyle = spin > 0 ? "#ffe066" : "#ffcf3f";
    ctx.strokeStyle = "#e08a10";
    ctx.lineWidth = 0.05;
    bolt(0, 0, 0.62);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    bolt(-0.03, -0.05, 0.3);
    ctx.fill();
    ctx.restore();
  }

  function drawCell(cell) {
    if (cell.got) return;
    const y = cell.y + Math.sin(world.t * 2.5 + cell.x) * 0.1;
    worldGlow(cell.x, y, 1, "#7dffb0", 0.55);
    light(cell.x, y, 1.8, 0.8);
    ctx.save();
    ctx.translate(cell.x, y);
    ctx.rotate(Math.sin(world.t * 1.8 + cell.x) * 0.12);
    ctx.fillStyle = "#1f8048";
    roundRect(ctx, -0.18, -0.36, 0.48, 0.66, 0.09);
    ctx.fill();
    const g = ctx.createLinearGradient(-0.24, 0, 0.2, 0);
    g.addColorStop(0, "#8dffbe");
    g.addColorStop(0.4, "#3ccf7a");
    g.addColorStop(1, "#24a35c");
    ctx.fillStyle = g;
    roundRect(ctx, -0.24, -0.32, 0.44, 0.64, 0.09);
    ctx.fill();
    ctx.fillStyle = "#c9d2d8";
    roundRect(ctx, -0.12, -0.43, 0.2, 0.13, 0.03);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    bolt(-0.02, 0, 0.36);
    ctx.fill();
    ctx.restore();
  }

  function drawPlug(x, y, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = "#23263a";
    roundRect(ctx, -0.2, -0.13, 0.32, 0.26, 0.07);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.2)";
    roundRect(ctx, -0.17, -0.11, 0.26, 0.06, 0.03);
    ctx.fill();
    ctx.fillStyle = "#e3c56a";
    ctx.fillRect(0.12, -0.09, 0.14, 0.05);
    ctx.fillRect(0.12, 0.04, 0.14, 0.05);
    ctx.restore();
  }

  function strokePath(pts, ox, oy) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x + ox, pts[0].y + oy);
    if (pts.length === 2) {
      ctx.lineTo(pts[1].x + ox, pts[1].y + oy);
      return;
    }
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2;
      const my = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x + ox, pts[i].y + oy, mx + ox, my + oy);
    }
    ctx.lineTo(pts[pts.length - 1].x + ox, pts[pts.length - 1].y + oy);
  }

  function drawCord(px, py) {
    const w = world;
    const a = cordAnchor(px, py, w.p.dir);
    let pts;
    let straight = false;
    if (w.rope) {
      pts = ropePath(a.x, a.y);
      straight = true;
    } else {
      pts = w.cord.slice();
      pts[0] = a;
    }
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const taut = w.rope ? 1 : 0;
    const draw = straight
      ? (ox, oy) => {
          ctx.beginPath();
          ctx.moveTo(pts[0].x + ox, pts[0].y + oy);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x + ox, pts[i].y + oy);
        }
      : (ox, oy) => strokePath(pts, ox, oy);
    ctx.strokeStyle = "rgba(10,5,25,0.25)";
    ctx.lineWidth = 0.16;
    draw(0.05, 0.07);
    ctx.stroke();
    ctx.strokeStyle = "#1a1d2c";
    ctx.lineWidth = 0.14;
    draw(0, 0);
    ctx.stroke();
    ctx.strokeStyle = taut ? "#5a6188" : "#41476a";
    ctx.lineWidth = 0.07;
    draw(0, 0);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.28)";
    ctx.lineWidth = 0.025;
    draw(-0.025, -0.025);
    ctx.stroke();
    const r = w.rope;
    if (r) {
      const hp = hookPos(r.hook, w.t);
      ctx.strokeStyle = "#1a1d2c";
      ctx.lineWidth = 0.08;
      for (let i = 0; i < Math.min(r.wraps, 5); i++) {
        ctx.beginPath();
        ctx.arc(hp.x, hp.y, 0.27 + i * 0.07, 0, TAU);
        ctx.stroke();
      }
      for (const k of r.pivots) worldGlow(k.x, k.y, 0.35, "#ffe066", 0.35);
      const last = pts[pts.length - 1];
      const prev = pts[pts.length - 2];
      drawPlug(last.x, last.y, Math.atan2(last.y - prev.y, last.x - prev.x));
      return;
    }
    const end = pts[pts.length - 1];
    const prev = pts[pts.length - 3];
    drawPlug(end.x, end.y, Math.atan2(end.y - prev.y, end.x - prev.x));
  }

  function drawShadowAt(x, y, size) {
    const fy = floorBelow(x, y - 0.05, 8);
    if (fy === null) return;
    const dist = fy - y;
    const a = clamp(0.32 - dist * 0.04, 0.05, 0.32);
    const s = size * clamp(1 - dist * 0.06, 0.5, 1);
    ctx.fillStyle = `rgba(20,10,40,${a})`;
    ctx.beginPath();
    ctx.ellipse(x, fy, s, s * 0.22, 0, 0, TAU);
    ctx.fill();
  }

  function drawTellyAt(x, y, tilt, dir, sy, ghost) {
    const w = world;
    const p = w.p;
    const s = 1.05;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    const sx = 1 + (1 - sy) * 0.9;
    ctx.translate(0, -s * 0.46 * sy);
    ctx.scale(sx * dir, sy);
    if (ghost) {
      ctx.fillStyle = "#ffd7a8";
      roundRect(ctx, -0.55, -0.42, 1.1, 0.84, 0.2);
      ctx.fill();
      ctx.restore();
      return;
    }
    // Little legs, stepping as Telly rolls.
    const moving = p.ground && Math.abs(p.vx) > 0.3;
    const ph = p.walk * 2.2;
    for (const [lx, o] of [[-0.2, 0], [0.2, Math.PI]]) {
      const lift = moving ? Math.max(0, Math.sin(ph + o)) * 0.1 : 0;
      const swing = moving ? Math.cos(ph + o) * 0.12 : !p.ground ? 0.08 * Math.sin(w.t * 12 + o) : 0;
      ctx.strokeStyle = "#2b2e44";
      ctx.lineWidth = 0.1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(lx, 0.34);
      ctx.lineTo(lx + swing, 0.45 - lift);
      ctx.stroke();
      ctx.fillStyle = "#2b2e44";
      ctx.beginPath();
      ctx.ellipse(lx + swing + 0.05, 0.47 - lift, 0.13, 0.065, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "#ff6b8a";
      ctx.fillRect(lx + swing - 0.07, 0.49 - lift, 0.24, 0.03);
    }
    // Antennae on springs, with shiny balls.
    ctx.strokeStyle = "#2b2e44";
    ctx.lineWidth = 0.045;
    const tips = [[-0.1, -0.4, -0.3, -0.8, p.ant[0], "#ff6b8a"], [0.1, -0.4, 0.33, -0.78, p.ant[1], "#ffd93d"]];
    for (const [bx, by, tx, ty, a, col] of tips) {
      const ex = bx + (tx - bx) * Math.cos(a) - (ty - by) * Math.sin(a);
      const ey = by + (tx - bx) * Math.sin(a) + (ty - by) * Math.cos(a);
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo((bx + ex) / 2 - a * 0.12, (by + ey) / 2, ex, ey);
      ctx.stroke();
      const bg = ctx.createRadialGradient(ex - 0.02, ey - 0.02, 0.005, ex, ey, 0.075);
      bg.addColorStop(0, "#ffffff");
      bg.addColorStop(0.4, col);
      bg.addColorStop(1, col);
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(ex, ey, 0.075, 0, TAU);
      ctx.fill();
    }
    // Body: the side panel for depth, then the front.
    ctx.fillStyle = "#b5520c";
    roundRect(ctx, -0.64, -0.49, 1.1, 0.84, 0.2);
    ctx.fill();
    const bg = ctx.createLinearGradient(-0.55, -0.42, 0.4, 0.42);
    bg.addColorStop(0, "#ffc47a");
    bg.addColorStop(0.5, "#ff9a3c");
    bg.addColorStop(1, "#e8701a");
    ctx.fillStyle = bg;
    roundRect(ctx, -0.55, -0.42, 1.1, 0.84, 0.2);
    ctx.fill();
    ctx.strokeStyle = "#b85a0e";
    ctx.lineWidth = 0.04;
    ctx.stroke();
    // A shine along the top and a rim along the bottom.
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    roundRect(ctx, -0.46, -0.38, 0.86, 0.07, 0.035);
    ctx.fill();
    ctx.fillStyle = "rgba(120,40,0,0.25)";
    roundRect(ctx, -0.46, 0.32, 0.92, 0.06, 0.03);
    ctx.fill();
    // Knobs and speaker grille.
    for (const ky of [-0.18, -0.01]) {
      const kg = ctx.createRadialGradient(0.38, ky - 0.02, 0.005, 0.4, ky, 0.06);
      kg.addColorStop(0, "#ffffff");
      kg.addColorStop(1, "#e9c39a");
      ctx.fillStyle = kg;
      ctx.beginPath();
      ctx.arc(0.4, ky, 0.058, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "#b85a0e";
      ctx.lineWidth = 0.015;
      ctx.beginPath();
      ctx.moveTo(0.4, ky);
      ctx.lineTo(0.4 + Math.cos(w.t + ky * 9) * 0.045, ky + Math.sin(w.t + ky * 9) * 0.045);
      ctx.stroke();
    }
    ctx.fillStyle = "#b85a0e";
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        ctx.beginPath();
        ctx.arc(0.33 + j * 0.07, 0.12 + i * 0.07, 0.017, 0, TAU);
        ctx.fill();
      }
    }
    // The screen: an inset bezel, then glass with scanlines and a glare.
    const glowing = w.finishing > 0 || (w.plug && w.plug.done);
    ctx.fillStyle = "#3a2410";
    roundRect(ctx, -0.47, -0.34, 0.76, 0.68, 0.16);
    ctx.fill();
    const sg = ctx.createRadialGradient(-0.12, -0.05, 0.05, -0.09, 0, 0.45);
    sg.addColorStop(0, glowing ? "#e9fdff" : "#4c6aa3");
    sg.addColorStop(1, glowing ? "#7fe0ff" : "#1a2340");
    ctx.fillStyle = sg;
    roundRect(ctx, -0.44, -0.31, 0.7, 0.62, 0.14);
    ctx.fill();
    ctx.save();
    roundRect(ctx, -0.44, -0.31, 0.7, 0.62, 0.14);
    ctx.clip();
    ctx.fillStyle = glowing ? "rgba(255,255,255,0.12)" : "rgba(140,190,255,0.09)";
    const scroll = (w.t * 0.4) % 0.07;
    for (let yy = -0.31 + scroll; yy < 0.31; yy += 0.07) ctx.fillRect(-0.44, yy, 0.7, 0.025);
    drawFace(glowing);
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    ctx.beginPath();
    ctx.moveTo(-0.44, -0.31);
    ctx.lineTo(-0.12, -0.31);
    ctx.lineTo(-0.34, 0.31);
    ctx.lineTo(-0.44, 0.31);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.ellipse(0.12, -0.22, 0.09, 0.035, -0.3, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  function drawTelly(px, py) {
    const w = world;
    const p = w.p;
    if (w.invuln > 0 && Math.floor(w.invuln * 12) % 2 === 0) return;
    drawShadowAt(px, py, 0.5);
    for (const g of w.ghosts) {
      ctx.globalAlpha = (g.life / 0.25) * 0.25;
      drawTellyAt(g.x, g.y, g.tilt, g.dir, 1, true);
    }
    ctx.globalAlpha = 1;
    drawTellyAt(px, py, p.tilt, p.dir, p.sy, false);
    const glowing = w.finishing > 0 || (w.plug && w.plug.done);
    const c = { x: px - p.dir * 0.09, y: py - 0.46 };
    worldGlow(c.x, c.y, glowing ? 1.6 : 0.9, glowing ? "#7fe0ff" : "#6f9bff", glowing ? 0.6 : 0.22);
    light(c.x, c.y, glowing ? 5 : 3.6, 1);
  }

  function drawFace(glowing) {
    const w = world;
    const p = w.p;
    const s = 1.05;
    const fx = -s * 0.09;
    const fy = 0;
    const ink = glowing ? "#1c2640" : "#ffffff";
    const speed = Math.hypot(p.vx, p.vy);
    let face = p.face;
    if (face !== "zap" && face !== "love") {
      if (p.worried) face = "worried";
      else if (w.rope && speed > 9) face = "whee";
      else if (p.pushing) face = "push";
      else if (!p.ground && p.vy > 8) face = "oh";
      else face = "happy";
    }
    ctx.fillStyle = ink;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 0.04;
    ctx.lineCap = "round";
    if (face === "zap") {
      for (const ex of [-0.12, 0.12]) {
        ctx.beginPath();
        ctx.moveTo(fx + s * (ex - 0.05), fy - s * 0.12);
        ctx.lineTo(fx + s * (ex + 0.05), fy - s * 0.02);
        ctx.moveTo(fx + s * (ex + 0.05), fy - s * 0.12);
        ctx.lineTo(fx + s * (ex - 0.05), fy - s * 0.02);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(fx - s * 0.08, fy + s * 0.12);
      for (let i = 1; i <= 4; i++) ctx.lineTo(fx - s * 0.08 + i * s * 0.04, fy + s * (i % 2 ? 0.08 : 0.12));
      ctx.stroke();
      return;
    }
    if (face === "love") {
      for (const ex of [-0.12, 0.12]) {
        const hx = fx + s * ex;
        const hy = fy - s * 0.07;
        const beat = 1 + Math.sin(w.t * 12) * 0.12;
        ctx.fillStyle = "#ff5c8a";
        ctx.beginPath();
        ctx.moveTo(hx, hy + s * 0.05 * beat);
        ctx.bezierCurveTo(hx - s * 0.08 * beat, hy - s * 0.02, hx - s * 0.03, hy - s * 0.08 * beat, hx, hy - s * 0.03);
        ctx.bezierCurveTo(hx + s * 0.03, hy - s * 0.08 * beat, hx + s * 0.08 * beat, hy - s * 0.02, hx, hy + s * 0.05 * beat);
        ctx.fill();
      }
      ctx.strokeStyle = ink;
      ctx.beginPath();
      ctx.arc(fx, fy + s * 0.06, s * 0.08, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      return;
    }
    // Eyes look where Telly is going.
    const lookX = clamp(p.vx * 0.004, -0.02, 0.03);
    const lookY = clamp(p.vy * 0.003, -0.02, 0.02);
    const blink = face === "happy" && p.blink < 0;
    if (blink) {
      for (const ex of [-0.12, 0.12]) {
        ctx.beginPath();
        ctx.moveTo(fx + s * (ex - 0.05), fy - s * 0.07);
        ctx.lineTo(fx + s * (ex + 0.05), fy - s * 0.07);
        ctx.stroke();
      }
    } else {
      for (const ex of [-0.12, 0.12]) {
        ctx.fillStyle = ink;
        ctx.beginPath();
        const tall = face === "push" ? 0.035 : face === "oh" || face === "whee" ? 0.078 : 0.066;
        ctx.ellipse(fx + s * ex + 0.02, fy - s * 0.07, s * 0.056, s * tall, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = glowing ? "#ffffff" : "#1b2440";
        ctx.beginPath();
        ctx.arc(fx + s * ex + 0.03 + lookX, fy - s * 0.075 + lookY, s * 0.026, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(fx + s * ex + 0.045 + lookX, fy - s * 0.09 + lookY, s * 0.01, 0, TAU);
        ctx.fill();
      }
      if (face === "worried") {
        ctx.strokeStyle = ink;
        ctx.lineWidth = 0.03;
        for (const ex of [-0.12, 0.12]) {
          ctx.beginPath();
          ctx.moveTo(fx + s * (ex - 0.05), fy - s * (ex < 0 ? 0.15 : 0.18));
          ctx.lineTo(fx + s * (ex + 0.05), fy - s * (ex < 0 ? 0.18 : 0.15));
          ctx.stroke();
        }
      }
    }
    ctx.fillStyle = "rgba(255,120,150,0.55)";
    ctx.beginPath();
    ctx.arc(fx - s * 0.22, fy + s * 0.05, s * 0.045, 0, TAU);
    ctx.arc(fx + s * 0.22, fy + s * 0.05, s * 0.045, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.fillStyle = ink;
    ctx.lineWidth = 0.04;
    ctx.beginPath();
    if (face === "oh") {
      ctx.ellipse(fx, fy + s * 0.1, s * 0.045, s * 0.06, 0, 0, TAU);
      ctx.fill();
    } else if (face === "whee") {
      ctx.arc(fx, fy + s * 0.05, s * 0.09, 0, Math.PI);
      ctx.fill();
      ctx.fillStyle = "#ff8fa8";
      ctx.beginPath();
      ctx.ellipse(fx, fy + s * 0.11, s * 0.045, s * 0.025, 0, 0, TAU);
      ctx.fill();
    } else if (face === "worried" || face === "push") {
      ctx.moveTo(fx - s * 0.07, fy + s * 0.12);
      ctx.quadraticCurveTo(fx, fy + s * (face === "push" ? 0.09 : 0.06), fx + s * 0.07, fy + s * 0.12);
      ctx.stroke();
    } else {
      ctx.arc(fx, fy + s * 0.04, s * 0.08, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (const q of world.parts) {
      const k = q.life / q.max;
      const a = 1 - k;
      if (q.kind === "dust" || q.kind === "smoke") {
        ctx.globalAlpha = a * (q.kind === "smoke" ? 0.4 : 0.6);
        ctx.fillStyle = q.kind === "smoke" ? "#3b3550" : "#ffffff";
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.size * (1 + k * 1.5), 0, TAU);
        ctx.fill();
      } else if (q.kind === "spark") {
        ctx.globalAlpha = a;
        ctx.strokeStyle = q.color;
        ctx.lineWidth = 0.05;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(q.x, q.y);
        ctx.lineTo(q.x - q.vx * 0.03, q.y - q.vy * 0.03);
        ctx.stroke();
      } else if (q.kind === "drop") {
        ctx.globalAlpha = a;
        ctx.fillStyle = "#9fdcff";
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.size, 0, TAU);
        ctx.fill();
      } else if (q.kind === "star") {
        ctx.globalAlpha = a;
        ctx.fillStyle = q.color;
        FK.starPath(ctx, q.x, q.y, q.size * 1.4, q.size * 0.55, 4);
        ctx.fill();
      } else if (q.kind === "ring") {
        ctx.globalAlpha = a * 0.9;
        ctx.strokeStyle = q.color;
        ctx.lineWidth = 0.07 * a + 0.01;
        ctx.beginPath();
        ctx.arc(q.x, q.y, 0.2 + k * 1.3, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    for (const q of world.parts) if (q.kind === "spark" || q.kind === "star") glow(q.x, q.y, 0.25, "#ffe066", (1 - q.life / q.max) * 0.5);
  }

  // The dark rooms: everything dims except what is lit.
  function drawLighting(theme) {
    if (!theme.dark) return;
    const q = 0.25;
    const lw = Math.ceil(W * q);
    const lh = Math.ceil(H * q);
    if (!lightCanvas || lightCanvas.width !== lw || lightCanvas.height !== lh) lightCanvas = canvasOf(lw, lh);
    const g = lightCanvas.getContext("2d");
    g.globalCompositeOperation = "source-over";
    g.clearRect(0, 0, lw, lh);
    g.fillStyle = `rgba(12,8,38,${theme.dark})`;
    g.fillRect(0, 0, lw, lh);
    g.globalCompositeOperation = "destination-out";
    const o = camOrigin();
    for (let i = 0; i < lights.length; i += 4) {
      const x = (o.x + lights[i] * Z) * q;
      const y = (o.y + lights[i + 1] * Z) * q;
      const r = lights[i + 2] * Z * q;
      if (x < -r || y < -r || x > lw + r || y > lh + r) continue;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(0,0,0,${lights[i + 3]})`);
      gr.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = gr;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.drawImage(lightCanvas, 0, 0, W, H);
  }

  /* ---------------- on-screen buttons ---------------- */
  let showPad = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  const touches = new Map();     // pointerId -> button
  function buttons() {
    const R = clamp(Math.min(W, H) * 0.085, 30, 52);
    const by = H - safeBottom - R - 16;
    return [
      { id: "left", x: 16 + R, y: by, r: R, icon: "◀" },
      { id: "right", x: 16 + R * 3.3, y: by, r: R, icon: "▶" },
      { id: "jump", x: W - 16 - R * 1.15, y: by - R * 0.15, r: R * 1.15, icon: "⤒" },
      { id: "cord", x: W - 16 - R * 3.5, y: by + R * 0.1, r: R, icon: "🔌" },
    ];
  }
  function buttonAt(x, y) {
    let best = null;
    let bestD = Infinity;
    for (const b of buttons()) {
      const d = Math.hypot(x - b.x, y - b.y) / b.r;
      if (d < bestD) {
        bestD = d;
        best = b;
      }
    }
    return bestD < 2.4 ? best.id : null;
  }
  function applyTouches() {
    const held = new Set(touches.values());
    input.left = held.has("left");
    input.right = held.has("right");
    if (held.has("jump") && !input.jump) input.jumpPressed = true;
    input.jump = held.has("jump");
    if (held.has("cord") && !input.cord) input.cordPressed = true;
    if (!held.has("cord") && input.cord) input.cordReleased = true;
    input.cord = held.has("cord");
  }

  function drawButtons() {
    if (!showPad || kit.state !== "playing") return;
    const held = new Set(touches.values());
    const w = world;
    let cordIcon = "🔌";
    const ready = w && !w.rope && (nearSocket() || nearExit() || bestHook());
    if (w && !w.rope && !nearSocket() && !nearExit() && bestHook()) cordIcon = "🪝";
    for (const b of buttons()) {
      const on = held.has(b.id);
      const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
      g.addColorStop(0, on ? "rgba(255,255,255,0.7)" : "rgba(255,255,255,0.42)");
      g.addColorStop(1, on ? "rgba(255,255,255,0.45)" : "rgba(255,255,255,0.18)");
      ctx.fillStyle = g;
      ctx.strokeStyle = "rgba(255,255,255,0.75)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(b.x, b.y + (on ? 2 : 0), b.r, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgba(30,25,60,0.85)";
      ctx.font = `bold ${Math.round(b.r * 0.85)}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(b.id === "cord" ? cordIcon : b.icon, b.x, b.y + 1 + (on ? 2 : 0));
      if (b.id === "cord" && ready) {
        ctx.strokeStyle = `rgba(255,230,90,${0.6 + 0.3 * Math.sin(w.t * 8)})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 4, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.textBaseline = "alphabetic";
  }

  let lastRender = 0;
  function render() {
    if (!ctx) return;
    const now = performance.now();
    const realDt = lastRender ? clamp((now - lastRender) / 1000, 0, 1 / 30) : 1 / 60;
    lastRender = now;
    if (bench.active) bench.frame(now);
    if (!world) newWorld(0);
    // The attract screen plays itself behind the title and result cards.
    if (kit.state !== "playing" && kit.state !== "paused" && mode === "play") {
      mode = "demo";
      newWorld(0);
    }
    if (kit.state !== "playing" && kit.state !== "paused") simulate(realDt);
    const w = world;
    const p = w.p;
    const L = w.L;
    // Draw Telly between the last two physics steps, so motion is smooth at
    // any screen refresh rate.
    const alpha = clamp(w.acc / STEP, 0, 1);
    const ix = lerp(p.px, p.x, alpha);
    const iy = lerp(p.py, p.y, alpha);
    const speed = Math.hypot(p.vx, p.vy);
    // The camera leads where Telly is heading and pulls back on fast swings.
    const zoomTo = w.rope || (!p.ground && speed > 9) ? clamp(1 - (speed - 6) * 0.018, 0.84, 1) : 1;
    w.cam.z = lerp(w.cam.z, zoomTo, Math.min(1, realDt * 2));
    Z = T * w.cam.z;
    const lead = p.dir * 1.6 + clamp(p.vx * 0.15, -1.2, 1.2);
    w.cam.x = lerp(w.cam.x, ix + lead, Math.min(1, realDt * 4.2));
    w.cam.y = lerp(w.cam.y, Math.min(iy, BOTTOM + 1) - 1.8 + clamp(p.vy * 0.06, -0.6, 1), Math.min(1, realDt * 4.2));
    w.cam.x = Math.max(w.cam.x, (W * 0.42) / Z - 1);
    const theme = L.theme;
    lights.length = 0;
    ctx.save();
    kit.applyShake(ctx);
    ctx.drawImage(sky(theme), 0, 0, W, H);
    if (quality < 2) drawStrip(theme, 0);
    drawBackground(theme);
    drawChunks(theme);
    const o = camOrigin();
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.scale(Z, Z);
    drawWires();
    for (const wtr of L.water) drawWater(wtr, theme);
    for (const pl of L.plates) drawPlate(pl);
    for (const br of L.bridges) drawBridge(br);
    for (const d of L.doors) drawDoor(d);
    for (const lf of L.lifts) drawLift(lf);
    for (const f of L.fans) drawFan(f);
    for (const sp of L.sparkers) drawSparker(sp);
    for (const s of L.springs) drawSpring(s);
    for (const pad of L.pads) drawPad(pad);
    for (const s of L.sockets) drawSocket(s);
    drawExit(L.exit);
    const target = !w.rope && w.zap <= 0 && !w.plug ? bestHook() : null;
    for (const h of L.hooks) drawHook(h, h === target);
    for (const s of L.sparks) drawSpark(s);
    for (const c of L.cells) drawCell(c);
    for (const c of L.crates) drawCrate(c);
    if (bench.active && w.trail.length > 1) {
      ctx.strokeStyle = "rgba(255,230,120,0.35)";
      ctx.lineWidth = 0.08;
      ctx.beginPath();
      const from = Math.max(0, w.trail.length - 240);
      for (let i = from; i < w.trail.length; i++) {
        if (i === from) ctx.moveTo(w.trail[i].x, w.trail[i].y);
        else ctx.lineTo(w.trail[i].x, w.trail[i].y);
      }
      ctx.stroke();
    }
    drawCord(ix, iy);
    drawTelly(ix, iy);
    drawParticles();
    ctx.restore();
    drawLighting(theme);
    if (theme.dark && quality < 2) ctx.drawImage(getVignette(), 0, 0, W, H);
    kit.fx.draw(ctx);
    drawButtons();
    ctx.restore();
    govern(realDt);
  }

  function simulate(dt) {
    const w = world;
    w.acc += dt;
    let n = 0;
    while (w.acc >= STEP && n < 8) {
      step(STEP);
      w.acc -= STEP;
      n += 1;
      if (world !== w) return;
    }
    if (n === 8) w.acc = 0;
  }

  function update(dt) {
    if (mode !== "play") return;
    if (world.finishing <= 0) roomTime += dt;
    simulate(dt);
  }

  function updateHud() {
    if (mode !== "play" || !world) return;
    const cells = world.L.cells.filter((c) => c.got).length;
    kit.setExtra(`<span>🔋${Math.max(0, batteries)} · Room ${world.L.n + 1}${cells ? ` · ${cells}/3` : ""}</span>`);
  }

  function startGame() {
    bench.stop(false);
    mode = "play";
    batteries = BATTERIES;
    for (const k of Object.keys(stats)) stats[k] = 0;
    clearInput();
    newWorld(0);
    updateHud();
    kit.toast(`Room 1: ${world.L.def.name}`, "#ffe9c4");
  }

  /* ---------------- benchmark: "Test this device" ---------------- */
  const BENCH_SECONDS = 20;
  const BENCH_KEY = "fk:family-telly-swing:bench";
  const bench = {
    active: false,
    started: 0,
    last: 0,
    frames: [],
    begin() {
      if (kit.state === "playing" || kit.state === "paused") return;
      const overlay = document.getElementById("fk-overlay");
      overlay.classList.remove("fk-show");
      overlay.innerHTML = "";
      mode = "bench";
      newWorld(1);
      this.active = true;
      if (view) view.resize();
      this.frames = [];
      this.started = performance.now();
      this.last = 0;
      kit.sound.unlock();
    },
    frame(now) {
      if (this.last) this.frames.push(now - this.last);
      this.last = now;
      if (now - this.started >= BENCH_SECONDS * 1000) this.stop(true);
    },
    stop(show) {
      if (!this.active) return;
      this.active = false;
      mode = "demo";
      newWorld(0);
      if (show) showBenchResult(summarize(this.frames));
    },
  };

  function summarize(frames) {
    const sorted = frames.slice().sort((a, b) => a - b);
    const total = frames.reduce((s, f) => s + f, 0) || 1;
    const pct = (q) => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * q))] || 0;
    const slowest = sorted.slice(Math.floor(sorted.length * 0.99));
    const low = slowest.length ? 1000 / (slowest.reduce((s, f) => s + f, 0) / slowest.length) : 0;
    const result = {
      fps: Math.round((frames.length / total) * 1000),
      low1: Math.round(low),
      p95: Math.round(pct(0.95) * 10) / 10,
      hitches: frames.filter((f) => f > 50).length,
      frames: frames.length,
      w: Math.round(W),
      h: Math.round(H),
      dpr: view ? view.dpr : 1,
      quality,
      ua: navigator.userAgent.slice(0, 160),
      at: new Date().toISOString(),
    };
    result.grade = result.fps >= 55 && result.hitches <= 2 ? "Silky smooth" : result.fps >= 40 ? "Smooth" : result.fps >= 25 ? "Playable" : "Struggling";
    try {
      localStorage.setItem(BENCH_KEY, JSON.stringify(result));
    } catch (_) {
      /* storage blocked */
    }
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: "arcade-game", slug: "family-telly-swing", type: "benchmark", result }, "*");
      }
    } catch (_) {
      /* parent gone */
    }
    return result;
  }

  function lastBench() {
    try {
      return JSON.parse(localStorage.getItem(BENCH_KEY) || "null");
    } catch (_) {
      return null;
    }
  }

  function showBenchResult(r) {
    const overlay = document.getElementById("fk-overlay");
    overlay.innerHTML =
      `<div class="fk-card"><div class="fk-emoji">🧪</div><h2>${r.grade}</h2>` +
      `<p class="fk-tag">This device ran Telly's busiest room for ${BENCH_SECONDS} seconds.</p>` +
      `<div class="ts-bench-grid">` +
      `<div><b>${r.fps}</b><span>frames a second</span></div>` +
      `<div><b>${r.low1}</b><span>slowest 1% (fps)</span></div>` +
      `<div><b>${r.p95} ms</b><span>95% of frames under</span></div>` +
      `<div><b>${r.hitches}</b><span>hitches over 50 ms</span></div>` +
      `</div>` +
      `<p class="ts-bench-note">${r.w}×${r.h} at ${r.dpr}× pixels. 60 is perfect; above 40 plays well.</p>` +
      `<button class="fk-btn" type="button" data-ts="again">↻ Test again</button>` +
      `<button class="fk-btn fk-ghost" type="button" data-ts="back">Back</button></div>`;
    overlay.classList.add("fk-show");
    tap(overlay.querySelector('[data-ts="again"]'), () => bench.begin());
    tap(overlay.querySelector('[data-ts="back"]'), () => kit.showTitle());
  }

  function tap(node, fn) {
    if (!node) return;
    let down = null;
    node.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
    node.addEventListener("pointerup", (e) => {
      if (!down) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      down = null;
      if (moved < 24) {
        e.preventDefault();
        fn();
      }
    });
    node.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        fn();
      }
    });
  }

  // Add "Test this device" and the stars won so far to the title card.
  const overlayEl = document.getElementById("fk-overlay");
  new MutationObserver(() => {
    const card = overlayEl.querySelector(".fk-card");
    if (!card || !card.querySelector('[data-fk="go"]') || card.querySelector('[data-ts="bench"]')) return;
    const btn = document.createElement("button");
    btn.className = "fk-btn fk-ghost";
    btn.type = "button";
    btn.dataset.ts = "bench";
    btn.textContent = "🧪 Test this device";
    const go = card.querySelector('[data-fk="go"]');
    go.insertAdjacentElement("afterend", btn);
    tap(btn, () => bench.begin());
    const won = Object.values(bestStars()).reduce((s, n) => s + (Number(n) || 0), 0);
    const prev = lastBench();
    if (won || prev) {
      const line = document.createElement("div");
      line.className = "ts-bench-line";
      line.textContent = [won ? `★ ${won} of ${ROOMS.length * 3} stars` : "", prev ? `Last test: ${prev.fps} fps` : ""].filter(Boolean).join(" · ");
      btn.insertAdjacentElement("afterend", line);
    }
  }).observe(overlayEl, { childList: true, subtree: true });

  /* ---------------- input ---------------- */
  view = kit.canvas(onResize);
  const cv = view.canvas;
  const local = (e) => {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  cv.addEventListener("pointerdown", (e) => {
    if (kit.state !== "playing") return;
    e.preventDefault();
    try {
      cv.setPointerCapture(e.pointerId);
    } catch (_) {
      /* synthetic pointer */
    }
    if (e.pointerType !== "mouse") showPad = true;
    if (!showPad) {
      // A mouse with no on-screen pad: a click throws the cord (or plugs in).
      touches.set(e.pointerId, "cord");
    } else {
      const at = local(e);
      const b = buttonAt(at.x, at.y);
      if (!b) return;
      touches.set(e.pointerId, b);
    }
    applyTouches();
  });
  cv.addEventListener("pointermove", (e) => {
    if (!touches.has(e.pointerId) || !showPad) return;
    e.preventDefault();
    const at = local(e);
    const b = buttonAt(at.x, at.y);
    // Sliding a thumb between ◀ and ▶ changes direction; other buttons hold.
    const was = touches.get(e.pointerId);
    if (b && (was === "left" || was === "right") && (b === "left" || b === "right") && b !== was) {
      touches.set(e.pointerId, b);
      applyTouches();
    }
  });
  const lift = (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.delete(e.pointerId);
    applyTouches();
  };
  cv.addEventListener("pointerup", lift);
  cv.addEventListener("pointercancel", lift);

  const KEYS = {
    ArrowLeft: "left", a: "left", A: "left",
    ArrowRight: "right", d: "right", D: "right",
    ArrowUp: "jump", " ": "jump", w: "jump", W: "jump", z: "jump", Z: "jump",
    x: "cord", X: "cord", Shift: "cord", e: "cord", E: "cord", ArrowDown: "cord", s: "cord", S: "cord",
  };
  window.addEventListener("keydown", (e) => {
    const k = KEYS[e.key];
    if (!k || kit.state !== "playing") return;
    e.preventDefault();
    if (e.repeat) return;
    if (k === "jump") input.jumpPressed = true;
    if (k === "cord") input.cordPressed = true;
    input[k] = true;
  });
  window.addEventListener("keyup", (e) => {
    const k = KEYS[e.key];
    if (!k) return;
    if (k === "cord" && input.cord) input.cordReleased = true;
    input[k] = false;
  });

  kit.run(update, render);

  // For tests and the phone check: drive the game without a finger.
  window.__telly = {
    get mode() { return mode; },
    get room() { return world ? world.L.n : -1; },
    get batteries() { return batteries; },
    get stats() { return { ...stats }; },
    get rooms() { return ROOMS.length; },
    get quality() { return quality; },
    autopilot(on) { auto = !!on; },
    bench: () => bench.begin(),
    level: (n) => {
      const L = buildRoom(n);
      return { name: L.def.name, cells: L.cells.length, sparks: L.sparks.length, hooks: L.hooks.length, sockets: L.sockets.length, exit: L.exit, width: L.w };
    },
    goto(n) {
      if (mode !== "play") return;
      newWorld(n);
      updateHud();
    },
    teleport(x, y) {
      const p = world.p;
      p.x = p.px = x;
      p.y = p.py = y;
      p.vx = p.vy = 0;
      world.rope = null;
      world.cord = makeCord();
    },
    wrapCheck(A, c0, c1) {
      return cornerInSweep(A, c0, c1);
    },
    refill() {
      batteries = BATTERIES;
    },
    advance(seconds) {
      // Run the game forward without waiting for frames (tests).
      const n = Math.round(seconds / STEP);
      for (let i = 0; i < n && kit.state === "playing"; i++) {
        if (world.finishing <= 0) roomTime += STEP;
        step(STEP);
      }
    },
    hold(key, on) {
      if (key === "jump" && on && !input.jump) input.jumpPressed = true;
      if (key === "cord" && on && !input.cord) input.cordPressed = true;
      if (key === "cord" && !on && input.cord) input.cordReleased = true;
      input[key] = !!on;
    },
    state() {
      const w = world;
      const p = w.p;
      return {
        x: p.x, y: p.y, vx: p.vx, vy: p.vy, ground: p.ground, roped: !!w.rope, pivots: w.rope ? w.rope.pivots.length : 0,
        plugged: !!w.plug, zap: w.zap > 0, finishing: w.finishing > 0,
        doors: w.L.doors.map((d) => d.open), lifts: w.L.lifts.map((l) => l.y), fans: w.L.fans.map((f) => f.spin),
        bridges: w.L.bridges.map((b) => b.ext), plates: w.L.plates.map((pl) => pl.pressed),
        crates: w.L.crates.map((c) => ({ x: c.x, y: c.y })), cells: w.L.cells.filter((c) => c.got).length, skips: w.skips,
      };
    },
  };
})();
</script>
</body>
</html>
