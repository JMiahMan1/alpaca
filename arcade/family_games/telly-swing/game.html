(function () {

  /* ---------------- physics, in tiles and seconds (y grows downward) ---------------- */
  const G_UP = 42;          // gravity while rising with jump held

  const APEX = 0.55;        // near the top of a held jump, gravity eases off: a floaty peak

  const RUN = 6.2;
  const PUSH_RUN = 2.6;     // pushing a crate is slow going

  const ACC_AIR = 30;

  const SPRING_V = -Math.sqrt(2 * G_UP * 6.4);
  const COYOTE = 0.1;       // a jump still works just after running off a ledge
  const BUFFER = 0.14;      // and just before landing

  /* ---------------- the rooms, built by hand ----------------
   * Coordinates are tiles: x to the right, y downward; a ground's "top" is
   * the row Telly stands on. Every room has exactly three power cells. */
  function builder() {
    const L = {
      solids: [], ledges: [], water: [], hooks: [], sparks: [], cells: [], pads: [], springs: [], crates: [],
      sparkers: [], sockets: [], doors: [], lifts: [], fans: [], bridges: [], plates: [], start: { x: 2, y: 11 }, exit: null,
    };
    const b = {
      L,
      ground: (x0, x1, top) => L.solids.push([x0, x1, top, BOTTOM + 1]),
      block: (x0, x1, y0, y1) => L.solids.push([x0, x1, y0, y1]),
      ledge: (x0, x1, y) => L.ledges.push([x0, x1, y]),
      water: (x0, x1, y) => {
        L.water.push({ x0, x1, y });
        L.solids.push([x0, x1, y + 1, BOTTOM + 1]);
      },
      start: (x, y) => { L.start = { x, y }; },
      exit: (x, y) => { L.exit = { x, y }; },
      pad: (x, y) => L.pads.push({ x, y, on: false }),
      spark: (x, y) => L.sparks.push({ x, y, got: false }),
      sparks: (list) => list.forEach(([x, y]) => L.sparks.push({ x, y, got: false })),
      cell: (x, y) => L.cells.push({ x, y, got: false }),
      hook: (x, y, o) => L.hooks.push({ bx: x, by: y, ax: (o && o.ax) || 0, ay: (o && o.ay) || 0, sp: (o && o.sp) || 1, ph: (o && o.ph) || 0 }),
      spring: (x, y) => L.springs.push({ x, y, squash: 0 }),
      crate: (x, y) => L.crates.push({ hx: x, hy: y }),
      sparker: (x, y, phase) => L.sparkers.push({ x, y, h: 2.7, phase: phase || 0 }),
      socket: (x, y, time) => {
        const s = { kind: "socket", x, y, time: time || 0, left: 0, latched: false };
        L.sockets.push(s);
        return s;
      },
      plate: (x0, x1, y) => {
        const p = { kind: "plate", x0, x1, y, pressed: false, depth: 0 };
        L.plates.push(p);
        return p;
      },
      door: (x, y0, y1, by) => L.doors.push({ x, y0, y1, by, open: 0 }),
      lift: (x0, x1, yDown, yUp, by) => L.lifts.push({ x0, x1, yDown, yUp, y: yDown, by, dy: 0 }),
      fan: (x, y, h, by) => L.fans.push({ x, y, h, by, spin: 0, a: 0 }),
      bridge: (x0, x1, y, by) => L.bridges.push({ x0, x1, y, by, ext: 0 }),
    };
    return b;
  }

  const ROOMS = [

        b.ground(39, 48, 11); b.pad(41, 11);
        b.ground(48, 52, 10); b.ground(52, 56, 9);
        b.sparks([[53, 8], [54, 8], [55, 8]]);
        b.cell(57.5, 7.4);
        b.ground(59, 82, 9);
        b.spring(67, 9); b.ledge(68, 73, 4);
        b.sparks([[69, 3.2], [72, 3.2]]); b.cell(70.5, 3);

        b.hook(13.5, 5); b.sparks([[12, 9.4], [13.5, 9.9], [15, 9.4]]);
        b.ground(17, 25, 11); b.pad(19, 11);
        b.hook(28.5, 5); b.hook(32.5, 5); b.cell(30.5, 7.6);
        b.ground(36, 44, 11);
        b.hook(48.5, 4.5, { ax: 1.4, sp: 0.9 });
        b.ground(53, 62, 10); b.pad(55, 10); b.ledge(56, 60, 8); b.cell(58, 7);
        b.hook(65.5, 4); b.hook(69, 4.5); b.hook(72.5, 4); b.cell(69, 0.4);
        b.sparks([[65.5, 8.8], [69, 9.3], [72.5, 8.8]]);
        b.ground(76, 92, 11); b.exit(88, 11);
      },
    },
    {
      name: "Power Up", theme: "garage", par: 55,
      build(b) {
        b.ground(0, 24, 11); b.start(2, 11);
        const a = b.socket(7, 11, 0);

        const c = b.socket(39, 11, 3.5);

        const a = b.socket(29, 11, 5);
        b.lift(32, 35, 10.55, 5, a); b.cell(33.5, 2.5);
        b.ground(32, 35, 11);
        b.ground(35, 46, 5);
        b.sparker(40, 5, 0.6);
        b.hook(49, 0); b.hook(53, 0); b.cell(51, 4);
        b.sparks([[49, 4], [53, 4]]);
        b.ground(56, 80, 7); b.pad(58, 7);
        b.cell(62, 4.1);
        b.sparker(66, 7, 0.9);
        b.exit(76, 7);
      },
    },
    {
      name: "Bridge Builder", theme: "dusk", par: 75,
      build(b) {
        b.ground(0, 10, 11); b.start(2, 11);
        b.hook(13, 5, { ax: 1.2, sp: 0.9 }); b.hook(17, 5, { ax: 1.2, sp: 0.9, ph: Math.PI });
        b.cell(15, 9);
        b.ground(20, 30, 11);
        b.crate(22, 11);
        const plate = b.plate(27, 29, 11);
        b.bridge(30, 40, 11, plate); b.cell(35, 8.6);
        b.sparks([[32, 10.3], [34, 10.3], [36, 10.3], [38, 10.3]]);
        b.ground(40, 50, 11); b.pad(42, 11);
        const a = b.socket(44, 11, 6);
        b.fan(49.1, 11, 8, a);
        b.ground(50, 70, 4); b.cell(52, 1.2);
        const c = b.socket(53, 4, 3);

      },
    },
    {
      name: "Starlight", theme: "night", par: 80,
      build(b) {
        b.ground(0, 8, 9); b.start(2, 9);
        b.hook(11, 3); b.hook(15, 3.5, { ay: 0.8 }); b.hook(19, 3);
        b.sparks([[11, 7.6], [15, 8.2], [19, 7.6]]);
        b.ground(22, 30, 9); b.cell(24, 7.4);
        b.spring(28, 9);
        b.ground(31, 52, 4);
        b.sparker(35, 4, 0); b.cell(35, 0.6);
        b.pad(41, 4);
        const a = b.socket(39, 4, 4);
        b.door(44, -3, 4, a);
        b.hook(55, -1.5, { ax: 1, sp: 0.8 }); b.hook(59.5, -1, { ax: 1, sp: 0.8, ph: Math.PI }); b.cell(57, 3);
        b.ground(64, 80, 6); b.exit(76, 6);
      },
    },
  ];

  /* ---------------- building a room into a grid ---------------- */
  function buildRoom(n) {
    const def = ROOMS[n % ROOMS.length];
    const b = builder();
    def.build(b);
    const L = b.L;
    L.n = n;
    L.def = def;
    L.theme = THEMES[def.theme];
    L.par = def.par;
    let width = 0;
    for (const s of L.solids) width = Math.max(width, s[1]);
    L.w = width + 6;
    L.h = BOTTOM + 1;
    L.top = -6;
    const rows = L.h - L.top;
    L.grid = new Uint8Array(L.w * rows);
    const set = (x, y, v) => {
      if (x < 0 || x >= L.w || y < L.top || y >= L.h) return;
      L.grid[(y - L.top) * L.w + x] = v;
    };
    for (const [x0, x1, y0, y1] of L.solids) for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) set(x, y, 1);
    for (const [x0, x1, y] of L.ledges) for (let x = x0; x < x1; x++) set(x, y, 2);
    for (const wtr of L.water) for (let x = wtr.x0; x < wtr.x1; x++) set(x, wtr.y, 0);
    // Below the last row the ground carries on (and holes stay holes), so a
    // tall screen never shows sky under the floor.
    L.tile = (x, y) => (x < 0 || x >= L.w || y < L.top ? 0 : L.grid[(Math.min(y, L.h - 1) - L.top) * L.w + x]);
    L.crates = L.crates.map((c) => ({ x: c.hx + 0.5, y: c.hy, w: 0.96, h: 0.96, vx: 0, vy: 0, ground: false, hx: c.hx + 0.5, hy: c.hy, isCrate: true, tilt: 0 }));
    return L;
  }

  /* ---------------- the world ---------------- */
  let world = null;
  let mode = "demo";        // demo | play | bench
  let auto = false;
  const stats = { sparks: 0, cells: 0, wraps: 0, rooms: 0, stars: 0 };
  let batteries = BATTERIES;
  let roomTime = 0;
  const input = { left: false, right: false, jump: false, cord: false, jumpPressed: false, cordPressed: false, cordReleased: false };

  function clearInput() {
    input.left = input.right = input.jump = input.cord = false;
    input.jumpPressed = input.cordPressed = input.cordReleased = false;
    touches.clear();
  }

  function newWorld(n) {
    const L = buildRoom(n);
    world = {
      L,
      t: 0,
      acc: 0,
      p: {
        x: L.start.x, y: L.start.y, px: L.start.x, py: L.start.y, w: PW, h: PH, vx: 0, vy: 0, ground: true, on: null, dir: 1,
        coyote: 0, buffer: 0, sy: 1, syV: 0, tilt: 0, walk: 0, face: "happy", worried: false, pushing: false, flung: false,
        ant: [0, 0], antV: [0, 0], blink: 2,
      },
      rope: null,
      plug: null,
      finishing: 0,
      zap: 0,
      invuln: 0,
      flick: 0,
      checkpoint: { x: L.start.x, y: L.start.y },
      cam: { x: L.start.x + 2, y: L.start.y - 2, z: 1 },
      parts: [],
      wind: [],
      cord: null,
      progress: { x: L.start.x, t: 0 },
      trail: [],
      ghosts: [],
      skips: 0,
    };
    world.cord = makeCord();
    roomTime = 0;
    chunks.clear();
    return world;
  }

  /* ---------------- solids and collisions ---------------- */
  function doorRect(d) {
    if (d.open >= 0.98) return null;
    const h = (d.y1 - d.y0) * (1 - d.open);
    return { x: d.x + 0.08, y: d.y0, w: 0.84, h };
  }
  function bridgeRect(br) {
    if (br.ext <= 0.02) return null;
    return { x: br.x0, y: br.y, w: (br.x1 - br.x0) * br.ext, h: 0.4 };
  }

  // Calls fn(rect) for every solid that overlaps the box [l,r]x[t,b]; a
  // false return stops the walk. A rect is {x,y,w,h, oneWay?, crate?, lift?}.
  const tmpRect = { x: 0, y: 0, w: 1, h: 1, oneWay: false, crate: null, lift: null };
  function eachSolid(l, t, r, b, self, fn) {
    const L = world.L;
    for (let ty = Math.floor(t); ty <= Math.floor(b - EPS); ty++) {
      for (let tx = Math.floor(l); tx <= Math.floor(r - EPS); tx++) {
        const v = L.tile(tx, ty);
        if (!v) continue;
        tmpRect.x = tx; tmpRect.y = ty; tmpRect.w = 1; tmpRect.h = v === 2 ? 0.3 : 1;
        tmpRect.oneWay = v === 2; tmpRect.crate = null; tmpRect.lift = null;
        if (fn(tmpRect) === false) return;
      }
    }
    if (l < 0) {
      // The room's left edge is a wall.
      if (fn({ x: -5, y: -50, w: 5, h: 100, oneWay: false, crate: null, lift: null }) === false) return;
    }
    for (const d of L.doors) {
      const rc = doorRect(d);
      if (rc && rc.x < r && rc.x + rc.w > l && rc.y < b && rc.y + rc.h > t && fn({ ...rc, oneWay: false }) === false) return;
    }
    for (const br of L.bridges) {
      const rc = bridgeRect(br);
      if (rc && rc.x < r && rc.x + rc.w > l && rc.y < b && rc.y + rc.h > t && fn({ ...rc, oneWay: false }) === false) return;
    }
    for (const lf of L.lifts) {
      const rc = { x: lf.x0, y: lf.y, w: lf.x1 - lf.x0, h: 0.45, oneWay: false, lift: lf };
      if (rc.x < r && rc.x + rc.w > l && rc.y < b && rc.y + rc.h > t && fn(rc) === false) return;
    }
    for (const c of L.crates) {
      if (c === self) continue;
      const rc = { x: c.x - c.w / 2, y: c.y - c.h, w: c.w, h: c.h, oneWay: false, crate: c };
      if (rc.x < r && rc.x + rc.w > l && rc.y < b && rc.y + rc.h > t && fn(rc) === false) return;
    }
  }

  function overlaps(bd, rc) {
    return bd.x - bd.w / 2 < rc.x + rc.w - EPS && bd.x + bd.w / 2 > rc.x + EPS && bd.y - bd.h < rc.y + rc.h - EPS && bd.y > rc.y + EPS;
  }

  function boxFree(bd, x, y) {
    let free = true;
    eachSolid(x - bd.w / 2, y - bd.h, x + bd.w / 2, y, bd, (rc) => {
      if (rc.oneWay) return true;
      if (x - bd.w / 2 < rc.x + rc.w - EPS && x + bd.w / 2 > rc.x + EPS && y - bd.h < rc.y + rc.h - EPS && y > rc.y + EPS) {
        free = false;
        return false;
      }
      return true;
    });
    return free;
  }

  function moveX(bd, dx) {
    if (!dx) return false;
    bd.x += dx;
    let hit = false;
    eachSolid(bd.x - bd.w / 2, bd.y - bd.h, bd.x + bd.w / 2, bd.y, bd, (rc) => {
      if (rc.oneWay || !overlaps(bd, rc)) return true;
      // A low lip (a lift resting on the floor) is stepped up onto.
      if (bd.ground && rc.y < bd.y && bd.y - rc.y <= 0.55 && boxFree(bd, bd.x, rc.y)) {
        bd.y = rc.y;
        return true;
      }
      let left = rc.x;
      let width = rc.w;
      if (rc.crate) {
        const c = rc.crate;
        // Telly shoves a crate along instead of stopping.
        if (!bd.isCrate && bd.ground && c.ground) {
          moveX(c, dx > 0 ? bd.x + bd.w / 2 - (c.x - c.w / 2) : bd.x - bd.w / 2 - (c.x + c.w / 2));
          c.tilt = clamp(c.tilt + dx * 0.6, -0.06, 0.06);
          bd.pushing = true;
        }
        left = c.x - c.w / 2;
        width = c.w;
        if (!(bd.x - bd.w / 2 < left + width - EPS && bd.x + bd.w / 2 > left + EPS)) return true;
      }
      if (dx > 0) bd.x = left - bd.w / 2;
      else bd.x = left + width + bd.w / 2;
      hit = true;
      return true;
    });
    if (hit) bd.vx = 0;
    return hit;
  }

  function moveY(bd, dy) {
    if (!dy) return false;
    const prev = bd.y;
    bd.y += dy;
    let hit = false;
    eachSolid(bd.x - bd.w / 2, bd.y - bd.h, bd.x + bd.w / 2, bd.y, bd, (rc) => {
      if (rc.oneWay) {
        if (dy > 0 && prev <= rc.y + 0.02 && bd.y > rc.y && bd.x + bd.w / 2 > rc.x + EPS && bd.x - bd.w / 2 < rc.x + rc.w - EPS) {
          bd.y = rc.y;
          hit = true;
        }
        return true;
      }
      if (!overlaps(bd, rc)) return true;
      if (dy > 0) bd.y = rc.y;
      else bd.y = rc.y + rc.h + bd.h;
      hit = true;
      return true;
    });
    if (hit) bd.vy = 0;
    return hit;
  }

  // What a body stands on: a solid, a ledge, a lift or a crate (or null).
  function standingOn(bd) {
    let on = null;
    eachSolid(bd.x - bd.w / 2 + 0.02, bd.y - 0.01, bd.x + bd.w / 2 - 0.02, bd.y + 0.04, bd, (rc) => {
      if (Math.abs(rc.y - bd.y) < 0.03) {
        on = rc.lift || rc.crate || { ground: true };
        return false;
      }
      return true;
    });
    return on;
  }

  // Pushed out of anything that moved into it (a closing door, a lift).
  function depenetrate(bd) {
    for (let k = 0; k < 3; k++) {
      let moved = false;
      eachSolid(bd.x - bd.w / 2, bd.y - bd.h, bd.x + bd.w / 2, bd.y, bd, (rc) => {
        if (rc.oneWay || !overlaps(bd, rc)) return true;
        const up = bd.y - rc.y;
        const down = rc.y + rc.h - (bd.y - bd.h);
        const left = bd.x + bd.w / 2 - rc.x;
        const right = rc.x + rc.w - (bd.x - bd.w / 2);
        const m = Math.min(up, down + 0.2, left, right);
        if (m === up) { bd.y = rc.y; if (bd.vy > 0) bd.vy = 0; }
        else if (m === left) bd.x = rc.x - bd.w / 2;
        else if (m === right) bd.x = rc.x + rc.w + bd.w / 2;
        else { bd.y = rc.y + rc.h + bd.h; if (bd.vy < 0) bd.vy = 0; }
        moved = true;
        return false;
      });
      if (!moved) return;
    }
  }

  function solidAt(x, y) {
    let hit = false;
    eachSolid(x - 0.01, y - 0.01, x + 0.01, y + 0.01, null, (rc) => {
      if (rc.oneWay) return true;
      hit = true;
      return false;
    });
    return hit;
  }

  // The first floor under (x, y) within `depth` tiles, or null.
  function floorBelow(x, y, depth) {
    const L = world.L;
    for (let ty = Math.floor(y); ty <= Math.floor(y + depth); ty++) {
      const v = L.tile(Math.floor(x), ty);
      if (v && ty >= y - 0.01) return ty;
    }
    for (const lf of L.lifts) if (x >= lf.x0 && x <= lf.x1 && lf.y >= y - 0.01 && lf.y <= y + depth) return lf.y;
    for (const br of L.bridges) {
      const rc = bridgeRect(br);
      if (rc && x >= rc.x && x <= rc.x + rc.w && rc.y >= y - 0.01 && rc.y <= y + depth) return rc.y;
    }
    for (const c of L.crates) if (Math.abs(x - c.x) < c.w / 2 && c.y - c.h >= y - 0.01 && c.y - c.h <= y + depth) return c.y - c.h;
    return null;
  }

  // Whether a straight line between two points is clear of solid tiles.
  function lineClear(ax, ay, bx, by) {
    const L = world.L;
    const n = Math.ceil(Math.hypot(bx - ax, by - ay) / 0.2);
    for (let i = 1; i < n; i++) {
      const x = lerp(ax, bx, i / n);
      const y = lerp(ay, by, i / n);
      if (L.tile(Math.floor(x), Math.floor(y)) === 1) return false;
    }
    return true;
  }

  /* ---------------- machines ---------------- */
  function powered(by) {
    if (!by) return false;
    if (by.kind === "plate") return by.pressed;
    return by.latched || by.left > 0;
  }

  function hookPos(h, t) {
    return { x: h.bx + Math.sin(t * h.sp + h.ph) * h.ax, y: h.by + Math.sin(t * h.sp * 1.3 + h.ph) * h.ay };
  }

  function center(p) {
    return { x: p.x, y: p.y - PH * 0.52 };
  }

  function updateMachines(dt) {
    const w = world;
    const L = w.L;
    for (const s of L.sockets) {
      if (s.left > 0) {
        const before = s.left;
        s.left = Math.max(0, s.left - dt);
        if (mode === "play" && s.left > 0 && s.left < 1.6 && Math.floor(before * 3) !== Math.floor(s.left * 3)) kit.sound.play("tap");
      }
    }
    const bodies = [w.p, ...L.crates];
    for (const pl of L.plates) {
      const was = pl.pressed;
      pl.pressed = bodies.some((bd) => Math.abs(bd.y - pl.y) < 0.06 && Math.min(bd.x + bd.w / 2, pl.x1) - Math.max(bd.x - bd.w / 2, pl.x0) > 0.3);
      pl.depth = lerp(pl.depth, pl.pressed ? 1 : 0, Math.min(1, dt * 14));
      if (pl.pressed && !was) {
        kit.sound.play("pop", 0.7);
        emit("spark", (pl.x0 + pl.x1) / 2, pl.y - 0.1, 8, { speed: 3, color: "#7dffb0" });
      }
    }
    for (const d of L.doors) {
      const was = d.open;
      d.open = clamp(d.open + (powered(d.by) ? 3 : -2.2) * dt, 0, 1);
      if (was === 0 && d.open > 0 && mode !== "bench") kit.sound.play("whoosh");
      if (was > 0 && d.open === 0) emit("dust", d.x + 0.5, d.y1, 6, { speed: 2 });
    }
    for (const br of L.bridges) br.ext = clamp(br.ext + (powered(br.by) ? 2.2 : -2.2) * dt, 0, 1);
    for (const lf of L.lifts) {
      // A powered lift waits for a rider, then goes up while the power lasts.
      const riding = bodies.some((bd) => standingOn(bd) === lf);
      const target = powered(lf.by) && (riding || lf.y < lf.yDown - 0.01) ? lf.yUp : lf.yDown;
      const dy = clamp(target - lf.y, -3 * dt, 3 * dt);
      lf.dy = dy;
      if (dy) {
        // Whatever stands on the lift rides it.
        for (const bd of bodies) if (standingOn(bd) === lf) bd.y += dy;
        lf.y += dy;
      }
    }
    for (const f of L.fans) {
      f.spin = lerp(f.spin, powered(f.by) ? 1 : 0, Math.min(1, dt * 3));
      f.a += f.spin * dt * 22;
    }
    for (const c of L.crates) stepCrate(c, dt);
    for (const sp of L.sparkers) {
      const t = (w.t + sp.phase) % 2.6;
      const was = sp.active;
      sp.active = t < 1.1;
      sp.warn = t > 2.15;
      if (sp.active && !was) emit("spark", sp.x + 0.5, sp.y - 0.6, 10, { speed: 5, color: "#bfefff" });
    }
  }

  function inWind(bd) {
    for (const f of world.L.fans) {
      if (f.spin < 0.3) continue;
      if (Math.abs(bd.x - f.x) < 0.85 && bd.y <= f.y + 0.01 && bd.y - bd.h * 0.5 > f.y - f.h) return f;
    }
    return null;
  }

  function stepCrate(c, dt) {
    const f = inWind(c);
    const wasGround = c.ground;
    const fall = c.vy;
    c.vy = Math.min(MAX_FALL, c.vy + G_DOWN * dt);
    if (f) c.vy = Math.max(-WIND_MAX * 0.6, c.vy - WIND * f.spin * dt);
    if (c.ground) c.vx *= Math.max(0, 1 - dt * 12);
    moveX(c, c.vx * dt);
    moveY(c, c.vy * dt);
    const on = standingOn(c);
    c.ground = !!on;
    if (c.ground && c.vy > 0) c.vy = 0;
    if (c.ground && !wasGround && fall > 4) {
      emit("dust", c.x, c.y, 8, { speed: 3 });
      kit.sound.play("thud");
    }
    c.tilt *= 1 - Math.min(1, dt * 10);
    depenetrate(c);
    if (c.y > BOTTOM + 3) {
      // A crate lost down a hole comes back where it started.
      c.x = c.hx;
      c.y = c.hy;
      c.vx = c.vy = 0;
      emit("ring", c.x, c.y - 0.5, 1, { color: "#ffffff" });
    }
  }

  /* ---------------- Telly ---------------- */
  function bestHook() {
    const w = world;
    const c = center(w.p);
    let best = null;
    let bestScore = Infinity;
    for (const h of w.L.hooks) {
      const hp = hookPos(h, w.t);
      if (hp.y > c.y - 0.6) continue;
      if ((hp.x - c.x) * w.p.dir < -1.6) continue;
      const d = Math.hypot(hp.x - c.x, hp.y - c.y);
      if (d > RANGE) continue;
      // The cord cannot reach a hook through a wall.
      if (!lineClear(c.x, c.y, hp.x, hp.y)) continue;
      const score = Math.abs(hp.x - (c.x + w.p.dir * 2.2)) + d * 0.35;
      if (score < bestScore) {
        bestScore = score;
        best = h;
      }
    }
    return best;
  }

  function nearSocket() {
    const p = world.p;
    if (!p.ground) return null;
    for (const s of world.L.sockets) if (Math.abs(s.x - p.x) < 1.3 && Math.abs(s.y - p.y) < 0.6) return s;
    return null;
  }

  function nearExit() {
    const p = world.p;
    const e = world.L.exit;
    return p.ground && Math.abs(e.x - p.x) < 1.6 && Math.abs(e.y - p.y) < 0.6;
  }

  // Where the cord pulls from: the last corner it wrapped, or the hook.
  function ropeAnchor(r) {
    return r.pivots.length ? r.pivots[r.pivots.length - 1] : hookPos(r.hook, world.t);
  }

  function attach(h) {
    const w = world;
    const p = w.p;
    const c = center(p);
    const hp = hookPos(h, w.t);
    const d = Math.hypot(hp.x - c.x, hp.y - c.y);
    const angle = Math.atan2(c.x - hp.x, c.y - hp.y);
    const len = clamp(d, LMIN, LMAX);
    w.rope = { hook: h, L: len, pivots: [], angle, wraps: 0, accum: 0, shoot: 0.08, still: 0 };
    p.ground = false;
    p.dir = hp.x >= c.x ? 1 : -1;
    // The throw yanks Telly forward, enough to swing well past the hook.
    if (angle * p.dir < SWING_TO) {
      const tx = Math.cos(angle) * p.dir;
      const ty = -Math.sin(angle) * p.dir;
      const vt = p.vx * tx + p.vy * ty;
      const need = Math.sqrt(Math.max(0, 2 * G_UP * len * (Math.cos(Math.abs(angle)) - Math.cos(SWING_TO))));
      if (vt < need) {
        p.vx += (need - vt) * tx;
        p.vy += (need - vt) * ty;
      }
    }
    emit("spark", hp.x, hp.y, 8, { speed: 4, color: "#ffe066" });
    kit.sound.play("whoosh");
    kit.haptic(10);
  }

  function release(boost) {
    const w = world;
    if (!w.rope) return;
    const p = w.p;
    p.vx *= 1.06;
    p.vy *= 1.06;
    if (boost) {
      p.vy = Math.min(p.vy, 0) - 5;
      p.vx += p.dir * 1;
      emit("ring", p.x, p.y - 0.4, 1, { color: "#ffffff" });
    }
    p.flung = true;
    if (w.rope.wraps > 0) kit.sound.play("pop", 1.2);
    w.rope = null;
  }

  function cordPress() {
    const w = world;
    if (!w || w.zap > 0 || w.plug || w.finishing > 0) return;
    if (w.rope) return;
    const s = nearSocket();
    if (s) {
      w.plug = { target: s, t: 0, dur: 0.45, exit: false };
      kit.sound.play("pop", 0.8);
      return;
    }
    if (nearExit()) {
      w.plug = { target: w.L.exit, t: 0, dur: 0.6, exit: true };
      kit.sound.play("start");
      return;
    }
    const h = bestHook();
    if (h) attach(h);
    else w.flick = 0.3;
  }

  function hop(v) {
    const p = world.p;
    p.vy = v;
    p.flung = v === SPRING_V;
    p.ground = false;
    p.coyote = 0;
    p.buffer = 0;
    p.syV += 4.5;   // stretch up off the ground
    emit("dust", p.x, p.y, 5, { speed: 2 });
    kit.sound.play("bounce", 1.2);
  }

  function step(dt) {
    const w = world;
    const p = w.p;
    const L = w.L;
    w.t += dt;
    p.px = p.x;
    p.py = p.y;
    if (w.invuln > 0) w.invuln -= dt;
    if (w.flick > 0) w.flick -= dt;
    updateMachines(dt);
    stepParticles(dt);
    stepBody(dt);
    if (w.finishing > 0) {
      w.finishing -= dt;
      p.face = "love";
      if (Math.random() < dt * 20) emit("star", L.exit.x - 0.1 + (Math.random() - 0.5), L.exit.y - 1.5, 1, { speed: 2, color: "#ffe066" });
      if (w.finishing <= 0) roomDone();
      stepCord(dt);
      return;
    }
    if (w.zap > 0) {
      w.zap -= dt;
      if (Math.random() < dt * 25) emit("smoke", p.x, p.y - 0.6, 1, { speed: 1 });
      if (w.zap <= 0) respawn();
      stepCord(dt);
      return;
    }
    if (mode !== "play" || auto) autopilot(dt);

    if (input.cordPressed) cordPress();
    if (input.cordReleased) release(false);
    input.cordPressed = input.cordReleased = false;
    if (input.jumpPressed) p.buffer = BUFFER;
    input.jumpPressed = false;
    p.buffer = Math.max(0, p.buffer - dt);
    p.coyote = p.ground ? COYOTE : Math.max(0, p.coyote - dt);

    if (w.plug) {
      w.plug.t += dt;
      p.vx = 0;
      if (w.plug.t >= w.plug.dur && !w.plug.done) {
        w.plug.done = true;
        const s = w.plug.target;
        if (w.plug.exit) {
          w.finishing = 1.3;
          kit.sound.play("win");
          kit.haptic(25);
          emit("star", s.x - 0.1, s.y - 1.4, 24, { speed: 6, color: "#ffe066" });
          emit("ring", s.x - 0.1, s.y - 1.4, 2, { color: "#fff4b8" });
        } else {
          if (s.time > 0) s.left = s.time;
          else s.latched = true;
          kit.sound.play("coin");
          kit.haptic(15);
          emit("spark", s.x - 0.3, s.y - 0.7, 16, { speed: 6, color: "#bfefff" });
          emit("ring", s.x - 0.05, s.y - 0.6, 1, { color: "#7dffb0" });
        }
      }
      if (w.plug.t >= w.plug.dur + (w.plug.exit ? 9 : 0.3)) w.plug = null;
    }

    const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    const prevGround = p.ground;
    const fallSpeed = p.vy;
    p.pushing = false;
    if (!w.rope && !w.plug) {
      if (dir) p.dir = dir;
      const top = p.wasPushing ? PUSH_RUN : RUN;
      if (dir) {
        const acc = p.ground ? ACC_GROUND : ACC_AIR;
        // Turning round is snappy, and kicks up a little dust.
        const turning = Math.sign(p.vx) !== dir && Math.abs(p.vx) > 2;
        if (turning && p.ground && Math.random() < dt * 30) emit("dust", p.x, p.y, 1, { speed: 2 });
        const boost = turning ? 1.8 : 1;
        const cap = p.ground ? top : Math.max(top, Math.abs(p.vx));
        p.vx = clamp(p.vx + dir * acc * boost * dt, -cap, cap);
      } else if (p.ground) {
        const f = FRICTION * dt;
        p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
      } else {
        p.vx *= 1 - dt * 0.6;
      }
      if (p.buffer > 0 && (p.ground || p.coyote > 0)) hop(JUMP_V);
    } else if (w.rope && p.buffer > 0) {
      p.buffer = 0;
      release(true);
    }

    // Gravity: lighter while rising with jump held (or flung by a spring or
    // the cord), lightest of all near the top of a held jump.
    if (p.vy >= 0) p.flung = false;
    const holdUp = (input.jump || p.flung) && !w.rope;
    let g = w.rope ? G_UP : p.vy < 0 && holdUp ? G_UP : G_DOWN;
    if (holdUp && Math.abs(p.vy) < 2.5 && !p.ground) g *= APEX;
    p.vy = Math.min(MAX_FALL, p.vy + g * dt);
    const fan = !w.rope ? inWind(p) : null;
    if (fan) {
      p.vy = Math.max(-WIND_MAX, p.vy - WIND * fan.spin * dt);
      if (Math.random() < 0.15) emit("dust", p.x + (Math.random() - 0.5) * 0.6, p.y, 1, { speed: 1, vy: -4 });
    }

    if (w.rope) pumpRope(dir, dt);

    const c0 = center(p);
    moveX(p, p.vx * dt);
    p.wasPushing = p.pushing;
    moveY(p, p.vy * dt);
    if (w.rope) constrainRope(c0);
    depenetrate(p);
    const on = standingOn(p);
    p.ground = !!on && p.vy >= -0.01;
    p.on = on;
    if (p.ground && !prevGround) {
      if (w.rope) release(false);
      const hard = clamp(fallSpeed / MAX_FALL, 0, 1);
      p.syV -= 3 + hard * 7;
      emit("dust", p.x, p.y, 4 + Math.round(hard * 10), { speed: 2 + hard * 3 });
      if (hard > 0.7) kit.shake(4, 0.12);
      kit.sound.play("thud");
    }
    if (p.ground && p.vy > 0) p.vy = 0;
    if (p.ground) {
      p.walk += Math.abs(p.vx) * dt * 3.2;
      if (Math.abs(p.vx) > 4 && Math.random() < dt * 10) emit("dust", p.x - p.dir * 0.3, p.y, 1, { speed: 1, vx: -p.dir * 1.5 });
    }
    p.worried = p.ground && !dir && !w.rope && floorBelow(p.x + p.dir * 0.7, p.y, 3) === null;

    // Springs, pads, pickups and hazards.
    for (const s of L.springs) {
      if (s.squash > 0) s.squash -= dt * 3;
      if (p.ground && Math.abs(p.x - s.x) < 0.5 && Math.abs(p.y - s.y) < 0.05) {
        hop(SPRING_V);
        s.squash = 1;
        emit("ring", s.x, s.y - 0.4, 1, { color: "#ffe066" });
        kit.sound.play("bounce", 0.8);
        kit.haptic(14);
      }
    }
    for (const pad of L.pads) {
      if (!pad.on && p.ground && Math.abs(p.x - pad.x) < 0.7 && Math.abs(p.y - pad.y) < 0.05) {
        pad.on = true;
        w.checkpoint = { x: pad.x, y: pad.y };
        if (mode === "play") kit.toast("Checkpoint!", "#7dffb0");
        emit("ring", pad.x, pad.y - 0.3, 1, { color: "#7dffb0" });
        kit.sound.play("coin");
      }
    }
    const c = center(p);
    for (const s of L.sparks) {
      if (!s.got && Math.hypot(s.x - c.x, s.y - c.y) < 0.75) {
        s.got = true;
        stats.sparks += 1;
        if (mode === "play") kit.addScore(10);
        emit("star", s.x, s.y, mode === "bench" ? 14 : 7, { speed: 4, color: "#ffe066" });
        emit("ring", s.x, s.y, 1, { color: "#fff4b8" });
        kit.sound.play("coin");
      }
    }
    for (const cell of L.cells) {
      if (!cell.got && Math.hypot(cell.x - c.x, cell.y - c.y) < 0.85) {
        cell.got = true;
        stats.cells += 1;
        if (mode === "play") {
          kit.addScore(50);
          kit.toast(`Power cell ${L.cells.filter((k) => k.got).length}/3! +50`, "#7dffb0");
          updateHud();
        }
        emit("star", cell.x, cell.y, 16, { speed: 6, color: "#7dffb0" });
        emit("ring", cell.x, cell.y, 2, { color: "#7dffb0" });
        kit.sound.play("win");
        kit.haptic(20);
      }
    }
    if (w.invuln <= 0) {
      for (const wtr of L.water) {
        if (p.x > wtr.x0 + 0.1 && p.x < wtr.x1 - 0.1 && p.y > wtr.y + 0.3) zap("Splash! Telly fizzed.", true);
      }
      for (const sp of L.sparkers) {
        if (sp.active && Math.abs(p.x - sp.x - 0.5) < 0.35 + p.w / 2 && p.y > sp.y - sp.h && p.y - p.h < sp.y) zap("Bzzt! Mind the sparks.");
      }
    }
    if (p.y > BOTTOM + 3) zap("Down the hole! Telly lost a battery.");
    if (mode === "bench" && w.trail.length < 2000) w.trail.push({ x: c.x, y: c.y });
    // Afterimages when Telly really flies.
    if (Math.hypot(p.vx, p.vy) > 10 && Math.random() < dt * 40) w.ghosts.push({ x: p.x, y: p.y, tilt: p.tilt, dir: p.dir, life: 0.25 });
    stepCord(dt);
  }

  // Telly's springy body: squash and stretch, lean, antennae.
  function stepBody(dt) {
    const p = world.p;
    const target = p.ground ? 1 : 1 + clamp(Math.abs(p.vy) * 0.007, 0, 0.12);
    p.syV += (-(p.sy - target) * 260 - p.syV * 14) * dt;
    p.sy = clamp(p.sy + p.syV * dt, 0.62, 1.3);
    const r = world.rope;
    let lean;
    if (r) {
      const a = ropeAnchor(r);
      lean = clamp(-(center(p).x - a.x) * 0.2, -0.7, 0.7);
    } else {
      lean = clamp(p.vx * 0.022, -0.14, 0.14) + (p.ground ? 0 : clamp(p.vy * 0.01, -0.08, 0.08) * p.dir);
    }
    p.tilt = lerp(p.tilt, lean, Math.min(1, dt * 12));
    for (let i = 0; i < 2; i++) {
      const force = -p.ant[i] * 160 - p.antV[i] * 9 - (p.vx - (p.lastVx || 0)) * (i ? 3 : 2.4) - (p.vy - (p.lastVy || 0)) * 0.6 * p.dir;
      p.antV[i] += force * dt;
      p.ant[i] = clamp(p.ant[i] + p.antV[i] * dt, -0.7, 0.7);
    }
    p.lastVx = p.vx;
    p.lastVy = p.vy;
    p.blink -= dt;
    if (p.blink < -0.12) p.blink = 2 + Math.random() * 3;
    for (let i = world.ghosts.length - 1; i >= 0; i--) {
      world.ghosts[i].life -= dt;
      if (world.ghosts[i].life <= 0) world.ghosts.splice(i, 1);
    }
  }

  function pumpRope(dir, dt) {
    const w = world;
    const p = w.p;
    const r = w.rope;
    const a = ropeAnchor(r);
    const c = center(p);
    const angle = Math.atan2(c.x - a.x, c.y - a.y);
    const tx = Math.cos(angle);
    const ty = -Math.sin(angle);
    if (dir) {
      // ◀ ▶ push along the swing, the way a kid pumps a swing.
      p.vx += tx * PUMP * dt * dir;
      p.vy += ty * PUMP * dt * dir;
      p.dir = dir;
    } else if (input.cord) {
      // Holding on with no direction keeps the swing going the way it goes.
      const s = p.vx * tx + p.vy * ty >= 0 ? 1 : -1;
      p.vx += tx * PUMP * 0.5 * dt * s;
      p.vy += ty * PUMP * 0.5 * dt * s;
    }
    // A little air drag, so swings settle rather than run forever.
    p.vx *= 1 - dt * 0.05;
    p.vy *= 1 - dt * 0.05;
    if (r.shoot > 0) r.shoot -= dt;
  }

  /* The cord wraps round the corners of blocks it swings past, and unwraps
   * when Telly swings back: each corner becomes a new pivot, and the swing
   * carries on round it with the cord that is left. */
  function convexCorner(tx, ty) {
    const L = world.L;
    const tl = L.tile(tx - 1, ty - 1) === 1;
    const tr = L.tile(tx, ty - 1) === 1;
    const bl = L.tile(tx - 1, ty) === 1;
    const br = L.tile(tx, ty) === 1;
    const n = tl + tr + bl + br;
    if (n !== 1) return null;
    // Push the pivot a hair out from the block so the cord sits on its edge.
    const ox = tl || bl ? 0.05 : -0.05;
    const oy = tl || tr ? 0.05 : -0.05;
    return { x: tx + ox, y: ty + oy };
  }

  function cross(ax, ay, bx, by) {
    return ax * by - ay * bx;
  }

  function cornerInSweep(A, c0, c1) {
    const area = cross(c0.x - A.x, c0.y - A.y, c1.x - A.x, c1.y - A.y);
    if (Math.abs(area) < 1e-7) return null;
    const side = Math.sign(area);
    const x0 = Math.floor(Math.min(A.x, c0.x, c1.x));
    const x1 = Math.ceil(Math.max(A.x, c0.x, c1.x));
    const y0 = Math.floor(Math.min(A.y, c0.y, c1.y));
    const y1 = Math.ceil(Math.max(A.y, c0.y, c1.y));
    let best = null;
    let bestT = Infinity;
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const k = convexCorner(tx, ty);
        if (!k) continue;
        if (Math.hypot(k.x - A.x, k.y - A.y) < 0.3) continue;
        // Strictly inside the triangle swept this step.
        const d1 = cross(c0.x - A.x, c0.y - A.y, k.x - A.x, k.y - A.y) * side;
        const d2 = cross(c1.x - c0.x, c1.y - c0.y, k.x - c0.x, k.y - c0.y) * side;
        const d3 = cross(A.x - c1.x, A.y - c1.y, k.x - c1.x, k.y - c1.y) * side;
        if (d1 <= 1e-6 || d2 <= 1e-6 || d3 <= 1e-6) continue;
        // The first corner the sweeping cord meets.
        const tt = d1 / Math.hypot(k.x - A.x, k.y - A.y);
        if (tt < bestT) {
          bestT = tt;
          best = { x: k.x, y: k.y, side };
        }
      }
    }
    return best;
  }

  function constrainRope(c0) {
    const w = world;
    const p = w.p;
    const r = w.rope;
    let c = center(p);
    // Unwrap: Telly swung back past the line through the last corner.
    if (r.pivots.length) {
      const k = r.pivots[r.pivots.length - 1];
      const prev = r.pivots.length > 1 ? r.pivots[r.pivots.length - 2] : hookPos(r.hook, w.t);
      if (cross(k.x - prev.x, k.y - prev.y, c.x - k.x, c.y - k.y) * k.side < 0) {
        r.pivots.pop();
        r.L += k.seg;
        r.accum = 0;
        r.angle = Math.atan2(c.x - prev.x, c.y - prev.y);
      }
    }
    // Wrap: the cord swept across a block corner this step.
    const A = ropeAnchor(r);
    const k = cornerInSweep(A, c0, c);
    if (k && r.L - Math.hypot(k.x - A.x, k.y - A.y) > 0.35) {
      k.seg = Math.hypot(k.x - A.x, k.y - A.y);
      r.pivots.push(k);
      r.L -= k.seg;
      r.accum = 0;
      r.angle = Math.atan2(c.x - k.x, c.y - k.y);
      emit("spark", k.x, k.y, 6, { speed: 3, color: "#ffe066" });
      kit.sound.play("tap");
    }
    const a = ropeAnchor(r);
    let dx = c.x - a.x;
    let dy = c.y - a.y;
    const d = Math.hypot(dx, dy) || 0.0001;
    if (d > r.L) {
      const nx = dx / d;
      const ny = dy / d;
      p.x -= nx * (d - r.L);
      p.y -= ny * (d - r.L);
      const out = p.vx * nx + p.vy * ny;
      if (out > 0) {
        p.vx -= out * nx;
        p.vy -= out * ny;
      }
      dx = nx * r.L;
      dy = ny * r.L;
    }
    const angle = Math.atan2(dx, dy);
    let delta = angle - r.angle;
    if (delta > Math.PI) delta -= TAU;
    if (delta < -Math.PI) delta += TAU;
    r.angle = angle;
    r.accum += delta;
    r.still = Math.hypot(p.vx, p.vy) < 0.8 ? r.still + STEP : 0;
    if (Math.abs(r.accum) >= TAU && !r.pivots.length) {
      // Right round the hook: the cord coils and Telly speeds up.
      r.accum -= Math.sign(r.accum) * TAU;
      r.wraps += 1;
      stats.wraps += 1;
      const before = r.L;
      r.L = Math.max(LMIN, r.L * 0.82);
      const kk = Math.min(1.25, before / r.L);
      p.vx *= kk;
      p.vy *= kk;
      if (mode === "play") kit.addScore(25);
      const hp = hookPos(r.hook, w.t);
      emit("star", hp.x, hp.y, 12, { speed: 5, color: "#ffe066" });
      emit("ring", hp.x, hp.y, 1, { color: "#ffe066" });
      const s = toScreen(hp.x, hp.y);
      kit.fx.text(s.x, s.y - 20, "WRAP! +25", { color: "#ffe066", size: 20 });
      kit.sound.play("combo", r.wraps);
      kit.haptic(15);
    }
  }

  function zap(why, splash) {
    const w = world;
    if (w.zap > 0) return;
    w.rope = null;
    w.plug = null;
    w.zap = 0.9;
    w.p.face = "zap";
    const c = center(w.p);
    if (splash) emit("drop", c.x, Math.min(c.y, BOTTOM), 22, { speed: 6, vy: -6 });
    else emit("spark", c.x, Math.min(c.y, BOTTOM), 22, { speed: 7, color: "#bfefff" });
    kit.sound.play("bad");
    kit.shake(9, 0.3);
    kit.haptic(40);
    if (mode !== "play") return;
    batteries -= 1;
    updateHud();
    kit.toast(why, "#ffd166");
  }

  function respawn() {
    const w = world;
    if (mode === "play" && batteries <= 0) {
      kit.gameOver({
        reason: "Out of battery!",
        emoji: "🪫",
        stats: [["Rooms", stats.rooms], ["Stars", stats.stars], ["Sparks", stats.sparks], ["Wraps", stats.wraps]],
      });
      return;
    }
    const p = w.p;
    p.x = p.px = w.checkpoint.x;
    p.y = p.py = w.checkpoint.y;
    p.vx = p.vy = 0;
    p.ground = true;
    p.face = "happy";
    w.invuln = 1.2;
    w.cord = makeCord();
    emit("ring", p.x, p.y - 0.4, 2, { color: "#7fd6ff" });
  }

  const STAR_KEY = "fk:family-telly-swing:stars";
  function bestStars() {
    try {
      return JSON.parse(localStorage.getItem(STAR_KEY) || "{}") || {};
    } catch (_) {
      return {};
    }
  }

  function roomDone() {
    const w = world;
    stats.rooms += 1;
    if (mode === "play") {
      const cells = w.L.cells.filter((c) => c.got).length;
      const quick = roomTime <= w.L.par;
      const stars = 1 + (cells === 3 ? 1 : 0) + (quick ? 1 : 0);
      stats.stars += stars;
      const fast = Math.max(0, Math.round((w.L.par - roomTime) * 4));
      const points = 200 + stars * 100 + fast;
      kit.addScore(points);
      kit.toast(`${"★".repeat(stars)}${"☆".repeat(3 - stars)} ${w.L.def.name}! +${points}`, "#7dffb0");
      const best = bestStars();
      const key = String(w.L.n % ROOMS.length);
      if ((best[key] || 0) < stars) {
        best[key] = stars;
        try {
          localStorage.setItem(STAR_KEY, JSON.stringify(best));
        } catch (_) {
          /* storage blocked */
        }
      }
      if (batteries < BATTERIES) batteries += 1;
    }
    const next = w.L.n + 1;
    if (mode === "demo") newWorld(next % 2);
    else if (mode === "bench") newWorld(1);
    else newWorld(next);
    updateHud();
    if (mode === "play") kit.toast(`Room ${next + 1}: ${world.L.def.name}`, "#ffe9c4");
  }

  /* ---------------- the autopilot: attract screen, benchmark and tests ---------------- */
  function autopilot(dt) {
    const w = world;
    const p = w.p;
    input.left = false;
    input.right = true;
    input.jump = p.vy < 0 && !p.ground;
    if (w.rope) {
      const hp = hookPos(w.rope.hook, w.t);
      const c = center(p);
      input.cord = true;
      if (mode === "bench" && w.rope.wraps < 1 && w.L.hooks.indexOf(w.rope.hook) % 3 === 0) return;
      const landing = floorBelow(c.x + 1, p.y, 6) !== null;
      if ((c.x - hp.x > w.rope.L * 0.5 && p.vy < 1.5) || c.x - hp.x > w.rope.L * 0.85 || w.rope.still > 1.5 || (landing && c.x > hp.x + 0.5 && p.vy < 0)) {
        input.cord = false;
        input.cordReleased = true;
      }
      return;
    }
    input.cord = false;
    if (w.plug) return;
    const s = nearSocket();
    if (s && !powered(s) && s.x > p.x - 1.2) {
      input.cordPressed = true;
      return;
    }
    if (nearExit()) {
      input.cordPressed = true;
      return;
    }
    const h = bestHook();
    const hp = h ? hookPos(h, w.t) : null;
    if (p.ground) {
      const ahead = p.x + 0.9;
      const gap = floorBelow(ahead, p.y, 4) === null || w.L.water.some((q) => ahead > q.x0 && ahead < q.x1 && Math.abs(q.y - p.y) < 0.1);
      const wall = solidAt(p.x + 0.6, p.y - 0.5) || solidAt(p.x + 0.6, p.y - 1.4);
      if (gap || wall) {
        if (gap && hp && hp.x > p.x + 0.5) input.cordPressed = true;
        else input.jumpPressed = true;
      }
    } else if (p.vy > 1 && hp && hp.x > p.x + 0.8 && floorBelow(p.x, p.y, 3) === null) {
      input.cordPressed = true;
    }
    // On the attract screen a stuck Telly hops on to the next pad.
    const prog = w.progress;
    if (p.x > prog.x + 0.4) {
      prog.x = p.x;
      prog.t = 0;
    } else {
      prog.t += dt;
      if (prog.t > 4 && (mode !== "play" || auto)) {
        prog.t = 0;
        w.skips += 1;
        const next = w.L.pads.find((pd) => pd.x > p.x + 1) || w.L.exit;
        p.x = p.px = next.x;
        p.y = p.py = next.y;
        p.vx = p.vy = 0;
        w.rope = null;
        prog.x = p.x;
      }
    }
  }

  /* ---------------- the power cord: a little chain of points ---------------- */
  const CORD_N = 16;
  function makeCord() {
    const pts = [];
    const p = world ? world.p : { x: 2, y: 11, dir: 1 };
    for (let i = 0; i < CORD_N; i++) pts.push({ x: p.x - p.dir * (0.4 + i * 0.1), y: p.y - 0.25, px: p.x - p.dir * (0.4 + i * 0.1), py: p.y - 0.25 });
    return pts;
  }

  function cordAnchor(x, y, dir) {
    return { x: x - dir * 0.4, y: y - 0.3 };
  }

  // The cord's path while it is on a hook: Telly, each wrapped corner, the hook.
  function ropePath(ax, ay) {
    const r = world.rope;
    const hp = hookPos(r.hook, world.t);
    const path = [{ x: ax, y: ay }];
    for (let i = r.pivots.length - 1; i >= 0; i--) path.push(r.pivots[i]);
    path.push(hp);
    if (r.shoot > 0) {
      // The plug flies out to the hook.
      const k = 1 - r.shoot / 0.08;
      const last = path.length - 1;
      path[last] = { x: lerp(path[last - 1].x, hp.x, k), y: lerp(path[last - 1].y, hp.y, k) };
    }
    return path;
  }

  function stepCord(dt) {
    const w = world;
    const pts = w.cord;
    const p = w.p;
    const a = cordAnchor(p.x, p.y, p.dir);
    if (w.rope) {
      // Lay the chain along the taut path so letting go starts from there.
      const path = ropePath(a.x, a.y);
      const lens = [];
      let total = 0;
      for (let i = 1; i < path.length; i++) {
        const l = Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
        lens.push(l);
        total += l;
      }
      for (let i = 0; i < CORD_N; i++) {
        let d = (total * i) / (CORD_N - 1);
        let k = 0;
        while (k < lens.length - 1 && d > lens[k]) {
          d -= lens[k];
          k += 1;
        }
        const f = lens[k] ? clamp(d / lens[k], 0, 1) : 0;
        const q = pts[i];
        q.px = q.x;
        q.py = q.y;
        q.x = lerp(path[k].x, path[k + 1].x, f);
        q.y = lerp(path[k].y, path[k + 1].y, f);
      }
      return;
    }
    let endPin = null;
    let seg = 0.11;
    if (w.plug) {
      const s = w.plug.target;
      const k = clamp(w.plug.t / (w.plug.dur * 0.8), 0, 1);
      const sx = s.x + (w.plug.exit ? -0.45 : -0.32);
      const sy = s.y - (w.plug.exit ? 1.25 : 0.72);
      endPin = { x: lerp(pts[CORD_N - 1].x, sx, k), y: lerp(pts[CORD_N - 1].y, sy, k) };
      seg = Math.max(0.11, (Math.hypot(sx - a.x, sy - a.y) * 1.15) / (CORD_N - 1));
    } else if (w.flick > 0) {
      const k = Math.sin((1 - w.flick / 0.3) * Math.PI);
      endPin = { x: a.x + p.dir * 2.6 * k, y: a.y - 1.6 * k };
      seg = 0.2;
    }
    const g = 30 * dt * dt;
    const fan = inWind({ x: a.x, y: a.y + 0.3, h: 0.6 });
    for (let i = 1; i < CORD_N; i++) {
      const q = pts[i];
      const vx = (q.x - q.px) * 0.96;
      const vy = (q.y - q.py) * 0.96;
      q.px = q.x;
      q.py = q.y;
      q.x += vx;
      // In a fan's wind the cord flutters instead of hanging.
      q.x += fan ? Math.sin(w.t * 20 + i) * 0.004 : 0;
      q.y += vy + (fan ? -g * 0.4 : g);
    }
    for (let it = 0; it < 6; it++) {
      pts[0].x = a.x;
      pts[0].y = a.y;
      if (endPin) {
        pts[CORD_N - 1].x = endPin.x;
        pts[CORD_N - 1].y = endPin.y;
      }
      for (let i = 0; i < CORD_N - 1; i++) {
        const q = pts[i];
        const r = pts[i + 1];
        const dx = r.x - q.x;
        const dy = r.y - q.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const diff = (d - seg) / d;
        const wq = i === 0 ? 0 : 0.5;
        const wr = i + 1 === CORD_N - 1 && endPin ? 0 : 0.5;
        const sum = wq + wr || 1;
        q.x += dx * diff * (wq / sum);
        q.y += dy * diff * (wq / sum);
        r.x -= dx * diff * (wr / sum);
        r.y -= dy * diff * (wr / sum);
      }
      // The trailing cord lies on the floor rather than through it.
      for (let i = 1; i < CORD_N; i++) {
        const q = pts[i];
        const v = w.L.tile(Math.floor(q.x), Math.floor(q.y));
        if (v === 1) {
          q.y = Math.floor(q.y) - 0.03;
          q.px = lerp(q.px, q.x, 0.5);
        }
      }
    }
  }

  /* ---------------- particles, in world units ---------------- */
  function emit(kind, x, y, n, o) {
    if (!world) return;
    const opt = o || {};
    const parts = world.parts;
    for (let i = 0; i < n && parts.length < 420; i++) {
      const a = Math.random() * TAU;
      const sp = (opt.speed || 2) * (0.4 + Math.random() * 0.8);
      const q = {
        kind, x, y,
        vx: (opt.vx || 0) + Math.cos(a) * sp,
        vy: (opt.vy || 0) + Math.sin(a) * sp - (kind === "dust" ? sp * 0.6 : 0),
        life: 0, max: 0.4 + Math.random() * 0.4, size: 0.08 + Math.random() * 0.1, color: opt.color || "#ffffff",
      };
      if (kind === "dust") { q.vy = -Math.random() * (opt.speed || 2) * 0.6 + (opt.vy || 0); q.vx = (opt.vx || 0) + (Math.random() - 0.5) * (opt.speed || 2) * 1.6; q.size = 0.1 + Math.random() * 0.12; q.max = 0.45 + Math.random() * 0.3; }
      if (kind === "ring") { q.vx = q.vy = 0; q.max = 0.45 + i * 0.12; q.size = 0.2; }
      if (kind === "smoke") { q.vx *= 0.3; q.vy = -1 - Math.random(); q.size = 0.15; q.max = 0.8; }
      if (kind === "drop") { q.size = 0.06 + Math.random() * 0.06; q.max = 0.7; }
      parts.push(q);
    }
  }
  function stepParticles(dt) {
    const w = world;
    const parts = w.parts;
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.life += dt;
      if (q.life >= q.max) {
        parts.splice(i, 1);
        continue;
      }
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      if (q.kind === "spark" || q.kind === "drop") q.vy += 22 * dt;
      else if (q.kind === "star") q.vy += 4 * dt;
      else if (q.kind === "dust") { q.vx *= 1 - dt * 3; q.vy += 2.5 * dt; }
      if (q.kind === "spark" || q.kind === "drop") {
        // Bounce off floors once, then settle.
        if (w.L.tile(Math.floor(q.x), Math.floor(q.y)) === 1 && q.vy > 0) {
          q.y = Math.floor(q.y) - 0.01;
          q.vy *= -0.35;
          q.vx *= 0.6;
        }
      }
    }
    for (const f of w.L.fans) {
      if (f.spin > 0.3 && Math.random() < dt * 30 * f.spin && w.wind.length < 120) {
        w.wind.push({ x: f.x + (Math.random() - 0.5) * 1.3, y: f.y - 0.2, len: 0.4 + Math.random() * 0.7, top: f.y - f.h, v: 7 + Math.random() * 5 });
      }
    }
    for (let i = w.wind.length - 1; i >= 0; i--) {
      const s = w.wind[i];

  function anchorY() {

  /* ---------- parallax layers: painted once per theme ---------- */

  function drawStrip(theme, layer) {

  function getVignette() {

  // A soft round glow, cached per colour, drawn with "lighter".
