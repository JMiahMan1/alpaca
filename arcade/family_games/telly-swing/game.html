<!doctype html>

    font-size: 14px; font-weight: 800; cursor: pointer; color: #2a2140; display: inline-flex; align-items: center; justify-content: center; }
  .ts-room-pick span { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<script>
(function () {
  "use strict";
  const FK = window.FamilyKit;
  const { clamp, lerp, roundRect } = FK;
  const TAU = Math.PI * 2;

  /* ---------------- physics, in tiles and seconds (y grows downward) ---------------- */
  const G_UP = 42;          // gravity while rising with jump held
  const G_DOWN = 66;        // falling, or jump let go early (short hops)
  const APEX = 0.55;        // near the top of a held jump, gravity eases off: a floaty peak
  const MAX_FALL = 24;
  const RUN = 6.2;
  const PUSH_RUN = 2.6;     // pushing a crate is slow going
  const ACC_GROUND = 48;
  const ACC_AIR = 30;
  const FRICTION = 44;
  const JUMP_V = -Math.sqrt(2 * G_UP * 3.4);   // about 3.4 tiles up, 4.5 across
  const SPRING_V = -Math.sqrt(2 * G_UP * 6.4);
  const COYOTE = 0.1;       // a jump still works just after running off a ledge
  const BUFFER = 0.14;      // and just before landing
  const RANGE = 7.6;        // how far the cord reaches for a hook
  const LMAX = 5;
  const LMIN = 1.6;
  const SWING_TO = 0.95;    // a throw always swings Telly at least this far past the hook
  const PUMP = 11;          // ◀ ▶ push the swing along
  const PW = 0.78;
  const PH = 0.86;
  const WIND = 125;
  const WIND_MAX = 7.5;
  const STEP = 1 / 120;
  const BATTERIES = 3;
  const BOTTOM = 15;        // the lowest row of every room
  const EPS = 1e-5;

  const kit = FK.create({
    slug: "family-telly-swing",
    title: "Telly Swing",
    tagline: "Swing, plug in and power your way home!",
    emoji: "📺",
    accent: "#ff8a2a",
    accent2: "#7b6cff",
    scoreLabel: "Score",
    howTo: [
      ["🕹️", "◀ ▶ roll, ⤒ jumps (arrows and Space)."],
      ["🌀", "🔌 at a hook: hold to swing, let go to fly."],
      ["🔌", "🔌 at a socket powers doors, lifts and fans."],
      ["🔋", "Get 3 🔋, then plug into the gold outlet."],
    ],
    onStart: () => startGame(),
    onPause: () => clearInput(),
    onResume: () => clearInput(),
  });

  /* ---------------- looks: one per room ---------------- */
  const THEMES = {
    living: { name: "Living Room", bg: "home", sky: ["#ffe9cf", "#ffc6d6"], far: "#f2b9b5", mid: "#d98f8f", detail: "#fff3e3",
      top: "#e8875a", topHi: "#ffb48a", body: "#b9774a", side: "#8e5530", line: "#7a4626", tex: "planks", deco: "rug", light: "#fff3d6" },
    kitchen: { name: "Kitchen", bg: "kitchen", sky: ["#e2f6ff", "#c2dcff"], far: "#b9d3f0", mid: "#93b4dc", detail: "#f4fbff",
      top: "#f6fbff", topHi: "#ffffff", body: "#9cc3d8", side: "#6e98b0", line: "#5d849c", tex: "tiles", deco: "shine", light: "#ffffff" },
    garage: { name: "Garage", bg: "garage", sky: ["#d9d4f6", "#f7dcc0"], far: "#bdb6d9", mid: "#9a93ba", detail: "#efe9ff",
      top: "#aab4c6", topHi: "#d5dceb", body: "#7a8296", side: "#596073", line: "#474d5e", tex: "metal", deco: "stripes", light: "#fff8e6" },
    garden: { name: "Garden", bg: "garden", sky: ["#bfeeff", "#ecffd9"], far: "#a6dcb0", mid: "#78c08a", detail: "#e6ffe0",
      top: "#6cc24a", topHi: "#9be26f", body: "#8a5b3b", side: "#6a4229", line: "#553220", tex: "soil", deco: "grass", light: "#fffbd0" },
    roofs: { name: "Rooftops", bg: "city", sky: ["#ff9c8a", "#ffd977"], far: "#e59a8c", mid: "#c26d70", detail: "#ffe7b0",
      top: "#cc5f47", topHi: "#ef8a6a", body: "#a1786a", side: "#7c574b", line: "#5f3f35", tex: "bricks", deco: "roof", light: "#fff0c9" },
    workshop: { name: "Workshop", bg: "workshop", sky: ["#3b3561", "#7b5a7c"], far: "#3d3660", mid: "#2b2547", detail: "#ffd98a",

    dusk: { name: "Back Yard", bg: "garden", sky: ["#6f5cc9", "#ff9f80"], far: "#6a4e9a", mid: "#4b3577", detail: "#ffe2a8",
      top: "#4f9a46", topHi: "#76c062", body: "#6b4a37", side: "#4d3324", line: "#3b2519", tex: "soil", deco: "grass", light: "#ffe2a8", dark: 0.32 },

      top: "#dfe3ff", topHi: "#ffffff", body: "#9aa1dc", side: "#7279b8", line: "#5c62a0", tex: "tiles", deco: "shine", light: "#fff7c2", night: true, dark: 0.55 },
  };

  /* ---------------- the rooms, built by hand ----------------
   * Coordinates are tiles: x to the right, y downward; a ground's "top" is
   * the row Telly stands on. Every room has exactly three power cells. */
  function builder() {
    const L = {
      solids: [], ledges: [], water: [], hooks: [], sparks: [], cells: [], pads: [], springs: [], boosters: [], crates: [],
      baddies: [], sparkers: [], sockets: [], doors: [], lifts: [], fans: [], bridges: [], plates: [], start: { x: 2, y: 11 }, exit: null,
    };
    const b = {
      L,
      ground: (x0, x1, top) => L.solids.push([x0, x1, top, BOTTOM + 1]),
      block: (x0, x1, y0, y1) => L.solids.push([x0, x1, y0, y1]),
      ledge: (x0, x1, y) => L.ledges.push([x0, x1, y]),
      water: (x0, x1, y) => {
        L.water.push({ x0, x1, y });
        L.solids.push([x0, x1, y + 1, BOTTOM + 1]);
      },
      start: (x, y) => { L.start = { x, y }; },
      exit: (x, y) => { L.exit = { x, y }; },
      pad: (x, y) => L.pads.push({ x, y, on: false }),
      spark: (x, y) => L.sparks.push({ x, y, got: false }),
      sparks: (list) => list.forEach(([x, y]) => L.sparks.push({ x, y, got: false })),
      cell: (x, y) => L.cells.push({ x, y, got: false }),
      hook: (x, y, o) => L.hooks.push({ bx: x, by: y, ax: (o && o.ax) || 0, ay: (o && o.ay) || 0, sp: (o && o.sp) || 1, ph: (o && o.ph) || 0 }),
      spring: (x, y) => L.springs.push({ x, y, squash: 0 }),
      booster: (x, y, vx, vy) => L.boosters.push({ x, y, vx: vx || 13.2, vy: vy || -15.8, pulse: 0, cool: 0 }),
      crate: (x, y) => L.crates.push({ hx: x, hy: y }),
      baddie: (x, y, x0, x1, kind) => L.baddies.push({
        x, y, hx: x, hy: y, x0, x1, kind: kind || "bug", dir: 1, vx: 0, vy: 0,
        w: 0.84, h: kind === "roller" ? 0.96 : kind === "hopper" ? 1.02 : 0.74,
        walk: 0, pause: 0, squash: 0, hopT: 0, dead: false, deadT: 0, spin: 0,
      }),
      sparker: (x, y, phase) => L.sparkers.push({ x, y, h: 2.7, phase: phase || 0 }),
      socket: (x, y, time) => {
        const s = { kind: "socket", x, y, time: time || 0, left: 0, latched: false };
        L.sockets.push(s);
        return s;
      },
      plate: (x0, x1, y) => {
        const p = { kind: "plate", x0, x1, y, pressed: false, depth: 0 };
        L.plates.push(p);
        return p;
      },
      door: (x, y0, y1, by) => L.doors.push({ x, y0, y1, by, open: 0 }),
      lift: (x0, x1, yDown, yUp, by) => L.lifts.push({ x0, x1, yDown, yUp, y: yDown, by, dy: 0, dx: 0 }),
      mover: (x0, x1, y, o) => L.lifts.push({
        x0, x1, bx0: x0, bx1: x1, yDown: y, yUp: y, y, by: null, dy: 0, dx: 0,
        mover: true, ax: (o && o.ax) || 0, ay: (o && o.ay) || 0, sp: (o && o.sp) || 1.2, ph: (o && o.ph) || 0,
      }),
      fan: (x, y, h, by) => L.fans.push({ x, y, h, by, spin: 0, a: 0 }),
      bridge: (x0, x1, y, by) => L.bridges.push({ x0, x1, y, by, ext: 0 }),
    };
    return b;
  }

    {

        b.crate(8, 11);

    {

    {

      build(b) {

        b.sparker(8, 11, 0);

    {
      name: "Clockwork Climb", theme: "living", par: 80,
      build(b) {

        b.baddie(8.5, 11, 5.5, 11.2, "bug");

        b.ground(60, 74, 7); b.pad(62, 7);

  /* ---------------- building a room into a grid ---------------- */
  function buildRoom(n) {
    const def = ROOMS[n % ROOMS.length];
    const b = builder();
    def.build(b);
    const L = b.L;
    L.n = n;
    L.def = def;
    L.theme = THEMES[def.theme];
    L.par = def.par;
    let width = 0;
    for (const s of L.solids) width = Math.max(width, s[1]);
    L.w = width + 6;
    L.h = BOTTOM + 1;
    L.top = -6;
    const rows = L.h - L.top;
    L.grid = new Uint8Array(L.w * rows);
    const set = (x, y, v) => {
      if (x < 0 || x >= L.w || y < L.top || y >= L.h) return;
      L.grid[(y - L.top) * L.w + x] = v;
    };
    for (const [x0, x1, y0, y1] of L.solids) for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) set(x, y, 1);
    for (const [x0, x1, y] of L.ledges) for (let x = x0; x < x1; x++) set(x, y, 2);
    for (const wtr of L.water) for (let x = wtr.x0; x < wtr.x1; x++) set(x, wtr.y, 0);
    // Below the last row the ground carries on (and holes stay holes), so a
    // tall screen never shows sky under the floor.
    L.tile = (x, y) => (x < 0 || x >= L.w || y < L.top ? 0 : L.grid[(Math.min(y, L.h - 1) - L.top) * L.w + x]);
    L.crates = L.crates.map((c) => ({ x: c.hx + 0.5, y: c.hy, w: 0.96, h: 0.96, vx: 0, vy: 0, ground: false, hx: c.hx + 0.5, hy: c.hy, isCrate: true, tilt: 0 }));
    return L;
  }

  /* ---------------- the world ---------------- */
  let world = null;
  let mode = "demo";        // demo | play | bench
  let auto = false;
  const stats = { sparks: 0, cells: 0, wraps: 0, rooms: 0, stars: 0, baddies: 0 };
  let batteries = BATTERIES;
  let roomTime = 0;
  const input = { left: false, right: false, jump: false, cord: false, jumpPressed: false, cordPressed: false, cordReleased: false };

  function clearInput() {
    input.left = input.right = input.jump = input.cord = false;
    input.jumpPressed = input.cordPressed = input.cordReleased = false;
    touches.clear();
  }

  function newWorld(n) {
    const L = buildRoom(n);
    world = {
      L,
      t: 0,
      acc: 0,
      p: {
        x: L.start.x, y: L.start.y, px: L.start.x, py: L.start.y, w: PW, h: PH, vx: 0, vy: 0, ground: true, on: null, dir: 1, faceDir: 1,
        coyote: 0, buffer: 0, sy: 1, syV: 0, tilt: 0, walk: 0, face: "happy", worried: false, pushing: false, pulling: null, flung: false,
        hover: 0.45, hovering: false, ropeBlend: 0, spin: 0,
        ant: [0, 0], antV: [0, 0], blink: 2,
      },
      rope: null,
      plug: null,
      plugAngle: 0,
      plugAV: 0,
      unplug: null,
      finishing: 0,
      zap: 0,
      invuln: 0,
      flick: 0,
      checkpoint: { x: L.start.x, y: L.start.y },
      cam: { x: L.start.x + 2, y: L.start.y - 2, z: 1 },
      parts: [],
      wind: [],
      cord: null,
      progress: { x: L.start.x, t: 0 },
      trail: [],
      ghosts: [],
      skips: 0,
    };
    world.cord = makeCord();
    roomTime = 0;
    chunks.clear();
    return world;
  }

  /* ---------------- solids and collisions ---------------- */
  function doorRect(d) {
    if (d.open >= 0.98) return null;
    const h = (d.y1 - d.y0) * (1 - d.open);
    return { x: d.x + 0.08, y: d.y0, w: 0.84, h };
  }
  function bridgeRect(br) {
    if (br.ext <= 0.02) return null;
    return { x: br.x0, y: br.y, w: (br.x1 - br.x0) * br.ext, h: 0.4 };
  }

  // Calls fn(rect) for every solid that overlaps the box [l,r]x[t,b]; a
  // false return stops the walk. A rect is {x,y,w,h, oneWay?, crate?, lift?}.
  const tmpRect = { x: 0, y: 0, w: 1, h: 1, oneWay: false, crate: null, lift: null };
  function eachSolid(l, t, r, b, self, fn) {
    const L = world.L;
    for (let ty = Math.floor(t); ty <= Math.floor(b - EPS); ty++) {
      for (let tx = Math.floor(l); tx <= Math.floor(r - EPS); tx++) {
        const v = L.tile(tx, ty);
        if (!v) continue;
        tmpRect.x = tx; tmpRect.y = ty; tmpRect.w = 1; tmpRect.h = v === 2 ? 0.3 : 1;
        tmpRect.oneWay = v === 2; tmpRect.crate = null; tmpRect.lift = null;
        if (fn(tmpRect) === false) return;
      }
    }
    if (l < 0) {
      // The room's left edge is a wall.
      if (fn({ x: -5, y: -50, w: 5, h: 100, oneWay: false, crate: null, lift: null }) === false) return;
    }
    for (const d of L.doors) {
      const rc = doorRect(d);
      if (rc && rc.x < r && rc.x + rc.w > l && rc.y < b && rc.y + rc.h > t && fn({ ...rc, oneWay: false }) === false) return;
    }
    for (const br of L.bridges) {
      const rc = bridgeRect(br);
      if (rc && rc.x < r && rc.x + rc.w > l && rc.y < b && rc.y + rc.h > t && fn({ ...rc, oneWay: false }) === false) return;
    }
    for (const lf of L.lifts) {
      const rc = { x: lf.x0, y: lf.y, w: lf.x1 - lf.x0, h: 0.45, oneWay: false, lift: lf };
      if (rc.x < r && rc.x + rc.w > l && rc.y < b && rc.y + rc.h > t && fn(rc) === false) return;
    }
    for (const c of L.crates) {
      if (c === self) continue;
      const rc = { x: c.x - c.w / 2, y: c.y - c.h, w: c.w, h: c.h, oneWay: false, crate: c };
      if (rc.x < r && rc.x + rc.w > l && rc.y < b && rc.y + rc.h > t && fn(rc) === false) return;
    }
  }

  function overlaps(bd, rc) {
    return bd.x - bd.w / 2 < rc.x + rc.w - EPS && bd.x + bd.w / 2 > rc.x + EPS && bd.y - bd.h < rc.y + rc.h - EPS && bd.y > rc.y + EPS;
  }

  function boxFree(bd, x, y) {
    let free = true;
    eachSolid(x - bd.w / 2, y - bd.h, x + bd.w / 2, y, bd, (rc) => {
      if (rc.oneWay) return true;
      if (x - bd.w / 2 < rc.x + rc.w - EPS && x + bd.w / 2 > rc.x + EPS && y - bd.h < rc.y + rc.h - EPS && y > rc.y + EPS) {
        free = false;
        return false;
      }
      return true;
    });
    return free;
  }

  function moveX(bd, dx) {
    if (!dx) return false;
    bd.x += dx;
    let hit = false;
    eachSolid(bd.x - bd.w / 2, bd.y - bd.h, bd.x + bd.w / 2, bd.y, bd, (rc) => {
      if (rc.oneWay || !overlaps(bd, rc)) return true;
      // A low lip (a lift resting on the floor) is stepped up onto.
      if (bd.ground && rc.y < bd.y && bd.y - rc.y <= 0.55 && boxFree(bd, bd.x, rc.y)) {
        bd.y = rc.y;
        return true;
      }
      let left = rc.x;
      let width = rc.w;
      if (rc.crate) {
        const c = rc.crate;
        // Telly shoves a crate along instead of stopping.
        if (!bd.isCrate && bd.ground && c.ground) {
          moveX(c, dx > 0 ? bd.x + bd.w / 2 - (c.x - c.w / 2) : bd.x - bd.w / 2 - (c.x + c.w / 2));
          c.tilt = clamp(c.tilt + dx * 0.6, -0.06, 0.06);
          bd.pushing = true;
        }
        left = c.x - c.w / 2;
        width = c.w;
        if (!(bd.x - bd.w / 2 < left + width - EPS && bd.x + bd.w / 2 > left + EPS)) return true;
      }
      if (dx > 0) bd.x = left - bd.w / 2;
      else bd.x = left + width + bd.w / 2;
      hit = true;
      return true;
    });
    if (hit) bd.vx = 0;
    return hit;
  }

  function moveY(bd, dy) {
    if (!dy) return false;
    const prev = bd.y;
    bd.y += dy;
    let hit = false;
    eachSolid(bd.x - bd.w / 2, bd.y - bd.h, bd.x + bd.w / 2, bd.y, bd, (rc) => {
      if (rc.oneWay) {
        if (dy > 0 && prev <= rc.y + 0.02 && bd.y > rc.y && bd.x + bd.w / 2 > rc.x + EPS && bd.x - bd.w / 2 < rc.x + rc.w - EPS) {
          bd.y = rc.y;
          hit = true;
        }
        return true;
      }
      if (!overlaps(bd, rc)) return true;
      if (dy > 0) bd.y = rc.y;
      else bd.y = rc.y + rc.h + bd.h;
      hit = true;
      return true;
    });
    if (hit) bd.vy = 0;
    return hit;
  }

  // What a body stands on: a solid, a ledge, a lift or a crate (or null).
  function standingOn(bd) {
    let on = null;
    eachSolid(bd.x - bd.w / 2 + 0.02, bd.y - 0.01, bd.x + bd.w / 2 - 0.02, bd.y + 0.04, bd, (rc) => {
      if (Math.abs(rc.y - bd.y) < 0.03) {
        on = rc.lift || rc.crate || { ground: true };
        return false;
      }
      return true;
    });
    return on;
  }

  // Pushed out of anything that moved into it (a closing door, a lift).
  function depenetrate(bd) {
    for (let k = 0; k < 3; k++) {
      let moved = false;
      eachSolid(bd.x - bd.w / 2, bd.y - bd.h, bd.x + bd.w / 2, bd.y, bd, (rc) => {
        if (rc.oneWay || !overlaps(bd, rc)) return true;
        const up = bd.y - rc.y;
        const down = rc.y + rc.h - (bd.y - bd.h);
        const left = bd.x + bd.w / 2 - rc.x;
        const right = rc.x + rc.w - (bd.x - bd.w / 2);
        const m = Math.min(up, down + 0.2, left, right);
        if (m === up) { bd.y = rc.y; if (bd.vy > 0) bd.vy = 0; }
        else if (m === left) bd.x = rc.x - bd.w / 2;
        else if (m === right) bd.x = rc.x + rc.w + bd.w / 2;
        else { bd.y = rc.y + rc.h + bd.h; if (bd.vy < 0) bd.vy = 0; }
        moved = true;
        return false;
      });
      if (!moved) return;
    }
  }

  function solidAt(x, y) {
    let hit = false;
    eachSolid(x - 0.01, y - 0.01, x + 0.01, y + 0.01, null, (rc) => {
      if (rc.oneWay) return true;
      hit = true;
      return false;
    });
    return hit;
  }

  // The first floor under (x, y) within `depth` tiles, or null.
  function floorBelow(x, y, depth) {
    const L = world.L;
    for (let ty = Math.floor(y); ty <= Math.floor(y + depth); ty++) {
      const v = L.tile(Math.floor(x), ty);
      if (v && ty >= y - 0.01) return ty;
    }
    for (const lf of L.lifts) if (x >= lf.x0 && x <= lf.x1 && lf.y >= y - 0.01 && lf.y <= y + depth) return lf.y;
    for (const br of L.bridges) {
      const rc = bridgeRect(br);
      if (rc && x >= rc.x && x <= rc.x + rc.w && rc.y >= y - 0.01 && rc.y <= y + depth) return rc.y;
    }
    for (const c of L.crates) if (Math.abs(x - c.x) < c.w / 2 && c.y - c.h >= y - 0.01 && c.y - c.h <= y + depth) return c.y - c.h;
    return null;
  }

  // Whether a straight line between two points is clear of solid tiles.
  function lineClear(ax, ay, bx, by) {
    const L = world.L;
    const n = Math.ceil(Math.hypot(bx - ax, by - ay) / 0.2);
    for (let i = 1; i < n; i++) {
      const x = lerp(ax, bx, i / n);
      const y = lerp(ay, by, i / n);
      if (L.tile(Math.floor(x), Math.floor(y)) === 1) return false;
    }
    return true;
  }

  /* ---------------- machines ---------------- */
  function powered(by) {
    if (!by) return false;
    if (by.kind === "plate") return by.pressed;
    return by.latched || by.left > 0;
  }

  function hookPos(h, t) {
    return { x: h.bx + Math.sin(t * h.sp + h.ph) * h.ax, y: h.by + Math.sin(t * h.sp * 1.3 + h.ph) * h.ay };
  }

  function center(p) {
    return { x: p.x, y: p.y - PH * 0.52 };
  }

  function updateMachines(dt) {
    const w = world;
    const L = w.L;
    for (const s of L.sockets) {
      if (s.jolt > 0) s.jolt = Math.max(0, s.jolt - dt * 6);
      if (s.surge > 0) s.surge = Math.max(0, s.surge - dt * 1.8);
      if (s.left > 0) {
        const before = s.left;
        s.left = Math.max(0, s.left - dt);
        if (mode === "play" && s.left > 0 && s.left < 1.6 && Math.floor(before * 3) !== Math.floor(s.left * 3)) kit.sound.play("tap");
      }
    }
    if (L.exit.jolt > 0) L.exit.jolt = Math.max(0, L.exit.jolt - dt * 6);
    if (L.exit.surge > 0) L.exit.surge = Math.max(0, L.exit.surge - dt * 1.6);
    for (const h of L.hooks) {
      if (h.jolt > 0) h.jolt = Math.max(0, h.jolt - dt * 5);
    }
    const bodies = [w.p, ...L.crates];
    for (const pl of L.plates) {
      const was = pl.pressed;
      pl.pressed = bodies.some((bd) => Math.abs(bd.y - pl.y) < 0.06 && Math.min(bd.x + bd.w / 2, pl.x1) - Math.max(bd.x - bd.w / 2, pl.x0) > 0.3);
      pl.depth = lerp(pl.depth, pl.pressed ? 1 : 0, Math.min(1, dt * 14));
      if (pl.pressed && !was) {
        kit.sound.play("pop", 0.7);
        emit("spark", (pl.x0 + pl.x1) / 2, pl.y - 0.1, 8, { speed: 3, color: "#7dffb0" });
      }
    }
    for (const d of L.doors) {
      const was = d.open;
      d.open = clamp(d.open + (powered(d.by) ? 3 : -2.2) * dt, 0, 1);
      if (was === 0 && d.open > 0 && mode !== "bench") kit.sound.play("whoosh");
      if (was > 0 && d.open === 0) emit("dust", d.x + 0.5, d.y1, 6, { speed: 2 });
    }
    for (const br of L.bridges) br.ext = clamp(br.ext + (powered(br.by) ? 2.2 : -2.2) * dt, 0, 1);
    for (const lf of L.lifts) {
      if (lf.mover) {
        const nx0 = lf.bx0 + Math.sin(w.t * lf.sp + lf.ph) * lf.ax;
        const ny = lf.yDown + Math.sin(w.t * lf.sp * 1.15 + lf.ph) * lf.ay;
        const dx = nx0 - lf.x0;
        const dy = ny - lf.y;
        lf.dx = dx;
        lf.dy = dy;
        for (const bd of bodies) {
          if (standingOn(bd) === lf) {
            moveX(bd, dx);
            bd.y += dy;
          }
        }
        lf.x0 += dx;
        lf.x1 += dx;
        lf.y = ny;
        continue;
      }
      // A powered lift waits for a rider, then goes up while the power lasts.
      const riding = bodies.some((bd) => standingOn(bd) === lf);
      const target = powered(lf.by) && (riding || lf.y < lf.yDown - 0.01) ? lf.yUp : lf.yDown;
      const dy = clamp(target - lf.y, -3 * dt, 3 * dt);
      lf.dy = dy;
      if (dy) {
        // Whatever stands on the lift rides it.
        for (const bd of bodies) if (standingOn(bd) === lf) bd.y += dy;
        lf.y += dy;
      }
    }
    for (const f of L.fans) {
      f.spin = lerp(f.spin, powered(f.by) ? 1 : 0, Math.min(1, dt * 3));
      f.a += f.spin * dt * 22;
    }
    for (const c of L.crates) stepCrate(c, dt);
    for (const bd of L.baddies) stepBaddie(bd, dt);
    for (const sp of L.sparkers) {
      const t = (w.t + sp.phase) % 2.6;
      const was = sp.active;
      sp.active = t < 1.1;
      sp.warn = t > 2.15;
      if (sp.active && !was) emit("spark", sp.x + 0.5, sp.y - 0.6, 10, { speed: 5, color: "#bfefff" });
    }
  }

  function defeatBaddie(bd, causeX) {
    if (bd.dead) return;
    bd.dead = true;
    bd.deadT = 0;
    const pushDir = bd.x >= causeX ? 1 : -1;
    bd.vx = pushDir * 3.8;
    bd.vy = -6.8;
    bd.squash = 0.6;
    stats.baddies += 1;
    if (mode === "play") kit.addScore(25);
    emit("spark", bd.x, bd.y - bd.h * 0.5, 14, { speed: 5.5, color: "#7fe0ff" });
    emit("star", bd.x, bd.y - bd.h * 0.5, 10, { speed: 4.5, color: "#ffe066" });
    emit("ring", bd.x, bd.y - bd.h * 0.5, 1, { color: "#ff6b8a" });
    kit.sound.play("pop", 1.15);
    kit.sound.tone(240, 0.09, { type: "sawtooth", slide: 680, vol: 0.2 });
    kit.haptic(14);
  }

  function stepBaddie(bd, dt) {
    if (bd.dead) {
      if (bd.deadT < 0.55) {
        bd.deadT += dt;
        bd.x += bd.vx * dt;
        bd.y += bd.vy * dt;
        bd.vy += 28 * dt;
        bd.spin += bd.vx * 3.2 * dt;
        if (Math.random() < dt * 25) emit("smoke", bd.x, bd.y - 0.3, 1, { speed: 1.2 });
      }
      return;
    }
    if (bd.squash > 0) bd.squash = Math.max(0, bd.squash - dt * 3.5);
    if (bd.pause > 0) {
      bd.pause -= dt;
      bd.vx = 0;
      return;
    }
    const spd = bd.kind === "roller" ? 2.6 : bd.kind === "hopper" ? 2.25 : 1.9;
    bd.vx = bd.dir * spd;
    bd.x += bd.vx * dt;
    bd.walk += Math.abs(bd.vx) * dt * 3.4;
    if (bd.kind === "hopper") {
      bd.hopT = (bd.hopT || 0) + dt;
      if (bd.y < bd.hy || bd.vy < 0) {
        bd.vy += 36 * dt;
        bd.y += bd.vy * dt;
        if (bd.y >= bd.hy) {
          bd.y = bd.hy;
          bd.vy = 0;
          bd.squash = 0.35;
          emit("spark", bd.x, bd.y - 0.05, 3, { speed: 2, color: "#5dff9a" });
        }
      } else if (bd.hopT >= 1.05) {
        bd.hopT = 0;
        bd.vy = -7.6;
        bd.squash = 0.25;
      }
    }
    if ((bd.dir > 0 && bd.x >= bd.x1) || (bd.dir < 0 && bd.x <= bd.x0)) {
      bd.x = clamp(bd.x, bd.x0, bd.x1);
      bd.dir = -bd.dir;
      bd.pause = 0.16;
      bd.squash = 0.25;
    }
    for (const cr of world.L.crates) {
      if (Math.abs(cr.y - bd.y) < 0.6 && Math.abs(cr.x - bd.x) < (cr.w + bd.w) * 0.5) {
        if (Math.abs(cr.vx) > 0.4) {
          defeatBaddie(bd, cr.x);
          return;
        }
        bd.dir = bd.x < cr.x ? -1 : 1;
        bd.x += bd.dir * 0.08;
        bd.pause = 0.12;
      }
    }
    if (Math.random() < dt * 3.5) {
      const col = bd.kind === "roller" ? "#7fe0ff" : bd.kind === "hopper" ? "#5dff9a" : "#ff6b8a";
      emit("spark", bd.x, bd.y - bd.h - 0.08, 1, { speed: 1.8, color: col });
    }
  }

  function inWind(bd) {
    for (const f of world.L.fans) {
      if (f.spin < 0.3) continue;
      if (Math.abs(bd.x - f.x) < 0.85 && bd.y <= f.y + 0.01 && bd.y - bd.h * 0.5 > f.y - f.h) return f;
    }
    return null;
  }

  function stepCrate(c, dt) {
    const f = inWind(c);
    const wasGround = c.ground;
    const fall = c.vy;
    c.vy = Math.min(MAX_FALL, c.vy + G_DOWN * dt);
    if (f) c.vy = Math.max(-WIND_MAX * 0.6, c.vy - WIND * f.spin * dt);
    if (c.ground) c.vx *= Math.max(0, 1 - dt * 12);
    moveX(c, c.vx * dt);
    moveY(c, c.vy * dt);
    const on = standingOn(c);
    c.ground = !!on;
    if (c.ground && c.vy > 0) c.vy = 0;
    if (c.ground && !wasGround && fall > 4) {
      emit("dust", c.x, c.y, 8, { speed: 3 });
      kit.sound.play("thud");
    }
    c.tilt *= 1 - Math.min(1, dt * 10);
    depenetrate(c);
    if (c.y > BOTTOM + 3) {
      // A crate lost down a hole comes back where it started.
      c.x = c.hx;
      c.y = c.hy;
      c.vx = c.vy = 0;
      emit("ring", c.x, c.y - 0.5, 1, { color: "#ffffff" });
    }
  }

  /* ---------------- Telly ---------------- */
  function bestHook() {
    const w = world;
    const c = center(w.p);
    let best = null;
    let bestScore = Infinity;
    for (const h of w.L.hooks) {
      const hp = hookPos(h, w.t);
      if (hp.y > c.y - 0.6) continue;
      if ((hp.x - c.x) * w.p.dir < -1.6) continue;
      const d = Math.hypot(hp.x - c.x, hp.y - c.y);
      if (d > RANGE) continue;
      // The cord cannot reach a hook through a wall.
      if (!lineClear(c.x, c.y, hp.x, hp.y)) continue;
      const score = Math.abs(hp.x - (c.x + w.p.dir * 2.2)) + d * 0.35;
      if (score < bestScore) {
        bestScore = score;
        best = h;
      }
    }
    return best;
  }

  function nearSocket() {
    const p = world.p;
    if (!p.ground && (p.vy < -2 || floorBelow(p.x, p.y, 0.6) === null)) return null;
    for (const s of world.L.sockets) if (Math.abs(s.x - p.x) < 1.5 && Math.abs(s.y - p.y) < 0.75) return s;
    return null;
  }

  function nearExit() {
    const p = world.p;
    const e = world.L.exit;
    return (p.ground || (p.vy >= -2 && floorBelow(p.x, p.y, 0.6) !== null)) && Math.abs(e.x - p.x) < 1.75 && Math.abs(e.y - p.y) < 0.75;
  }

  function nearBaddie() {
    const p = world.p;
    let best = null;
    let bestD = Infinity;
    for (const bd of world.L.baddies) {
      if (bd.dead) continue;
      const dx = Math.abs(bd.x - p.x);
      const dy = Math.abs(bd.y - p.y);
      if (dx < 3.8 && dy < 1.45 && dx < bestD) {
        bestD = dx;
        best = bd;
      }
    }
    return best;
  }

  // Where the cord pulls from: the last corner it wrapped, or the hook.
  function ropeAnchor(r) {
    return r.pivots.length ? r.pivots[r.pivots.length - 1] : hookPos(r.hook, world.t);
  }

  function attach(h) {
    const w = world;
    const p = w.p;
    const c = center(p);
    const hp = hookPos(h, w.t);
    const d = Math.hypot(hp.x - c.x, hp.y - c.y);
    const angle = Math.atan2(c.x - hp.x, c.y - hp.y);
    const targetL = clamp(d, LMIN, LMAX);
    // Start at the live distance so grabbing from afar reels Telly in smoothly
    // rather than teleporting on the first frame.
    w.rope = {
      hook: h, L: Math.max(LMIN, d), targetL, pivots: [], angle, wraps: 0, accum: 0,
      shoot: 0.11, twang: 0, twangV: 0, latched: false, still: 0,
    };
    p.ground = false;
    p.hover = 0.45;
    p.dir = hp.x >= c.x ? 1 : -1;
    // The throw yanks Telly forward, enough to swing well past the hook.
    if (angle * p.dir < SWING_TO) {
      const tx = Math.cos(angle) * p.dir;
      const ty = -Math.sin(angle) * p.dir;
      const vt = p.vx * tx + p.vy * ty;
      const need = Math.sqrt(Math.max(0, 2 * G_UP * targetL * (Math.cos(Math.abs(angle)) - Math.cos(SWING_TO))));
      if (vt < need) {
        p.vx += (need - vt) * tx;
        p.vy += (need - vt) * ty;
      }
    }
    p.syV += 3.2;
    emit("spark", hp.x, hp.y, 8, { speed: 4, color: "#ffe066" });
    kit.sound.play("whoosh");
    kit.sound.tone(360, 0.09, { type: "sine", slide: 880, vol: 0.2 });
    kit.haptic(10);
  }

  function release(boost) {
    const w = world;
    if (!w.rope) return;
    const p = w.p;
    const hp = ropeAnchor(w.rope);
    p.vx *= 1.06;
    p.vy *= 1.06;
    if (boost) {
      p.vy = Math.min(p.vy, 0) - 5;
      p.vx += p.dir * 1;
      p.syV += 4.2;
      emit("ring", p.x, p.y - 0.4, 1, { color: "#ffffff" });
    }
    emit("spark", hp.x, hp.y, 6, { speed: 3.5, color: "#7fe0ff" });
    // Whip the plug back along the cord toward Telly.
    const pts = w.cord;
    if (pts && pts.length) {
      const a = cordAnchor(p.x, p.y, p.faceDir, p.tilt, p.sy, 0);
      for (let i = 1; i < pts.length; i++) {
        const f = i / (pts.length - 1);
        const rx = (a.x - pts[i].x) * 0.09 * f;
        const ry = (a.y - pts[i].y) * 0.09 * f - 0.04 * f;
        pts[i].px = pts[i].x - rx;
        pts[i].py = pts[i].y - ry;
      }
    }
    p.flung = true;
    p.hover = 0.45;
    if (w.rope.wraps > 0) kit.sound.play("pop", 1.2);
    else kit.sound.tone(620, 0.07, { type: "sine", slide: 340, vol: 0.16 });
    w.rope = null;
  }

  function plugReceptacle(s, exit, side) {
    if (exit) return { x: s.x - 0.09 + side * 0.18, y: s.y - 1.42 };
    return { x: s.x - 0.05 + side * 0.16, y: s.y - 0.74 };
  }

  function startPlug(target, exit) {
    const w = world;
    const p = w.p;
    const pts = w.cord;
    const end = pts[pts.length - 1];
    const side = p.x <= target.x + 0.2 ? -1 : 1;
    const standX = target.x + side * (exit ? 1.56 : 1.38);
    p.dir = -side;
    w.unplug = null;
    w.plug = {
      target, t: 0, seatT: exit ? 0.18 : 0.15, dur: exit ? 0.6 : 0.45, exit,
      side, standX, startX: end.x, startY: end.y, startAngle: w.plugAngle || 0,
      seated: false, done: false,
    };
    p.syV += 3.2;
    kit.sound.play(exit ? "start" : "pop", 0.85);
    kit.sound.tone(300, 0.1, { type: "sine", slide: 680, vol: 0.2 });
  }

  function cordPress() {
    const w = world;
    if (!w || w.zap > 0 || w.plug || w.finishing > 0) return;
    if (w.rope) return;
    const s = nearSocket();
    if (s) {
      startPlug(s, false);
      return;
    }
    if (nearExit()) {
      startPlug(w.L.exit, true);
      return;
    }
    const h = bestHook();
    if (h) attach(h);
    else {
      const bd = nearBaddie();
      world.p.ropeBlend = 0.85;
      if (bd) {
        world.p.dir = bd.x >= world.p.x ? 1 : -1;
        w.flickBaddie = bd;
        kit.sound.tone(520, 0.09, { type: "sawtooth", slide: 860, vol: 0.18 });
      } else {
        w.flickBaddie = null;
        kit.sound.tone(420, 0.08, { type: "triangle", slide: 260, vol: 0.15 });
      }
      w.flick = 0.32;
    }
  }

  function hop(v) {
    const p = world.p;
    p.vy = v;
    p.flung = v === SPRING_V;
    p.ground = false;
    p.coyote = 0;
    p.buffer = 0;
    p.hover = 0.45;
    p.syV += 4.5;   // stretch up off the ground
    emit("dust", p.x, p.y, 5, { speed: 2 });
    kit.sound.play("bounce", 1.2);
  }

  function step(dt) {
    const w = world;
    const p = w.p;
    const L = w.L;
    w.t += dt;
    p.px = p.x;
    p.py = p.y;
    if (w.invuln > 0) w.invuln -= dt;
    if (w.flick > 0) w.flick -= dt;
    if (w.unplug) {
      w.unplug.t += dt;
      if (w.unplug.t >= w.unplug.dur) w.unplug = null;
    }
    updateMachines(dt);
    stepParticles(dt);
    stepBody(dt);
    if (w.finishing > 0) {
      w.finishing -= dt;
      p.face = "love";
      // Celebratory happy hop rhythm while powering the gold exit!
      if (p.ground && Math.sin(w.t * 14) > 0.92) p.syV += 1.4;
      if (Math.random() < dt * 24) emit("star", L.exit.x - 0.1 + (Math.random() - 0.5), L.exit.y - 1.5, 1, { speed: 2.5, color: "#ffe066" });
      if (Math.random() < dt * 18) emit("spark", L.exit.x - 0.1, L.exit.y - 1.4, 1, { speed: 3.5, color: "#7fe0ff" });
      if (w.finishing <= 0) roomDone();
      stepCord(dt);
      return;
    }
    if (w.zap > 0) {
      w.zap -= dt;
      if (Math.random() < dt * 25) emit("smoke", p.x, p.y - 0.6, 1, { speed: 1 });
      if (w.zap <= 0) respawn();
      stepCord(dt);
      return;
    }
    if (mode !== "play" || auto) autopilot(dt);

    if (input.cordPressed) cordPress();
    if (input.cordReleased) release(false);
    input.cordPressed = input.cordReleased = false;
    if (input.jumpPressed) p.buffer = BUFFER;
    input.jumpPressed = false;
    p.buffer = Math.max(0, p.buffer - dt);
    p.coyote = p.ground ? COYOTE : Math.max(0, p.coyote - dt);

    const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);

    if (w.plug) {
      w.plug.t += dt;
      p.vx = 0;
      const s = w.plug.target;
      const rc = plugReceptacle(s, w.plug.exit, w.plug.side);
      // Slide Telly cleanly beside the socket so both Telly and the plug are visible.
      if (!w.plug.done && Math.abs(p.x - s.x) < (w.plug.exit ? 1.52 : 1.34)) {
        const nextX = lerp(p.x, w.plug.standX, Math.min(1, dt * 18));
        if (boxFree(p, nextX, p.y)) p.x = nextX;
      }
      if (w.plug.t >= w.plug.seatT && !w.plug.seated) {
        w.plug.seated = true;
        s.jolt = 1;
        p.syV -= 3.2;
        emit("spark", rc.x, rc.y, 10, { speed: 4.5, color: "#ffe066" });
        emit("ring", rc.x, rc.y, 1, { color: "#7fe0ff" });
        kit.sound.tone(170, 0.06, { type: "triangle", slide: 95, vol: 0.25 });
        kit.sound.tone(640, 0.1, { type: "sine", slide: 980, vol: 0.2, delay: 0.03 });
        kit.haptic(12);
      }
      if (w.plug.seated && !w.plug.done && Math.random() < dt * 35) {
        emit("spark", rc.x, rc.y, 1, { speed: 3, color: "#7fe0ff" });
      }
      if (w.plug.t >= w.plug.dur && !w.plug.done) {
        w.plug.done = true;
        s.surge = 1;
        s.jolt = 0.7;
        p.syV += 3.8;
        if (w.plug.exit) {
          w.finishing = 1.3;
          kit.sound.play("win");
          kit.haptic(25);
          emit("star", s.x - 0.1, s.y - 1.4, 24, { speed: 6, color: "#ffe066" });
          emit("ring", s.x - 0.1, s.y - 1.4, 2, { color: "#fff4b8" });
        } else {
          if (s.time > 0) s.left = s.time;
          else s.latched = true;
          kit.sound.play("coin");
          kit.haptic(15);
          emit("spark", rc.x, rc.y, 18, { speed: 6, color: "#bfefff" });
          emit("ring", rc.x, rc.y, 1, { color: "#7dffb0" });
        }
      }
      // Once charged, let the player move right away and pop the plug back out.
      const endWait = w.plug.exit ? 9 : dir || p.buffer > 0 ? 0.04 : 0.22;
      if (w.plug.t >= w.plug.dur + endWait) {
        if (!w.plug.exit) {
          w.unplug = { x: rc.x, y: rc.y, side: w.plug.side, t: 0, dur: 0.2 };
          const pts = w.cord;
          if (pts && pts.length) {
            const last = pts[pts.length - 1];
            last.px = last.x - w.plug.side * 0.14;
            last.py = last.y + 0.09;
          }
          emit("spark", rc.x, rc.y, 5, { speed: 2.8, color: "#ffe066" });
          kit.sound.tone(720, 0.06, { type: "sine", slide: 380, vol: 0.14 });
        }
        w.plug = null;
      }
    }

    const prevGround = p.ground;
    const fallSpeed = p.vy;
    p.pushing = false;
    p.pulling = null;
    p.hovering = false;
    if (!w.rope && (!w.plug || w.plug.done)) {
      if (dir) p.dir = dir;
      // Cordy-style crate pulling: hold 🔌 beside a crate while backing away.
      if (p.ground && input.cord && dir) {
        for (const cr of L.crates) {
          const gapX = Math.abs(p.x - cr.x) - (p.w / 2 + cr.w / 2);
          if (cr.ground && gapX > -0.05 && gapX < 0.42 && Math.abs(p.y - cr.y) < 0.25 && Math.sign(cr.x - p.x) === -dir) {
            p.pulling = cr;
            p.pushing = true;
            p.dir = Math.sign(cr.x - p.x) || p.dir;
            break;
          }
        }
      }
      const top = p.wasPushing || p.pulling ? PUSH_RUN : RUN;
      if (dir) {
        const acc = p.ground ? ACC_GROUND : ACC_AIR;
        // Turning round is snappy, and kicks up a little dust.
        const turning = Math.sign(p.vx) !== dir && Math.abs(p.vx) > 2;
        if (turning && p.ground && Math.random() < dt * 30) emit("dust", p.x, p.y, 1, { speed: 2 });
        const boost = turning ? 1.8 : 1;
        const cap = p.ground ? top : Math.max(top, Math.abs(p.vx));
        p.vx = clamp(p.vx + dir * acc * boost * dt, -cap, cap);
      } else if (p.ground) {
        const f = FRICTION * dt;
        p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
      } else {
        p.vx *= 1 - dt * 0.6;
      }
      if (p.buffer > 0 && (p.ground || p.coyote > 0)) hop(JUMP_V);
    } else if (w.rope && p.buffer > 0) {
      p.buffer = 0;
      release(true);
    }

    // Gravity: lighter while rising with jump held (or flung by a spring or
    // the cord), lightest of all near the top of a held jump.
    if (p.vy >= 0) p.flung = false;
    const holdUp = (input.jump || p.flung) && !w.rope;
    let g = w.rope ? G_UP : p.vy < 0 && holdUp ? G_UP : G_DOWN;
    if (holdUp && Math.abs(p.vy) < 2.5 && !p.ground) g *= APEX;
    p.vy = Math.min(MAX_FALL, p.vy + g * dt);
    // Cordy's electric hover jets: holding Jump while falling cushions descent.
    if (mode === "play" && !auto && !p.ground && !w.rope && !w.plug && input.jump && p.vy > 1.4 && p.hover > 0) {
      p.hover = Math.max(0, p.hover - dt);
      p.hovering = true;
      p.vy = Math.min(p.vy, 2.6);
      if (Math.random() < dt * 45) {
        emit("spark", p.x + (Math.random() - 0.5) * 0.35, p.y + 0.02, 1, { speed: 1.8, vy: 3.5, color: "#7fe0ff" });
      }
    }
    const fan = !w.rope ? inWind(p) : null;
    if (fan) {
      p.vy = Math.max(-WIND_MAX, p.vy - WIND * fan.spin * dt);
      p.hover = 0.45;
      if (Math.random() < 0.15) emit("dust", p.x + (Math.random() - 0.5) * 0.6, p.y, 1, { speed: 1, vy: -4 });
    }

    if (w.rope) pumpRope(dir, dt);

    const c0 = center(p);
    const prevX = p.x;
    moveX(p, p.vx * dt);
    if (p.pulling && p.x !== prevX) {
      moveX(p.pulling, p.x - prevX);
      p.pulling.tilt = clamp(p.pulling.tilt + (p.x - prevX) * 0.6, -0.06, 0.06);
    }
    p.wasPushing = p.pushing;
    moveY(p, p.vy * dt);
    if (w.rope) constrainRope(c0);
    depenetrate(p);
    const on = standingOn(p);
    p.ground = !!on && p.vy >= -0.01;
    p.on = on;
    if (p.ground) p.hover = 0.45;
    if (p.ground && !prevGround) {
      if (w.rope) release(false);
      const hard = clamp(fallSpeed / MAX_FALL, 0, 1);
      p.syV -= 3 + hard * 7;
      emit("dust", p.x, p.y, 4 + Math.round(hard * 10), { speed: 2 + hard * 3 });
      if (hard > 0.7) kit.shake(4, 0.12);
      kit.sound.play("thud");
    }
    if (p.ground && p.vy > 0) p.vy = 0;
    if (p.ground) {
      p.walk += Math.abs(p.vx) * dt * 3.2;
      if (Math.abs(p.vx) > 4 && Math.random() < dt * 10) emit("dust", p.x - p.dir * 0.3, p.y, 1, { speed: 1, vx: -p.dir * 1.5 });
    }
    p.worried = p.ground && !dir && !w.rope && !w.plug && floorBelow(p.x + p.dir * 0.7, p.y, 3) === null;

    // Springs, boosters, pads, pickups and hazards.
    for (const s of L.springs) {
      if (s.squash > 0) s.squash -= dt * 3;
      if (p.ground && Math.abs(p.x - s.x) < 0.5 && Math.abs(p.y - s.y) < 0.05) {
        hop(SPRING_V);
        s.squash = 1;
        emit("ring", s.x, s.y - 0.4, 1, { color: "#ffe066" });
        kit.sound.play("bounce", 0.8);
        kit.haptic(14);
      }
    }
    for (const bst of L.boosters) {
      if (bst.pulse > 0) bst.pulse = Math.max(0, bst.pulse - dt * 3);
      if (bst.cool > 0) bst.cool = Math.max(0, bst.cool - dt);
      if (bst.cool <= 0 && Math.abs(p.x - bst.x) < 0.72 && Math.abs(p.y - bst.y) < 0.5) {
        bst.pulse = 1;
        bst.cool = 0.28;
        p.vx = bst.vx;
        p.vy = bst.vy;
        p.dir = bst.vx >= 0 ? 1 : -1;
        p.flung = true;
        p.ground = false;
        p.coyote = 0;
        p.buffer = 0;
        p.hover = 0.45;
        p.syV += 5.2;
        emit("ring", bst.x, bst.y - 0.35, 2, { color: "#48f0ff" });
        emit("star", bst.x, bst.y - 0.35, 10, { speed: 5, color: "#ffe066" });
        kit.sound.play("whoosh");
        kit.sound.tone(360, 0.12, { type: "sawtooth", slide: 880, vol: 0.2 });
        kit.haptic(16);
      }
    }
    for (const pad of L.pads) {
      if (!pad.on && p.ground && Math.abs(p.x - pad.x) < 0.7 && Math.abs(p.y - pad.y) < 0.05) {
        pad.on = true;
        w.checkpoint = { x: pad.x, y: pad.y };
        if (mode === "play") kit.toast("Checkpoint!", "#7dffb0");
        emit("ring", pad.x, pad.y - 0.3, 1, { color: "#7dffb0" });
        kit.sound.play("coin");
      }
    }
    const c = center(p);
    for (const s of L.sparks) {
      if (!s.got && Math.hypot(s.x - c.x, s.y - c.y) < 0.75) {
        s.got = true;
        stats.sparks += 1;
        if (mode === "play") kit.addScore(10);
        emit("star", s.x, s.y, mode === "bench" ? 14 : 7, { speed: 4, color: "#ffe066" });
        emit("ring", s.x, s.y, 1, { color: "#fff4b8" });
        kit.sound.play("coin");
      }
    }
    for (const cell of L.cells) {
      if (!cell.got && Math.hypot(cell.x - c.x, cell.y - c.y) < 0.85) {
        cell.got = true;
        stats.cells += 1;
        if (mode === "play") {
          kit.addScore(50);
          kit.toast(`Power cell ${L.cells.filter((k) => k.got).length}/3! +50`, "#7dffb0");
          updateHud();
        }
        emit("star", cell.x, cell.y, 16, { speed: 6, color: "#7dffb0" });
        emit("ring", cell.x, cell.y, 2, { color: "#7dffb0" });
        kit.sound.play("win");
        kit.haptic(20);
      }
    }
    stepCord(dt);
    for (const bd of L.baddies) {
      if (bd.dead) continue;
      // Cord whip / plug zap attack strikes as the whip reaches peak extension!
      if (w.flick > 0 && w.flick <= 0.22 && w.cord && w.cord.length >= 3) {
        const tip = w.cord[w.cord.length - 1];
        const neck = w.cord[w.cord.length - 2];
        const by = bd.y - bd.h * 0.5;
        if (
          w.flickBaddie === bd ||
          Math.hypot(tip.x - bd.x, tip.y - by) < 0.95 ||
          Math.hypot(neck.x - bd.x, neck.y - by) < 0.85
        ) {
          defeatBaddie(bd, p.x);
          continue;
        }
      }
      const dx = Math.abs(p.x - bd.x);
      const overlapX = dx < (p.w + bd.w) * 0.44;
      const overlapY = p.y > bd.y - bd.h - 0.05 && p.y - p.h < bd.y;
      if (overlapX && overlapY) {
        const stomp = p.vy >= -0.5 && (p.py <= bd.y - bd.h * 0.42 || p.y <= bd.y - bd.h * 0.52);
        const swingSmash = !!(w.rope && Math.hypot(p.vx, p.vy) > 8.2);
        if (stomp || swingSmash) {
          defeatBaddie(bd, p.x);
          if (!w.rope) {
            p.vy = input.jump ? JUMP_V * 1.02 : -10.5;
            p.ground = false;
            p.hover = 0.45;
            p.syV += 4.5;
          }
        } else if (w.invuln <= 0 && w.flick <= 0) {
          bd.squash = 0.35;
          zap("Bzzt! Zapped by a Spark-Bot.");
        }
      }
    }
    if (w.invuln <= 0) {
      for (const wtr of L.water) {
        if (p.x > wtr.x0 + 0.1 && p.x < wtr.x1 - 0.1 && p.y > wtr.y + 0.3) zap("Splash! Telly fizzed.", true);
      }
      for (const sp of L.sparkers) {
        if (sp.active && Math.abs(p.x - sp.x - 0.5) < 0.35 + p.w / 2 && p.y > sp.y - sp.h && p.y - p.h < sp.y) zap("Bzzt! Mind the sparks.");
      }
    }
    if (p.y > BOTTOM + 3) zap("Down the hole! Telly lost a battery.");
    if (mode === "bench" && w.trail.length < 2000) w.trail.push({ x: c.x, y: c.y });
    // Afterimages when Telly really flies.
    if (Math.hypot(p.vx, p.vy) > 10 && Math.random() < dt * 40) w.ghosts.push({ x: p.x, y: p.y, tilt: p.tilt, dir: p.dir, life: 0.25 });
  }

  // Shortest signed angular difference from a to b.
  function angleDiff(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  // Telly's springy body: squash and stretch, lean, antennae.
  function stepBody(dt) {
    const w = world;
    const p = w.p;
    const target = p.ground ? 1 : 1 + clamp(Math.abs(p.vy) * 0.007, 0, 0.12);
    p.syV += (-(p.sy - target) * 260 - p.syV * 14) * dt;
    p.sy = clamp(p.sy + p.syV * dt, 0.62, 1.3);
    p.faceDir = lerp(p.faceDir === undefined ? p.dir : p.faceDir, p.dir, Math.min(1, dt * 16));
    p.ropeBlend = lerp(p.ropeBlend || 0, w.rope ? 1 : w.plug || w.flick > 0 ? 0.85 : 0, Math.min(1, dt * 18));
    const r = w.rope;
    let lean;
    if (r) {
      const a = ropeAnchor(r);
      const c = center(p);
      const ropeAng = Math.atan2(c.x - a.x, c.y - a.y);
      // Align with the pendulum radial, and follow all the way round on a loop.
      const loopBlend = clamp((Math.abs(ropeAng) - 1.1) / 0.8, 0, 1);
      const baseTilt = lerp(clamp(-ropeAng * 0.65, -0.85, 0.85), -ropeAng, loopBlend);
      const tangKick = clamp((p.vx * Math.cos(ropeAng) - p.vy * Math.sin(ropeAng)) * 0.012, -0.18, 0.18);
      lean = baseTilt + tangKick;
      p.tilt += angleDiff(p.tilt, lean) * Math.min(1, dt * 14);
    } else if (w.plug && w.plug.seated && !w.plug.done) {
      lean = p.dir * 0.08 + Math.sin(w.t * 38) * 0.03;
      p.tilt += angleDiff(p.tilt, lean) * Math.min(1, dt * 14);
    } else {
      lean = (p.pushing ? p.dir * (p.pulling ? -0.12 : 0.14) : clamp(p.vx * 0.022, -0.14, 0.14)) +
        (p.ground ? 0 : clamp(p.vy * 0.01, -0.08, 0.08) * p.dir);
      p.tilt += angleDiff(p.tilt, lean) * Math.min(1, dt * 12);
    }
    for (let i = 0; i < 2; i++) {
      const buzz = w.plug && w.plug.seated ? Math.sin(w.t * 55 + i * 3) * 8 : 0;
      const force = -p.ant[i] * 160 - p.antV[i] * 9 - (p.vx - (p.lastVx || 0)) * (i ? 3 : 2.4) - (p.vy - (p.lastVy || 0)) * 0.6 * p.dir + buzz;
      p.antV[i] += force * dt;
      p.ant[i] = clamp(p.ant[i] + p.antV[i] * dt, -0.7, 0.7);
    }
    p.lastVx = p.vx;
    p.lastVy = p.vy;
    p.blink -= dt;
    if (p.blink < -0.12) p.blink = 2 + Math.random() * 3;
    for (let i = w.ghosts.length - 1; i >= 0; i--) {
      w.ghosts[i].life -= dt;
      if (w.ghosts[i].life <= 0) w.ghosts.splice(i, 1);
    }
  }

  function pumpRope(dir, dt) {
    const w = world;
    const p = w.p;
    const r = w.rope;
    const a = ropeAnchor(r);
    const c = center(p);
    const angle = Math.atan2(c.x - a.x, c.y - a.y);
    const tx = Math.cos(angle);
    const ty = -Math.sin(angle);
    // Smoothly reel into the swing radius when grappling from far away.
    if (!r.pivots.length && r.targetL !== undefined && r.L > r.targetL) {
      r.L = Math.max(r.targetL, r.L - 18 * dt);
    }
    if (dir) {
      // ◀ ▶ push along the swing, the way a kid pumps a swing.
      p.vx += tx * PUMP * dt * dir;
      p.vy += ty * PUMP * dt * dir;
      p.dir = dir;
    } else if (input.cord) {
      // Holding on with no direction keeps the swing going the way it goes.
      const s = p.vx * tx + p.vy * ty >= 0 ? 1 : -1;
      p.vx += tx * PUMP * 0.5 * dt * s;
      p.vy += ty * PUMP * 0.5 * dt * s;
    }
    // A little air drag, so swings settle rather than run forever.
    p.vx *= 1 - dt * 0.05;
    p.vy *= 1 - dt * 0.05;
    if (r.shoot > 0) {
      r.shoot = Math.max(0, r.shoot - dt);
      if (r.shoot === 0 && !r.latched) {
        r.latched = true;
        r.hook.jolt = 1;
        r.twangV = 7.5;
        const hp = hookPos(r.hook, w.t);
        emit("ring", hp.x, hp.y, 1, { color: "#ffe066" });
        kit.sound.tone(920, 0.06, { type: "triangle", slide: 1240, vol: 0.16 });
      }
    }
    // Damped guitar-string twang along the taut cord after latching.
    r.twangV += (-r.twang * 240 - r.twangV * 14) * dt;
    r.twang += r.twangV * dt;
  }

  /* The cord wraps round the corners of blocks it swings past, and unwraps
   * when Telly swings back: each corner becomes a new pivot, and the swing
   * carries on round it with the cord that is left. */
  function convexCorner(tx, ty) {
    const L = world.L;
    const tl = L.tile(tx - 1, ty - 1) === 1;
    const tr = L.tile(tx, ty - 1) === 1;
    const bl = L.tile(tx - 1, ty) === 1;
    const br = L.tile(tx, ty) === 1;
    const n = tl + tr + bl + br;
    if (n !== 1) return null;
    // Push the pivot a hair out from the block so the cord sits on its edge.
    const ox = tl || bl ? 0.05 : -0.05;
    const oy = tl || tr ? 0.05 : -0.05;
    return { x: tx + ox, y: ty + oy };
  }

  function cross(ax, ay, bx, by) {
    return ax * by - ay * bx;
  }

  function cornerInSweep(A, c0, c1) {
    const area = cross(c0.x - A.x, c0.y - A.y, c1.x - A.x, c1.y - A.y);
    if (Math.abs(area) < 1e-7) return null;
    const side = Math.sign(area);
    const x0 = Math.floor(Math.min(A.x, c0.x, c1.x));
    const x1 = Math.ceil(Math.max(A.x, c0.x, c1.x));
    const y0 = Math.floor(Math.min(A.y, c0.y, c1.y));
    const y1 = Math.ceil(Math.max(A.y, c0.y, c1.y));
    let best = null;
    let bestT = Infinity;
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const k = convexCorner(tx, ty);
        if (!k) continue;
        if (Math.hypot(k.x - A.x, k.y - A.y) < 0.3) continue;
        // Strictly inside the triangle swept this step.
        const d1 = cross(c0.x - A.x, c0.y - A.y, k.x - A.x, k.y - A.y) * side;
        const d2 = cross(c1.x - c0.x, c1.y - c0.y, k.x - c0.x, k.y - c0.y) * side;
        const d3 = cross(A.x - c1.x, A.y - c1.y, k.x - c1.x, k.y - c1.y) * side;
        if (d1 <= 1e-6 || d2 <= 1e-6 || d3 <= 1e-6) continue;
        // The first corner the sweeping cord meets.
        const tt = d1 / Math.hypot(k.x - A.x, k.y - A.y);
        if (tt < bestT) {
          bestT = tt;
          best = { x: k.x, y: k.y, side };
        }
      }
    }
    return best;
  }

  function constrainRope(c0) {
    const w = world;
    const p = w.p;
    const r = w.rope;
    let c = center(p);
    // Unwrap: Telly swung back past the line through the last corner.
    if (r.pivots.length) {
      const k = r.pivots[r.pivots.length - 1];
      const prev = r.pivots.length > 1 ? r.pivots[r.pivots.length - 2] : hookPos(r.hook, w.t);
      if (cross(k.x - prev.x, k.y - prev.y, c.x - k.x, c.y - k.y) * k.side < 0) {
        r.pivots.pop();
        r.L += k.seg;
        r.accum = 0;
        r.angle = Math.atan2(c.x - prev.x, c.y - prev.y);
      }
    }
    // Wrap: the cord swept across a block corner this step.
    const A = ropeAnchor(r);
    const k = cornerInSweep(A, c0, c);
    if (k && r.L - Math.hypot(k.x - A.x, k.y - A.y) > 0.35) {
      k.seg = Math.hypot(k.x - A.x, k.y - A.y);
      r.pivots.push(k);
      r.L -= k.seg;
      r.accum = 0;
      r.angle = Math.atan2(c.x - k.x, c.y - k.y);
      r.twangV += 4;
      emit("spark", k.x, k.y, 6, { speed: 3, color: "#ffe066" });
      kit.sound.play("tap");
    }
    const a = ropeAnchor(r);
    let dx = c.x - a.x;
    let dy = c.y - a.y;
    const d = Math.hypot(dx, dy) || 0.0001;
    if (d > r.L) {
      const nx = dx / d;
      const ny = dy / d;
      p.x -= nx * (d - r.L);
      p.y -= ny * (d - r.L);
      const out = p.vx * nx + p.vy * ny;
      if (out > 0) {
        p.vx -= out * nx;
        p.vy -= out * ny;
      }
      dx = nx * r.L;
      dy = ny * r.L;
    }
    const angle = Math.atan2(dx, dy);
    let delta = angle - r.angle;
    if (delta > Math.PI) delta -= TAU;
    if (delta < -Math.PI) delta += TAU;
    r.angle = angle;
    r.accum += delta;
    r.still = Math.hypot(p.vx, p.vy) < 0.8 ? r.still + STEP : 0;
    if (Math.abs(r.accum) >= TAU && !r.pivots.length) {
      // Right round the hook: the cord coils and Telly speeds up.
      r.accum -= Math.sign(r.accum) * TAU;
      r.wraps += 1;
      stats.wraps += 1;
      const before = r.L;
      r.L = Math.max(LMIN, r.L * 0.82);
      if (r.targetL !== undefined) r.targetL = Math.min(r.targetL, r.L);
      const kk = Math.min(1.25, before / r.L);
      p.vx *= kk;
      p.vy *= kk;
      r.hook.jolt = 1;
      if (mode === "play") kit.addScore(25);
      const hp = hookPos(r.hook, w.t);
      emit("star", hp.x, hp.y, 12, { speed: 5, color: "#ffe066" });
      emit("ring", hp.x, hp.y, 1, { color: "#ffe066" });
      const s = toScreen(hp.x, hp.y);
      kit.fx.text(s.x, s.y - 20, "WRAP! +25", { color: "#ffe066", size: 20 });
      kit.sound.play("combo", r.wraps);
      kit.haptic(15);
    }
  }

  function zap(why, splash) {
    const w = world;
    if (w.zap > 0) return;
    w.rope = null;
    w.plug = null;
    w.unplug = null;
    w.zap = 0.9;
    w.p.face = "zap";
    const c = center(w.p);
    if (splash) emit("drop", c.x, Math.min(c.y, BOTTOM), 22, { speed: 6, vy: -6 });
    else emit("spark", c.x, Math.min(c.y, BOTTOM), 22, { speed: 7, color: "#bfefff" });
    kit.sound.play("bad");
    kit.shake(9, 0.3);
    kit.haptic(40);
    if (mode !== "play") return;
    batteries -= 1;
    updateHud();
    kit.toast(why, "#ffd166");
  }

  function respawn() {
    const w = world;
    if (mode === "play" && batteries <= 0) {
      kit.gameOver({
        reason: "Out of battery!",
        emoji: "🪫",
        stats: [["Rooms", stats.rooms], ["Stars", stats.stars], ["Sparks", stats.sparks], ["Wraps", stats.wraps]],
      });
      return;
    }
    const p = w.p;
    p.x = p.px = w.checkpoint.x;
    p.y = p.py = w.checkpoint.y;
    p.vx = p.vy = 0;
    p.ground = true;
    p.hover = 0.45;
    p.face = "happy";
    w.invuln = 1.2;
    w.cord = makeCord();
    emit("ring", p.x, p.y - 0.4, 2, { color: "#7fd6ff" });
  }

  const STAR_KEY = "fk:family-telly-swing:stars";
  function bestStars() {
    try {
      return JSON.parse(localStorage.getItem(STAR_KEY) || "{}") || {};
    } catch (_) {
      return {};
    }
  }

  function roomDone() {
    const w = world;
    stats.rooms += 1;
    if (mode === "play") {
      const cells = w.L.cells.filter((c) => c.got).length;
      const quick = roomTime <= w.L.par;
      const stars = 1 + (cells === 3 ? 1 : 0) + (quick ? 1 : 0);
      stats.stars += stars;
      const fast = Math.max(0, Math.round((w.L.par - roomTime) * 4));
      const points = 200 + stars * 100 + fast;
      kit.addScore(points);
      kit.toast(`${"★".repeat(stars)}${"☆".repeat(3 - stars)} ${w.L.def.name}! +${points}`, "#7dffb0");
      const best = bestStars();
      const key = String(w.L.n % ROOMS.length);
      if ((best[key] || 0) < stars) {
        best[key] = stars;
        try {
          localStorage.setItem(STAR_KEY, JSON.stringify(best));
        } catch (_) {
          /* storage blocked */
        }
      }
      if (batteries < BATTERIES) batteries += 1;
    }
    const next = w.L.n + 1;
    if (mode === "demo") newWorld(next % 2);
    else if (mode === "bench") newWorld(1);
    else newWorld(next);
    updateHud();
    if (mode === "play") kit.toast(`Room ${next + 1}: ${world.L.def.name}`, "#ffe9c4");
  }

  /* ---------------- the autopilot: attract screen, benchmark and tests ---------------- */
  function autopilot(dt) {
    const w = world;
    const p = w.p;
    input.left = false;
    input.right = true;
    input.jump = p.vy < 0 && !p.ground;
    if (w.rope) {
      const hp = hookPos(w.rope.hook, w.t);
      const c = center(p);
      input.cord = true;
      if (mode === "bench" && w.rope.wraps < 1 && w.L.hooks.indexOf(w.rope.hook) % 3 === 0) return;
      const landing = floorBelow(c.x + 1, p.y, 6) !== null;
      const effL = Math.min(w.rope.L, w.rope.targetL || w.rope.L);
      if ((c.x - hp.x > effL * 0.5 && p.vy < 1.5) || c.x - hp.x > effL * 0.85 || w.rope.still > 1.5 || (landing && c.x > hp.x + 0.5 && p.vy < 0)) {
        input.cord = false;
        input.cordReleased = true;
      }
      return;
    }
    input.cord = false;
    if (w.plug) return;
    const s = nearSocket();
    if (s && !powered(s) && s.x > p.x - 1.2) {
      input.cordPressed = true;
      return;
    }
    if (nearExit()) {
      input.cordPressed = true;
      return;
    }
    const h = bestHook();
    const hp = h ? hookPos(h, w.t) : null;
    if (p.ground) {
      // Wait on a rising lift until it reaches the top ledge.
      if (p.on && !p.on.mover && p.on.yUp !== undefined && powered(p.on.by) && p.on.y > p.on.yUp + 0.2) {
        input.right = false;
        return;
      }
      // Ride a moving hover-gondola until it nears the far side of its track.
      if (p.on && p.on.mover && p.x > p.on.x1 - 0.7 && p.on.x1 < p.on.bx1 + p.on.ax - 0.35 && floorBelow(p.x + 2.2, p.y, 4) === null) {
        input.right = false;
        return;
      }
      // Pause before an active or about-to-fire sparker, then dash through.
      for (const sp of w.L.sparkers) {
        const dx = sp.x + 0.5 - p.x;
        if (dx > 0.35 && dx < 1.55 && Math.abs(sp.y - p.y) < 0.6 && (sp.active || sp.warn)) {
          input.right = false;
          return;
        }
      }
      // Whip or stomp any patrolling baddie ahead.
      for (const bd of w.L.baddies) {
        if (bd.dead) continue;
        const dx = bd.x - p.x;
        if (dx > -0.2 && dx < 2.2 && Math.abs(bd.y - p.y) < 1.1) {
          if (w.flick <= 0 && dx > 0.5) input.cordPressed = true;
          if (dx < 1.35) input.jumpPressed = true;
          break;
        }
      }
      const ahead = p.x + 0.9;
      const gap = floorBelow(ahead, p.y, 4) === null || w.L.water.some((q) => ahead > q.x0 && ahead < q.x1 && Math.abs(q.y - p.y) < 0.1);
      const wall = solidAt(p.x + 0.6, p.y - 0.5) || solidAt(p.x + 0.6, p.y - 1.4);
      if (gap || wall) {
        if (gap && hp && hp.x > p.x + 0.5) input.cordPressed = true;
        else input.jumpPressed = true;
      }
    } else if (p.vy > 1 && hp && hp.x > p.x + 0.8 && floorBelow(p.x, p.y, 3) === null) {
      input.cordPressed = true;
    }
    // On the attract screen a stuck Telly hops on to the next pad.
    const prog = w.progress;
    if (p.x > prog.x + 0.4) {
      prog.x = p.x;
      prog.t = 0;
    } else {
      prog.t += dt;
      if (prog.t > 4 && (mode !== "play" || auto)) {
        prog.t = 0;
        w.skips += 1;
        const next = w.L.pads.find((pd) => pd.x > p.x + 1) || w.L.exit;
        p.x = p.px = next.x;
        p.y = p.py = next.y;
        p.vx = p.vy = 0;
        w.rope = null;
        prog.x = p.x;
      }
    }
  }

  /* ---------------- the power cord: a little chain of points ---------------- */
  const CORD_N = 18;
  function makeCord() {
    const pts = [];
    const p = world ? world.p : { x: 2, y: 11, dir: 1 };
    const a = cordAnchor(p.x, p.y, p.dir, 0, 1, 0);
    for (let i = 0; i < CORD_N; i++) {
      pts.push({
        x: a.x - p.dir * i * 0.095,
        y: a.y + Math.min(0.18, i * 0.025),
        px: a.x - p.dir * i * 0.095,
        py: a.y + Math.min(0.18, i * 0.025),
      });
    }
    if (world) world.plugAngle = p.dir > 0 ? Math.PI : 0;
    return pts;
  }

  // Exact world position and outward tangent of Telly's rubber cord grommet,
  // rotating with Telly's tilt/squash and blending to the top grip during a swing.
  function cordAnchor(x, y, faceDir, tilt, sy, ropeBlend) {
    const p = world ? world.p : null;
    const rawDir = faceDir !== undefined ? faceDir : p ? (p.faceDir !== undefined ? p.faceDir : p.dir) : 1;
    const fDir = (rawDir >= 0 ? 1 : -1) * (0.78 + 0.22 * Math.min(1, Math.abs(rawDir)));
    const tl = tilt !== undefined ? tilt : p ? p.tilt : 0;
    const stretchY = sy !== undefined ? sy : p ? p.sy : 1;
    const rb = ropeBlend !== undefined ? ropeBlend : p ? p.ropeBlend || 0 : 0;
    const s = 1.05;
    const sx = 1 + (1 - stretchY) * 0.9;
    // Blend from the rear grommet (-0.54, 0.14) to the top swing clasp (0, -0.46).
    const lx = lerp(-0.54, 0, rb) * sx * fDir;
    const ly = (lerp(0.14, -0.46, rb) - s * 0.46) * stretchY;
    const cos = Math.cos(tl);
    const sin = Math.sin(tl);
    const wx = x + lx * cos - ly * sin;
    const wy = y + lx * sin + ly * cos;
    const tnx = lerp(-fDir, 0, rb);
    const tny = lerp(0.08, -1, rb);
    const nx = tnx * cos - tny * sin;
    const ny = tnx * sin + tny * cos;
    return { x: wx, y: wy, nx, ny };
  }

  // The cord's path while it is on a hook: Telly, each wrapped corner, the hook.
  function ropePath(ax, ay) {
    const r = world.rope;
    const hp = hookPos(r.hook, world.t);
    const path = [{ x: ax, y: ay }];
    for (let i = r.pivots.length - 1; i >= 0; i--) path.push(r.pivots[i]);
    const prev = path[path.length - 1];
    const ang = Math.atan2(hp.y - prev.y, hp.x - prev.x);
    // Stop at the hook's outer clasp ring so the plug clamps onto the rim.
    const clasp = { x: hp.x - Math.cos(ang) * 0.18, y: hp.y - Math.sin(ang) * 0.18 };
    path.push(clasp);
    if (r.shoot > 0) {
      // The plug flies out to the hook.
      const k = 1 - r.shoot / 0.11;
      const e = 1 - Math.pow(1 - k, 2.5);
      const last = path.length - 1;
      path[last] = { x: lerp(path[last - 1].x, clasp.x, e), y: lerp(path[last - 1].y, clasp.y, e) };
    }
    return path;
  }

  function stepCord(dt) {
    const w = world;
    const pts = w.cord;
    const p = w.p;
    const a = cordAnchor(p.x, p.y, p.faceDir, p.tilt, p.sy, p.ropeBlend);
    if (w.rope) {
      // Lay the chain along the rope (with throw whip, slack bow and pluck twang)
      // so letting go starts smoothly from its live shape.
      const r = w.rope;
      const path = ropePath(a.x, a.y);
      const lens = [];
      let total = 0;
      for (let i = 1; i < path.length; i++) {
        const l = Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
        lens.push(l);
        total += l;
      }
      const lastA = path[Math.max(0, path.length - 2)];
      const lastB = path[path.length - 1];
      const segDx = lastB.x - lastA.x;
      const segDy = lastB.y - lastA.y;
      const segLen = Math.hypot(segDx, segDy) || 1;
      const px = -segDy / segLen;
      const py = segDx / segLen;
      const shootK = r.shoot > 0 ? r.shoot / 0.11 : 0;
      const slack = Math.max(0, (r.L - segLen) * 0.28);
      for (let i = 0; i < CORD_N; i++) {
        let d = (total * i) / (CORD_N - 1);
        let k = 0;
        while (k < lens.length - 1 && d > lens[k]) {
          d -= lens[k];
          k += 1;
        }
        const f = lens[k] ? clamp(d / lens[k], 0, 1) : 0;
        let x = lerp(path[k].x, path[k + 1].x, f);
        let y = lerp(path[k].y, path[k + 1].y, f);
        if (k === lens.length - 1) {
          const arch = Math.sin(f * Math.PI);
          // Whip wave during throw, twang on latch, and natural bow when slack.
          const whip = shootK > 0 ? Math.sin(f * Math.PI * 2.5 - (1 - shootK) * 14) * shootK * 0.26 * arch : 0;
          const twang = r.twang * 0.08 * arch;
          const bow = slack * arch * (segDx >= 0 ? 1 : -1);
          x += px * (whip + twang) + bow * 0.25;
          y += py * (whip + twang) + slack * arch * 0.7;
        }
        const q = pts[i];
        q.px = q.x;
        q.py = q.y;
        q.x = x;
        q.y = y;
      }
      w.plugAngle = Math.atan2(segDy, segDx);
      return;
    }
    let endPin = null;
    let neckPin = null;
    let seg = 0.095;
    let targetPlugAngle = null;
    if (w.plug) {
      const s = w.plug.target;
      const side = w.plug.side;
      const rc = plugReceptacle(s, w.plug.exit, side);
      const u = clamp(w.plug.t / w.plug.seatT, 0, 1);
      const e = 1 - Math.pow(1 - u, 3);
      const destX = rc.x;
      const destY = rc.y;
      const arc = Math.sin(u * Math.PI) * 0.85;
      endPin = {
        x: lerp(w.plug.startX, destX, e),
        y: lerp(w.plug.startY, destY, e) - arc,
      };
      const goalAngle = side < 0 ? 0 : Math.PI;
      targetPlugAngle = w.plug.startAngle + angleDiff(w.plug.startAngle, goalAngle) * e;
      if (u > 0.45) {
        const k = (u - 0.45) / 0.55;
        neckPin = {
          x: endPin.x + side * 0.24 * k,
          y: endPin.y + 0.05 * k,
        };
      }
      seg = Math.max(0.085, (Math.hypot(endPin.x - a.x, endPin.y - a.y) * 1.18) / (CORD_N - 1));
    } else if (w.flick > 0) {
      const u = clamp(1 - w.flick / 0.32, 0, 1);
      const ext = u <= 0.36 ? 1 - Math.pow(1 - u / 0.36, 3) : 1 - (u - 0.36) / 0.64;
      let tx = a.x + p.dir * 2.55;
      let ty = a.y - 1.15;
      if (w.flickBaddie) {
        tx = w.flickBaddie.x;
        ty = w.flickBaddie.y - w.flickBaddie.h * 0.55;
      }
      endPin = {
        x: lerp(a.x, tx, ext),
        y: lerp(a.y, ty, ext) - Math.sin(ext * Math.PI) * 0.38,
      };
      const dx = endPin.x - a.x;
      const dy = endPin.y - a.y;
      for (let i = 0; i < CORD_N; i++) {
        const f = i / (CORD_N - 1);
        const arch = Math.sin(f * Math.PI);
        const whipWave = Math.sin(f * Math.PI * 2.2 - u * 11) * 0.18 * arch;
        const x = a.x + dx * f;
        const y = a.y + dy * f - arch * 0.32 * ext + whipWave;
        const q = pts[i];
        q.px = q.x;
        q.py = q.y;
        q.x = x;
        q.y = y;
      }
      w.plugAngle = Math.atan2(ty - a.y, tx - a.x);
      return;
    }
    const g = 30 * dt * dt;
    const fan = inWind({ x: a.x, y: a.y + 0.3, h: 0.6 });
    const perkTarget = !w.plug && !w.unplug ? nearSocket() || (nearExit() ? w.L.exit : null) || nearBaddie() : null;
    const hookTarget = !w.plug && !w.unplug && !perkTarget ? bestHook() : null;
    for (let i = 1; i < CORD_N; i++) {
      const q = pts[i];
      const isPlug = i === CORD_N - 1;
      const damp = isPlug ? 0.94 : 0.955;
      const vx = (q.x - q.px) * damp;
      const vy = (q.y - q.py) * damp;
      q.px = q.x;
      q.py = q.y;
      q.x += vx;
      // In a fan's wind the cord flutters instead of hanging.
      q.x += fan ? Math.sin(w.t * 20 + i) * 0.004 : 0;
      q.y += vy + (fan ? -g * 0.4 : g * (isPlug ? 1.15 : 1));
    }
    // Cordy's alive plug tail: perks up and points toward a nearby socket or hook!
    if ((perkTarget || hookTarget) && !endPin) {
      const last = pts[CORD_N - 1];
      const tx = perkTarget ? perkTarget.x : hookPos(hookTarget, w.t).x;
      const ty = perkTarget ? perkTarget.y - 0.8 : hookPos(hookTarget, w.t).y;
      const pull = perkTarget ? 0.014 : 0.008;
      last.x += clamp(tx - last.x, -1.5, 1.5) * pull;
      last.y -= 0.018 + Math.sin(w.t * 8) * 0.005;
      targetPlugAngle = Math.atan2(ty - last.y, tx - last.x);
    }
    for (let it = 0; it < 7; it++) {
      pts[0].x = a.x;
      pts[0].y = a.y;
      // Strain-relief stiffness right where the cord leaves Telly's chassis.
      if (!w.plug && w.flick <= 0) {
        pts[1].x = lerp(pts[1].x, a.x + a.nx * seg * 1.05, 0.32);
        pts[1].y = lerp(pts[1].y, a.y + a.ny * seg * 1.05, 0.32);
      }
      if (endPin) {
        pts[CORD_N - 1].x = endPin.x;
        pts[CORD_N - 1].y = endPin.y;
      }
      if (neckPin) {
        pts[CORD_N - 2].x = lerp(pts[CORD_N - 2].x, neckPin.x, 0.55);
        pts[CORD_N - 2].y = lerp(pts[CORD_N - 2].y, neckPin.y, 0.55);
      }
      for (let i = 0; i < CORD_N - 1; i++) {
        const q = pts[i];
        const r = pts[i + 1];
        const dx = r.x - q.x;
        const dy = r.y - q.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const diff = (d - seg) / d;
        const wq = i === 0 ? 0 : 0.5;
        const wr = i + 1 === CORD_N - 1 && endPin ? 0 : i + 1 === CORD_N - 1 ? 0.35 : 0.5;
        const sum = wq + wr || 1;
        q.x += dx * diff * (wq / sum);
        q.y += dy * diff * (wq / sum);
        r.x -= dx * diff * (wr / sum);
        r.y -= dy * diff * (wr / sum);
      }
      // The trailing cord and heavy plug rest on top of the floor rather than clipping it.
      for (let i = 1; i < CORD_N; i++) {
        const q = pts[i];
        const clearance = i === CORD_N - 1 ? 0.13 : i === CORD_N - 2 ? 0.08 : 0.04;
        const v = w.L.tile(Math.floor(q.x), Math.floor(q.y + clearance));
        if (v === 1) {
          q.y = Math.floor(q.y + clearance) - clearance;
          q.px = lerp(q.px, q.x, i === CORD_N - 1 ? 0.35 : 0.45);
        }
      }
    }
    const end = pts[CORD_N - 1];
    const prev = pts[CORD_N - 3];
    const naturalAngle = Math.atan2(end.y - prev.y, end.x - prev.x);
    const goal = targetPlugAngle !== null ? targetPlugAngle : naturalAngle;
    w.plugAngle = (w.plugAngle || 0) + angleDiff(w.plugAngle || 0, goal) * Math.min(1, dt * (w.plug ? 28 : 14));
  }

  /* ---------------- particles, in world units ---------------- */
  function emit(kind, x, y, n, o) {
    if (!world) return;
    const opt = o || {};
    const parts = world.parts;
    for (let i = 0; i < n && parts.length < 420; i++) {
      const a = Math.random() * TAU;
      const sp = (opt.speed || 2) * (0.4 + Math.random() * 0.8);
      const q = {
        kind, x, y,
        vx: (opt.vx || 0) + Math.cos(a) * sp,
        vy: (opt.vy || 0) + Math.sin(a) * sp - (kind === "dust" ? sp * 0.6 : 0),
        life: 0, max: 0.4 + Math.random() * 0.4, size: 0.08 + Math.random() * 0.1, color: opt.color || "#ffffff",
      };
      if (kind === "dust") { q.vy = -Math.random() * (opt.speed || 2) * 0.6 + (opt.vy || 0); q.vx = (opt.vx || 0) + (Math.random() - 0.5) * (opt.speed || 2) * 1.6; q.size = 0.1 + Math.random() * 0.12; q.max = 0.45 + Math.random() * 0.3; }
      if (kind === "ring") { q.vx = q.vy = 0; q.max = 0.45 + i * 0.12; q.size = 0.2; }
      if (kind === "smoke") { q.vx *= 0.3; q.vy = -1 - Math.random(); q.size = 0.15; q.max = 0.8; }
      if (kind === "drop") { q.size = 0.06 + Math.random() * 0.06; q.max = 0.7; }
      parts.push(q);
    }
  }
  function stepParticles(dt) {
    const w = world;
    const parts = w.parts;
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.life += dt;
      if (q.life >= q.max) {
        parts.splice(i, 1);
        continue;
      }
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      if (q.kind === "spark" || q.kind === "drop") q.vy += 22 * dt;
      else if (q.kind === "star") q.vy += 4 * dt;
      else if (q.kind === "dust") { q.vx *= 1 - dt * 3; q.vy += 2.5 * dt; }
      if (q.kind === "spark" || q.kind === "drop") {
        // Bounce off floors once, then settle.
        if (w.L.tile(Math.floor(q.x), Math.floor(q.y)) === 1 && q.vy > 0) {
          q.y = Math.floor(q.y) - 0.01;
          q.vy *= -0.35;
          q.vx *= 0.6;
        }
      }
    }
    for (const f of w.L.fans) {
      if (f.spin > 0.3 && Math.random() < dt * 30 * f.spin && w.wind.length < 120) {
        w.wind.push({ x: f.x + (Math.random() - 0.5) * 1.3, y: f.y - 0.2, len: 0.4 + Math.random() * 0.7, top: f.y - f.h, v: 7 + Math.random() * 5 });
      }
    }
    for (let i = w.wind.length - 1; i >= 0; i--) {
      const s = w.wind[i];
      s.y -= s.v * dt;
      if (s.y < s.top) w.wind.splice(i, 1);
    }
  }

  /* ======================= drawing ======================= */
  let view = null;
  let ctx = null;
  let W = 1;
  let H = 1;
  let T = 32;         // pixels per tile at zoom 1
  let Z = 32;         // pixels per tile this frame (with the camera's zoom)
  let DPR = 1;
  let safeBottom = 0;
  let skyCache = null;
  let skyKey = "";
  let vignette = null;
  let glowCache = {};
  const strips = new Map();     // parallax layers, per theme
  const chunks = new Map();     // pre-drawn blocks of tiles
  let lightCanvas = null;
  const lights = [];

  /* Quality: 0 full, 1 fewer pixels and extras, 2 also no far scenery.
   * Play steps down when frames run slow; the benchmark stays at full. */
  let quality = 0;
  const frameTimes = [];
  let governedAt = 0;
  const DPR_CAP = [2.5, 1.6, 1.15];
  function govern(dt) {
    if (bench.active || document.hidden) return;
    frameTimes.push(dt);
    if (frameTimes.length > 90) frameTimes.shift();
    const now = performance.now();
    if (quality >= 2 || frameTimes.length < 90 || now - governedAt < 2500) return;
    const sorted = frameTimes.slice().sort((a, b) => a - b);
    if (sorted[45] > 1 / 46) {
      quality += 1;
      governedAt = now;
      frameTimes.length = 0;
      if (view) view.resize();
    }
  }

  function onResize(v) {
    view = v;
    ctx = v.ctx;
    W = v.w;
    H = v.h;
    const cap = bench.active ? DPR_CAP[0] : DPR_CAP[quality];
    if (v.dpr > cap) {
      // Fewer pixels: draw at a lower density and let the browser scale up.
      v.dpr = cap;
      v.canvas.width = Math.round(W * cap);
      v.canvas.height = Math.round(H * cap);
      ctx.setTransform(cap, 0, 0, cap, 0, 0);
    }
    DPR = v.dpr;
    T = Math.max(26, Math.min(W / 10, H / 10.5));
    Z = T;
    skyKey = "";
    vignette = null;
    glowCache = {};
    strips.clear();
    chunks.clear();
    lightCanvas = null;
    const probe = document.getElementById("ts-safe");
    safeBottom = probe ? parseFloat(getComputedStyle(probe).paddingBottom) || 0 : 0;
  }

  function anchorY() {
    return showPad ? 0.48 : 0.56;
  }

  function camOrigin() {
    const cam = world.cam;
    return { x: Math.round(W * 0.42 - cam.x * Z), y: Math.round(H * anchorY() - cam.y * Z) };
  }

  function toScreen(x, y) {
    if (!world) return { x: 0, y: 0 };
    const o = camOrigin();
    return { x: o.x + x * Z, y: o.y + y * Z };
  }

  function rngFn(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash(x, y) {
    let h = (x * 374761393 + y * 668265263) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
    return (h ^ (h >>> 16)) / 4294967296;
  }

  function canvasOf(w, h) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    return c;
  }

  /* ---------- sky ---------- */
  function sky(theme) {
    const key = `${theme.name}:${W}x${H}`;
    if (key === skyKey && skyCache) return skyCache;
    const q = Math.min(DPR, 1.25);
    const c = canvasOf(W * q, H * q);
    const g = c.getContext("2d");
    g.scale(q, q);
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, theme.sky[0]);
    grad.addColorStop(1, theme.sky[1]);
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    const r = rngFn(77);
    if (theme.dark) {
      for (let i = 0; i < (theme.night ? 140 : 50); i++) {
        g.globalAlpha = 0.3 + r() * 0.6;
        g.fillStyle = "#fff";
        g.beginPath();
        g.arc(r() * W, r() * H * 0.7, 0.4 + r() * 1.4, 0, TAU);
        g.fill();
      }
      g.globalAlpha = 1;
    }
    const lx = W * 0.78;
    const ly = H * 0.17;
    const m = Math.min(W, H);
    const lg = g.createRadialGradient(lx, ly, 0, lx, ly, Math.max(W, H) * 0.6);
    lg.addColorStop(0, theme.night ? "rgba(255,247,200,0.32)" : "rgba(255,255,240,0.6)");
    lg.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = lg;
    g.fillRect(0, 0, W, H);
    g.fillStyle = theme.night ? "#fff6c9" : theme.dark ? "#ffd9a0" : "rgba(255,255,255,0.9)";
    g.beginPath();
    g.arc(lx, ly, m * 0.06, 0, TAU);
    g.fill();
    if (theme.night) {
      g.fillStyle = theme.sky[0];
      g.beginPath();
      g.arc(lx + m * 0.025, ly - m * 0.015, m * 0.052, 0, TAU);
      g.fill();
    }
    // Soft clouds.
    g.fillStyle = theme.dark ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.45)";
    for (let i = 0; i < 6; i++) {
      const cx = r() * W;
      const cy = H * (0.08 + r() * 0.3);
      const s = m * (0.05 + r() * 0.05);
      for (let k = 0; k < 4; k++) {
        g.beginPath();
        g.ellipse(cx + (k - 1.5) * s * 0.9, cy + Math.sin(k * 2) * s * 0.2, s * (0.8 + (k % 2) * 0.3), s * 0.55, 0, 0, TAU);
        g.fill();
      }
    }
    // Light shafts, indoors, and a haze low down for depth.
    if (!theme.night && (theme.bg === "home" || theme.bg === "kitchen" || theme.bg === "garage" || theme.bg === "workshop")) {
      g.save();
      g.globalAlpha = theme.dark ? 0.06 : 0.1;
      g.fillStyle = theme.light;
      for (let i = 0; i < 3; i++) {
        const x = W * (0.05 + i * 0.36);
        g.beginPath();
        g.moveTo(x, 0);
        g.lineTo(x + W * 0.1, 0);
        g.lineTo(x + W * 0.34, H);
        g.lineTo(x + W * 0.16, H);
        g.fill();
      }
      g.restore();
    }
    const hz = g.createLinearGradient(0, H * 0.3, 0, H);
    hz.addColorStop(0, "rgba(255,255,255,0)");
    hz.addColorStop(1, theme.dark ? "rgba(40,30,80,0.25)" : "rgba(255,240,235,0.28)");
    g.fillStyle = hz;
    g.fillRect(0, 0, W, H);
    skyCache = c;
    skyKey = key;
    return c;
  }

  /* ---------- parallax layers: painted once per theme ---------- */
  function strip(theme, layer) {
    const key = `${theme.name}:${layer}`;
    if (strips.has(key)) return strips.get(key);
    const far = layer === 0;
    const q = far ? 0.4 : Math.min(DPR, 1.25);   // the far layer is painted small: soft focus
    const u = T * (far ? 0.62 : 0.78);
    const SW = Math.ceil(u * 30);
    const SH = Math.ceil(u * 12);
    const base = SH - u * 2;
    const c = canvasOf(SW * q, SH * q);
    const g = c.getContext("2d");
    g.scale(q, q);
    const color = far ? theme.far : theme.mid;
    const r = rngFn(theme.name.length * 97 + layer * 13);

        g.lineTo(x + 1 + d, y - d);
        g.lineTo(x + 1 + d, y + 1 - d);
        g.lineTo(x + 1, y + 1);
        g.closePath();
        g.fill();
      }
    }
    // Fronts, with rounded outer corners.
    const R = 0.26;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (!solid(x, y)) continue;
        const up = air(x, y - 1);
        const dn = air(x, y + 1);
        const lf = air(x - 1, y);
        const rt = air(x + 1, y);
        const tl = up && lf ? R : 0;
        const tr = up && rt ? R : 0;
        const br = dn && rt ? R : 0;
        const bl = dn && lf ? R : 0;
        g.fillStyle = pat;
        g.beginPath();
        g.moveTo(x + tl, y);
        g.lineTo(x + 1 - tr, y);
        if (tr) g.quadraticCurveTo(x + 1, y, x + 1, y + tr);
        g.lineTo(x + 1, y + 1 - br);
        if (br) g.quadraticCurveTo(x + 1, y + 1, x + 1 - br, y + 1);
        g.lineTo(x + bl, y + 1);
        if (bl) g.quadraticCurveTo(x, y + 1, x, y + 1 - bl);
        g.lineTo(x, y + tl);
        if (tl) g.quadraticCurveTo(x, y, x + tl, y);
        g.closePath();
        g.fill();
        // Deeper is darker; edges catch the light or fall into shade.
        const k = depth(x, y);
        if (k > 0) {
          g.fillStyle = `rgba(15,8,35,${Math.min(0.32, k * 0.08)})`;
          g.fill();
        }
        if (lf) {
          const gr = g.createLinearGradient(x, 0, x + 0.25, 0);
          gr.addColorStop(0, "rgba(255,255,255,0.22)");
          gr.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = gr;
          g.fillRect(x, y + (up ? 0.25 : 0), 0.25, 1 - (up ? 0.25 : 0) - (dn ? R : 0));
        }
        if (rt) {
          const gr = g.createLinearGradient(x + 0.75, 0, x + 1, 0);
          gr.addColorStop(0, "rgba(0,0,0,0)");
          gr.addColorStop(1, "rgba(0,0,0,0.22)");
          g.fillStyle = gr;
          g.fillRect(x + 0.75, y + (up ? 0.25 : 0), 0.25, 1 - (up ? 0.25 : 0) - (dn ? R : 0));
        }
        if (dn) {
          g.fillStyle = "rgba(0,0,0,0.18)";
          g.fillRect(x + bl, y + 0.88, 1 - bl - br, 0.12);
        }
      }
    }
    // The top surface: a thick lip with a lit edge, and its decorations.
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (!solid(x, y) || solid(x, y - 1)) continue;
        const lf = air(x - 1, y) || solid(x - 1, y - 1);
        const rt = air(x + 1, y) || solid(x + 1, y - 1);
        const ex0 = lf ? x - 0.06 : x;
        const ex1 = rt ? x + 1.06 : x + 1.001;
        const gr = g.createLinearGradient(0, y - 0.02, 0, y + 0.32);
        gr.addColorStop(0, theme.topHi);
        gr.addColorStop(0.35, theme.top);
        gr.addColorStop(1, theme.top);
        g.fillStyle = gr;
        roundRect(g, ex0, y - 0.04, ex1 - ex0, 0.34, lf || rt ? 0.12 : 0);
        g.fill();
        g.fillStyle = "rgba(0,0,0,0.15)";
        g.fillRect(ex0 + 0.04, y + 0.26, ex1 - ex0 - 0.08, 0.06);
        g.fillStyle = "rgba(255,255,255,0.55)";
        g.fillRect(ex0 + 0.08, y - 0.02, ex1 - ex0 - 0.16, 0.04);
        decorate(g, theme, x, y);
      }
    }
    // One-way shelves: planks on brackets.
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (L.tile(x, y) !== 2) continue;
        const startL = L.tile(x - 1, y) !== 2;
        const endR = L.tile(x + 1, y) !== 2;
        g.fillStyle = theme.side;
        g.fillRect(x + d, y - d, 1, 0.3);
        const gr = g.createLinearGradient(0, y, 0, y + 0.3);
        gr.addColorStop(0, theme.topHi);
        gr.addColorStop(1, theme.top);
        g.fillStyle = gr;
