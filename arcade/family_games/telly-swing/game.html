    if (!showPad || kit.state !== "playing") return;
    const held = new Set(touches.values());
    const w = world;
    let cordIcon = "🔌";
    if (w && !w.rope) {
      if (nearSocket() || nearExit()) cordIcon = "🔌";
      else if (bestHook()) cordIcon = "🪝";
    }
    for (const b of buttons()) {
      const on = held.has(b.id);
      ctx.fillStyle = on ? "rgba(255,255,255,0.55)" : "rgba(255,255,255,0.28)";
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgba(30,25,60,0.85)";
      ctx.font = `bold ${Math.round(b.r * 0.85)}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(b.id === "cord" ? cordIcon : b.icon, b.x, b.y + 1);
      if (b.id === "cord" && w && !w.rope && (nearSocket() || nearExit() || bestHook())) {
        ctx.strokeStyle = `rgba(255,230,90,${0.6 + 0.3 * Math.sin(w.t * 8)})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 4, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.textBaseline = "alphabetic";
  }

  let lastRender = 0;
  function render() {
    if (!ctx) return;
    const now = performance.now();
    const realDt = lastRender ? clamp((now - lastRender) / 1000, 0, 1 / 30) : 1 / 60;
    lastRender = now;
    if (bench.active) bench.frame(now);
    if (!world) newWorld(0);
    // The attract screen plays itself behind the title and result cards.
    if (kit.state !== "playing" && kit.state !== "paused" && mode === "play") {
      mode = "demo";
      newWorld(0);
    }
    if (kit.state !== "playing" && kit.state !== "paused") simulate(realDt);
    const w = world;
    const p = w.p;
    const L = w.L;
    const tx = p.x + p.dir * 1.6 + (w.rope ? p.vx * 0.12 : 0);
    w.cam.x = lerp(w.cam.x, tx, 0.07);
    w.cam.y = lerp(w.cam.y, Math.min(p.y, BOTTOM + 1) - 1.8, 0.07);
    w.cam.x = Math.max(w.cam.x, (W * 0.42) / T - 1);
    const theme = L.theme;
    ctx.save();
    kit.applyShake(ctx);
    drawBackground(theme);
    ctx.save();
    ctx.translate(Math.round(W * 0.42 - w.cam.x * T), Math.round(H * anchorY() - w.cam.y * T));
    ctx.scale(T, T);
    drawWires();
    drawTiles(theme);
    for (const wtr of L.water) drawWater(wtr, theme);
    for (const pl of L.plates) drawPlate(pl);
    for (const br of L.bridges) drawBridge(br);
    for (const d of L.doors) drawDoor(d);
    for (const lf of L.lifts) drawLift(lf);
    for (const f of L.fans) drawFan(f);
    for (const sp of L.sparkers) drawSparker(sp);
    for (const s of L.springs) drawSpring(s);
    for (const pad of L.pads) drawPad(pad);
    for (const s of L.sockets) drawSocket(s);
    drawExit(L.exit);
    const target = !w.rope && w.zap <= 0 && !w.plug ? bestHook() : null;
    for (const h of L.hooks) drawHook(h, h === target);
    for (const s of L.sparks) drawSpark(s);
    for (const c of L.cells) drawCell(c);
    for (const c of L.crates) drawCrate(c);
    if (bench.active && w.trail.length > 1) {
      ctx.strokeStyle = "rgba(255,230,120,0.35)";
      ctx.lineWidth = 0.08;
      ctx.beginPath();
      const from = Math.max(0, w.trail.length - 240);
      for (let i = from; i < w.trail.length; i++) {
        if (i === from) ctx.moveTo(w.trail[i].x, w.trail[i].y);
        else ctx.lineTo(w.trail[i].x, w.trail[i].y);
      }
      ctx.stroke();
    }
    drawCord();
    drawTelly();
    drawDust();
    ctx.restore();
    if (theme.dim) ctx.drawImage(getVignette(), 0, 0, W, H);
    kit.fx.draw(ctx);
    drawButtons();
    ctx.restore();
  }

  function simulate(dt) {
    const w = world;
    w.acc += dt;
    let n = 0;
    while (w.acc >= STEP && n < 8) {
      step(STEP);
      w.acc -= STEP;
      n += 1;
      if (world !== w) return;
    }
    if (n === 8) w.acc = 0;
  }

  function update(dt) {
    if (mode !== "play") return;
    if (world.finishing <= 0) roomTime += dt;
    simulate(dt);
  }

  function updateHud() {
    if (mode !== "play" || !world) return;
    const cells = world.L.cells.filter((c) => c.got).length;
    kit.setExtra(`<span>🔋${Math.max(0, batteries)} · Room ${world.L.n + 1}${cells ? ` · ${cells}/3` : ""}</span>`);
  }

  function startGame() {
    bench.stop(false);
    mode = "play";
    batteries = BATTERIES;
    for (const k of Object.keys(stats)) stats[k] = 0;
    clearInput();
    newWorld(0);
    updateHud();
    kit.toast(`Room 1: ${world.L.def.name}`, "#ffe9c4");
  }

  /* ---------------- benchmark: "Test this device" ---------------- */
  const BENCH_SECONDS = 20;
  const BENCH_KEY = "fk:family-telly-swing:bench";
  const bench = {
    active: false,
    started: 0,
    last: 0,
    frames: [],
    begin() {
      if (kit.state === "playing" || kit.state === "paused") return;
      const overlay = document.getElementById("fk-overlay");
      overlay.classList.remove("fk-show");
      overlay.innerHTML = "";
      mode = "bench";
      newWorld(1);
      this.active = true;
      this.frames = [];
      this.started = performance.now();
      this.last = 0;
      kit.sound.unlock();
    },
    frame(now) {
      if (this.last) this.frames.push(now - this.last);
      this.last = now;
      if (now - this.started >= BENCH_SECONDS * 1000) this.stop(true);
    },
    stop(show) {
      if (!this.active) return;
      this.active = false;
      mode = "demo";
      newWorld(0);
      if (show) showBenchResult(summarize(this.frames));
    },
  };

  function summarize(frames) {
    const sorted = frames.slice().sort((a, b) => a - b);
    const total = frames.reduce((s, f) => s + f, 0) || 1;
    const pct = (q) => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * q))] || 0;
    const slowest = sorted.slice(Math.floor(sorted.length * 0.99));
    const low = slowest.length ? 1000 / (slowest.reduce((s, f) => s + f, 0) / slowest.length) : 0;
    const result = {
      fps: Math.round((frames.length / total) * 1000),
      low1: Math.round(low),
      p95: Math.round(pct(0.95) * 10) / 10,
      hitches: frames.filter((f) => f > 50).length,
      frames: frames.length,
      w: Math.round(W),
      h: Math.round(H),
      dpr: view ? view.dpr : 1,
      ua: navigator.userAgent.slice(0, 160),
      at: new Date().toISOString(),
    };
    result.grade = result.fps >= 55 && result.hitches <= 2 ? "Silky smooth" : result.fps >= 40 ? "Smooth" : result.fps >= 25 ? "Playable" : "Struggling";
    try {
      localStorage.setItem(BENCH_KEY, JSON.stringify(result));
    } catch (_) {
      /* storage blocked */
    }
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: "arcade-game", slug: "family-telly-swing", type: "benchmark", result }, "*");
      }
    } catch (_) {
      /* parent gone */
    }
    return result;
  }

  function lastBench() {
    try {
      return JSON.parse(localStorage.getItem(BENCH_KEY) || "null");
    } catch (_) {
      return null;
    }
  }

  function showBenchResult(r) {
    const overlay = document.getElementById("fk-overlay");
    overlay.innerHTML =
      `<div class="fk-card"><div class="fk-emoji">🧪</div><h2>${r.grade}</h2>` +
      `<p class="fk-tag">This device ran Telly's busiest room for ${BENCH_SECONDS} seconds.</p>` +
      `<div class="ts-bench-grid">` +
      `<div><b>${r.fps}</b><span>frames a second</span></div>` +
      `<div><b>${r.low1}</b><span>slowest 1% (fps)</span></div>` +
      `<div><b>${r.p95} ms</b><span>95% of frames under</span></div>` +
      `<div><b>${r.hitches}</b><span>hitches over 50 ms</span></div>` +
      `</div>` +
      `<p class="ts-bench-note">${r.w}×${r.h} at ${r.dpr}× pixels. 60 is perfect; above 40 plays well.</p>` +
      `<button class="fk-btn" type="button" data-ts="again">↻ Test again</button>` +
      `<button class="fk-btn fk-ghost" type="button" data-ts="back">Back</button></div>`;
    overlay.classList.add("fk-show");
    tap(overlay.querySelector('[data-ts="again"]'), () => bench.begin());
    tap(overlay.querySelector('[data-ts="back"]'), () => kit.showTitle());
  }

  function tap(node, fn) {
    if (!node) return;
    let down = null;
    node.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
    node.addEventListener("pointerup", (e) => {
      if (!down) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      down = null;
      if (moved < 24) {
        e.preventDefault();
        fn();
      }
    });
    node.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        fn();
      }
    });
  }

  // Add "Test this device" and the stars won so far to the title card.
  const overlayEl = document.getElementById("fk-overlay");
  new MutationObserver(() => {
    const card = overlayEl.querySelector(".fk-card");
    if (!card || !card.querySelector('[data-fk="go"]') || card.querySelector('[data-ts="bench"]')) return;
    const btn = document.createElement("button");
    btn.className = "fk-btn fk-ghost";
    btn.type = "button";
    btn.dataset.ts = "bench";
    btn.textContent = "🧪 Test this device";
    const go = card.querySelector('[data-fk="go"]');
    go.insertAdjacentElement("afterend", btn);
    tap(btn, () => bench.begin());
    const won = Object.values(bestStars()).reduce((s, n) => s + (Number(n) || 0), 0);
    const prev = lastBench();
    if (won || prev) {
      const line = document.createElement("div");
      line.className = "ts-bench-line";
      line.textContent = [won ? `★ ${won} of ${ROOMS.length * 3} stars` : "", prev ? `Last test: ${prev.fps} fps` : ""].filter(Boolean).join(" · ");
      btn.insertAdjacentElement("afterend", line);
    }
  }).observe(overlayEl, { childList: true, subtree: true });

  /* ---------------- input ---------------- */
  view = kit.canvas(onResize);
  const cv = view.canvas;
  const local = (e) => {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  cv.addEventListener("pointerdown", (e) => {
    if (kit.state !== "playing") return;
    e.preventDefault();
    try {
      cv.setPointerCapture(e.pointerId);
    } catch (_) {
      /* synthetic pointer */
    }
    if (e.pointerType !== "mouse") showPad = true;
    if (!showPad) {
      // A mouse with no on-screen pad: a click throws the cord (or plugs in).
      touches.set(e.pointerId, "cord");
    } else {
      const at = local(e);
      const b = buttonAt(at.x, at.y);
      if (!b) return;
      touches.set(e.pointerId, b);
    }
    applyTouches();
  });
  cv.addEventListener("pointermove", (e) => {
    if (!touches.has(e.pointerId) || !showPad) return;
    e.preventDefault();
    const at = local(e);
    const b = buttonAt(at.x, at.y);
    // Sliding a thumb between ◀ and ▶ changes direction; other buttons hold.
    const was = touches.get(e.pointerId);
    if (b && (was === "left" || was === "right") && (b === "left" || b === "right") && b !== was) {
      touches.set(e.pointerId, b);
      applyTouches();
    }
  });
  const lift = (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.delete(e.pointerId);
    applyTouches();
  };
  cv.addEventListener("pointerup", lift);
  cv.addEventListener("pointercancel", lift);

  const KEYS = {
    ArrowLeft: "left", a: "left", A: "left",
    ArrowRight: "right", d: "right", D: "right",
    ArrowUp: "jump", " ": "jump", w: "jump", W: "jump", z: "jump", Z: "jump",
    x: "cord", X: "cord", Shift: "cord", e: "cord", E: "cord", ArrowDown: "cord", s: "cord", S: "cord",
  };
  window.addEventListener("keydown", (e) => {
    const k = KEYS[e.key];
    if (!k || kit.state !== "playing") return;
    e.preventDefault();
    if (e.repeat) return;
    if (k === "jump") input.jumpPressed = true;
    if (k === "cord") input.cordPressed = true;
    input[k] = true;
  });
  window.addEventListener("keyup", (e) => {
    const k = KEYS[e.key];
    if (!k) return;
    if (k === "cord" && input.cord) input.cordReleased = true;
    input[k] = false;
  });

  kit.run(update, render);

  // For tests and the phone check: drive the game without a finger.
  window.__telly = {
    get mode() { return mode; },
    get room() { return world ? world.L.n : -1; },
    get batteries() { return batteries; },
    get stats() { return { ...stats }; },
    get rooms() { return ROOMS.length; },
    autopilot(on) { auto = !!on; },
    bench: () => bench.begin(),
    level: (n) => {
      const L = buildRoom(n);
      return { name: L.def.name, cells: L.cells.length, sparks: L.sparks.length, hooks: L.hooks.length, sockets: L.sockets.length, exit: L.exit, width: L.w };
    },
    goto(n) {
      if (mode !== "play") return;
      newWorld(n);
      updateHud();
    },
    teleport(x, y) {
      const p = world.p;
      p.x = x;
      p.y = y;
      p.vx = p.vy = 0;
      world.rope = null;
      world.cord = makeCord();
    },
    refill() {
      batteries = BATTERIES;
    },
    advance(seconds) {
      // Run the game forward without waiting for frames (tests).
      const n = Math.round(seconds / STEP);
      for (let i = 0; i < n && kit.state === "playing"; i++) {
        if (world.finishing <= 0) roomTime += STEP;
        step(STEP);
      }
    },
    hold(key, on) {
      if (key === "jump" && on && !input.jump) input.jumpPressed = true;
      if (key === "cord" && on && !input.cord) input.cordPressed = true;
      if (key === "cord" && !on && input.cord) input.cordReleased = true;
      input[key] = !!on;
    },
    state() {
      const w = world;
      const p = w.p;
      return {
        x: p.x, y: p.y, vx: p.vx, vy: p.vy, ground: p.ground, roped: !!w.rope, plugged: !!w.plug, zap: w.zap > 0, finishing: w.finishing > 0,
        doors: w.L.doors.map((d) => d.open), lifts: w.L.lifts.map((l) => l.y), fans: w.L.fans.map((f) => f.spin),
        bridges: w.L.bridges.map((b) => b.ext), plates: w.L.plates.map((pl) => pl.pressed),
        crates: w.L.crates.map((c) => ({ x: c.x, y: c.y })), cells: w.L.cells.filter((c) => c.got).length, skips: w.skips || 0,
      };
    },
  };
})();
</script>
</body>
</html>
