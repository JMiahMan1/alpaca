<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petal Swap</title>
<!-- @family-kit -->
<style>
  html, body { background: #8fd0ee; }
  #fk-hud .fk-extra span.ps-low { color: #ffd166; }
  @media (max-width: 420px) {
    #fk-hud { gap: 6px; }
    #fk-hud .fk-pill { padding: 6px 9px; font-size: 16px; gap: 4px; }
    #fk-hud .fk-pill small { font-size: 10px; letter-spacing: 0.04em; }
    .fk-icon-btn { width: 40px; height: 40px; font-size: 18px; }
  }
  @media (max-width: 350px) {
    #fk-hud [data-fk="best"] small { display: none; }
  }
</style>
</head>
<body>
<div id="fk-stage"></div>
<script>
(function () {
  "use strict";
  const FK = window.FamilyKit;
  const N = 8;
  const KINDS = 6;
  const RB = 6; // rainbow seed kind
  const START_MOVES = 30;
  const MILESTONES = [2000, 5000, 9000, 14000, 20000, 28000];
  const POP = 0.26;
  const G = 70; // cells / s^2
  const VMAX = 26;
  const RM = FK.reducedMotion;

  const COLORS = ["#ff4d6d", "#ff9f1c", "#ffd23f", "#5ccf4a", "#3a86ff", "#9b5de5", "#ffffff"];
  const LIGHT = ["#ffb3c1", "#ffd29d", "#fff3b0", "#c4f7a1", "#a9c9ff", "#dcc2ff", "#ffffff"];
  const DARK = ["#a4133c", "#b05800", "#b07d00", "#1f7a1a", "#0b3a9a", "#4b1d8f", "#5a3d8a"];

  /* ---------------- state ---------------- */
  let grid = [];
  let dying = [];
  let petals = [];
  let effects = [];
  let tweens = [];
  let waiters = [];
  let ambient = [];
  let phase = "title"; // title | busy | idle | finale | over
  let moves = START_MOVES;
  let movesUsed = 0;
  let maxCombo = 0;
  let specialsMade = 0;
  let msIdx = 0;
  let selected = null;
  let drag = null;
  let idleT = 0;
  let hint = null;
  let hintT = 0;
  let clock = 0;
  let rclock = 0;
  let nextId = 1;
  let lastLand = 0;
  let lastToast = -9;
  let goalShown = 0;
  const L = { bx: 0, by: 0, cs: 40, size: 320, frame: 10, rad: 10, goal: null };
  const S = { base: [], rainbow: null, rays: null, bg: null, board: null, boardM: 28 };

  const key = (r, c) => r * N + c;
  const inB = (r, c) => r >= 0 && c >= 0 && r < N && c < N;
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  function mk(kind, r, c, sp) {
    return { id: nextId++, kind, sp: sp || null, r, c, px: c, py: r, vy: 0, lock: false, squash: 0, born: 1 };
  }

  /* ---------------- kit ---------------- */
  const kit = FK.create({
    slug: "family-petal-swap",
    title: "Petal Swap",
    tagline: "Swap flowers, grow a garden!",
    emoji: "🌸",
    accent: "#ff5fa2",
    accent2: "#ffa94d",
    howTo: [
      ["👆", "Swipe a flower toward a neighbour to swap them."],
      ["🌼", "Line up 3 or more of the same flower to clear them."],
      ["🐝", "Match 4 for a Bee, an L or T for a Sunburst, 5 for a Rainbow seed."],
      ["⏳", "You have 30 moves. Big scores earn bonus moves!"],
    ],
    onStart,
  });

  /* ---------------- tiny async engine (pause-aware: driven by update) ---------------- */
  function tween(dur, fn) {
    return new Promise((res) => tweens.push({ t: 0, dur: Math.max(0.001, dur), fn, res }));
  }
  function wait(sec) {
    return tween(sec, () => {});
  }
  function until(fn) {
    return new Promise((res) => waiters.push({ fn, res }));
  }
  function later(sec, fn) {
    if (sec <= 0.001) fn();
    else wait(sec).then(fn);
  }
  function toast(text, color) {
    kit.toast(text, color);
    lastToast = clock;
  }

  /* ---------------- board logic ---------------- */
  function kindAt(r, c) {
    if (!inB(r, c)) return -1;
    const p = grid[r][c];
    return p && p.kind < KINDS ? p.kind : -1;
  }
  function hasMatchAt(r, c) {
    const k = kindAt(r, c);
    if (k < 0) return false;
    let n = 1;
    for (let x = c - 1; kindAt(r, x) === k; x--) n++;
    for (let x = c + 1; kindAt(r, x) === k; x++) n++;
    if (n >= 3) return true;
    n = 1;
    for (let y = r - 1; kindAt(y, c) === k; y--) n++;
    for (let y = r + 1; kindAt(y, c) === k; y++) n++;
    return n >= 3;
  }
  function swapGrid(a, b) {
    const t = grid[a.r][a.c];
    grid[a.r][a.c] = grid[b.r][b.c];
    grid[b.r][b.c] = t;
  }
  function isSpecialSwap(pa, pb) {
    return (pa.sp && pb.sp) || pa.kind === RB || pb.kind === RB;
  }
  function findMoves() {
    const out = [];
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++)
        for (const [dr, dc] of [[0, 1], [1, 0]]) {
          const r2 = r + dr, c2 = c + dc;
          if (!inB(r2, c2)) continue;
          const a = grid[r][c], b = grid[r2][c2];
          if (!a || !b) continue;
          let ok = isSpecialSwap(a, b);
          if (!ok) {
            swapGrid({ r, c }, { r: r2, c: c2 });
            ok = hasMatchAt(r, c) || hasMatchAt(r2, c2);
            swapGrid({ r, c }, { r: r2, c: c2 });
          }
          if (ok) out.push({ a: { r, c }, b: { r: r2, c: c2 } });
        }
    return out;
  }
  function findGroups() {
    const runs = [];
    for (let r = 0; r < N; r++) {
      let c = 0;
      while (c < N) {
        const k = kindAt(r, c);
        let e = c;
        if (k >= 0) while (kindAt(r, e + 1) === k) e++;
        if (k >= 0 && e - c + 1 >= 3) {
          const cells = [];
          for (let x = c; x <= e; x++) cells.push({ r, c: x });
          runs.push({ dir: "h", cells, kind: k });
        }
        c = e + 1;
      }
    }
    for (let c = 0; c < N; c++) {
      let r = 0;
      while (r < N) {
        const k = kindAt(r, c);
        let e = r;
        if (k >= 0) while (kindAt(e + 1, c) === k) e++;
        if (k >= 0 && e - r + 1 >= 3) {
          const cells = [];
          for (let y = r; y <= e; y++) cells.push({ r: y, c });
          runs.push({ dir: "v", cells, kind: k });
        }
        r = e + 1;
      }
    }
    if (!runs.length) return [];
    const parent = runs.map((_, i) => i);
    const find = (i) => (parent[i] === i ? i : (parent[i] = find(parent[i])));
    const owner = new Map();
    runs.forEach((run, i) =>
      run.cells.forEach((cell) => {
        const k = key(cell.r, cell.c);
        if (owner.has(k)) parent[find(i)] = find(owner.get(k));
        else owner.set(k, i);
      }),
    );
    const groups = new Map();
    runs.forEach((run, i) => {
      const root = find(i);
      if (!groups.has(root)) groups.set(root, { runs: [], keys: new Set(), kind: run.kind });
      const g = groups.get(root);
      g.runs.push(run);
      run.cells.forEach((cell) => g.keys.add(key(cell.r, cell.c)));
    });
    return [...groups.values()];
  }
  function decideSpecial(g, prefer) {
    let maxLen = 0, longest = null, hasH = false, hasV = false;
    for (const run of g.runs) {
      if (run.cells.length > maxLen) { maxLen = run.cells.length; longest = run; }
      if (run.dir === "h") hasH = true; else hasV = true;
    }
    let sp = null;
    if (maxLen >= 5) sp = "rb";
    else if (hasH && hasV) sp = "sun";
    else if (maxLen === 4) sp = longest.dir === "h" ? "h" : "v";
    if (!sp) return null;
    let pos = null;
    for (const k of prefer) if (g.keys.has(k)) { pos = { r: Math.floor(k / N), c: k % N }; break; }
    if (!pos && sp === "sun") {
      const hk = new Set(), vk = new Set();
      g.runs.forEach((run) => run.cells.forEach((cell) => (run.dir === "h" ? hk : vk).add(key(cell.r, cell.c))));
      for (const k of hk) if (vk.has(k)) { pos = { r: Math.floor(k / N), c: k % N }; break; }
    }
    if (!pos) pos = longest.cells[Math.floor((longest.cells.length - 1) / 2)];
    return { sp, r: pos.r, c: pos.c, kind: sp === "rb" ? RB : g.kind };
  }
  function mostCommonKind() {
    const n = new Array(KINDS).fill(0);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const k = kindAt(r, c); if (k >= 0) n[k]++; }
    let best = 0;
    for (let k = 1; k < KINDS; k++) if (n[k] > n[best]) best = k;
    return best;
  }
  function allRest() {
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++) {
        const p = grid[r][c];
        if (p && (p.lock || p.vy !== 0 || p.py !== p.r)) return false;
      }
    return true;
  }
  function genBoard() {
    for (let tries = 0; tries < 300; tries++) {
      const g = [];
      for (let r = 0; r < N; r++) {
        g.push([]);
        for (let c = 0; c < N; c++) {
          let k;
          do k = FK.randInt(0, KINDS - 1);
          while ((c >= 2 && g[r][c - 1].kind === k && g[r][c - 2].kind === k) || (r >= 2 && g[r - 1][c].kind === k && g[r - 2][c].kind === k));
          g[r].push(mk(k, r, c));
        }
      }
      grid = g;
      if (findMoves().length >= 3) return;
    }
  }

  /* ---------------- explosions ---------------- */
  function blastTargets(it) {
    const out = [];
    const add = (r, c, d) => { if (inB(r, c)) out.push({ r, c, d }); };
    const { r, c } = it;
    switch (it.type) {
      case "h": for (let x = 0; x < N; x++) add(r, x, Math.abs(x - c)); break;
      case "v": for (let y = 0; y < N; y++) add(y, c, Math.abs(y - r)); break;
      case "cross":
        for (let x = 0; x < N; x++) add(r, x, Math.abs(x - c));
        for (let y = 0; y < N; y++) add(y, c, Math.abs(y - r));
        break;
      case "cross3":
        for (let o = -1; o <= 1; o++) {
          for (let x = 0; x < N; x++) add(r + o, x, Math.abs(x - c));
          for (let y = 0; y < N; y++) add(y, c + o, Math.abs(y - r));
        }
        break;
      case "sun": for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) add(r + y, c + x, Math.max(Math.abs(x), Math.abs(y))); break;
      case "sun5": for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++) add(r + y, c + x, Math.max(Math.abs(x), Math.abs(y))); break;
      case "rb": {
        const target = it.target === undefined ? mostCommonKind() : it.target;
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (kindAt(y, x) === target) add(y, x, Math.hypot(x - c, y - r) * 0.6);
        add(r, c, 0);
        break;
      }
      case "all": for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) add(y, x, Math.hypot(x - c, y - r) * 0.7); break;
    }
    return out;
  }
  function blastFx(it, targets) {
    const t0 = -it.delay;
    const { r, c } = it;
    const beam = (dir, rr, cc) => effects.push({ kind: "beam", dir, r: rr, c: cc, t: t0, dur: 0.55 });
    switch (it.type) {
      case "h": beam("h", r, c); break;
      case "v": beam("v", r, c); break;
      case "cross": beam("h", r, c); beam("v", r, c); break;
      case "cross3": for (let o = -1; o <= 1; o++) { beam("h", r + o, c); beam("v", r, c + o); } break;
      case "sun": effects.push({ kind: "ring", r, c, rad: 1.9, t: t0, dur: 0.5 }); break;
      case "sun5": effects.push({ kind: "ring", r, c, rad: 3.2, t: t0, dur: 0.6 }); break;
      case "rb": effects.push({ kind: "rays", r, c, targets, t: t0, dur: 0.6 }); break;
      case "all":
        effects.push({ kind: "ring", r, c, rad: 7, t: t0, dur: 0.8 });
        effects.push({ kind: "rays", r, c, targets, t: t0, dur: 0.8 });
        break;
    }
    const snd = kit.sound;
    later(it.delay, () => {
      const { x, y } = cellXY(r, c);
      if (it.type === "h" || it.type === "v" || it.type === "cross" || it.type === "cross3") {
        snd.play("whoosh");
        snd.tone(320, 0.35, { type: "sawtooth", slide: 520, vol: 0.05 });
        kit.shake(it.type === "cross3" ? 9 : 4, 0.25);
        kit.haptic(15);
      } else if (it.type === "sun" || it.type === "sun5") {
        snd.play("thud");
        snd.tone(660, 0.25, { type: "triangle", slide: 1200, vol: 0.12 });
        kit.shake(it.type === "sun5" ? 11 : 6, 0.3);
        kit.haptic(25);
        kit.fx.burst(x, y, ["#ffd23f", "#ffb703", "#fff3b0"], 14, { speed: 260, shape: "star", size: 5 });
      } else {
        [523, 659, 784, 1047, 1319].forEach((f, i) => snd.tone(f, 0.18, { type: "triangle", vol: 0.12, delay: i * 0.05 }));
        kit.shake(it.type === "all" ? 16 : 9, it.type === "all" ? 0.6 : 0.35);
        kit.haptic(35);
        kit.fx.burst(x, y, ["#ff4d6d", "#ffd23f", "#5ccf4a", "#3a86ff", "#9b5de5"], 22, { speed: 320, shape: "star", size: 5 });
      }
    });
  }

  async function explode(plan, mult) {
    const cells = plan.cells;
    const protect = plan.protect || new Set();
    const merge = plan.merge || new Map();
    const activated = new Set(plan.activated || []);
    const queue = (plan.queue || []).slice();
    let fired = 0;
    const addCell = (r, c, d) => {
      if (!inB(r, c)) return false;
      const k = key(r, c);
      if (protect.has(k)) return false;
      const cur = cells.get(k);
      if (!cur) cells.set(k, { delay: d });
      else if (cur.delay > d) cur.delay = d;
      return true;
    };
    const enqueueAt = (r, c, d) => {
      const p = grid[r][c];
      if (p && p.sp && !activated.has(p.id)) queue.push({ type: p.sp, r, c, delay: d + 0.06, pid: p.id });
    };
    for (const [k, v] of cells) enqueueAt(Math.floor(k / N), k % N, v.delay);
    for (const s of plan.spawns || []) enqueueAt(s.r, s.c, 0);
    let qi = 0;
    while (qi < queue.length) {
      const it = queue[qi++];
      if (it.pid !== undefined) {
        if (activated.has(it.pid)) continue;
        activated.add(it.pid);
      }
      fired++;
      const tg = blastTargets(it);
      blastFx(it, tg);
      for (const t of tg) {
        const d = it.delay + 0.03 + t.d * 0.035;
        if (addCell(t.r, t.c, d)) enqueueAt(t.r, t.c, d);
      }
    }

    let n = 0, maxD = 0, sx = 0, sy = 0;
    for (const [k, v] of cells) {
      const r = Math.floor(k / N), c = k % N;
      const p = grid[r][c];
      if (!p) continue;
      grid[r][c] = null;
      dying.push({ p, t: 0, delay: v.delay, merge: merge.get(k) || null, popped: false });
      n++;
      sx += c; sy += r;
      maxD = Math.max(maxD, v.delay);
    }
    let bonus = 0;
    for (const s of plan.spawns || []) {
      const old = grid[s.r][s.c];
      if (old) dying.push({ p: old, t: 0, delay: 0, merge: null, popped: true });
      const np = mk(s.kind, s.r, s.c, s.sp);
      np.born = 0;
      grid[s.r][s.c] = np;
      specialsMade++;
      n++; sx += s.c; sy += s.r;
      bonus += s.sp === "rb" ? 150 : s.sp === "sun" ? 80 : 50;
      announceSpecial(s);
    }
    if (!n) return;
    const pts = (n * 10 + fired * 40) * mult + bonus;
    kit.addScore(pts);
    const { x, y } = cellXY(sy / n, sx / n);
    kit.fx.text(x, y, "+" + FK.fmt(pts), { color: mult > 1 ? "#ffe066" : "#ffffff", size: Math.min(36, 20 + pts / 60) });
    kit.sound.play("pop", 1 + Math.min(0.8, (mult - 1) * 0.12));
    if (n >= 10) later(0.08, () => kit.sound.play("pop", 1.3));
    await wait(maxD + POP * 0.9);
  }
  function announceSpecial(s) {
    const { x, y } = cellXY(s.r, s.c);
    const label = s.sp === "rb" ? "Rainbow seed!" : s.sp === "sun" ? "Sunburst!" : "Bee!";
    later(0.12, () => {
      kit.fx.text(x, y - L.cs * 0.6, label, { color: s.sp === "rb" ? "#ffd6f5" : "#fff3b0", size: 20 });
      kit.fx.burst(x, y, ["#fff3b0", "#ffffff", COLORS[s.kind] || "#ffd23f"], 12, { speed: 160, shape: "star", size: 4, gravity: 120 });
      kit.sound.play("coin");
    });
  }
  function gravity() {
    for (let c = 0; c < N; c++) {
      let write = N - 1;
      for (let r = N - 1; r >= 0; r--) {
        const p = grid[r][c];
        if (p) {
          if (r !== write) { grid[write][c] = p; grid[r][c] = null; p.r = write; }
          write--;
        }
      }
      const miss = write + 1;
      const off = Math.random() * 0.5;
      for (let r = write; r >= 0; r--) {
        const p = mk(FK.randInt(0, KINDS - 1), r, c);
        p.py = r - miss - 0.3 - off;
        grid[r][c] = p;
      }
    }
    return until(allRest);
  }
  function planFromGroups(groups, prefer) {
    const plan = { cells: new Map(), protect: new Set(), merge: new Map(), spawns: [] };
    for (const g of groups) {
      const s = decideSpecial(g, prefer);
      if (s) { plan.spawns.push(s); plan.protect.add(key(s.r, s.c)); }
      for (const k of g.keys) {
        if (s && k === key(s.r, s.c)) continue;
        plan.cells.set(k, { delay: 0 });
        if (s) plan.merge.set(k, { r: s.r, c: s.c });
      }
    }
    return plan;
  }
  async function resolveBoard(prefer, firstPlan, party) {
    let chain = 0;
    const pm = party ? 2 : 1;
    if (firstPlan) {
      chain = 1;
      await explode(firstPlan, pm);
      await gravity();
    }
    for (let guard = 0; guard < 60; guard++) {
      const groups = findGroups();
      if (!groups.length) break;
      chain++;
      if (chain >= 2) {
        kit.sound.play("combo", chain - 1);
        toast(`Combo x${chain}!`, chain >= 4 ? "#ff3d8b" : "#ff8a00");
      }
      await explode(planFromGroups(groups, chain === 1 ? prefer : []), chain * pm);
      await gravity();
    }
    maxCombo = Math.max(maxCombo, chain);
  }

  async function specialSwap(pa, pb) {
    // pa now sits at pb's old cell and vice versa.
    const plan = { cells: new Map(), activated: [pa.id, pb.id], queue: [] };
    const A = { r: pa.r, c: pa.c }, B = { r: pb.r, c: pb.c };
    if (pa.kind === RB && pb.kind === RB) {
      plan.cells.set(key(A.r, A.c), { delay: 0 });
      plan.cells.set(key(B.r, B.c), { delay: 0 });
      plan.queue.push({ type: "all", r: A.r, c: A.c, delay: 0.05 });
      toast("Garden storm!", "#b15cff");
    } else if (pa.kind === RB || pb.kind === RB) {
      const rb = pa.kind === RB ? pa : pb;
      const o = rb === pa ? pb : pa;
      plan.cells.set(key(rb.r, rb.c), { delay: 0 });
      if (!o.sp) {
        plan.queue.push({ type: "rb", r: rb.r, c: rb.c, target: o.kind, delay: 0.05 });
      } else {
        const T = o.sp;
        const targets = [];
        for (let r = 0; r < N; r++)
          for (let c = 0; c < N; c++) {
            const p = grid[r][c];
            if (p && p !== o && p.kind === o.kind && !p.sp) {
              p.sp = T === "h" || T === "v" ? (Math.random() < 0.5 ? "h" : "v") : T;
              p.born = 0.35;
              targets.push({ r, c });
            }
          }
        effects.push({ kind: "rays", r: rb.r, c: rb.c, targets, t: 0, dur: 0.55 });
        [523, 659, 784, 1047].forEach((f, i) => kit.sound.tone(f, 0.16, { type: "triangle", vol: 0.12, delay: i * 0.06 }));
        toast(T === "sun" ? "Sunburst bouquet!" : "Bee swarm!", "#ff9f1c");
        await wait(0.55);
        targets.push({ r: o.r, c: o.c });
        targets.forEach((t, i) => plan.cells.set(key(t.r, t.c), { delay: 0.05 + i * 0.07 }));
        plan.activated = [rb.id];
      }
    } else {
      const types = [pa.sp, pb.sp].sort().join("+");
      const type = types === "sun+sun" ? "sun5" : types.includes("sun") ? "cross3" : "cross";
      plan.cells.set(key(A.r, A.c), { delay: 0 });
      plan.cells.set(key(B.r, B.c), { delay: 0 });
      plan.queue.push({ type, r: A.r, c: A.c, delay: 0.05 });
      toast(type === "sun5" ? "Mega bloom!" : type === "cross3" ? "Busy bees!" : "Bee cross!", "#ff9f1c");
    }
    await resolveBoard([], plan);
  }

  /* ---------------- moves ---------------- */
  function animSwap(a, b, dur) {
    const pa = grid[a.r][a.c], pb = grid[b.r][b.c];
    pa.lock = pb.lock = true;
    pa.top = true; pb.top = false;
    swapGrid(a, b);
    pa.r = b.r; pa.c = b.c; pb.r = a.r; pb.c = a.c;

      const e = easeInOut(k);

  async function trySwap(a, b) {
    if (phase !== "idle" || !inB(a.r, a.c) || !inB(b.r, b.c)) return;

    const pa = grid[a.r][a.c], pb = grid[b.r][b.c];
    if (!pa || !pb) return;
    phase = "busy";
    selected = null;
    hint = null;
    idleT = 0;
    kit.sound.play("tap");
    const special = isSpecialSwap(pa, pb);
    await animSwap(a, b);
    if (!special && !hasMatchAt(a.r, a.c) && !hasMatchAt(b.r, b.c)) {
      kit.sound.play("bad");

  async function afterMove() {

      updateHud();
      if (clock - lastToast < 0.7) await wait(0.6);
      toast("+5 moves!", "#2fbf4a");
      kit.sound.play("coin");
      kit.fx.burst(L.bx + L.size / 2, L.by - 4, ["#b9fbc0", "#ffffff", "#ffe066"], 18, { speed: 220, shape: "star", size: 5 });
    }

    idleT = 0;

  async function shuffleBoard() {
    phase = "busy";
    if (clock - lastToast < 0.7) await wait(0.5);
    toast("Shuffle!", "#3a86ff");
    kit.sound.play("whoosh");
    const ps = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) ps.push(grid[r][c]);
    const from = ps.map((p) => ({ x: p.px, y: p.py }));
    let ok = false;
    for (let tries = 0; tries < 300 && !ok; tries++) {
      FK.shuffle(ps);
      ps.forEach((p, i) => { p.r = Math.floor(i / N); p.c = i % N; grid[p.r][p.c] = p; });
      ok = !findGroups().length && findMoves().length > 0;
    }
    if (!ok) {
      const keepFrom = new Map(ps.map((p, i) => [p, from[i]]));
      genBoard();
      ps.length = 0;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) ps.push(grid[r][c]);
      from.length = 0;
      ps.forEach((p) => from.push(keepFrom.get(p) || { x: 3.5, y: 3.5 }));
    }
    const ctrl = ps.map(() => ({ x: 3.5 + FK.rand(-1, 1), y: 3.5 + FK.rand(-1, 1) }));
    ps.forEach((p) => (p.lock = true));
    await tween(0.8, (k) => {
      const e = easeInOut(k);
      ps.forEach((p, i) => {
        const f = from[i], m = ctrl[i];
        const ax = FK.lerp(f.x, m.x, e), ay = FK.lerp(f.y, m.y, e);
        const bx = FK.lerp(m.x, p.c, e), by = FK.lerp(m.y, p.r, e);
        p.px = FK.lerp(ax, bx, e);
        p.py = FK.lerp(ay, by, e);

    });

  }
  async function finale() {

    if (clock - lastToast < 0.7) await wait(0.6);
    if (findSpecial()) {
      toast("Garden party!", "#ff3d8b");
      kit.sound.play("combo", 5);
      await wait(0.8);
      for (let guard = 0; guard < 40; guard++) {
        const p = findSpecial();
        if (!p) break;
        const plan = { cells: new Map([[key(p.r, p.c), { delay: 0 }]]) };
        await resolveBoard([], plan, true);
        await wait(0.2);

    } else {

      await wait(0.6);
    }

      emoji: "🌸",

  /* ---------------- input ---------------- */
  function cellAt(p) {

  }
  kit.pointer(null, {
    down(p) {
      idleT = 0;
      hint = null;
      if (phase !== "idle") return;
      const cell = cellAt(p);
      if (!cell) { selected = null; return; }
      drag = { x: p.x, y: p.y, cell, done: false, ox: 0, oy: 0 };
    },
    move(p) {
      if (!drag || drag.done) return;
      const dx = p.x - drag.x, dy = p.y - drag.y;
      const lim = L.cs * 0.18;
      drag.ox = FK.clamp(dx, -lim, lim) / L.cs;
      drag.oy = FK.clamp(dy, -lim, lim) / L.cs;
      if (Math.abs(dx) > Math.abs(dy)) drag.oy = 0; else drag.ox = 0;
      if (Math.hypot(dx, dy) > Math.max(14, L.cs * 0.3)) {
        drag.done = true;
        const d = Math.abs(dx) > Math.abs(dy) ? { r: 0, c: Math.sign(dx) } : { r: Math.sign(dy), c: 0 };
        const t = { r: drag.cell.r + d.r, c: drag.cell.c + d.c };
        const from = drag.cell;
        drag = null;
        selected = null;
        if (inB(t.r, t.c)) trySwap(from, t);
      }
    },
    up(p) {
      if (!drag) return;
      const cell = drag.cell;
      const moved = Math.hypot(p.x - drag.x, p.y - drag.y);
      drag = null;
      if (phase !== "idle" || moved > L.cs * 0.6) return;
      if (selected && Math.abs(selected.r - cell.r) + Math.abs(selected.c - cell.c) === 1) {
        const a = selected;
        selected = null;
        trySwap(a, cell);
      } else if (selected && selected.r === cell.r && selected.c === cell.c) {
        selected = null;
      } else {
        selected = cell;
        kit.sound.tone(720, 0.06, { type: "triangle", vol: 0.12 });

  /* ---------------- update ---------------- */
  function landTick() {

  }
  function spawnPetals(d) {
    const p = d.p;

    const n = RM ? 2 : 6;
    const cols = p.kind === RB ? ["#ff4d6d", "#ffd23f", "#5ccf4a", "#3a86ff", "#9b5de5"] : [COLORS[p.kind], LIGHT[p.kind]];

    }
    if (phase === "idle" && !drag) {
      idleT += dt;
      if (idleT > 5 && !hint) {

        if (ms.length) { hint = FK.pick(ms); hintT = 0; }
      }

  }

  function drawRays(g, s) {

      const dr = hint.b.r - hint.a.r, dc = hint.b.c - hint.a.c;
      hintOff = { wig, dr, dc, env };
      for (const cell of [hint.a, hint.b]) {
        const { x, y } = cellXY(cell.r, cell.c);
        ctx.fillStyle = `rgba(255,255,200,${0.25 + 0.45 * env})`;
        FK.roundRect(ctx, x - cs / 2 + 3, y - cs / 2 + 3, cs - 6, cs - 6, cs * 0.24);
        ctx.fill();
      }
    }
    const tops = [];
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++) {
        const p = grid[r] && grid[r][c];
        if (!p) continue;
        if (p.lock && p.top) { tops.push(p); continue; }
        let x = L.bx + (p.px + 0.5) * cs, y = L.by + (p.py + 0.5) * cs, s = 1;
        if (hintOff && !p.lock) {
          if (r === hint.a.r && c === hint.a.c) { x += hintOff.dc * hintOff.wig * cs; y += hintOff.dr * hintOff.wig * cs; s = 1 + 0.05 * hintOff.env; }
          else if (r === hint.b.r && c === hint.b.c) { x -= hintOff.dc * hintOff.wig * cs; y -= hintOff.dr * hintOff.wig * cs; s = 1 + 0.05 * hintOff.env; }
        }
        if (selected && phase === "idle" && r === selected.r && c === selected.c) s = 1.08 + 0.03 * Math.sin(rclock * 7);
        if (drag && !drag.done && r === drag.cell.r && c === drag.cell.c) { x += drag.ox * cs; y += drag.oy * cs; s = 1.06; }
        drawPieceAt(ctx, p, x, y, s, 1);
      }
    for (const p of tops) drawPieceAt(ctx, p, L.bx + (p.px + 0.5) * cs, L.by + (p.py + 0.5) * cs, 1 + 0.12 * (p.lift || 0), 1);
    for (const d of dying) {
      const p = d.p;
      let x = L.bx + (p.px + 0.5) * cs, y = L.by + (p.py + 0.5) * cs;
      if (d.t < d.delay) { drawPieceAt(ctx, p, x, y, 1 + 0.05 * Math.sin(d.t * 40), 1); continue; }
      const k = Math.min(1, (d.t - d.delay) / POP);
      let s, a = 1;
      if (d.merge) {
        const q = cellXY(d.merge.r, d.merge.c);
        const e = k * k;
        x = FK.lerp(x, q.x, e);
        y = FK.lerp(y, q.y, e);
        s = 1 - k * 0.7;
        a = 1 - k * 0.6;
      } else if (d.popped && d.delay === 0 && d.t === 0) {
        s = 1;
      } else {
        s = k < 0.3 ? 1 + 0.28 * (k / 0.3) : 1.28 * (1 - (k - 0.3) / 0.7);
        a = 1 - Math.max(0, (k - 0.4) / 0.6);
      }
      drawPieceAt(ctx, p, x, y, Math.max(0, s), Math.max(0, a));
    }
    drawEffects(ctx);
    ctx.restore();
    for (let i = petals.length - 1; i >= 0; i--) {
      const q = petals[i];
      q.life += rdt;
      if (q.life >= q.max) { petals.splice(i, 1); continue; }
      q.vy += L.cs * 9 * rdt;
      q.vx *= 1 - 1.8 * rdt;
      q.vy *= 1 - 1.2 * rdt;
      q.x += (q.vx + Math.sin(q.life * 9 + q.seed) * L.cs * 0.8) * rdt;
      q.y += q.vy * rdt;
      q.rot += q.spin * rdt;
      ctx.globalAlpha = Math.min(1, (1 - q.life / q.max) * 1.6);
      petal(ctx, q.x, q.y, q.size, q.rot, q.color);
    }
    ctx.globalAlpha = 1;
    kit.fx.draw(ctx);
    ctx.restore();
  }

  genBoard();
  kit.run(update, render);

  // Debug / test hook.
  window.__petal = {
    get phase() { return phase; },
    get moves() { return moves; },
    get movesUsed() { return movesUsed; },
    get maxCombo() { return maxCombo; },
    get specialsMade() { return specialsMade; },
    get layout() { return { bx: L.bx, by: L.by, cs: L.cs, size: L.size }; },
    findMoves,
    hasMatches: () => findGroups().length > 0,
    cellCenter: (r, c) => cellXY(r, c),
    board: () => grid.map((row) => row.map((p) => (p ? (p.sp ? p.sp + ":" + p.kind : p.kind) : null))),
    setMoves(n) { moves = n; updateHud(); },
    setPiece(r, c, kind, sp) { const p = mk(kind, r, c, sp || null); grid[r][c] = p; },
  };
})();
</script>
</body>
