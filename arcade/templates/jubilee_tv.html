<script>
  (function () {  // before first paint: TV browsers get the light look, and the frame fits any screen
    var q = /[?&]lite=([01])/.exec(location.search), tv = /Web0S|webOS|Tizen|SMART-TV|SmartTV|NetCast|HbbTV|CrKey|AFT[A-Z]|BRAVIA|Android TV|GoogleTV/i.test(navigator.userAgent || "");
    if (q ? q[1] === "1" : tv) document.documentElement.className += " lite";
    /* Low-power mode for a weak TV browser: LG webOS (and the older NetCast)
       runs an old Chromium that paints on a slow CPU, so the 3D card flip,
       filters, blurred and animated shadows and the camera glide made every
       animation crawl there. Android TV / Cast / desktop are untouched.
       ?lowfx=1 forces it on, ?lowfx=0 off. */
    var lq = /[?&]lowfx=([01])/.exec(location.search), weak = /Web0S|webOS|NetCast/i.test(navigator.userAgent || "");
    if (lq ? lq[1] === "1" : weak) document.documentElement.className += " lowfx";
    /* The frame is a fixed 17.778 x 10 rem (16:9). Scale rem to the viewport so the stage
       fills the screen on any display instead of overflowing a small/portrait one. */
    function fit() {
      // Fit what the screen shows, not the page: a Cast receiver can lay the
      // page out larger than its picture (the office TV: a 1040x585 page on a
      // 960x540 screen, so about 4% went missing on every edge). The frame
      // stays centred, so sizing it to the screen keeps all of it in view.
      var w = window.innerWidth || 1920, h = window.innerHeight || 1080;
      var sw = (window.screen && screen.width) || 0, sh = (window.screen && screen.height) || 0;
      if (sw > 0 && sw < w) w = sw;
      if (sh > 0 && sh < h) h = sh;
      var rem = Math.min(h * 0.1, w / 17.778);
      document.documentElement.style.fontSize = rem + "px";
    }
    window.addEventListener("resize", fit);
    fit();
  })();
</script>

      event = '<div class="cAlert debt">A debt is due: $' + fmt(room.pending.amount) + '</div>';
    }
    var log = (room.log || []).slice(-5).reverse();
    if (log[0]) event += '<div class="cEvent">' + esc(brief(log[0])) + '</div>';
    var code = esc(room.code || PINNED);
    var right = '<div class="fCard"><div class="fLabel">Jackpot</div><div class="fPot">$' + fmt(room.pot) + '</div>'
      + '<div class="fBank">🏠 ' + room.bank_houses + ' · 🏨 ' + room.bank_hotels + '<small> in the bank</small></div></div>'
      + '<div class="fCard fStory"><div class="fLabel">Earlier</div>'
      + log.slice(1).map(function (line) { return '<div class="fLog">' + esc(brief(line)) + '</div>'; }).join("") + '</div>';
    var join = '<div class="fCard fJoin"><img alt="" src="/api/jubilee/rooms/' + code + '/join.svg"><div class="fLabel">Scan to play</div><b>' + code + '</b></div>';
    return { left: left, now: now, pills: pills, event: event, right: right, join: join, code: code };
  }
  /* Where a piece lands, a card big enough to read across the room: the full
     name, the price, the rent, and who owns it. */
  var lastRoom = null, landTimer = null;
  function landed(t, seat) {
    var room = lastRoom; if (!room || !room.board) return;
    var sp = room.board[Math.round(t.shown) % 40];
    if (!sp || (!sp.price && sp.kind !== "tribute" && sp.kind !== "offering")) return;
    var color = KIND_BAND[sp.kind] || GROUP_COLORS[sp.group] || "#7c3aed";
    var rows = "";
    if (sp.kind === "tribute" || sp.kind === "offering") rows = '<div class="lRow big">Pay $' + fmt(sp.flat || sp.amount || 0) + '</div>';
    else {
      rows += '<div class="lRow"><span>Price</span><b>$' + fmt(sp.price) + '</b></div>';
      if (sp.rents) {
        rows += '<div class="lRow"><span>Rent</span><b>$' + fmt(sp.rents[0]) + '</b></div>'
          + '<div class="lRow"><span>With a hotel</span><b>$' + fmt(sp.rents[5]) + '</b></div>';
      } else if (sp.kind === "railroad") rows += '<div class="lRow"><span>Rent</span><b>$25 - $200</b></div>';
      else if (sp.kind === "utility") rows += '<div class="lRow"><span>Rent</span><b>4× or 10× the dice</b></div>';
      var owner = sp.owner != null ? room.players[sp.owner] : null;
      rows += owner ? '<div class="lOwner"><i style="background:' + seatColor(sp.owner) + '"></i>Owned by ' + esc(owner.name)
          + (sp.houses === 5 ? ' · 🏨' : sp.houses ? ' · ' + sp.houses + ' 🏠' : '') + (sp.mortgaged ? ' · mortgaged' : '') + '</div>'
        : '<div class="lOwner forsale">For sale</div>';
    }
    var who = room.players[seat];
    var el = $("tv-land");
    el.innerHTML = '<div class="lCard"><div class="lBand" style="background:' + color + '">' + esc(sp.name) + '</div>'
      + '<div class="lWho">' + esc(who ? who.name : "") + ' landed here</div>' + rows + '</div>';
    el.className = "on";
    if (landTimer) clearTimeout(landTimer);
    landTimer = setTimeout(function () { el.className = ""; }, 4500);
  }
  var centerSig = "";
  function renderGame(room) {
    lastRoom = room;
    if (!board || board.code !== room.code || !document.body.contains(board.wrap)) {
      $("tv-main").innerHTML = "";
      board = buildBoard(room);
      var row = document.createElement("div");
      row.className = "tvPlay";
      board.left = document.createElement("div"); board.left.className = "tvFrame left";
      board.right = document.createElement("div"); board.right.className = "tvFrame right";
      row.appendChild(board.left); row.appendChild(board.wrap); row.appendChild(board.right);
      $("tv-main").appendChild(row);
      fitTexts(board.svg);
      centerSig = "";
    }
    updateBoard(room);
    moveTokens(room);
    var sig = [room.turn, room.round, room.pot, room.bank_houses, room.bank_hotels, room.log_seq, JSON.stringify(room.last_roll), room.feast,
      JSON.stringify(room.auction), JSON.stringify(room.pending),
      JSON.stringify(room.players.map(function (p) { return [p.cash, p.net_worth, p.bankrupt, p.in_jail, p.kingdoms, p.away]; }))].join("~");
    if (sig !== centerSig) {
      centerSig = sig;
      var parts = centerHtml(room);
      board.left.innerHTML = parts.left; board.right.innerHTML = parts.right;
      // The join card (its QR) is the same node every time: it is served
      // no-store, so rebuilding it re-fetched and re-drew the QR on every
      // change of cash or log.
      if (!board.joinEl || board.joinCode !== parts.code) {
        var jh = document.createElement("div"); jh.innerHTML = parts.join;
        board.joinEl = jh.firstChild; board.joinCode = parts.code;
      }
      board.right.appendChild(board.joinEl);
      board.nowEl.innerHTML = parts.now; board.pillsEl.innerHTML = parts.pills; board.eventEl.innerHTML = parts.event;
      if (!board.diceShown && room.last_roll && room.last_roll.d1) showDice(room.last_roll, false);
    }
  }
  function renderFinished(room) {
    var sorted = room.players.slice().sort(function (a, b) {
      if (a.seat === room.winner) return -1;
      if (b.seat === room.winner) return 1;
      return b.net_worth - a.net_worth;
    });
    var winner = null;
    for (var i = 0; i < room.players.length; i++) if (room.players[i].seat === room.winner) winner = room.players[i];
    if (!winner) winner = sorted[0];
    var rows = "";
    for (var j = 0; j < sorted.length; j++) {
      var p = sorted[j];
      rows += '<div class="stRow' + (p.seat === winner.seat ? " winner" : "") + '"><div class="rk">' + (j + 1) + '</div><div class="nm">' + tokenBadge(p.token, seatColor(p.seat), "tkI") + ' ' + esc(p.name) + '</div><div class="nw">$' + fmt(p.net_worth) + '</div></div>';
    }
    var why = { kingdom: "👑 Three kingdoms!", "last-standing": "The last one standing", "quick-game": "Two bankruptcies end the Quick Game",
      "family-fun-full-rounds": "Twelve full rounds: the richest household wins", "round-limit": "The round limit: the richest household wins" }[room.result] || "";
    var aw = "", list = room.awards || [];
    for (var k = 0; k < list.length; k++) {
      aw += '<div class="award" style="animation-delay:' + (0.6 + k * 0.2).toFixed(1) + 's"><span class="ic">' + esc(list[k].icon) + '</span><b>' + esc(list[k].title) + '</b>'
        + '<div class="nm">' + esc(list[k].name) + '</div><small>' + esc(list[k].detail) + '</small></div>';
    }
    $("tv-main").innerHTML = '<div class="finish' + (aw ? ' withAwards' : '') + '"><div class="crown">👑</div><div class="winTitle">' + esc(winner.name) + ' WINS THE JUBILEE!</div>'
      + (why ? '<div class="winWhy">' + esc(why) + '</div>' : '')
      + '<div class="finBody"><div class="standings">' + rows + '</div>' + (aw ? '<div class="awards">' + aw + '</div>' : '') + '</div></div>';
  }
  var pollTimer = null;
  function schedule(ms) { if (pollTimer) clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }
  function reconnecting(on) { var el = $("tv-reconnect"); if (el) el.className = on ? "on" : ""; }
  poll();
})();
</script>
</body>
</html>
