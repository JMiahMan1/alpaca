<!DOCTYPE html>
<html lang="en">
<script>
  (function () {  // before first paint: TV browsers get the light look, and the frame fits any screen
    var q = /[?&]lite=([01])/.exec(location.search), tv = /Web0S|webOS|Tizen|SMART-TV|SmartTV|NetCast|HbbTV/i.test(navigator.userAgent || "");
    if (q ? q[1] === "1" : tv) document.documentElement.className += " lite";
    /* The frame is a fixed 17.778 x 10 rem (16:9). Scale rem to the viewport so the stage
       fills the screen on any display instead of overflowing a small/portrait one. */
    function fit() {
      var rem = Math.min((window.innerHeight || 1080) * 0.1, (window.innerWidth || 1920) / 17.778);
      document.documentElement.style.fontSize = rem + "px";
    }
    window.addEventListener("resize", fit);
    fit();
  })();
</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jubilee!: TV</title>
<!--
  The Jubilee! TV stage. It runs on the TV itself (a Cast receiver, the LG or
  Samsung browser, any TV browser), so it needs no input, follows one room on
  its own, and is written in ES5 with XHR and flexbox: TV browsers are often
  years behind phones. It shows only what every phone already shows - the
  board, the players, the pot, whose turn it is - never a draft or a secret.
-->
<style>
  :root { --gold: #ffc83d; --gold2: #ffe88a; --violet: #8b5cf6; --mint: #2ed3b7; --rose: #ff6b6b; --ink: #fff8e7; --dim: #cbb9ff; }
  * { box-sizing: border-box; }
  html { font-size: 10vh; height: 100%; }
  body { margin: 0; height: 100%; background: #0d0720; color: var(--ink); overflow: hidden; font-size: .14rem;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { background: radial-gradient(ellipse at 50% -10%, #3b1d7a 0%, #160b33 45%, #0d0620 100%); }
  #frame { position: absolute; left: 50%; top: 50%; width: 17.778rem; height: 10rem; margin-left: -8.889rem; margin-top: -5rem; }
  /* Inside the TV-safe area: many TVs overscan and crop about 5% off every
     edge, which cut off the board's left column. */
  #stage { position: absolute; top: .5rem; bottom: .5rem; left: .9rem; right: .9rem; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; height: .58rem; flex: 0 0 auto; }
  .brand { font-size: .32rem; font-weight: 900; color: var(--gold); letter-spacing: .04em; text-shadow: 0 0 .3rem rgba(255,200,61,.4); }
  .brand small { color: var(--dim); font-weight: 700; font-size: .2rem; margin-left: .15rem; letter-spacing: .28em; }
  .pill { display: inline-block; padding: .05rem .18rem; border-radius: 99px; background: rgba(255,200,61,.14);
    border: .02rem solid rgba(255,200,61,.45); color: var(--gold2); font-weight: 900; font-size: .2rem; margin-left: .16rem; }
  .main { flex: 1 1 auto; display: flex; min-height: 0; overflow: hidden; }
  .foot { flex: 0 0 auto; height: .4rem; display: flex; align-items: center; justify-content: center; color: var(--dim);
    font-size: .22rem; font-weight: 700; letter-spacing: .06em; border-top: .02rem solid rgba(255,255,255,.08); }
  .foot b { color: var(--gold2); letter-spacing: .25em; margin: 0 .12rem; }
  /* ---------- lobby ---------- */
  .lobby { display: flex; align-items: center; justify-content: center; width: 100%; gap: .9rem; }
  .lobbyGlow { font-size: 1.5rem; font-weight: 900; color: var(--gold); text-align: center; line-height: .95;
    text-shadow: 0 .07rem 0 #4a2c00, 0 0 .7rem rgba(255,200,61,.55); }
  .lobbyGlow small { display: block; font-size: .24rem; letter-spacing: .4em; color: var(--gold2); margin-top: .18rem; }
  .qr { width: 3.1rem; height: 3.1rem; background: #fff; border-radius: .22rem; padding: .13rem; flex: 0 0 auto; }
  .qr img { width: 100%; height: 100%; display: block; }
  .codeBig { font-size: .9rem; font-weight: 900; letter-spacing: .3em; color: var(--gold2); text-align: center; margin-top: .3rem; font-variant-numeric: tabular-nums; }
  .joinHow { color: var(--dim); font-size: .24rem; text-align: center; margin-top: .16rem; font-weight: 700; line-height: 1.4; }
  .joinHow b { color: #fff; }
  .waitSeats { display: flex; flex-wrap: wrap; justify-content: center; gap: .18rem; margin-top: .4rem; }
  .seat { background: rgba(255,255,255,.07); border: .02rem solid rgba(255,255,255,.14); border-radius: .18rem;
    padding: .12rem .22rem; font-size: .24rem; font-weight: 800; }
  .seat.empty { border-style: dashed; color: rgba(255,255,255,.35); }
  /* ---------- game layout ---------- */
  .boardCol { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-width: 0; }
  .boardCol { justify-content: flex-start; position: relative; }
  .boardCol svg { height: 8.76rem; width: 8.76rem; max-height: 100%; }
  .sideCol { flex: 0 0 6.9rem; display: flex; flex-direction: column; gap: .18rem; padding-left: .3rem; overflow: hidden; }
  /* In play the board is the screen: the full height (3% kept top and bottom;
     overscan crops the sides more, so 5% there), and a narrow column of
     essentials right beside it -- title, players, jackpot, the latest events,
     how to join. */
  body.playing #stage { top: .3rem; bottom: .3rem; }
  body.playing .top, body.playing .foot { display: none; }
  body.playing .main { justify-content: center; }
  body.playing .boardCol { flex: 0 0 auto; }
  body.playing .boardCol svg { height: 9.4rem; width: 9.4rem; max-height: none; }
  body.playing .sideCol { flex: 0 0 4.7rem; gap: .12rem; padding-left: .3rem; }
  body.playing .sideCard { padding: .12rem .16rem; border-radius: .16rem; }
  body.playing .sideLabel { font-size: .15rem; }
  .sideHead { display: flex; align-items: center; justify-content: space-between; gap: .06rem; }
  .sideHead .brand { font-size: .28rem; white-space: nowrap; }
  .sideHead .pill { margin-left: .05rem; font-size: .15rem; padding: .03rem .1rem; }
  body.playing .plr { padding: .06rem .1rem; gap: .12rem; }
  body.playing .plr .ring { width: .5rem; height: .5rem; font-size: .3rem; }
  body.playing .plr .nm { font-size: .25rem; }
  body.playing .plr .st { font-size: .18rem; }
  body.playing .players.many { gap: .05rem; }
  body.playing .players.many .plr { padding: .03rem .08rem; }
  body.playing .players.many .plr .ring { width: .38rem; height: .38rem; font-size: .23rem; }
  body.playing .players.many .plr .nm { font-size: .2rem; }
  body.playing .players.many .plr .st { font-size: .15rem; }
  body.playing .potNum { font-size: .4rem; }
  body.playing .metaRow { font-size: .19rem; }
  body.playing .logRow { font-size: .18rem; }
  .joinCard { display: flex; align-items: center; gap: .14rem; }
  .joinCard img { width: .8rem; height: .8rem; background: #fff; border-radius: .08rem; padding: .04rem; flex: 0 0 auto; }
  .joinCard .jc { font-size: .16rem; color: var(--dim); font-weight: 800; line-height: 1.3; }
  .joinCard .jc b { display: block; font-size: .34rem; color: var(--gold2); letter-spacing: .18em; }
  .sideCard { background: rgba(255,255,255,.06); border: .02rem solid rgba(255,255,255,.12); border-radius: .16rem; padding: .14rem .18rem; }
  .sideLabel { font-size: .15rem; letter-spacing: .22em; color: var(--dim); font-weight: 900; text-transform: uppercase; }
  .players { display: flex; flex-direction: column; gap: .12rem; }
  .plr { display: flex; align-items: center; gap: .14rem; background: rgba(255,255,255,.05); border-radius: .12rem;
    padding: .08rem .12rem; border: .03rem solid transparent; }
  .plr.turn { border-color: var(--gold); background: rgba(255,200,61,.12); box-shadow: 0 0 .3rem rgba(255,200,61,.35); }
  .plr.out { opacity: .35; filter: grayscale(1); }
  .plr .ring { width: .42rem; height: .42rem; border-radius: 50%; border: .035rem solid; display: flex; align-items: center; justify-content: center; font-size: .26rem; flex: 0 0 auto; }
  .plr .who { min-width: 0; flex: 1 1 auto; }
  .plr .nm { font-size: .19rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plr .st { font-size: .14rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .plr.jail .st { color: var(--rose); }
  .potRow { display: flex; align-items: baseline; justify-content: space-between; }
  .potNum { font-size: .4rem; font-weight: 900; color: var(--mint); font-variant-numeric: tabular-nums; }
  .metaRow { display: flex; gap: .14rem; align-items: center; justify-content: space-between; font-size: .17rem; color: var(--dim); font-weight: 800; }
  .auctionBar { background: #ffe9a8; color: #3a2503; border-radius: .14rem; padding: .1rem .14rem; border: .025rem solid var(--gold); }
  .auctionBar .who { font-size: .13rem; letter-spacing: .18em; font-weight: 900; color: #7a5b16; text-transform: uppercase; }
  .auctionBar .bid { font-size: .32rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .auctionBar .pass { font-size: .13rem; font-weight: 800; color: #7a5b16; }
  .logRow { font-size: .17rem; font-weight: 700; color: #efe9ff; line-height: 1.35; padding: .05rem 0; border-bottom: .01rem solid rgba(255,255,255,.07);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logLine { font-size: .155rem; color: var(--dim); line-height: 1.45; max-height: 1.9rem; overflow: hidden; }
  /* ---------- finish ---------- */
  .finish { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .crown { font-size: 1.5rem; animation: crownDrop 1.1s cubic-bezier(.2,1.5,.3,1); filter: drop-shadow(0 .1rem .35rem rgba(255,200,61,.55)); }
  @keyframes crownDrop { 0% { transform: translateY(-2.2rem) rotate(-28deg) scale(.4); opacity: 0; } 70% { transform: translateY(.12rem) rotate(6deg) scale(1.12); } 100% { transform: none; } }
  .winTitle { font-size: .62rem; font-weight: 900; color: var(--gold); text-shadow: 0 .04rem 0 #4a2c00; margin-top: .1rem; }
  .standings { margin-top: .4rem; width: 8.4rem; display: flex; flex-direction: column; gap: .1rem; }
  .stRow { display: flex; align-items: center; gap: .14rem; background: rgba(255,255,255,.06); border-radius: .12rem; padding: .08rem .16rem; font-size: .2rem; font-weight: 800; }
  .stRow.winner { border: .025rem solid var(--gold); background: rgba(255,200,61,.14); }
  .stRow .rk { color: var(--gold2); width: .35rem; font-variant-numeric: tabular-nums; }
  .stRow .nm { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stRow .nw { font-variant-numeric: tabular-nums; color: var(--gold2); }
  /* ---------- lite (TV browsers) ---------- */
  html.lite .boardCol svg, html.lite .crown, html.lite .lobbyGlow { filter: none; }
  /* ---------- big moments: the roll and the drawn card ---------- */
  #tv-fx { position: absolute; left: 0; top: .58rem; width: 8.76rem; bottom: .4rem; display: none; align-items: center; justify-content: center; z-index: 10; }
  #tv-fx.on { display: flex; }
  #tv-fx.dim { left: -1rem; right: -1rem; width: auto; top: -1rem; bottom: -1rem; background: rgba(8,4,24,.6); }
  .tvDice { background: rgba(13,7,32,.82); border: .03rem solid rgba(255,200,61,.55); border-radius: .3rem; padding: .3rem .4rem .22rem;
    box-shadow: 0 .2rem .6rem rgba(0,0,0,.6); }
  .tvDice { display: flex; flex-direction: column; align-items: center; }
  .tvDicePair { display: flex; }
  .tvDie { width: 1.4rem; height: 1.4rem; margin: 0 .2rem; background: #fffdf4; border-radius: .3rem; border: .04rem solid #b9a86e;
    box-shadow: 0 .14rem .3rem rgba(0,0,0,.6); position: relative; animation: tvpop .5s cubic-bezier(.2,1.5,.3,1); }
  .tvPip { position: absolute; width: .25rem; height: .25rem; margin: -.125rem 0 0 -.125rem; border-radius: 50%; background: #2a1563; }
  .tvRollText { margin-top: .24rem; font-size: .34rem; font-weight: 900; color: var(--gold); text-shadow: 0 .04rem 0 #4a2c00; }
  .tvCard { width: 6.2rem; background: #fffdf0; color: #1b0f3b; border-radius: .3rem; border: .06rem solid #7a5b16; overflow: hidden;
    text-align: center; box-shadow: 0 .3rem .9rem rgba(0,0,0,.7); animation: tvpop .6s cubic-bezier(.2,1.3,.3,1); }
  .tvCard .band { padding: .16rem 0; font-size: .26rem; font-weight: 900; letter-spacing: .3em; color: #fff8e7; background: #6d28d9; }
  .tvCard.scripture .band { background: #1d4ed8; }
  .tvCard .who { margin-top: .16rem; font-size: .2rem; font-weight: 800; color: #6b5b8f; }
  .tvCard .q { margin: .2rem .35rem; font-family: Georgia, serif; font-style: italic; font-size: .38rem; line-height: 1.35; }
  .tvCard .ref { font-size: .22rem; font-weight: 900; color: #7a5b16; }
  .tvCard .eff { margin: .22rem .3rem .3rem; padding: .14rem; border-radius: .14rem; background: #fde68a; border: .03rem solid #b45309;
    font-size: .3rem; font-weight: 900; color: #422006; }
  @keyframes tvpop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <div class="top">
      <div class="brand">🎺 JUBILEE!<small>BIBLE LANDS</small></div>
      <div><span class="pill">ROUND <b id="tv-round">1</b></span><span class="pill" id="tv-ruleset">CLASSIC</span></div>
    </div>
    <div class="main" id="tv-main"></div>
    <div id="tv-fx"></div>
    <div class="foot">SCAN TO PLAY · <b id="tv-code">····</b> · games.sumemail.com</div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var PINNED = "__ROOM_CODE__";
  var POLL_MS = 1000, FAILS = 0, MAX_FAILS = 5;
  var GROUP_COLORS = { brown: "#8c5a3b", lightblue: "#6fd3e7", pink: "#d63384", orange: "#f7871f", red: "#d32f2f", yellow: "#f2c230", green: "#2e9e5b", blue: "#1d4ed8" };
  var SEAT_COLORS = ["#ffc83d","#ff6b6b","#2ed3b7","#7dd3fc","#c084fc","#fb923c","#34d399","#f472b6"];
  var TOKENS = { ark:"🚢", dove:"🕊️", menorah:"🕎", star:"⭐", scroll:"📜", fish:"🐟", cup:"🍷", trumpet:"🎺" };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
  function fmt(n) { return Number(n || 0).toLocaleString("en-US"); }
  function xhr(method, url, body, cb) {
    var r = new XMLHttpRequest();
    r.open(method, url, true);
    r.timeout = 8000;
    if (body) r.setRequestHeader("Content-Type", "application/json");
    r.onload = function () { var d = null; try { d = JSON.parse(r.responseText); } catch (e) {} cb(d, r.status); };
    r.onerror = function () { cb(null, 0); };
    r.ontimeout = function () { cb(null, 0); };
    r.send(body ? JSON.stringify(body) : null);
  }
  var lastSig = "";
  /* The roll and the drawn card, played big on the TV. ``n`` counts each
     one on the server, so the first look at a room shows nothing old. */
  var seenRoll = null, seenCard = null, fxTimer = null, primed = false;
  var PIPS = { 1: [[50,50]], 2: [[27,27],[73,73]], 3: [[25,25],[50,50],[75,75]], 4: [[27,27],[73,27],[27,73],[73,73]],
    5: [[25,25],[75,25],[50,50],[25,75],[75,75]], 6: [[27,22],[73,22],[27,50],[73,50],[27,78],[73,78]] };
  function dieHtml(v) {
    var h = '<div class="tvDie">', pts = PIPS[v] || [], i;
    for (i = 0; i < pts.length; i++) h += '<div class="tvPip" style="left:' + pts[i][0] + '%;top:' + pts[i][1] + '%"></div>';
    return h + '</div>';
  }
  var fxTurn = null;
  function hideFx() { var fx = $("tv-fx"); fx.className = ""; fx.innerHTML = ""; fxTurn = null; }
  function showFx(html, ms, dim) {
    var fx = $("tv-fx");
    fx.innerHTML = html;
    fx.className = dim ? "on dim" : "on";
    if (fxTimer) clearTimeout(fxTimer);
    fxTimer = setTimeout(hideFx, ms);
  }
  function bigMoments(room) {
    var r = room.last_roll, c = room.last_card;
    var rn = r && r.n != null ? r.n : null, cn = c && c.n != null ? c.n : null;
    if (!primed) { primed = true; seenRoll = rn; seenCard = cn; return; }
    if (cn !== null && cn !== seenCard) {
      seenCard = cn; seenRoll = rn;
      var sc = c.deck === "scripture";
      showFx('<div class="tvCard' + (sc ? ' scripture' : '') + '"><div class="band">' + (sc ? "SCRIPTURE" : "PARABLE") + '</div>'
        + '<div class="who">' + esc(c.player || "") + ' drew</div>'
        + '<div class="q">' + esc(c.quote ? "\u201c" + c.quote + "\u201d" : (c.effect || c.text || "")) + '</div>'
        + (c.ref ? '<div class="ref">' + esc(c.ref) + '</div>' : '')
        + (c.quote && c.effect ? '<div class="eff">' + esc(c.effect) + '</div>' : '<div style="height:.3rem"></div>') + '</div>', 7000, true);
      return;
    }
    if (rn !== null && rn !== seenRoll) {
      seenRoll = rn;
      var who = room.players && room.players[room.turn] ? room.players[room.turn].name : "";
      showFx('<div class="tvDice"><div class="tvDicePair">' + dieHtml(r.d1) + dieHtml(r.d2) + '</div>'
        + '<div class="tvRollText">' + esc(who) + ' rolled ' + r.d1 + ' + ' + r.d2 + ' = ' + (r.d1 + r.d2) + (r.doubles ? " · DOUBLES!" : "") + '</div></div>', 8000, false);
      fxTurn = room.turn;
      return;
    }
    // The dice stay up while the player moves and decides; they go when the turn passes.
    if (fxTurn !== null && room.turn !== fxTurn) hideFx();
  }
  function poll() {
    if (!PINNED) { renderNoCode(); return; }
    xhr("GET", "/api/jubilee/rooms/" + encodeURIComponent(PINNED) + "?stage=1", null, function (d) {
      if (!d || !d.success) { FAILS += 1; if (FAILS >= MAX_FAILS) renderGone(); return; }
      FAILS = 0;
      var room = d.room;
      $("tv-code").textContent = room.code || PINNED;
      $("tv-round").textContent = room.round || 1;
      $("tv-ruleset").textContent = (room.ruleset || "classic").toUpperCase();
      document.body.className = room.status === "playing" ? "playing" : "";
      if (room.status === "lobby") { renderLobby(room); lastSig = "lobby"; return; }
      bigMoments(room);
      var sig = [room.turn, room.phase, room.status, JSON.stringify(room.last_roll), room.pot, room.bank_houses, room.log_seq,
        JSON.stringify(room.players.map(function (p) { return [p.position, p.cash, p.net_worth, p.bankrupt, p.jail, p.houses, p.hotels]; })),
        JSON.stringify(room.board.map(function (s) { return [s.owner, s.houses, s.mortgaged]; })),
        room.log.slice(-2).join("|"), room.winner].join("~");
      if (sig === lastSig) return;
      lastSig = sig;
      if (room.status === "finished") renderFinished(room); else renderGame(room);
    });
  }
  function renderNoCode() {
    $("tv-main").innerHTML = '<div class="lobby"><div><div class="lobbyGlow">JUBILEE!<small>BIBLE LANDS</small></div>'
      + '<div class="codeBig">GAMES.SUMEMAIL.COM</div>'
      + '<div class="joinHow">Open <b>games.sumemail.com/play/family-jubilee</b><br>and create or join a room.</div></div></div>';
  }
  function renderGone() {
    lastSig = "";
    $("tv-main").innerHTML = '<div class="lobby"><div><div class="lobbyGlow">GAME OVER<small>THE ROOM HAS ENDED</small></div>'
      + '<div class="joinHow">Start a new game at <b>games.sumemail.com/play/family-jubilee</b>.</div></div></div>';
  }
  /* ---------- shared bits ---------- */
  function tokenEmoji(id) { return TOKENS[id] || "🎟️"; }
  function seatColor(seat) { return SEAT_COLORS[seat % SEAT_COLORS.length]; }
  function seatChips(players) {
    var html = "", i, p;
    for (i = 0; i < 8; i++) {
      p = players[i];
      if (p) html += '<div class="seat">' + tokenEmoji(p.token) + ' ' + esc(p.name) + '</div>';
      else html += '<div class="seat empty">open seat</div>';
    }
    return '<div class="waitSeats">' + html + '</div>';
  }
  function renderLobby(room) {
    var base = location.origin;
    var html = '<div class="lobby">'
      + '<div><div class="lobbyGlow">JUBILEE!<small>BIBLE LANDS</small></div>'
      + '<div class="codeBig">' + esc(room.code) + '</div>'
      + '<div class="joinHow">Scan with any phone camera, or go to<br><b>games.sumemail.com/join/jubilee/' + esc(room.code) + '</b></div>'
      + seatChips(room.players || []) + '</div>'
      + '<div class="qr"><img alt="Join QR code" src="/api/jubilee/rooms/' + encodeURIComponent(room.code) + '/join.svg"></div>'
      + '</div>';
    $("tv-main").innerHTML = html;
  }
  /* ---------- the board (inline SVG, rebuilt only when the signature changes) ---------- */
  var SVGNS = "http://www.w3.org/2000/svg";
  var T = 960 / 11;
  function svgEl(tag, attrs, parent) {
    var el = document.createElementNS(SVGNS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  }
  function tileCenter(i) {
    // The standard board: each side's tiles face out from the middle, the
    // colour band on the inner edge and the name reading from that side.
    if (i <= 10) return { x: 960 - T / 2 - i * T, y: 960 - T / 2, rot: 0 };
    if (i <= 20) return { x: T / 2, y: 960 - T / 2 - (i - 10) * T, rot: 90 };
    if (i <= 30) return { x: T / 2 + (i - 20) * T, y: T / 2, rot: 180 };
    return { x: 960 - T / 2, y: T / 2 + (i - 30) * T, rot: 270 };
  }
  /* A land's name at the largest size that fits its tile, one line or two
     balanced ones (bold sans runs about 0.6 em a character). */
  function fitName(name, maxW, maxFs, minFs) {
    var words = String(name || "").split(/\s+/).filter(Boolean);
    var CH = 0.6;
    function longest(lines) { var m = 0; for (var i = 0; i < lines.length; i++) m = Math.max(m, lines[i].length); return m || 1; }
    var one = [words.join(" ")], two = one;
    for (var k = 1; k < words.length; k++) {
      var cand = [words.slice(0, k).join(" "), words.slice(k).join(" ")];
      if (two.length === 1 || longest(cand) < longest(two)) two = cand;
    }
    var fsOne = Math.min(maxFs, maxW / (CH * longest(one)));
    var fsTwo = Math.min(maxFs, maxW / (CH * longest(two)));
    var useOne = two.length === 1 || fsOne >= fsTwo * 0.9;
    return { lines: useOne ? one : two, size: Math.max(minFs, Math.round((useOne ? fsOne : fsTwo) * 10) / 10) };
  }
  function drawName(g, name, cy, maxFs, fill) {
    var fit = fitName(name, T - 10, maxFs, 8.5), lh = fit.size * 1.1;
    for (var li = 0; li < fit.lines.length; li++) {
      var t = svgEl("text", { x: 0, y: (cy + (li - (fit.lines.length - 1) / 2) * lh + fit.size * 0.36).toFixed(1), "text-anchor": "middle",
        "font-size": fit.size, "font-weight": 900, fill: fill || "#1b0f3b" }, g);
      t.textContent = fit.lines[li];
    }
  }
  /* The middle of the board says what is happening, big enough to read from
     the sofa: whose turn (in their colour, with their piece), the last roll,
     the latest event, the jackpot. */
  function wrapLine(text, max) {
    var words = String(text || "").split(/\s+/), lines = [""];
    for (var i = 0; i < words.length; i++) {
      var cur = lines[lines.length - 1], cand = cur ? cur + " " + words[i] : words[i];
      if (cand.length <= max || !cur) lines[lines.length - 1] = cand;
      else if (lines.length < 2) lines.push(words[i]);
      else { lines[1] = (lines[1] + " " + words[i]); }
    }
    if (lines[1] && lines[1].length > max) lines[1] = lines[1].slice(0, max - 1) + "…";
    return lines;
  }
  function centerStatus(svg, room) {
    var p = room.players && room.players[room.turn];
    if (p && room.status === "playing") {
      var color = seatColor(p.seat);
      svgEl("circle", { cx: 480, cy: 392, r: 46, fill: "rgba(255,255,255,.08)", stroke: color, "stroke-width": 6 }, svg);
      var em = svgEl("text", { x: 480, y: 410, "text-anchor": "middle", "font-size": 50 }, svg); em.textContent = tokenEmoji(p.token);
      var nm = String(p.name || "Someone");
      var whoFs = Math.min(46, 700 / (0.6 * (nm.length + 9)));
      var who = svgEl("text", { x: 480, y: 492, "text-anchor": "middle", "font-size": whoFs.toFixed(1), "font-weight": 900, fill: color,
        stroke: "#140a33", "stroke-width": 1.5, "paint-order": "stroke" }, svg);
      who.textContent = (p.in_jail ? "⛓ " : "") + nm.toUpperCase() + "'S TURN";
    }
    var lr = room.last_roll;
    if (lr && lr.d1 && lr.d2) {
      var roll = svgEl("text", { x: 480, y: 545, "text-anchor": "middle", "font-size": 30, "font-weight": 900, fill: "#ffe27a" }, svg);
      roll.textContent = "🎲 " + lr.d1 + " + " + lr.d2 + " = " + (lr.d1 + lr.d2) + (lr.d1 === lr.d2 ? "  DOUBLES!" : "");
    }
    var last = (room.log && room.log.length) ? room.log[room.log.length - 1] : "";
    var lines = wrapLine(last, 46);
    for (var i = 0; i < lines.length; i++) {
      if (!lines[i]) continue;
      var ev = svgEl("text", { x: 480, y: 604 + i * 32, "text-anchor": "middle", "font-size": 25, "font-weight": 800, fill: "#efe9ff" }, svg);
      ev.textContent = lines[i];
    }
    if (room.pot > 0) {
      var pot = svgEl("text", { x: 480, y: 718, "text-anchor": "middle", "font-size": 28, "font-weight": 900, fill: "#2ed3b7" }, svg);
      pot.textContent = "🍯 SABBATH JACKPOT $" + fmt(room.pot);
    }
  }
  function buildBoardSvg(room) {
    var svg = svgEl("svg", { viewBox: "0 0 960 960" }, null);
    var defs = svgEl("defs", {}, svg);
    var parchment = svgEl("radialGradient", { id: "parch", cx: "50%", cy: "42%", r: "75%" }, defs);
    svgEl("stop", { offset: "0%", "stop-color": "#fffdf0" }, parchment);
    svgEl("stop", { offset: "100%", "stop-color": "#efe0bd" }, parchment);
    svgEl("rect", { x: 0, y: 0, width: 960, height: 960, fill: "url(#parch)", stroke: "#1b0f3b", "stroke-width": 6 }, svg);
    /* center panel */
    svgEl("rect", { x: T, y: T, width: 960 - 2 * T, height: 960 - 2 * T, fill: "#1d1145", stroke: "#f5c344", "stroke-width": 4 }, svg);
    var rays = svgEl("g", { opacity: 0.16 }, svg);
    for (var r = 0; r < 12; r++) {
      svgEl("path", { d: "M480 480 L" + (480 + Math.cos(r * Math.PI / 6) * 700) + " " + (480 + Math.sin(r * Math.PI / 6) * 700)
        + " L" + (480 + Math.cos((r + 0.5) * Math.PI / 6) * 700) + " " + (480 + Math.sin((r + 0.5) * Math.PI / 6) * 700) + " Z", fill: "#ffc83d" }, rays);
    }
    var t1 = svgEl("text", { x: 480, y: 262, "text-anchor": "middle", "font-size": 76, "font-weight": 900, fill: "#ffc83d", stroke: "#4a2c00", "stroke-width": 3 }, svg);
    t1.textContent = "JUBILEE!";
    var t2 = svgEl("text", { x: 480, y: 300, "text-anchor": "middle", "font-size": 18, "font-weight": 800, fill: "#ffe88a", "letter-spacing": 10 }, svg);
    t2.textContent = "BIBLE LANDS";
    centerStatus(svg, room);
    var board = room.board || [];
    for (var i = 0; i < 40; i++) {
      var sp = board[i]; if (!sp) continue;
      var c = tileCenter(i);
      var g = svgEl("g", { transform: "translate(" + c.x + " " + c.y + ") rotate(" + c.rot + ")" }, svg);
      var isCorner = (i === 0 || i === 10 || i === 20 || i === 30);
      svgEl("rect", { x: -T / 2, y: -T / 2, width: T, height: T, rx: 6,
        fill: isCorner ? "#ffdf9e" : "#fff8e7", stroke: "#1b0f3b", "stroke-width": isCorner ? 3 : 1.5 }, g);
      if (i === 0) { corner(g, "JUBILEE!", "COLLECT $200", "🎺", "#ffb703"); continue; }
      if (i === 10) { corner(g, "THE DUNGEON", "PAUL & SILAS", "⛓️", "#c3b2a0"); continue; }
      if (i === 20) { corner(g, "SABBATH REST", "FREE PARKING", "🕊️", "#bde0fe"); continue; }
      if (i === 30) { corner(g, "SENT TO", "THE DUNGEON", "⛓️", "#ffc4c4"); continue; }
      var band = GROUP_COLORS[sp.group] || (sp.kind === "railroad" ? "#1f2937" : sp.kind === "utility" ? "#374151" : null);
      var bandColor = sp.kind === "chance" ? "#8b5cf6" : sp.kind === "chest" ? "#1d4ed8" : sp.kind === "tax" ? "#c44" : band;
      if (bandColor) svgEl("rect", { x: -T / 2, y: -T / 2, width: T, height: 17, fill: bandColor }, g);
      var label = sp.kind === "chance" ? "PARABLE" : sp.kind === "chest" ? "SCRIPTURE" : null;
      var nameTxt = label || sp.name || "";
      // Picture tiles: the picture up top, the name under it. Streets: the
      // name fills the middle. The price is always along the bottom.
      var art = sp.kind === "chance" ? "📜" : sp.kind === "chest" ? "📖" : sp.kind === "railroad" ? (sp.i === 35 ? "🐫" : "🚂")
        : sp.kind === "utility" ? (sp.i === 12 ? "💡" : "⛲") : sp.kind === "tax" ? "🪙" : null;
      var priceTxt = null;
      if (sp.kind === "tax") priceTxt = "PAY $" + fmt(sp.amount || 100);
      else if (sp.price) priceTxt = "$" + sp.price;
      if (art) {
        var at = svgEl("text", { x: 0, y: (bandColor ? -T / 2 + 38 : -T / 2 + 32), "text-anchor": "middle", "font-size": 22 }, g);
        at.textContent = art;
        drawName(g, nameTxt, priceTxt ? 13 : 20, 13);
      } else {
        drawName(g, nameTxt, priceTxt ? -1 : 6, 16);
      }
      if (priceTxt) { var pt = svgEl("text", { x: 0, y: T / 2 - 7, "text-anchor": "middle", "font-size": 14, "font-weight": 900, fill: sp.kind === "tax" ? "#b91c1c" : "#1b0f3b" }, g); pt.textContent = priceTxt; }
      if (sp.owner != null) {
        // Owner in the bottom corner, houses in the colour band: clear of the name.
        svgEl("circle", { cx: -T / 2 + 10, cy: T / 2 - 10, r: 6.5, fill: seatColor(sp.owner), stroke: "#1b0f3b", "stroke-width": 1.5 }, g);
        var yy = -T / 2 + 3;
        if (sp.houses === 5) { svgEl("rect", { x: -11, y: yy, width: 22, height: 11, rx: 2, fill: "#d32f2f", stroke: "#1b0f3b", "stroke-width": 1.2 }, g); }
        else if (sp.houses > 0) { for (var hix = 0; hix < sp.houses; hix++) { svgEl("rect", { x: -T / 2 + 8 + hix * 18, y: yy, width: 14, height: 10, rx: 1.5, fill: "#2e9e5b", stroke: "#1b0f3b", "stroke-width": 1 }, g); } }
        if (sp.mortgaged) { var mg = svgEl("text", { x: T / 2 - 11, y: T / 2 - 6, "text-anchor": "middle", "font-size": 15, "font-weight": 900, fill: "#c0392b" }, g); mg.textContent = "M"; }
      }
    }
    /* tokens on top */
    var stacks = {};
    for (var s = 0; s < room.players.length; s++) {
      var pl = room.players[s]; if (pl.bankrupt) continue;
      var key = String(pl.position); stacks[key] = stacks[key] || []; stacks[key].push(pl);
    }
    for (var keyPos in stacks) {
      var members = stacks[keyPos], idx = +keyPos, c2 = tileCenter(idx);
      for (var m = 0; m < members.length; m++) {
        var pl2 = members[m];
        var dx = (m % 2) * 22 - 11, dy = Math.floor(m / 2) * 20 - 24;
        var tk = svgEl("g", { transform: "translate(" + (c2.x + dx) + " " + (c2.y + dy) + ")" }, svg);
        svgEl("circle", { r: 12, fill: seatColor(pl2.seat), stroke: "#1b0f3b", "stroke-width": 2.5, opacity: pl2.in_jail ? 0.75 : 1 }, tk);
        var te = svgEl("text", { y: 5, "text-anchor": "middle", "font-size": 15 }, tk);
        te.textContent = tokenEmoji(pl2.token);
      }
    }
    return svg;
  }
  function corner(g, big, small, emoji, fill) {
    svgEl("rect", { x: -T / 2, y: -T / 2, width: T, height: T, fill: fill, opacity: 0.35 }, g);
    var e = svgEl("text", { x: 0, y: -14, "text-anchor": "middle", "font-size": 30 }, g); e.textContent = emoji;
    var bigFs = Math.min(13.5, (T - 8) / (0.6 * String(big).length));
    var smallFs = Math.min(10.5, (T - 8) / (0.6 * String(small).length));
    var b = svgEl("text", { x: 0, y: 9, "text-anchor": "middle", "font-size": bigFs.toFixed(1), "font-weight": 900, fill: "#1b0f3b" }, g); b.textContent = big;
    var s2 = svgEl("text", { x: 0, y: 9 + bigFs + 4, "text-anchor": "middle", "font-size": smallFs.toFixed(1), "font-weight": 800, fill: "#3c2a55" }, g); s2.textContent = small;
  }
  /* ---------- game + finish screens ---------- */
  function renderGame(room) {
    var svgHolder = buildBoardSvg(room);
    var head = '<div class="sideCard sideHead"><div class="brand">🎺 JUBILEE!</div><div><span class="pill">ROUND ' + (room.round || 1) + '</span>'
      + '<span class="pill">' + esc((room.ruleset || "classic").toUpperCase()) + '</span></div></div>';
    var many = (room.players || []).length > 4 ? " many" : "";
    var side = '<div class="sideCol">' + head + '<div class="sideCard"><div class="sideLabel">Players</div><div class="players' + many + '">' + playerRows(room) + '</div></div>';
    side += '<div class="sideCard"><div class="potRow"><span class="sideLabel" style="letter-spacing:.08em">JACKPOT</span><span class="potNum">$' + fmt(room.pot) + '</span></div>'
      + '<div class="metaRow"><span>Bank</span><span>🏠 ' + room.bank_houses + ' · 🏨 ' + room.bank_hotels + '</span></div></div>';
    if (room.auction) {
      var a = room.auction;
      side += '<div class="auctionBar"><div class="who">ON THE BLOCK</div><div style="font-size:.2rem;font-weight:900">' + esc(a.name || ("Space " + a.space)) + '</div>'
        + '<div class="bid">$' + fmt(a.high_bid) + '</div><div class="pass">' + (a.high_bidder_name ? esc(a.high_bidder_name) + " leads" : "No bids yet") + '</div></div>';
    }
    if (room.pending && room.pending.kind === "debt") {
      side += '<div class="auctionBar" style="background:#ffd4d4;border-color:#d32f2f"><div class="who" style="color:#8a1c1c">A DEBT IS DUE</div><div class="bid" style="font-size:.26rem">$' + fmt(room.pending.amount) + '</div></div>';
    }
    // The story so far: the last several events, newest first, fading back.
    var log = (room.log || []).slice(-5).reverse();
    var logHtml = log.map(function (line, i) {
      return '<div class="logRow" style="opacity:' + Math.max(0.35, 1 - i * 0.12).toFixed(2) + '">' + esc(line) + '</div>';
    }).join("");
    side += '<div class="sideCard" style="flex:1;min-height:0;overflow:hidden"><div class="sideLabel">Chronicle</div><div id="tv-log">' + logHtml + '</div></div>';
    var code = esc(room.code || PINNED);
    side += '<div class="sideCard joinCard"><img alt="" src="/api/jubilee/rooms/' + code + '/join.svg"><div class="jc">Scan to play<b>' + code + '</b>games.sumemail.com</div></div>';
    side += '</div>';
    var main = $("tv-main");
    main.innerHTML = '<div class="boardCol"></div>' + side;
    main.querySelector(".boardCol").appendChild(svgHolder);
  }
  function playerRows(room) {
    var html = "";
    for (var i = 0; i < room.players.length; i++) {
      var p = room.players[i];
      var cls = "plr" + (room.turn === p.seat && !p.bankrupt ? " turn" : "") + (p.bankrupt ? " out" : "") + (p.in_jail ? " jail" : "");
      var status = p.bankrupt ? "BANKRUPT" : p.in_jail ? "⛓ DUNGEON" : "$" + fmt(p.cash) + " · worth $" + fmt(p.net_worth);
      html += '<div class="' + cls + '"><div class="ring" style="border-color:' + seatColor(p.seat) + ';background:rgba(255,255,255,.06)">' + tokenEmoji(p.token) + '</div>'
        + '<div class="who"><div class="nm">' + esc(p.name) + (p.is_ai ? ' 🤖' : '') + '</div><div class="st">' + status + '</div></div></div>';
    }
    return html;
  }
  function renderFinished(room) {
    var sorted = room.players.slice().sort(function (a, b) { return b.net_worth - a.net_worth; });
    var winner = null;
    for (var i = 0; i < room.players.length; i++) if (room.players[i].seat === room.winner) winner = room.players[i];
    if (!winner) winner = sorted[0];
    var rows = "";
    for (var j = 0; j < sorted.length; j++) {
      var p = sorted[j];
      rows += '<div class="stRow' + (p.seat === winner.seat ? " winner" : "") + '"><div class="rk">' + (j + 1) + '</div><div class="nm">' + tokenEmoji(p.token) + ' ' + esc(p.name) + '</div><div class="nw">$' + fmt(p.net_worth) + '</div></div>';
    }
    $("tv-main").innerHTML = '<div class="finish"><div class="crown">👑</div><div class="winTitle">' + esc(winner.name) + ' WINS THE JUBILEE!</div><div class="standings">' + rows + '</div></div>';
  }
  poll();
  setInterval(poll, POLL_MS);
})();
</script>
