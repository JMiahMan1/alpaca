<script>
  (function () {  // before first paint: TV browsers get the light look, and the frame fits any screen
    var q = /[?&]lite=([01])/.exec(location.search), tv = /Web0S|webOS|Tizen|SMART-TV|SmartTV|NetCast|HbbTV|CrKey|AFT[A-Z]|BRAVIA|Android TV|GoogleTV/i.test(navigator.userAgent || "");
    if (q ? q[1] === "1" : tv) document.documentElement.className += " lite";
    /* The frame is a fixed 17.778 x 10 rem (16:9). Scale rem to the viewport so the stage
       fills the screen on any display instead of overflowing a small/portrait one. */
    function fit() {
      // Fit what the screen shows, not the page: a Cast receiver can lay the
      // page out larger than its picture (the office TV: a 1040x585 page on a
      // 960x540 screen, so about 4% went missing on every edge). The frame
      // stays centred, so sizing it to the screen keeps all of it in view.
      var w = window.innerWidth || 1920, h = window.innerHeight || 1080;
      var sw = (window.screen && screen.width) || 0, sh = (window.screen && screen.height) || 0;
      if (sw > 0 && sw < w) w = sw;
      if (sh > 0 && sh < h) h = sh;
      var rem = Math.min(h * 0.1, w / 17.778);
      document.documentElement.style.fontSize = rem + "px";
    }
    window.addEventListener("resize", fit);
    fit();
  })();
</script>

<script>
(function () {
  "use strict";
  var PINNED = "__ROOM_CODE__";
  var POLL_MS = 1000, FAILS = 0, GONE = 0;
  // Reduced motion (the TV's or browser's setting): no camera moves, no hop
  // arcs, no tumbling dice -- the same game, still.
  var RM = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var GROUP_COLORS = { brown: "#8c5a3b", lightblue: "#6fd3e7", pink: "#d63384", orange: "#f7871f", red: "#d32f2f", yellow: "#f2c230", green: "#2e9e5b", blue: "#1d4ed8" };
  var SEAT_COLORS = ["#ffc83d","#ff6b6b","#2ed3b7","#7dd3fc","#c084fc","#fb923c","#34d399","#f472b6"];
  var TOKENS = { ark:"🚢", dove:"🕊️", menorah:"🕎", star:"⭐", scroll:"📜", fish:"🐟", cup:"🍷", trumpet:"🎺" };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
  function fmt(n) { return Number(n || 0).toLocaleString("en-US"); }
  function xhr(method, url, body, cb) {
    var r = new XMLHttpRequest();
    r.open(method, url, true);
    r.timeout = 8000;
    if (body) r.setRequestHeader("Content-Type", "application/json");
    r.onload = function () { var d = null; try { d = JSON.parse(r.responseText); } catch (e) {} cb(d, r.status); };
    r.onerror = function () { cb(null, 0); };
    r.ontimeout = function () { cb(null, 0); };
    r.send(body ? JSON.stringify(body) : null);
  }
  var lastSig = "";
  /* The roll and the drawn card, played big on the TV. ``n`` counts each
     one on the server, so the first look at a room shows nothing old. */
  var seenRoll = null, seenCard = null, fxTimer = null, primed = false;
  var PIPS = { 1: [[50,50]], 2: [[27,27],[73,73]], 3: [[25,25],[50,50],[75,75]], 4: [[27,27],[73,27],[27,73],[73,73]],
    5: [[25,25],[75,25],[50,50],[25,75],[75,75]], 6: [[27,22],[73,22],[27,50],[73,50],[27,78],[73,78]] };
  function dieHtml(v) {
    var h = '<div class="tvDie">', pts = PIPS[v] || [], i;
    for (i = 0; i < pts.length; i++) h += '<div class="tvPip" style="left:' + pts[i][0] + '%;top:' + pts[i][1] + '%"></div>';
    return h + '</div>';
  }
  var fxTurn = null;
  function hideFx() { var fx = $("tv-fx"); fx.className = ""; fx.innerHTML = ""; fxTurn = null; }
  function showFx(html, ms, dim) {
    var fx = $("tv-fx");

    if (fxTimer) clearTimeout(fxTimer);

  }
  function bigMoments(room) {
    var r = room.last_roll, c = room.last_card;
    var rn = r && r.n != null ? r.n : null, cn = c && c.n != null ? c.n : null;
    if (!primed) { primed = true; seenRoll = rn; seenCard = cn; return; }
    if (cn !== null && cn !== seenCard) {
      seenCard = cn; seenRoll = rn;
      var sc = c.deck === "scripture";
      showFx('<div class="tvCard' + (sc ? ' scripture' : '') + '"><div class="band">' + (sc ? "SCRIPTURE" : "PARABLE") + '</div>'
        + '<div class="who">' + esc(c.player || "") + ' drew</div>'

      if (target === last) continue;
      var steps = (target - last + 40) % 40;
      if (steps > 0 && steps <= 12) { for (var k = 1; k <= steps; k++) t.queue.push((last + k) % 40); }
      else { t.queue = []; t.shown = target; t.dur = 0; }   // the Dungeon, a card: straight there
    }
    animating = true;
  }
  var animating = false;
  /* The camera: the whole board between moves; in a move it glides in toward
     the piece and follows it (the names there reach TV size), then glides
     back out a moment after it lands -- the way console board games do. */
  var ZOOM_IN = RM ? 1 : 1.7, lastCam = 0;
  function camera(now) {
    var c = board.cam, dt = Math.min(0.1, (now - (lastCam || now)) / 1000); lastCam = now;
    var close = board.focus && now - board.lastMove < 1600;
    var tz = close ? ZOOM_IN : 1, tx = close ? board.focus.x : BW / 2, ty = close ? board.focus.y : BH / 2;
    var halfW = BW / (2 * tz), halfH = BH / (2 * tz);
    tx = Math.max(halfW, Math.min(BW - halfW, tx)); ty = Math.max(halfH, Math.min(BH - halfH, ty));
    var e = 1 - Math.exp(-dt * 3.2);
    c.z += (tz - c.z) * e; c.x += (tx - c.x) * e; c.y += (ty - c.y) * e;
    var W = board.wrap.clientWidth || 1, H = board.wrap.clientHeight || 1;
    var px = c.x / BW * W, py = c.y / BH * H;
    var ox = Math.min(0, Math.max(W - W * c.z, W / 2 - px * c.z)), oy = Math.min(0, Math.max(H - H * c.z, H / 2 - py * c.z));
    var tr = "translate(" + ox.toFixed(1) + "px," + oy.toFixed(1) + "px) scale(" + c.z.toFixed(4) + ")";
    if (tr !== c.applied) { c.applied = tr; board.zoom.style.transform = tr; board.zoom.style.webkitTransform = tr; }
  }
  function tick(now) {
    if (board) {
      var moving = false, places = {};
      for (var seat in board.tokens) {
        var t = board.tokens[seat];
        if (t.dur && now - t.start >= t.dur) { t.shown = t.to; t.dur = 0; t.lift = 0; }
        if (!t.dur && t.queue.length) { t.from = t.shown; t.to = t.queue.shift(); t.start = now; t.dur = HOP_MS; }
        var pos = t.shown, lift = 0;
        if (t.dur) {
          var k = Math.min(1, (now - t.start) / t.dur);
          var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // ease in-out
          pos = t.from + e * (((t.to - t.from) + 40) % 40);
          lift = RM ? 0 : Math.sin(Math.PI * k) * 44;
          moving = true;
        }
        var key = Math.round(pos) % 40;
        places[key] = (places[key] || 0) + 1;
        var n = places[key] - 1, pt = pathPoint(pos);
        var dx = (n % 2) * 40 - 20, dy = Math.floor(n / 2) * 36 - 18;
        // The piece stands on the band side of its tile (off the name); in a
        // hop the body rises and its shadow stays on the board, shrinking.
        t.g.setAttribute("transform", "translate(" + (pt.x + pt.ix + dx).toFixed(1) + " " + (pt.y + pt.iy + dy).toFixed(1) + ")");
        if (t.dur || t.queue.length) { board.focus = { x: pt.x, y: pt.y }; board.lastMove = now; }
        if (t.wasMoving && !t.dur && !t.queue.length) landed(t, seat);
        t.wasMoving = !!(t.dur || t.queue.length);
        t.body.setAttribute("transform", "translate(0 " + (-lift).toFixed(1) + ")");
        var sc = 1 - lift / 90;
        t.shadow.setAttribute("rx", (26 * sc).toFixed(1)); t.shadow.setAttribute("ry", (9 * sc).toFixed(1));
      }
      animating = moving;
      camera(now);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  /* ---------- the middle: what is happening, big ---------- */
  function playerRows(room) {
    var html = "";
    for (var i = 0; i < room.players.length; i++) {
      var p = room.players[i];
      var cls = "plr" + (room.turn === p.seat && !p.bankrupt ? " turn" : "") + (p.bankrupt ? " out" : "") + (p.in_jail ? " jail" : "");
      var status = p.bankrupt ? "BANKRUPT" : p.in_jail ? "⛓ In the Dungeon" : "$" + fmt(p.cash) + "<small> · worth $" + fmt(p.net_worth) + "</small>";
      html += '<div class="' + cls + '"><div class="ring" style="border-color:' + seatColor(p.seat) + '">' + tokenEmoji(p.token) + '</div>'
        + '<div class="who"><div class="nm">' + esc(p.name) + (p.is_ai ? ' 🤖' : '') + '</div><div class="st">' + status + '</div></div></div>';
    }
    return html;
  }
  /* Left frame: the players. Board middle: the title and what is happening
     now. Right frame: the money, the story so far, how to join. */
  function centerHtml(room) {
    var p = room.players && room.players[room.turn];
    var many = room.players.length > 5 ? " many" : "";
    var left = '<div class="fLabel">Players</div><div class="players' + many + '">' + playerRows(room) + '</div>';
    var center = '<div class="cTitle"><span class="brand">🎺 JUBILEE!</span><span class="pill">ROUND ' + (room.round || 1) + '</span>'
      + '<span class="pill">' + esc((room.ruleset || "classic").toUpperCase()) + '</span></div><div class="cNow">';
    if (p && room.status === "playing") {
      center += '<div class="cTurn"><div class="ring big" style="border-color:' + seatColor(p.seat) + '">' + tokenEmoji(p.token) + '</div>'
        + '<div class="cWho" style="color:' + seatColor(p.seat) + '">' + esc((p.in_jail ? "⛓ " : "") + (p.name || "")) + "'s turn</div></div>";
    }
    var lr = room.last_roll;
    if (lr && lr.d1 && lr.d2) center += '<div class="cRoll">🎲 ' + lr.d1 + ' + ' + lr.d2 + ' = ' + (lr.d1 + lr.d2) + (lr.d1 === lr.d2 ? ' · DOUBLES!' : '') + '</div>';
    if (room.auction) {
      var a = room.auction;
      center += '<div class="cAlert">🔨 On the block: ' + esc(a.name || ("Space " + a.space)) + ' · $' + fmt(a.high_bid) + (a.high_bidder_name ? " · " + esc(a.high_bidder_name) + " leads" : "") + '</div>';
    } else if (room.pending && room.pending.kind === "debt") {
      center += '<div class="cAlert debt">A debt is due: $' + fmt(room.pending.amount) + '</div>';
    }
    var log = (room.log || []).slice(-5).reverse();
    if (log[0]) center += '<div class="cEvent">' + esc(log[0]) + '</div>';
    center += '</div>';
    var code = esc(room.code || PINNED);
    var right = '<div class="fCard"><div class="fLabel">Jackpot</div><div class="fPot">$' + fmt(room.pot) + '</div>'
      + '<div class="fBank">🏠 ' + room.bank_houses + ' · 🏨 ' + room.bank_hotels + '<small> in the bank</small></div></div>'
      + '<div class="fCard fStory"><div class="fLabel">Earlier</div>'
      + log.slice(1).map(function (line) { return '<div class="fLog">' + esc(line) + '</div>'; }).join("") + '</div>'
      + '<div class="fCard fJoin"><img alt="" src="/api/jubilee/rooms/' + code + '/join.svg"><div class="fLabel">Scan to play</div><b>' + code + '</b></div>';
    return { left: left, center: center, right: right };
  }
  /* Where a piece lands, a card big enough to read across the room: the full
     name, the price, the rent, and who owns it. */
  var lastRoom = null, landTimer = null;
  function landed(t, seat) {
    var room = lastRoom; if (!room || !room.board) return;
    var sp = room.board[Math.round(t.shown) % 40];
    if (!sp || (!sp.price && sp.kind !== "tribute" && sp.kind !== "offering")) return;
    var color = KIND_BAND[sp.kind] || GROUP_COLORS[sp.group] || "#7c3aed";
    var rows = "";
    if (sp.kind === "tribute" || sp.kind === "offering") rows = '<div class="lRow big">Pay $' + fmt(sp.flat || sp.amount || 0) + '</div>';
    else {
      rows += '<div class="lRow"><span>Price</span><b>$' + fmt(sp.price) + '</b></div>';
      if (sp.rents) {
        rows += '<div class="lRow"><span>Rent</span><b>$' + fmt(sp.rents[0]) + '</b></div>'
          + '<div class="lRow"><span>With a hotel</span><b>$' + fmt(sp.rents[5]) + '</b></div>';
      } else if (sp.kind === "railroad") rows += '<div class="lRow"><span>Rent</span><b>$25 - $200</b></div>';
      else if (sp.kind === "utility") rows += '<div class="lRow"><span>Rent</span><b>4× or 10× the dice</b></div>';
      var owner = sp.owner != null ? room.players[sp.owner] : null;
      rows += owner ? '<div class="lOwner"><i style="background:' + seatColor(sp.owner) + '"></i>Owned by ' + esc(owner.name)
          + (sp.houses === 5 ? ' · 🏨' : sp.houses ? ' · ' + sp.houses + ' 🏠' : '') + (sp.mortgaged ? ' · mortgaged' : '') + '</div>'
        : '<div class="lOwner forsale">For sale</div>';
    }
    var who = room.players[seat];
    var el = $("tv-land");
    el.innerHTML = '<div class="lCard"><div class="lBand" style="background:' + color + '">' + esc(sp.name) + '</div>'
      + '<div class="lWho">' + esc(who ? who.name : "") + ' landed here</div>' + rows + '</div>';
    el.className = "on";
    if (landTimer) clearTimeout(landTimer);
    landTimer = setTimeout(function () { el.className = ""; }, 4500);
  }
  var centerSig = "";
  function renderGame(room) {
    lastRoom = room;
    if (!board || board.code !== room.code || !document.body.contains(board.wrap)) {
      $("tv-main").innerHTML = "";
      board = buildBoard(room);
      var row = document.createElement("div");
      row.className = "tvPlay";
      board.left = document.createElement("div"); board.left.className = "tvFrame left";
      board.right = document.createElement("div"); board.right.className = "tvFrame right";
      row.appendChild(board.left); row.appendChild(board.wrap); row.appendChild(board.right);
      $("tv-main").appendChild(row);
      centerSig = "";
    }
    updateBoard(room);
    moveTokens(room);
    var sig = [room.turn, room.round, room.pot, room.bank_houses, room.bank_hotels, room.log_seq, JSON.stringify(room.last_roll),
      JSON.stringify(room.auction), JSON.stringify(room.pending),
      JSON.stringify(room.players.map(function (p) { return [p.cash, p.net_worth, p.bankrupt, p.in_jail]; }))].join("~");
    if (sig !== centerSig) {
      centerSig = sig;
      var parts = centerHtml(room);
      board.left.innerHTML = parts.left; board.center.innerHTML = parts.center; board.right.innerHTML = parts.right;
    }
  }
  function renderFinished(room) {
    var sorted = room.players.slice().sort(function (a, b) { return b.net_worth - a.net_worth; });
    var winner = null;
    for (var i = 0; i < room.players.length; i++) if (room.players[i].seat === room.winner) winner = room.players[i];
    if (!winner) winner = sorted[0];
    var rows = "";
    for (var j = 0; j < sorted.length; j++) {
      var p = sorted[j];
      rows += '<div class="stRow' + (p.seat === winner.seat ? " winner" : "") + '"><div class="rk">' + (j + 1) + '</div><div class="nm">' + tokenEmoji(p.token) + ' ' + esc(p.name) + '</div><div class="nw">$' + fmt(p.net_worth) + '</div></div>';
    }
    $("tv-main").innerHTML = '<div class="finish"><div class="crown">👑</div><div class="winTitle">' + esc(winner.name) + ' WINS THE JUBILEE!</div><div class="standings">' + rows + '</div></div>';
  }
  var pollTimer = null;
  function schedule(ms) { if (pollTimer) clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }
  function reconnecting(on) { var el = $("tv-reconnect"); if (el) el.className = on ? "on" : ""; }
  poll();
})();
</script>
</body>
</html>
