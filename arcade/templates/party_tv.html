<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parable Party: TV</title>
<!--
  The TV stage. It runs on the TV itself (a Cast receiver, the LG or Samsung
  browser, any TV browser, or headless Chromium rendering a stream for a Roku),
  so it needs no input, follows the room on its own, and is written in ES5 with
  XHR and flexbox: TV browsers are often years behind phones.
  Nothing a player is still typing is ever shown here; the room snapshot it
  reads has no answers until voting, and no authors until the reveal.
-->
<style>
  :root { --gold: #fbbf24; --gold2: #fde68a; --violet: #8b5cf6; --mint: #34d399; --rose: #fb7185; --ink: #f8fafc; --dim: #c4b5fd; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0720; color: var(--ink); overflow: hidden;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { background: radial-gradient(ellipse at 50% 0%, #2a1460 0%, #140a33 45%, #08041a 100%); }
  #stage { position: absolute; top: 4.5vh; bottom: 4.5vh; left: 4.5vw; right: 4.5vw; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; height: 9vh; flex: 0 0 auto; }
  .brand { font-size: 3.4vh; font-weight: 900; color: var(--gold); letter-spacing: .05em; }
  .brand small { color: var(--dim); font-weight: 700; font-size: 2.8vh; margin-left: 1.2vw; letter-spacing: 0; }
  .pill { display: inline-block; padding: .6vh 1.4vw; border-radius: 99px; background: rgba(251,191,36,.16); border: .25vh solid rgba(251,191,36,.5);
    color: var(--gold2); font-weight: 900; font-size: 2.8vh; }
  .main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  /* Safe centering: when a screen is tall it grows downward, never up into the header. */
  .main > * { margin-top: auto; margin-bottom: auto; }
  .center { text-align: center; }
  .huge { font-size: 13vh; font-weight: 900; letter-spacing: .12em; color: var(--gold); text-shadow: 0 .6vh 2.4vh rgba(251,191,36,.35); }
  .h1 { font-size: 6vh; font-weight: 900; line-height: 1.15; }
  .h2 { font-size: 4vh; font-weight: 800; line-height: 1.2; }
  .h3 { font-size: 3vh; font-weight: 700; color: var(--dim); }
  .row { display: flex; align-items: center; }
  .wrap { flex-wrap: wrap; }
  .gap { margin-right: 2vw; }
  .players { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 3vh; }
  .player { display: flex; flex-direction: column; align-items: center; width: 11vw; margin: 1vh .8vw; padding: 1.4vh .5vw; border-radius: 2vh;
    background: rgba(255,255,255,.06); border: .25vh solid rgba(255,255,255,.08); }
  .player .av { font-size: 6vh; line-height: 1.1; }
  .player .nm { font-size: 2.8vh; font-weight: 800; margin-top: .6vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 14vw; }
  .player .st { font-size: 2.8vh; margin-top: .4vh; color: var(--dim); }
  .player.done { border-color: var(--mint); background: rgba(52,211,153,.12); }
  .player.done .st { color: var(--mint); }
  .lobby { display: flex; align-items: center; justify-content: center; }
  .qr { width: 34vh; height: 34vh; background: #fff; border-radius: 2.4vh; padding: 1.4vh; margin-right: 4vw; flex: 0 0 auto; }
  .qr img { width: 100%; height: 100%; display: block; }
  .prompt { font-size: 6.2vh; font-weight: 900; line-height: 1.18; text-align: center; max-width: 82vw; margin: 0 auto; }
  .sub { font-size: 3.2vh; color: var(--dim); text-align: center; margin-top: 2vh; }
  .badge { font-size: 3vh; font-weight: 900; color: var(--gold2); text-align: center; margin-bottom: 2.4vh; }
  .clock { width: 13vh; height: 13vh; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 5.4vh; font-weight: 900;
    border: .9vh solid var(--gold); color: var(--gold2); background: rgba(0,0,0,.25); }
  .clock.low { border-color: var(--rose); color: var(--rose); }
  .clock.sm { width: 9vh; height: 9vh; font-size: 3.8vh; border-width: .6vh; margin-right: 1.4vw; flex: 0 0 auto; }
  .options { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 2vh; }
  .opt { width: 40vw; margin: 1.1vh 1vw; padding: 2vh 1.6vw; border-radius: 2.2vh; background: rgba(255,255,255,.07); border: .3vh solid rgba(255,255,255,.12);
    display: flex; align-items: flex-start; }
  .opt .n { font-size: 4vh; font-weight: 900; color: var(--gold); margin-right: 1.4vw; min-width: 3vw; }
  .opt .t { font-size: 3.4vh; font-weight: 800; line-height: 1.22; flex: 1 1 auto; }
  .opt .by { font-size: 2.8vh; color: var(--dim); margin-top: .8vh; font-weight: 700; }
  .opt .votes { font-size: 2.8vh; margin-top: .6vh; }
  .opt .pts { font-size: 3vh; font-weight: 900; color: var(--mint); margin-left: 1vw; white-space: nowrap; }
  .opt.win { border-color: var(--gold); background: rgba(251,191,36,.14); }
  .opt.trap { border-color: var(--rose); background: rgba(251,113,133,.12); }
  .opt.truth { border-color: var(--mint); background: rgba(52,211,153,.14); }
  .options.many .opt { width: 28vw; margin: .5vh .6vw; padding: 1vh 1vw; border-radius: 1.6vh; }
  .options.many .opt .t { font-size: 3.1vh; }
  .options.many .opt .n { font-size: 3vh; }
  .options.many .opt .by { font-size: 2.8vh; margin-top: .3vh; }
  .options.many .opt .votes { font-size: 2.8vh; margin-top: .2vh; }
  .options.many .opt .pts { font-size: 2.8vh; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 1.6vh; }
  .chip { padding: .7vh 1.2vw; margin: .5vh .5vw; border-radius: 99px; font-size: 2.8vh; font-weight: 800;
    background: rgba(255,255,255,.07); border: .2vh solid rgba(255,255,255,.12); }
  .chip.done { border-color: var(--mint); color: var(--mint); background: rgba(52,211,153,.12); }
  .opt.wait { opacity: .45; }
  .opt.wait .by, .opt.wait .votes, .opt.wait .pts { visibility: hidden; }
  .opt.now { transform: scale(1.04); box-shadow: 0 0 0 .6vh rgba(251,191,36,.45), 0 1.2vh 3vh rgba(0,0,0,.4); }
  .opt .votes span { display: inline-block; animation: popin .35s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes popin { from { transform: scale(0); } to { transform: none; } }
  .note { text-align: center; font-size: 2.8vh; color: var(--gold2); margin-top: 2vh; font-style: italic; }
  .board { display: flex; flex-direction: column; align-items: stretch; width: 60vw; margin: 2vh auto 0; }
  .line { display: flex; align-items: center; justify-content: space-between; padding: 1.2vh 2vw; margin: .5vh 0; border-radius: 1.6vh; background: rgba(255,255,255,.06); }
  .line .who { font-size: 3.4vh; font-weight: 800; }
  .line .sc { font-size: 3.4vh; font-weight: 900; color: var(--gold2); }
  .line .d { font-size: 2.8vh; color: var(--mint); margin-left: 1.4vw; font-weight: 800; }
  .podium { display: flex; align-items: flex-end; justify-content: center; margin-top: 3vh; }
  .step { width: 18vw; margin: 0 1vw; text-align: center; border-radius: 2vh 2vh 0 0; background: rgba(251,191,36,.16); border: .3vh solid rgba(251,191,36,.45); padding-top: 2vh; }
  .step .av { font-size: 8vh; }
  .step .nm { font-size: 3.4vh; font-weight: 900; }
  .step .sc { font-size: 3vh; color: var(--gold2); font-weight: 800; margin-bottom: 1.6vh; }
  .foot { height: 6vh; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; font-size: 2.8vh; color: var(--dim); }
  #sound { display: none; padding: .8vh 1.4vw; border-radius: 99px; background: rgba(251,113,133,.18); border: .25vh solid var(--rose); color: #fecdd3; font-weight: 800; }
  #sound.on { display: inline-block; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .fade { animation: fadein .45s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(1.5vh); } to { opacity: 1; transform: none; } }
  .joke { margin-top: 2vh; padding: 1.6vh 2vw; border-radius: 2vh; background: rgba(255, 200, 61, .12); border: .3vh solid rgba(255, 200, 61, .5); max-width: 52vw; }
  .joke .jk { font-size: 2.8vh; font-weight: 900; letter-spacing: .15em; text-transform: uppercase; color: #ffc83d; }
  .joke .js { font-size: 3vh; font-weight: 800; margin-top: .6vh; }
  .joke .jp { font-size: 3vh; font-weight: 900; color: #2ed3b7; margin-top: .4vh; }
  .how-now { margin: 2vh auto 0; max-width: 70vw; font-size: 2.8vh; font-weight: 800; color: #fde68a; text-align: center; }
  .howto { margin-top: 2vh; display: flex; gap: 1.2vw; }
  .howto .hs { flex: 1; font-size: 2.8vh; font-weight: 700; color: #e2e8f0; line-height: 1.3; }
  .howto .hs b { display: inline-block; width: 3.4vh; height: 3.4vh; line-height: 3.4vh; text-align: center; border-radius: 50%;
    background: #ffc83d; color: #1b0f3b; margin-right: .8vw; }
  .next-in { margin-top: 1.4vh; text-align: center; font-size: 2.8vh; font-weight: 800; color: #cbd5e1; }

  /* ---------- The bright game-show set (overrides the base look above) ----------
     Violet into magenta with spotlight rays and a marquee of blinking bulbs. Cards
     are cream with dark ink so every word reads from the couch. A TV browser that
     lacks conic gradients keeps the plain gradient (the declaration is dropped). */
  :root { --ink: #ffffff; --dim: #fde68a; --card: #fff8e7; --cardink: #1b0f3b; --carddim: #5b3fa0; }
  html, body { background: #6d28d9; }
  body { background: radial-gradient(ellipse at 50% 35%, #c026d3 0%, #7c3aed 45%, #3b0d7a 100%); }
  body { background: repeating-conic-gradient(from 0deg at 50% 38%, rgba(255,214,90,.16) 0deg 9deg, rgba(255,255,255,0) 9deg 18deg),
    radial-gradient(ellipse at 50% 35%, #d946ef 0%, #7c3aed 48%, #3b0d7a 100%); }
  .marquee { position: absolute; inset: 1.2vh 1.2vw; border-radius: 3vh; pointer-events: none; z-index: 0;
    border: .5vh solid rgba(255,214,90,.55);
    background-image: radial-gradient(circle, #fff7c2 0 .45vh, #ffc83d .5vh .7vh, rgba(255,200,61,0) .9vh);
    background-size: 3.2vh 3.2vh; background-repeat: space;
    -webkit-mask: linear-gradient(#000 0 0) top/100% 2.2vh no-repeat, linear-gradient(#000 0 0) bottom/100% 2.2vh no-repeat,
      linear-gradient(#000 0 0) left/2.2vh 100% no-repeat, linear-gradient(#000 0 0) right/2.2vh 100% no-repeat;
    mask: linear-gradient(#000 0 0) top/100% 2.2vh no-repeat, linear-gradient(#000 0 0) bottom/100% 2.2vh no-repeat,
      linear-gradient(#000 0 0) left/2.2vh 100% no-repeat, linear-gradient(#000 0 0) right/2.2vh 100% no-repeat;
    animation: bulbs 1.1s steps(2) infinite; }
  @keyframes bulbs { 0% { background-position: 0 0; } 100% { background-position: 1.6vh 1.6vh; } }
  #stage { z-index: 1; }
  .brand { font-size: 4.2vh; color: #fff; padding: .6vh 1.6vw; background: #ff6b6b; border: .45vh solid var(--cardink);
    border-radius: 1.6vh; box-shadow: .6vh .7vh 0 var(--cardink); transform: rotate(-2deg); display: inline-block; }
  .brand small { color: #fff3c4; }
  .huge { color: #ffc83d; text-shadow: .5vh .6vh 0 var(--cardink), 0 0 4vh rgba(255,200,61,.6); }
  .h1, .h2, .prompt { text-shadow: .3vh .4vh 0 rgba(27,15,59,.55); }
  .h3, .sub { color: #fff3c4; }
  .badge { display: table; margin: 0 auto 2.4vh; padding: .6vh 2vw; background: #ffc83d; color: var(--cardink);
    border: .4vh solid var(--cardink); border-radius: 99px; box-shadow: 0 .6vh 0 var(--cardink); }
  .pill { background: #2ed3b7; color: var(--cardink); border: .35vh solid var(--cardink); box-shadow: 0 .5vh 0 var(--cardink); }
  .clock { background: #fff8e7; color: var(--cardink); border-color: #ffc83d; box-shadow: 0 .8vh 0 var(--cardink); }
  .clock.low { background: #ff6b6b; color: #fff; border-color: #fff; animation: pulse .5s ease-in-out infinite; }
  .player, .chip, .line, .joke, .opt { background: var(--card); color: var(--cardink); border: .4vh solid var(--cardink);
    box-shadow: 0 .8vh 0 rgba(27,15,59,.85); }
  .player .st, .opt .by { color: var(--carddim); }
  .player.done, .chip.done { background: #c9f7ec; border-color: var(--cardink); }
  .player.done .st, .chip.done { color: #0d6e58; }
  .opt .n { color: #e11d74; }
  .opt .pts { color: #fff; background: #10b981; border-radius: 1vh; padding: .2vh .8vw; }
  .opt.win { background: #ffe58a; border-color: #b45309; }
  .opt.trap { background: #ffd0d0; border-color: #be123c; }
  .opt.truth { background: #c9f7ec; border-color: #0f766e; }
  .opt.now { box-shadow: 0 0 0 .7vh #ffc83d, 0 1.2vh 3vh rgba(0,0,0,.45); }
  .line .sc { color: #b45309; } .line .d { color: #0d6e58; }
  .step { background: #ffc83d; color: var(--cardink); border: .4vh solid var(--cardink); }
  .step .sc { color: var(--cardink); }
  .note { color: #fff3c4; }
  .joke .jk { color: #e11d74; } .joke .jp { color: #0d6e58; }
  .how-now { color: #fff; background: rgba(27,15,59,.35); border-radius: 2vh; padding: 1vh 1.6vw; }
  .howto .hs { color: #fff; }
  .next-in, .foot { color: #fff3c4; }
  .lobby .huge { font-size: 10.5vh; }
  .lobby .h2 { font-size: 3.4vh; }
  .lobby + .players { margin-top: 1.4vh; }
  .lobby .joke { margin-top: 1.4vh; padding: 1.2vh 1.6vw; }
  .lobby .howto { margin-top: 1.4vh; }
</style>
</head>
<body>
<div class="marquee"></div>
<div id="stage">
  <div class="top">
    <div class="brand">📜 PARABLE PARTY<small id="sub-brand">Family Party on the Big Screen</small></div>
    <div id="top-right"></div>
  </div>
  <div class="main" id="main"><div class="center h2 pulse">Connecting…</div></div>
  <div class="foot"><span id="foot-left"></span><span id="sound">🔊 Press OK to turn on the announcer</span></div>
</div>
<script>
(function () {
  "use strict";
  var PINNED = "__ROOM_CODE__";
  var POLL_MS = 1000;
  var code = PINNED;
  var room = null;
  var deadline = 0;
  var lastSig = "";
  var lastSpoken = "";   // the line being voiced now (a newer line wins)
  var inflightKey = "";  // a line whose audio is still being made
  var spokenKeys = {};   // every line already said: a re-render never says one twice
  var audio = null;
  var pendingLine = null;
  var soundBlocked = false;
  var failures = 0;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function xhr(method, url, body, cb, binary) {
    var r = new XMLHttpRequest();
    r.open(method, url, true);
    if (binary) r.responseType = "blob";
    if (body) r.setRequestHeader("Content-Type", "application/json");
    r.timeout = binary ? 60000 : 8000;
    r.onload = function () {
      if (binary) return cb(r.status === 200 ? r.response : null);
      var d = null;
      try { d = JSON.parse(r.responseText); } catch (e) {}
      cb(r.status >= 200 && r.status < 300 ? d : null, r.status);
    };
    r.onerror = r.ontimeout = function () { cb(null, 0); };
    r.send(body ? JSON.stringify(body) : null);
  }

  /* ---------- sound effects (synthesized; the TV is the only speaker) ---------- */
  var actx = null;
  function sfxCtx() {
    if (actx) return actx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { actx = new AC(); } catch (e) { actx = null; }
    return actx;
  }
  function tone(freq, dur, type, vol, delay, slide) {
    var c = sfxCtx();
    if (!c) return;
    if (c.state === "suspended" && c.resume) c.resume();
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  /* A studio audience: filtered noise in claps, swelling and fading. */
  function applause(dur, vol) {
    var c = sfxCtx();
    if (!c || !c.createBuffer) return;
    try {
      var n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) {
        var t = i / n, env = Math.min(1, t * 6) * Math.min(1, (1 - t) * 2.5);
        var clap = Math.random() < 0.004 ? 1 : 0.35; // individual hands over the wash
        d[i] = (Math.random() * 2 - 1) * env * clap;
      }
      var src = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
      src.buffer = buf; bp.type = "bandpass"; bp.frequency.value = 1800; bp.Q.value = 0.6;
      g.gain.value = vol || 0.35;
      src.connect(bp); bp.connect(g); g.connect(c.destination); src.start();
    } catch (e) {}
  }
  var sfx = {
    round: function () { tone(523, 0.14, "square", 0.12, 0); tone(659, 0.14, "square", 0.12, 0.1); tone(784, 0.14, "square", 0.12, 0.2); tone(1046, 0.4, "triangle", 0.24, 0.3); },
    vote: function () { tone(330, 0.25, "sawtooth", 0.08, 0, 660); tone(660, 0.12, "triangle", 0.18, 0.18); tone(880, 0.3, "triangle", 0.18, 0.3); },
    tick: function () { tone(1046, 0.06, "square", 0.06); },
    pop: function () { tone(440, 0.12, "triangle", 0.2, 0, 880); tone(1318, 0.18, "sine", 0.1, 0.08); },
    // The sad trombone: wah, wah, wah, waaah.
    trap: function () { tone(392, 0.32, "sawtooth", 0.1, 0, 370); tone(370, 0.32, "sawtooth", 0.1, 0.34, 349); tone(349, 0.32, "sawtooth", 0.1, 0.68, 330); tone(330, 0.9, "sawtooth", 0.11, 1.02, 300); },
    // Ding-ding-ding! and the audience goes wild.
    win: function () { tone(1318, 0.25, "sine", 0.2, 0); tone(1318, 0.25, "sine", 0.2, 0.16); tone(1568, 0.6, "sine", 0.22, 0.32); applause(2.2, 0.3); },
    finale: function () { tone(523, 0.14, "square", 0.12, 0); tone(659, 0.14, "square", 0.12, 0.12); tone(784, 0.14, "square", 0.12, 0.24); tone(1046, 0.8, "triangle", 0.26, 0.36); applause(4.5, 0.4); },
    join: function () { tone(880, 0.1, "sine", 0.14); tone(1318, 0.16, "sine", 0.12, 0.08); applause(0.9, 0.18); }
  };
  function playSfx(name) { try { sfx[name](); } catch (e) {} }

  /* ---------- announcer (Alpaca TTS, played on the TV's speakers) ---------- */
  function speak(text, key) {
    if (!text || spokenKeys[key]) return;
    spokenKeys[key] = true;
    lastSpoken = key;
    inflightKey = key; // being voiced: chatter and lobby jokes wait for it
    var voice = (room && room.voice) || "";
    xhr("POST", "/api/party/tts", { text: String(text).replace(/_{3,}/g, "blank").slice(0, 320), voice: voice }, function (blob) {
      if (inflightKey === key) inflightKey = "";
      if (!blob || blob.size < 128 || key !== lastSpoken || closedOut) return;
      play(blob);
    }, true);
  }
  var U = window.URL || window.webkitURL;
  function dropAudio() {
    // Stop the current line and hand its clip's memory back (a TV runs for days).
    try { if (audio) { audio.pause(); if (audio.__url) U.revokeObjectURL(audio.__url); } } catch (e) {}
    audio = null;
  }
  function play(blob) {
    dropAudio();
    var url = U.createObjectURL(blob);
    audio = new Audio(url);
    audio.__url = url;
    duck(true);
    var mine = audio;
    audio.onended = audio.onerror = function () {
      duck(false);
      try { U.revokeObjectURL(url); } catch (e) {}
      if (audio === mine) audio = null;
    };
    var p = audio.play();
    if (p && p.then) {
      p.then(function () { setSound(false); }, function () { pendingLine = blob; setSound(true); });
    }
  }
  function setSound(blocked) {
    soundBlocked = blocked;
    $("sound").className = blocked ? "on pulse" : "";
  }
  function unlock() {
    var c = sfxCtx();
    if (c && c.state === "suspended" && c.resume) c.resume();
    if (!soundBlocked) return;
    setSound(false);
    if (pendingLine) { var b = pendingLine; pendingLine = null; play(b); }
    if (music.bed && music.bed.paused) { var q = music.bed.play(); if (q && q["catch"]) q["catch"](function () {}); }
  }

  /* ---------- game-show music (composed once by Alpaca's MusicGen) ---------- */
  var music = { cues: null, loadedAt: 0, bed: null, bedName: "", ducked: false, fades: [], stings: [] };
  window.__stageMusic = music; // read by the browser checks
  function loadMusic() {
    if (music.loadedAt && Date.now() - music.loadedAt < 60000) return;
    music.loadedAt = Date.now();
    xhr("GET", "/api/party/music", null, function (d) {
      if (d && d.cues) { music.cues = d.cues; if (room) musicFor(room, true); }
    });
  }
  function cueReady(name) { return music.cues && music.cues[name] && music.cues[name].ready; }
  function fadeTo(el, target, ms, done) {
    // One fade per element: a duck and a fade-in racing left the bed at the wrong level.
    if (el.__fade) clearInterval(el.__fade);
    var start = el.volume, t0 = Date.now();
    var iv = el.__fade = setInterval(function () {
      var k = Math.min(1, (Date.now() - t0) / ms);
      try { el.volume = Math.max(0, Math.min(1, start + (target - start) * k)); } catch (e) {}
      if (k >= 1) { clearInterval(iv); if (done) done(); }
    }, 50);
  }
  function bedLevel() { var c = music.cues && music.cues[music.bedName]; return (c ? c.volume : 0.3) * (music.ducked ? 0.35 : 1); }
  function setBed(name) {
    if (!cueReady(name)) name = "";
    if (name === music.bedName) return;
    var old = music.bed;
    if (old) fadeTo(old, 0, 900, function () { try { old.pause(); } catch (e) {} });
    music.bed = null;
    music.bedName = name;
    if (!name) return;
    var el = new Audio(music.cues[name].url);
    el.loop = true;
    el.volume = 0;
    music.bed = el;
    var p = el.play();
    if (p && p["catch"]) p["catch"](function () { setSound(true); });
    fadeTo(el, bedLevel(), 1200);
  }
  function sting(name) {
    if (!cueReady(name)) return;
    var el = new Audio(music.cues[name].url);
    el.volume = music.cues[name].volume;
    music.stings.push(el);
    duck(true);
    el.onended = el.onerror = function () {
      duck(false);
      for (var i = music.stings.length - 1; i >= 0; i--) if (music.stings[i] === el) music.stings.splice(i, 1);
    };
    var p = el.play();
    if (p && p["catch"]) p["catch"](function () { duck(false); });
  }
  function duck(on) {
    music.ducked = on;
    if (music.bed) fadeTo(music.bed, bedLevel(), 300);
  }
  var BEDS = { lobby: "lobby", writing: "think", voting: "vote", reveal: "reveal" };
  function musicFor(r, quiet) {
    // A streamed stage has no sound of its own (the host's phone plays it).
    if (!r || STREAMED || r.music === false) { setBed(""); return; }
    loadMusic();
    var key = r.match_id + ":" + r.round + ":" + r.phase;
    if (!quiet && key !== music.lastKey) {
      if (r.phase === "writing" && r.round === 1) sting("theme");
      if (r.phase === "finished") sting("finale");
    }
    music.lastKey = key;
    setBed(BEDS[r.phase] || "");
  }
  document.addEventListener("keydown", unlock);
  document.addEventListener("click", unlock);
  document.addEventListener("touchstart", unlock);

  function announce(r) {
    var key = r.match_id + ":" + r.round + ":" + r.phase;
    // The host's line for this phase comes from the room, so the TV and phones agree.
    if (r.phase === "lobby" && r.joke && spokenKeys["lobby:" + r.code]) {
      // After the welcome, each new lobby joke once, never over another line.
      var jk = "lobby:" + r.code + ":" + r.joke.setup;
      if (!spokenKeys[jk] && !inflightKey && (!audio || audio.paused || audio.ended)) speak(r.joke.setup + " ... " + r.joke.punch, jk);
      return;
    }
    if (r.announce) { speak(r.announce, r.phase === "lobby" ? "lobby:" + r.code : key); return; }
    if (r.phase === "lobby") {
      speak("Welcome to Parable Party! Scan the code on the screen, or join room " + r.code.split("").join(" ") + " in Jarvis.", "lobby:" + r.code);
    } else if (r.phase === "writing" && r.prompt) {
      speak(r.prompt.announcer || ("Round " + r.round + "! " + (r.prompt.prompt || "")), key);
    } else if (r.phase === "voting") {
      speak("All the scrolls are in! Vote for your favorite on your phone, and and watch out for the Scribe's Trap!", key);
    } else if (r.phase === "reveal" && r.reveal) {
      speak(r.reveal.announcer || ("Here are the results for round " + r.round + "!"), key);
    } else if (r.phase === "finished") {
      var w = humans(r)[0];
      speak(w ? (w.name + " wins the Golden Scroll with " + w.score + " points! Well played, everyone!") : "What a match!", key);
    }
  }

  /* ---------- rendering ---------- */
  function humans(r) {
    var out = [];
    for (var i = 0; i < (r.players || []).length; i++) {
      var p = r.players[i];
      if (!p.spectator) out.push(p);
    }
    return out;
  }
  function playerById(r, id) {
    for (var i = 0; i < (r.players || []).length; i++) if (r.players[i].id === id) return r.players[i];
    return null;
  }
  function clockHtml(small) {
    return '<div class="clock' + (small ? " sm" : "") + '" id="clock" data-size="' + (small ? "sm" : "") + '">' +
      Math.max(0, Math.ceil((deadline - Date.now()) / 1000)) + "</div>";
  }
  function playersHtml(r, flag, doneText, waitText) {
    var list = humans(r);
    var h = '<div class="players">';
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var done = flag ? !!p[flag] : false;
      h += '<div class="player' + (done ? " done" : "") + '"><div class="av">' + esc(p.avatar || "⭐") + '</div><div class="nm">' +
        esc(p.name) + (p.is_bot ? " 🤖" : "") + '</div><div class="st">' + (flag ? (done ? doneText : waitText) : esc(p.score + " pts")) + "</div></div>";
    }
    return h + "</div>";
  }
  function chipsHtml(r, flag, doneMark) {
    var list = humans(r);
    var h = '<div class="chips">';
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var done = !!p[flag];
      h += '<span class="chip' + (done ? " done" : "") + '">' + esc(p.avatar || "⭐") + " " + esc(p.name) + (done ? " " + doneMark : " …") + "</span>";
    }
    return h + "</div>";
  }
  function promptHead(r) {
    var pr = r.prompt || {};
    var mult = pr.multiplier > 1 ? ' · <span style="color:#ffd0d0">' + pr.multiplier + "X POINTS</span>" : "";
    return '<div class="badge">' + esc(pr.icon || "📜") + " " + esc(pr.title || "") + mult + "</div>";
  }

  var hadRoom = false;
  var endedAt = 0;
  var closedOut = false; // a pinned TV whose game is over: nothing left to poll or draw
  var THANKS_MS = 15000;
  // The game is over: every sound stops at once (announcer, music, chatter, queued lines).
  function silenceAll() {
    dropAudio();
    inflightKey = "";
    for (var i = 0; i < music.stings.length; i++) { try { music.stings[i].pause(); } catch (e) {} }
    music.stings = [];
    pendingLine = null;
    lastSpoken = "";
    spokenKeys = {};
    setBed("");
    setSound(false);
  }
  setInterval(function () {
    if (!hadRoom || !endedAt || Date.now() - endedAt < THANKS_MS) return;
    endedAt = 0;
    if (PINNED) {
      // This TV was opened for that one game: close the page; if a TV browser
      // won't let it, leave a quiet, empty screen rather than a stale message.
      try { window.close(); } catch (e) {}
      closedOut = true;
      document.body.innerHTML = "";
      document.body.style.background = "#000";
    } else {
      hadRoom = false;
      lastSig = "";
      render();
    }
  }, 1000);
  function viewWaiting() {
    if (hadRoom) {
      return '<div class="center fade"><div class="h1">🙏 Thanks for playing!</div>' +
        '<div class="h3" style="margin-top:3vh">That game has ended. Start a new room on a phone and it will appear here.</div></div>';
    }
    return '<div class="center fade"><div class="h1">Ready when you are!</div>' +
      '<div class="h3" style="margin-top:3vh">On a phone, open <b>Jarvis → Family Games → Parable Party</b><br>and start a party room. It will appear here automatically.</div></div>';
  }
  function howToHtml() {
    return '<div class="howto"><div class="hs"><b>1</b>A Bible-story prompt appears here</div>' +
      '<div class="hs"><b>2</b>Write a funny or wise answer on your phone</div>' +
      '<div class="hs"><b>3</b>Vote for your favourite. Dodge the Scribe\'s Trap!</div></div>';
  }
  function jokeHtml(r) {
    if (!r.joke) return "";
    return '<div class="joke"><div class="jk">😄 Dad joke of the moment</div><div class="js">' + esc(r.joke.setup) +
      '</div><div class="jp">' + esc(r.joke.punch) + "</div></div>";
  }
  function viewLobby(r) {
    var origin = window.location.origin;
    var joinUrl = origin + "/join/" + r.code;
    var count = humans(r).filter(function (p) { return !p.is_bot; }).length;
    return '<div class="lobby fade"><div class="qr"><img alt="Join QR code" src="/api/party/rooms/' + encodeURIComponent(r.code) +
      '/join.svg" onerror="this.parentNode.style.display=\'none\'"></div><div><div class="h3">Scan to join, or enter room code</div>' +
      '<div class="huge">' + esc(r.code) + '</div><div class="h3">' + esc(joinUrl.replace(/^https?:\/\//, "")) + "</div>" +
      '<div class="h2" style="margin-top:1.6vh">' + (count ? count + (count === 1 ? " player is" : " players are") + " in. The host taps <b>Start</b> when everyone's ready."
        : "Waiting for players…") + "</div>" + howToHtml() + jokeHtml(r) + "</div></div>" + playersHtml(r, null);
  }
  function viewWriting(r) {
    var pr = r.prompt || {};
    return '<div class="fade">' + promptHead(r) + '<div class="prompt">' + esc(pr.prompt) + "</div>" +
      (pr.subprompt || pr.scene ? '<div class="sub">' + esc(pr.subprompt || pr.scene) + "</div>" : "") +
      (pr.instructions ? '<div class="how-now">👉 ' + esc(pr.instructions) + "</div>" : "") +
      '<div class="row" style="justify-content:center;margin-top:3vh"><div class="gap h2">✍️ Write your answer on your phone</div>' + clockHtml() + "</div>" +
      playersHtml(r, "submitted", "✅ Sealed", "✍️ Writing…") + "</div>";
  }
  function viewVoting(r) {
    var opts = r.options || [];
    var h = '<div class="fade">' + promptHead(r) + '<div class="sub" style="margin-top:0;font-size:3.2vh;color:#f8fafc;font-weight:800">' + esc((r.prompt || {}).prompt) + "</div>";
    h += '<div class="options' + (opts.length > 4 ? " many" : "") + '">';
    for (var i = 0; i < opts.length; i++) {
      h += '<div class="opt"><div class="n">' + (i + 1) + '</div><div class="t">' + esc(opts[i].text) + "</div></div>";
    }
    h += '</div><div class="row" style="justify-content:center;margin-top:1.2vh">' + clockHtml(true) +
      '<div class="h2" style="font-size:3.2vh">🗳️ Vote on your phone for your favourite (not your own). Watch out for the Scribe\'s Trap!</div></div>';
    return h + chipsHtml(r, "voted", "✅") + "</div>";
  }
  /* Use-Your-Words style reveal: answers are unveiled one at a time, fewest
     votes first and the winner last; each shows who voted for it, then who
     wrote it. The scores come after the last answer. */
  function revealOrder(r) {
    return (r.options || []).slice().sort(function (a, b) {
      var d = (a.voters || []).length - (b.voters || []).length;
      if (d) return d;
      return (a.is_round_winner ? 1 : 0) - (b.is_round_winner ? 1 : 0);
    });
  }
  // Headless Chromium is the stream renderer: this page is being sent to a TV as video.
  var STREAMED = /HeadlessChrome/.test(navigator.userAgent || "");

  function revealStep(r) {
    var n = (r.options || []).length;
    var per = r.reveal_step_seconds || 3.5;
    var total = r.phase_seconds || (8 + per * n);
    var elapsed = total - Math.max(0, (deadline - Date.now()) / 1000);
    return Math.max(0, Math.min(n, Math.floor((elapsed - 1) / per) + 1));
  }
  function nextInHtml(r) {
    if (r.round >= r.total_rounds) return "";
    return '<div class="next-in">Next round in <span id="next-in">' + Math.max(0, Math.ceil((deadline - Date.now()) / 1000)) + "</span>s</div>";
  }
  function viewReveal(r) {
    var opts = revealOrder(r);
    var step = revealStep(r);
    var h = '<div>' + promptHead(r) + '<div class="options' + (opts.length > 4 ? " many" : "") + '">';
    for (var i = 0; i < opts.length; i++) {
      var o = opts[i];
      var shown = i < step;
      var cls = !shown ? " wait" : (o.kind === "decoy" ? " trap" : o.kind === "truth" ? " truth" : o.is_round_winner ? " win" : "") + (i === step - 1 ? " now" : "");
      var by = o.kind === "truth" ? "📖 The real answer" : o.kind === "decoy"
        ? "🪤 The Scribe's Trap" + ((o.author_names || []).length ? " (planted by " + esc(o.author_names.join(", ")) + ")" : "")
        : "✍️ " + esc((o.author_names || []).join(", "));
      var voters = "";
      for (var v = 0; v < (o.voters || []).length; v++) {
        var vt = o.voters[v];
        var p = typeof vt === "string" ? playerById(r, vt) : vt;
        voters += p ? '<span style="animation-delay:' + (v * 0.18) + 's" title="' + esc(p.name) + '">' + esc(p.avatar || "⭐") + "</span> " : "";
      }
      h += '<div class="opt' + cls + '"><div class="t">' + (shown && o.is_round_winner ? "🏆 " : "") + esc(o.text) + '<div class="by">' + by + "</div>" +
        '<div class="votes">' + (voters || (shown ? "No votes" : "")) + "</div></div>" + (o.points_awarded ? '<div class="pts">+' + o.points_awarded + "</div>" : "") + "</div>";
    }
    h += "</div>";
    if (step < opts.length) return h + '<div class="center h3 pulse" style="margin-top:2vh">And the scrolls say…</div></div>';
    var note = (r.reveal && r.reveal.scripture_note) || (r.prompt && r.prompt.scripture_note);
    if (note) h += '<div class="note fade">' + esc(note) + "</div>";
    return h + '<div class="fade">' + (opts.length > 4 ? scoreChipsHtml(r) : boardHtml(r, 4)) + nextInHtml(r) + "</div></div>";
  }
  function scoreChipsHtml(r) {
    var list = humans(r);
    var h = '<div class="chips">';
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      h += '<span class="chip' + (i === 0 ? " done" : "") + '">' + (i + 1) + ". " + esc(p.avatar || "") + " " + esc(p.name) + " " + p.score +
        (p.round_delta ? ' <span style="color:' + (p.round_delta > 0 ? "#a7f3d0" : "#ffd0d0") + '">' + (p.round_delta > 0 ? "+" : "") + p.round_delta + "</span>" : "") + "</span>";
    }
    return h + "</div>";
  }
  function boardHtml(r, max) {
    var list = humans(r).slice(0, max || 8);
    var h = '<div class="board">';
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      h += '<div class="line"><span class="who">' + (i + 1) + ". " + esc(p.avatar || "") + " " + esc(p.name) + '</span><span><span class="sc">' +
        p.score + "</span>" + (p.round_delta ? '<span class="d">' + (p.round_delta > 0 ? "+" : "") + p.round_delta + "</span>" : "") + "</span></div>";
    }
    return h + "</div>";
  }
  function viewFinished(r) {
    var list = humans(r);
    var order = [1, 0, 2];
    var heights = ["24vh", "32vh", "18vh"];
    var h = '<div class="fade center"><div class="h1">🏆 ' + (list[0] ? esc(list[0].name) + " wins the Golden Scroll!" : "Match complete!") + '</div><div class="podium">';
    for (var i = 0; i < order.length; i++) {
      var p = list[order[i]];
      if (!p) continue;
      h += '<div class="step" style="min-height:' + heights[i] + '"><div class="av">' + esc(p.avatar || "⭐") + '</div><div class="nm">' + esc(p.name) +
        '</div><div class="sc">' + p.score + " pts</div></div>";
    }
    return h + "</div>" + (list.length > 3 ? boardHtml({ players: list.slice(3) }, 5) : "") +
      '<div class="h3" style="margin-top:2vh">The host can start a new match from their phone.</div></div>';
  }

  function render() {
    var r = room;
    var main = $("main");
    if (!r) {
      $("top-right").innerHTML = "";
      $("foot-left").innerHTML = "";
      main.innerHTML = viewWaiting();
      return;
    }
    $("top-right").innerHTML = '<span class="pill">ROOM ' + esc(r.code) + "</span>" +
      (r.round ? ' <span class="pill">ROUND ' + r.round + " / " + r.total_rounds + "</span>" : "");
    $("foot-left").innerHTML = "Join: " + esc(window.location.host) + "/join/" + esc(r.code);
    var views = { lobby: viewLobby, writing: viewWriting, voting: viewVoting, reveal: viewReveal, finished: viewFinished };
    main.innerHTML = (views[r.phase] || viewLobby)(r);
  }

  function signature(r) {
    if (!r) return "none";
    var p = [];
    for (var i = 0; i < (r.players || []).length; i++) {
      var x = r.players[i];
      p.push(x.id + ":" + x.score + ":" + (x.submitted ? 1 : 0) + (x.voted ? 1 : 0));
    }
    return [r.code, r.match_id, r.phase, r.round, (r.options || []).length, p.join(","), r.joke ? r.joke.setup : ""].join("|");
  }

  var lastPhaseKey = "";
  var phaseStartLocal = 0;
  var chatterDone = {};
  // The host talks while players write and vote: each line once, never over another.
  function runChatter() {
    if (closedOut || !room || !room.chatter || !room.chatter.length || STREAMED) return;
    if (inflightKey || (audio && !audio.paused && !audio.ended)) return;
    var age = (Date.now() - phaseStartLocal) / 1000;
    for (var i = 0; i < room.chatter.length; i++) {
      var c = room.chatter[i], k = lastPhaseKey + ":c" + i;
      if (chatterDone[k] || age < c.at) continue;
      chatterDone[k] = true;
      if (age - c.at < 8) { speak(c.text, k); return; }
    }
  }
  var lastPlayerCount = -1;
  var lastRevealStep = -1;
  var lastTick = -1;
  function apply(r) {
    var phaseKey = r ? r.match_id + ":" + r.round + ":" + r.phase : "";
    if (r && phaseKey !== lastPhaseKey && lastPhaseKey) {
      if (r.phase === "writing") playSfx("round");
      else if (r.phase === "voting") playSfx("vote");
      else if (r.phase === "finished") playSfx("finale");
    }
    if (r && r.phase === "lobby" && lastPlayerCount >= 0 && humans(r).length > lastPlayerCount) playSfx("join");
    lastPlayerCount = r ? humans(r).length : -1;
    if (phaseKey !== lastPhaseKey) { lastRevealStep = -1; phaseStartLocal = Date.now() - ((r && r.phase_age_s) || 0) * 1000; }
    lastPhaseKey = phaseKey;
    if (room && !r) { hadRoom = true; endedAt = Date.now(); silenceAll(); }
    if (r) hadRoom = false;
    room = r;
    musicFor(r, false);
    if (r && (r.phase === "writing" || r.phase === "voting" || r.phase === "reveal")) {
      // Viewers see a streamed stage r.stage_delay_s later, so its clock runs
      // that far ahead and reaches 0 when the round really ends. The reveal
      // keeps its own pacing.
      var lag = STREAMED && r.phase !== "reveal" ? (r.stage_delay_s || 0) : 0;
      deadline = Date.now() + Math.max(0, (r.seconds_remaining || 0) - lag) * 1000;
    }
    var sig = signature(r);
    if (sig !== lastSig) {
      lastSig = sig;
      render();
      if (r) announce(r);
    }
  }

  function poll() {
    if (closedOut) return;
    if (!code) return findRoom();
    xhr("GET", "/api/party/rooms/" + encodeURIComponent(code) + "?stage=1" + (STREAMED ? "&video=1" : ""), null, function (d, status) {
      if (d && d.success && d.room) {
        failures = 0;
        apply(d.room);
      } else if (status === 404) {
        // The room ended. A pinned TV waits for its code; an unpinned one moves on.
        apply(null);
        if (!PINNED) code = "";
      } else {
        failures++;
        if (failures === 5) $("main").innerHTML = '<div class="center h2 pulse">Reconnecting…</div>';
      }
      setTimeout(poll, POLL_MS);
    });
  }

  function findRoom() {
    xhr("GET", "/api/party/rooms", null, function (d) {
      var rooms = (d && d.rooms) || [];
      if (rooms.length) {
        code = rooms[0].code;
        return poll();
      }
      apply(null);
      setTimeout(poll, 3000);
    });
  }

  setInterval(function () {
    runChatter();
    if (room && room.phase === "reveal") {
      var step = revealStep(room);
      if (step !== lastRevealStep) {
        if (lastRevealStep >= 0 && step > 0) {
          var o = revealOrder(room)[step - 1];
          playSfx(o && o.kind === "decoy" ? "trap" : o && (o.is_round_winner || o.kind === "truth") ? "win" : "pop");
        }
        lastRevealStep = step;
        $("main").innerHTML = viewReveal(room);
      }
    }
    var ni = document.getElementById("next-in");
    if (ni && deadline) ni.textContent = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    var c = document.getElementById("clock");
    if (!c || !deadline) return;
    var left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    if (left <= 5 && left > 0 && left !== lastTick && room && (room.phase === "writing" || room.phase === "voting")) playSfx("tick");
    lastTick = left;
    c.textContent = left;
    c.className = "clock" + (c.getAttribute("data-size") === "sm" ? " sm" : "") + (left <= 10 ? " low" : "");
  }, 250);

  if (PINNED.indexOf("__") === 0) { PINNED = ""; code = ""; }

  // An unpinned TV follows the household: when someone starts a newer room,
  // move to it rather than sitting on the old one until it expires.
  setInterval(function () {
    if (PINNED || !code) return;
    xhr("GET", "/api/party/rooms", null, function (d) {
      var rooms = (d && d.rooms) || [];
      if (rooms.length && rooms[0].code !== code) { code = rooms[0].code; lastSig = ""; }
    });
  }, 10000);

  poll();
})();
</script>
</body>
</html>
